<title>보이지 않는 성벽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 터미널식 종목 보드. 목록(카드 그리드) -> 종목 상세(차트 + 접는 섹션). 색: 남색 잉크, 한국 증권앱 관례(상승 빨강, 하락 파랑), 호박색은 '구분 전' 표시에만. */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --ink:#101a2c; --muted:#58647a; --line:#d9dfe8; --soft:#eaeef4;
  --navy:#14243f; --on-navy:#ffffff; --amber:#8a5a0b; --amber-bg:#fbf0d9; --amber-line:#e3c27d;
  --up:#d1342f; --down:#1f5fd1; --area:rgba(20,36,63,.09); --grid:#e3e8ef;
  --f-body:"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-disp:"Noto Serif KR","Noto Sans KR",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c121c; --surface:#141c2a; --ink:#e7ecf5; --muted:#9aa6ba; --line:#263148; --soft:#1b2536;
  --navy:#9fb9ea; --on-navy:#0c121c; --amber:#e9b04f; --amber-bg:#2c2412; --amber-line:#6b5420;
  --up:#ff7a73; --down:#74a6ff; --area:rgba(159,185,234,.12); --grid:#222d42; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c121c; --surface:#141c2a; --ink:#e7ecf5; --muted:#9aa6ba; --line:#263148; --soft:#1b2536;
  --navy:#9fb9ea; --on-navy:#0c121c; --amber:#e9b04f; --amber-bg:#2c2412; --amber-line:#6b5420;
  --up:#ff7a73; --down:#74a6ff; --area:rgba(159,185,234,.12); --grid:#222d42; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;padding-inline:16px;padding-block:0}
a{color:var(--navy);text-underline-offset:3px}
button{font:inherit;color:inherit}
.wrap{max-width:1120px;margin-inline:auto}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)}
/* header */
header.top{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;padding-block:28px 18px}
header.top h1{font-family:var(--f-disp);font-weight:800;font-size:clamp(24px,4.4vw,34px);line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.01em}
header.top p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.themebtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px;color:var(--muted)}
.themebtn:hover{border-color:var(--navy);color:var(--ink)}
/* controls */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:0}
.tab{border:0;background:none;padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;color:var(--muted);font-weight:500}
.tab .n{font-family:var(--f-mono);font-size:12px;margin-left:6px;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--navy);font-weight:700}
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding-block:14px}
.bar input[type=search],.bar select{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 10px;font:inherit;font-size:14px;min-width:0}
.bar input[type=search]{flex:1 1 180px;max-width:280px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:13px;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;padding-bottom:28px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.card:hover{border-color:var(--navy);box-shadow:0 2px 14px rgba(16,26,44,.08)}
.card .r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tk{font-family:var(--f-mono);font-weight:500;font-size:19px;letter-spacing:.01em}
.pill{font-size:11.5px;border-radius:999px;padding:1px 9px;white-space:nowrap;font-weight:500}
.pill.us{background:var(--navy);color:var(--on-navy)}
.pill.pre{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-line)}
.card .nm{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .tag{font-size:12px;color:var(--muted)}
.card svg{display:block;width:100%;height:46px}
.card .r3{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.card .px{font-family:var(--f-mono);font-size:17px;font-weight:500}
.card .dd{font-family:var(--f-mono);font-size:12.5px}
.card .sub{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:8px;flex-wrap:wrap}
.empty{padding:40px 0;color:var(--muted);text-align:center}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;padding-block:18px 36px;line-height:1.7}
footer p{margin:2px 0}
/* detail */
.crumb{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding-block:18px 8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13.5px;text-decoration:none;color:var(--ink);display:inline-block}
.btn:hover{border-color:var(--navy)}
.dh{display:flex;gap:14px 20px;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;padding-block:6px 12px}
.dh h2{margin:0;font-family:var(--f-disp);font-weight:800;font-size:clamp(24px,5vw,34px);line-height:1.2}
.dh h2 .tk{font-size:inherit;margin-right:10px;font-family:var(--f-mono);font-weight:500}
.dh .co{color:var(--muted);font-size:14px;margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dh .big{font-family:var(--f-mono);font-size:clamp(26px,5vw,34px);font-weight:500;text-align:right}
.dh .big small{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
.lead{font-size:16.5px;line-height:1.7;margin:4px 0 16px;max-width:75ch;text-wrap:pretty}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0 28px;margin:0}
.facts div{display:grid;grid-template-columns:minmax(84px,34%) 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--soft);min-width:0}
.facts dt{color:var(--muted);font-size:13px}
.facts dd{margin:0;font-size:14px;overflow-wrap:anywhere}
.chartbox{margin-block:16px}
.chartbox h3{font-size:15px;margin:0 0 4px}
.readout{font-family:var(--f-mono);font-size:13px;color:var(--muted);min-height:20px;margin-bottom:4px}
.readout b{color:var(--ink);font-weight:500}
.chartbox svg{width:100%;height:auto;display:block;touch-action:pan-y;overflow:visible}
.mk{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:6px 20px}
.mk li{display:grid;grid-template-columns:24px 1fr;gap:8px;font-size:13.5px;align-items:start}
.mk .b{width:22px;height:22px;border-radius:50%;background:var(--navy);color:var(--on-navy);font-size:12px;display:grid;place-items:center;font-family:var(--f-mono)}
.mk .d{color:var(--muted);font-family:var(--f-mono);font-size:12px}
.mk .mv{color:var(--muted)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:560px){.dh .big{text-align:left}}
@media(max-width:720px){.cols{grid-template-columns:1fr}}
.cols h4{margin:0 0 8px;font-size:14px}
.cols ul{margin:0;padding-left:18px;display:grid;gap:8px;font-size:14px}
.cols .bu{border-top:3px solid var(--up)} .cols .be{border-top:3px solid var(--down)}
.ctl{display:flex;justify-content:space-between;align-items:center;padding-block:18px 8px;gap:8px}
.ctl h3{margin:0;font-size:15px}
details{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
details>summary{cursor:pointer;padding:12px 16px;font-weight:700;font-size:15px;list-style:none;display:flex;justify-content:space-between;gap:10px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"+";font-family:var(--f-mono);color:var(--muted)}
details[open]>summary::after{content:"−"}
details>.body{padding:2px 16px 16px;overflow-wrap:anywhere}
.md h1,.md h2,.md h3{font-size:15.5px;margin:18px 0 6px}
.md h4{font-size:14.5px;margin:16px 0 6px}
.md h5,.md h6{font-size:14px;margin:12px 0 4px;color:var(--muted)}
.md p{margin:8px 0} .md ul,.md ol{padding-left:20px;margin:8px 0} .md li{margin:3px 0}
.md blockquote{margin:8px 0;padding:2px 12px;border-left:3px solid var(--line);color:var(--muted)}
.tbl{overflow-x:auto;margin:10px 0;border:1px solid var(--line);border-radius:8px}
.tbl table{border-collapse:collapse;width:100%;min-width:480px;font-size:13.5px}
.tbl th,.tbl td{padding:7px 10px;border-bottom:1px solid var(--soft);text-align:left;vertical-align:top}
.tbl th{background:var(--soft);font-weight:700;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.src{margin:0;padding-left:18px;font-size:13.5px;display:grid;gap:4px}
.note{font-size:13px;color:var(--muted);margin-top:10px}
.pn{display:flex;justify-content:space-between;gap:10px;padding-block:18px 8px;flex-wrap:wrap}

.dd-panel{margin-bottom:16px}
.dd-panel>summary{padding:12px 16px}
.hb{display:grid;gap:5px}
.hb button{display:grid;grid-template-columns:54px 1fr 64px;gap:10px;align-items:center;background:none;border:0;padding:2px 0;cursor:pointer;text-align:left;width:100%}
.hb button:hover .lb{color:var(--navy);text-decoration:underline}
.hb .lb{font-family:var(--f-mono);font-size:13px}
.hb .tr{height:12px;background:var(--soft);border-radius:3px;position:relative;overflow:hidden}
.hb .fl{position:absolute;inset:0 auto 0 0;background:var(--down);border-radius:3px;opacity:.85}
.hb .vl{font-family:var(--f-mono);font-size:12.5px;text-align:right}
.refs{display:grid;gap:8px;margin-top:6px}
.refs .row{display:grid;grid-template-columns:minmax(96px,28%) 1fr minmax(96px,24%);gap:10px;align-items:center;font-size:13.5px}
.refs .tr{height:14px;background:var(--soft);border-radius:3px;position:relative;overflow:hidden}
.refs .fl{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--muted);opacity:.7}
.refs .cur .fl{background:var(--navy);opacity:1}
.refs .vv{font-family:var(--f-mono);font-size:12.5px;text-align:right;white-space:nowrap}
@media(max-width:560px){.refs .row{grid-template-columns:1fr;gap:3px}.refs .vv{text-align:left}}
@media(prefers-reduced-motion:no-preference){.card{transition:border-color .15s,box-shadow .15s}}
</style>
<div class="wrap" id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
(()=>{const pi=marked.parseInline.bind(marked),pa=marked.parse.bind(marked);const fx=x=>String(x).replace(/~/g,'&#126;');
marked.parseInline=(x,o)=>pi(fx(x),o);marked.parse=(x,o)=>pa(fx(x),o)})();
const DATA = /*DATA*/;
const S = DATA.stocks, BY = Object.fromEntries(S.map(s=>[s.ticker,s]));
const $ = (h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild};
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = (n,d=2)=>n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const pct = n=>(n>0?'+':n<0?'−':'')+Math.abs(n).toFixed(1)+'%';
const cls = n=>n>0?'up':n<0?'down':'';
const mcap = v=>!v?'–':v>=1e12?'$'+(v/1e12).toFixed(2)+'T':v>=1e9?'$'+(v/1e9).toFixed(v>=1e11?0:1)+'B':'$'+(v/1e6).toFixed(0)+'M';
const md = (t)=>{ if(!t) return ''; const el=document.createElement('div'); el.className='md'; el.innerHTML=marked.parse(t,{gfm:true,breaks:false});
  el.querySelectorAll('table').forEach(tb=>{const w=document.createElement('div');w.className='tbl';tb.replaceWith(w);w.appendChild(tb)});
  el.querySelectorAll('a[href]').forEach(a=>{a.target='_blank';a.rel='noopener noreferrer'}); return el.outerHTML; };
const safeLink=(u)=>/^https?:\/\//.test(u)?u:'#';
// derived numbers
S.forEach(s=>{const p=s.series.p,d=s.series.d; s.last=p[p.length-1]; s.hi=Math.max(...p); s.hiDate=d[p.indexOf(s.hi)];
  s.fromHi=(s.last/s.hi-1)*100; s.base=p[0]; s.baseDate=d[0]; s.ytd=(s.last/s.base-1)*100; s.sinceIpo=d[0]>'2026-01-05'; s.tags=s.field.split('·');});
const lastDate = S[0].series.d[S[0].series.d.length-1];

const REFS={MP:[['국방부 지분 매수가',30]],USAR:[['미 정부 매입가',17.17]],UUUU:[['CEO 매수가',13.08]],ELMT:[['공모가',14]],ALM:[['CEO 매수가',14.95]],PPTA:[['폴슨 매수가',13.2]],INTC:[['미 정부 매입가',20.47]],TSLA:[['머스크 매수가',389]],SPCX:[['공모가',135]],RCAT:[['증자 가격',9.4]],PLUG:[['CFO 평균 매수가',0.92]]};
S.forEach(s=>{const r=(s.glance||[]).find(x=>/목표가/.test(x[0]));const m=r&&String(r[1]).match(/\$\s?([\d,]+(?:\.\d+)?)/);s.tp=m?parseFloat(m[1].replace(/,/g,'')):null;});
function refsHtml(s){const rf=REFS[s.ticker];if(!rf)return '';const rows=[...rf.map(r=>({l:r[0],v:r[1],c:false})),{l:'현재가 ('+lastDate.slice(5).replace('-','/')+')',v:s.last,c:true}];const mx=Math.max(...rows.map(r=>r.v))*1.04;
 return `<div class="panel" style="margin-top:14px"><h3 style="font-size:15px;margin:0 0 8px">정부·내부자·공모 기준가 대비 현재가</h3><div class="refs">${rows.map(r=>`<div class="row ${r.c?'cur':''}"><span>${esc(r.l)}</span><span class="tr"><span class="fl" style="width:${(r.v/mx*100).toFixed(1)}%"></span></span><span class="vv">$${fmt(r.v)}${r.c?'':` <span class="${cls(s.last/r.v-1)}">${pct((s.last/r.v-1)*100)}</span>`}</span></div>`).join('')}</div><div class="note">오른쪽 %는 기준가 대비 현재가의 차이입니다. 기준가는 각 종목 '내부자·유명인 매매' 또는 '한눈에 보기'에 적힌 값입니다.</div></div>`}
/* ---------- state ---------- */
const st={cat:'전체',tag:null,q:'',sort:'drop'};
const root=document.getElementById('app');

function spark(s){const p=s.series.p,w=220,h=46,mn=Math.min(...p),mx=Math.max(...p);
  const pts=p.map((v,i)=>[(i/(p.length-1))*w, h-3-((v-mn)/(mx-mn||1))*(h-8)]);
  const path=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join('');
  const e=pts[pts.length-1];
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="${path} L${w} ${h} L0 ${h}Z" fill="var(--area)"/><path d="${path}" fill="none" stroke="var(--navy)" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;}

function list(){
  const cats=['전체','미국우선','구분 전'];
  const cnt=c=>c==='전체'?S.length:S.filter(s=>s.category===c).length;
  let items=S.filter(s=>(st.cat==='전체'||s.category===st.cat)&&(!st.tag||s.tags.includes(st.tag))&&(!st.q||(s.ticker+s.name_ko+s.company+s.field).toLowerCase().includes(st.q.toLowerCase())));
  const sorters={drop:(a,b)=>a.fromHi-b.fromHi,cap:(a,b)=>(b.mc||0)-(a.mc||0),ytd:(a,b)=>a.ytd-b.ytd,tk:(a,b)=>a.ticker.localeCompare(b.ticker)};
  items.sort(sorters[st.sort]);
  const pool=S.filter(s=>st.cat==='전체'||s.category===st.cat); const tags=[...new Set(pool.flatMap(s=>s.tags))];
  root.innerHTML=`
  <header class="top"><div><h1>보이지 않는 성벽</h1><p>미국과 중국의 패권 경쟁, 군비 경쟁, 공급망 내재화로 수요가 달라지는 미국 상장 종목 ${S.length}개를 정리했습니다. 종목을 누르면 주가 흐름과 근거를 볼 수 있습니다.</p></div><button class="themebtn" id="tg" type="button">테마 전환</button></header>
  <div class="tabs" role="tablist">${cats.map(c=>`<button class="tab" role="tab" aria-selected="${st.cat===c}" data-c="${c}">${c}<span class="n">${cnt(c)}</span></button>`).join('')}</div>
  <div class="bar"><input type="search" id="q" placeholder="종목 검색 (티커·이름)" value="${esc(st.q)}" aria-label="종목 검색">
    <label style="font-size:13px;color:var(--muted)">정렬 <select id="so">${[['drop','고점 대비 낙폭 큰 순'],['cap','시가총액 큰 순'],['ytd','올해 수익률 낮은 순'],['tk','티커 순']].map(([v,l])=>`<option value="${v}" ${st.sort===v?'selected':''}>${l}</option>`).join('')}</select></label>
    <div class="chips" role="group" aria-label="분야 필터">${tags.map(t=>`<button class="chip" type="button" aria-pressed="${st.tag===t}" data-t="${t}">${t}</button>`).join('')}</div></div>
  ${items.length?`<details class="dd-panel" open><summary>고점 대비 낙폭 (${items.length}개)</summary><div class="body"><div class="hb">${(()=>{const mxv=Math.max(...items.map(s=>-s.fromHi),1);return [...items].sort((a,b)=>a.fromHi-b.fromHi).map(s=>`<button type="button" data-k="${s.ticker}" aria-label="${s.ticker} 고점 대비 ${pct(s.fromHi)}"><span class="lb">${s.ticker}</span><span class="tr"><span class="fl" style="width:${(-s.fromHi/mxv*100).toFixed(1)}%"></span></span><span class="vl down">${pct(s.fromHi)}</span></button>`).join('')})()}</div><div class="note">2026년 종가 고점에서 ${lastDate.slice(5).replace('-','/')} 종가까지의 하락률입니다. 막대를 누르면 종목 상세로 이동합니다.</div></div></details>`:''}
  <div class="grid">${items.map(s=>`
   <button class="card" data-k="${s.ticker}" type="button">
     <div class="r1"><span class="tk">${s.ticker}</span><span class="pill ${s.category==='미국우선'?'us':'pre'}">${s.category}</span></div>
     <div class="nm">${esc(s.name_ko)} · ${esc(s.company)}</div>
     <div class="tag">${esc(s.field)}</div>
     ${spark(s)}
     <div class="r3"><span class="px">$${fmt(s.last)}</span><span class="dd ${cls(s.fromHi)}">고점 대비 ${pct(s.fromHi)}</span></div>
     <div class="sub"><span>시총 ${mcap(s.mc)}</span><span>${s.sinceIpo?'상장 후':'올해'} <span class="${cls(s.ytd)}">${pct(s.ytd)}</span></span></div>
   </button>`).join('')||'<div class="empty">조건에 맞는 종목이 없습니다.</div>'}</div>
  <footer><p>가격은 ${lastDate} 종가, 고점은 2026년 종가 기준입니다. 상장 후 1년이 안 된 종목(ELMT, SPCX)은 상장일 이후 값입니다.</p>
  <p>색 표기는 한국 증권앱 관례를 따릅니다. 상승은 빨강, 하락은 파랑입니다.</p>
  <p>각 종목의 상세 본문 숫자는 문서 작성 시점(10/7~10/9 종가) 기준이라 위 카드 가격과 조금 다를 수 있습니다. 내부자·정부 거래는 SEC·OGE 공시 기준이고, 확인하지 못한 항목은 각 종목 끝에 따로 적어 두었습니다.</p></footer>`;
  root.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{st.cat=b.dataset.c;st.tag=null;list()});
  root.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{st.tag=st.tag===b.dataset.t?null:b.dataset.t;list()});
  root.querySelector('#so').onchange=e=>{st.sort=e.target.value;list()};
  const q=root.querySelector('#q'); q.oninput=e=>{st.q=e.target.value;const pos=e.target.selectionStart;list();const n=root.querySelector('#q');n.focus();n.setSelectionRange(pos,pos)};
  root.querySelectorAll('.card,.hb button').forEach(c=>c.onclick=()=>{location.hash=c.dataset.k});
  root.querySelector('#tg').onclick=toggleTheme;
}

function toggleTheme(){const r=document.documentElement;const cur=r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');r.dataset.theme=cur==='dark'?'light':'dark'}

/* ---------- chart ---------- */
function chart(s){
  const d=s.series.d,p=s.series.p,W=900,H=340,L=52,R=14,T=54,B=30; const iw=W-L-R, ih=H-T-B;
  const t0=Date.parse(d[0]), t1=Date.parse(d[d.length-1]); const X=ds=>L+((Date.parse(ds)-t0)/(t1-t0||1))*iw;
  let mn=Math.min(...p),mx=Math.max(...p); const pad=(mx-mn)*.08||1; mn-=pad; mx+=pad; const Y=v=>T+ih-((v-mn)/(mx-mn))*ih;
  const xs=d.map(X), ys=p.map(Y);
  const line=xs.map((x,i)=>(i?'L':'M')+x.toFixed(1)+' '+ys[i].toFixed(1)).join('');
  // y ticks (nice)
  const step=(()=>{const raw=(mx-mn)/4,m=Math.pow(10,Math.floor(Math.log10(raw)));const f=raw/m;return (f<1.5?1:f<3.5?2:f<7.5?5:10)*m})();
  const ticks=[];for(let v=Math.ceil(mn/step)*step;v<=mx;v+=step)ticks.push(v);
  const dec=step<1?2:0;
  // month ticks
  const months=[];{let c=new Date(d[0]);c=new Date(Date.UTC(c.getUTCFullYear(),c.getUTCMonth()+1,1));while(c<=new Date(d[d.length-1])){months.push(new Date(c));c=new Date(Date.UTC(c.getUTCFullYear(),c.getUTCMonth()+1,1))}}
  // markers
  const evs=(s.chart_events||[]).map(ds=>({ds,e:s.events.find(e=>e.date===ds)})).filter(o=>o.e&&ds_ok(o.ds,d)).sort((a,b)=>a.ds<b.ds?-1:1);
  function ds_ok(ds,d){return ds>=d[0]&&ds<=d[d.length-1]}
  const lanes=[];const mk=evs.map((o,k)=>{let idx=0;while(idx<d.length-1&&d[idx+1]<=o.ds)idx++;const x=xs[idx];let ln=0;while((lanes[ln]??-99)>x-24)ln++;lanes[ln]=x;return {n:k+1,x,y:ys[idx],ln,o,idx}});
  s._mk=mk;
  const hi=p.indexOf(s.hi), lo=p.indexOf(Math.min(...p));
  const svg=`<svg id="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="${s.ticker} 2026년 일별 종가 차트">
   ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end" font-size="12" font-family="IBM Plex Mono,monospace" fill="var(--muted)">${v.toFixed(dec)}</text>`).join('')}
   ${months.map(m=>{const x=X(m.toISOString().slice(0,10));return `<line x1="${x}" x2="${x}" y1="${T+ih}" y2="${T+ih+5}" stroke="var(--muted)"/><text x="${x}" y="${H-8}" text-anchor="middle" font-size="12" fill="var(--muted)">${m.getUTCMonth()+1}월</text>`}).join('')}
   <path d="${line} L${xs[xs.length-1]} ${T+ih} L${xs[0]} ${T+ih}Z" fill="var(--area)"/>
   <path d="${line}" fill="none" stroke="var(--navy)" stroke-width="2" stroke-linejoin="round"/>
   ${mk.map(m=>`<line x1="${m.x}" x2="${m.x}" y1="${16+m.ln*17+8}" y2="${m.y}" stroke="var(--muted)" stroke-dasharray="2 3" opacity=".7"/><circle cx="${m.x}" cy="${m.y}" r="3.5" fill="var(--surface)" stroke="var(--navy)" stroke-width="2"/>`).join('')}
   ${mk.map(m=>`<g class="mkg" data-n="${m.n}"><circle cx="${m.x}" cy="${16+m.ln*17}" r="8.5" fill="var(--navy)"/><text x="${m.x}" y="${16+m.ln*17+4}" text-anchor="middle" font-size="11" font-family="IBM Plex Mono,monospace" fill="var(--on-navy)">${m.n}</text></g>`).join('')}
   <circle cx="${xs[hi]}" cy="${ys[hi]}" r="4" fill="var(--up)"/><text x="${xs[hi]+(xs[hi]>W-120?-8:8)}" y="${ys[hi]-8}" text-anchor="${xs[hi]>W-120?'end':'start'}" font-size="12" font-family="IBM Plex Mono,monospace" fill="var(--ink)">고점 ${p[hi].toFixed(2)}</text>
   <circle cx="${xs[xs.length-1]}" cy="${ys[ys.length-1]}" r="4.5" fill="var(--navy)"/>
   <line id="cx" y1="${T}" y2="${T+ih}" stroke="var(--ink)" stroke-width="1" opacity="0" /><circle id="cc" r="5" fill="var(--navy)" stroke="var(--surface)" stroke-width="2" opacity="0"/>
   <rect id="hit" x="${L}" y="${T}" width="${iw}" height="${ih}" fill="transparent"/>
  </svg>`;
  return {svg,xs,ys,d,p,W};
}

/* ---------- detail ---------- */
function detail(s){
  const i=S.indexOf(s), prev=S[(i+S.length-1)%S.length], next=S[(i+1)%S.length];
  const c=chart(s);
  const ev=(s.events||[]);
  const evTable='| 날짜 | 사건 | 주가 반응 |\n| --- | --- | --- |\n'+ev.map(e=>`| ${e.date.slice(5).replace('-','/')} | ${(e.title?'**'+e.title+'** — ':'')+String(e.detail||'').replace(/\|/g,'\\|').replace(/\n/g,' ')} | ${String(e.move||'').replace(/\|/g,'\\|').replace(/\n/g,' ')}${e.close?' (종가 '+String(e.close).replace(/\|/g,'')+')':''} |`).join('\n');
  const sec=(t,html,open)=>html?`<details ${open?'open':''}><summary>${t}</summary><div class="body">${html}</div></details>`:'';
  const li=a=>`<ul>${(a||[]).map(x=>`<li>${marked.parseInline(String(x))}</li>`).join('')}</ul>`;
  root.innerHTML=`
  <div class="crumb"><button class="btn" id="back" type="button">← 전체 목록</button></div>
  <div class="dh"><div><h2><span class="tk">${s.ticker}</span>${esc(s.name_ko)}</h2>
    <div class="co"><span>${esc(s.company)}</span><span class="pill ${s.category==='미국우선'?'us':'pre'}">${s.category}</span><span>${esc(s.field)}</span><span>시총 ${mcap(s.mc)}</span></div></div>
    <div class="big">$${fmt(s.last)}<small class="${cls(s.fromHi)}">고점 대비 ${pct(s.fromHi)} · ${lastDate.slice(5).replace('-','/')} 종가</small></div></div>
  <p class="lead">${marked.parseInline(String(s.lead||''))}</p>
  <div class="panel"><dl class="facts">${(s.glance||[]).map(r=>`<div><dt>${esc(r[0])}</dt><dd>${marked.parseInline(String(r[1]))}</dd></div>`).join('')}${s.tp?`<div><dt>목표가까지 거리</dt><dd>${lastDate.slice(5).replace('-','/')} 종가 $${fmt(s.last)} 기준, 평균 목표가 $${fmt(s.tp)}까지 <b class="${cls(s.tp/s.last-1)}">${pct((s.tp/s.last-1)*100)}</b></dd></div>`:''}</dl>
    <div class="note">위 표는 문서 작성 시점(10/7~10/9 종가) 기준입니다.</div></div>
  <div class="panel chartbox"><h3>${s.sinceIpo?'상장 이후':'2026년'} 일별 종가와 주요 사건</h3><div class="readout" id="ro">차트 위를 움직이면 날짜별 종가가 보입니다.</div>${c.svg}
    <ul class="mk">${(s._mk||[]).map(m=>`<li><span class="b">${m.n}</span><div><span class="d">${m.o.ds.slice(5).replace('-','/')}</span> <b>${esc(m.o.e.title||'')}</b><div class="mv">${esc(String(m.o.e.move||'').slice(0,90))}</div></div></li>`).join('')}</ul></div>
  ${refsHtml(s)}
  <div class="ctl"><h3>상세 내용</h3><button class="btn" id="ex" type="button">모두 펼치기</button></div>
  <div class="cols" style="margin-bottom:10px"><div class="panel bu"><h4>강세 논리</h4>${li(s.bull)}</div><div class="panel be"><h4>약세 논리</h4>${li(s.bear)}</div></div>
  ${sec('기업 개요와 돈 버는 구조',md(s.overview_md),true)}
  ${sec(esc(s.gov_title||'정부와의 관계'),md(s.gov_md),true)}
  ${sec('2026년 주요 사건 ('+ev.length+'건)',md(evTable),false)}
  ${sec('증권사 목표가',md(s.analysts_md),false)}
  ${sec(esc(s.insider_title||'내부자·유명인 매매'),md(s.insider_md),false)}
  ${sec('앞으로 확인할 것',md(s.next_md),true)}
  ${sec('용어 풀이',md(s.glossary_md),false)}
  ${sec('출처와 확인하지 못한 것',(s.unverified?`<p><b>확인 못함</b> ${marked.parseInline(String(s.unverified))}</p>`:'')+`<ul class="src">${(s.sources||[]).map(x=>`<li><a href="${safeLink(x.u)}" target="_blank" rel="noopener noreferrer">${esc(x.t)}</a></li>`).join('')}</ul>`,false)}
  <div class="pn"><button class="btn" data-k="${prev.ticker}" type="button">← ${prev.ticker}</button><button class="btn" data-k="${next.ticker}" type="button">${next.ticker} →</button></div>
  <footer><p>정보 정리 목적의 자료이며 출처는 각 항목에 표시했습니다. 숫자는 문서 작성 시점 기준입니다.</p></footer>`;
  root.querySelector('#back').onclick=()=>{location.hash=''};
  root.querySelectorAll('.pn .btn').forEach(b=>b.onclick=()=>{location.hash=b.dataset.k});
  let all=false;const ex=root.querySelector('#ex');ex.onclick=()=>{all=!all;root.querySelectorAll('details').forEach(x=>x.open=all);ex.textContent=all?'모두 접기':'모두 펼치기'};
  // chart interaction
  const svg=root.querySelector('#ch'),ro=root.querySelector('#ro'),cx=svg.querySelector('#cx'),cc=svg.querySelector('#cc');
  function show(ev){const r=svg.getBoundingClientRect();const x=(ev.clientX-r.left)/r.width*c.W;let b=0,bd=1e9;c.xs.forEach((v,k)=>{const dd=Math.abs(v-x);if(dd<bd){bd=dd;b=k}});
    cx.setAttribute('x1',c.xs[b]);cx.setAttribute('x2',c.xs[b]);cx.setAttribute('opacity','.35');cc.setAttribute('cx',c.xs[b]);cc.setAttribute('cy',c.ys[b]);cc.setAttribute('opacity','1');
    const ch=(c.p[b]/s.hi-1)*100;const mkh=(s._mk||[]).filter(m=>m.idx===b).map(m=>' · 사건 '+m.n).join('');
    ro.innerHTML=`<b>${c.d[b]}</b> · 종가 <b>$${c.p[b].toFixed(2)}</b> · 고점 대비 <span class="${cls(ch)}">${pct(ch)}</span>${mkh}`}
  svg.addEventListener('pointermove',show);svg.addEventListener('pointerdown',show);
  svg.addEventListener('pointerleave',()=>{cx.setAttribute('opacity','0');cc.setAttribute('opacity','0')});
}

function route(){const k=decodeURIComponent(location.hash.slice(1)).toUpperCase(); if(BY[k]){detail(BY[k]);window.scrollTo(0,0)} else {list()}}
addEventListener('hashchange',route);
route();
</script>
