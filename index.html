const DATA = {"stocks":[{"ticker":"ALM","company":"Almonty Industries","name_ko":"알몬티 인더스트리스","category":"미국우선","field":"텅스텐","doc_url":"https://claude.ai/code/artifact/59eb8dfa-8a4c-41c4-93f9-c902c9c9599e","lead":"알몬티는 한국 영월 상동 광산을 33년 만에 다시 돌려 '중국 밖 최대 텅스텐 광산'을 만들려는 회사입니다. 텅스텐 값이 1년 새 약 7배 오르며 4월에 주가가 $23까지 갔지만, 상동 증산이 예상보다 늦고 8억 달러 전환사채를 발행하면서 지금은 고점의 절반 수준입니다.","glance":[["상장","미국 나스닥 (티커 ALM), 2025년 7월 상장. 캐나다 TSX는 2026년 7월 31일, 호주 ASX는 9월 1일 상장 폐지"],["현재가","$11.57 (연초 $8.80 대비 +31%)"],["시가총액","약 33.4억 달러 (주식 수 약 2.88억 주)"],["2026년 고점 / 저점 (종가)","$23.42 (4월 17일, 장중 $24.41) / $8.63 (1월 9일)"],["고점 대비","−51%"],["최근 12개월 매출","약 8,580만 캐나다달러 (약 6,200만 미국달러). 2분기만 4,300만 캐나다달러 (+498%)"],["현금 / 빚","현금 약 12.3억 캐나다달러 (6월 말) / 2031년 만기 전환사채 8억 미국달러 (연 2.25%)"],["정부 개입","미국 정부의 직접 투자·대출은 없음. 대신 2027년 미군 '중국산 텅스텐 금지' 규정의 수혜, 미 국무부가 르완다 합작을 연결"],["국방 필수도","높음. 텅스텐은 철갑탄·미사일·장갑에 대체재가 거의 없는 금속"],["내부자 동향","CEO 루이스 블랙 측이 3월 23일 500만 주를 $15.25에 팔고 다음 날 10만 주를 $14.95에 삼. 이사 트라척은 7월에 60만 주(약 990만 달러) 매도"],["증권사 평균 목표가","약 $24.4 (12명, 범위 $12.9~32.3)"]],"overview_md":"한 줄 정리: 강세론은 '중국이 막은 텅스텐을 대신 공급할 서방 1등 광산'을, 약세론은 '느린 상동 증산과 높은 몸값, 그리고 비교 대상인 EQ리소시스보다 적은 생산량'을 봅니다.\n\n#### 기업 개요: 이 회사는 무엇을 하나\n\n알몬티는 땅에서 텅스텐 광석을 캐내 '정광'(광석을 부수고 골라 텅스텐 함량을 높인 가루)으로 만들어 파는 광산 회사입니다. 원래 캐나다 회사였지만 2026년 4월 13일 본사를 미국 몬태나주 딜런으로 옮겼습니다.\n\n#### 광산과 프로젝트\n\n| 자산 | 나라 | 상태 | 핵심 숫자 |\n|---|---|---|---|\n| 상동 광산 | 한국 강원 영월 | 1단계 가동 중. 3월 17일 준공식, 7월 1일 선광 시작, 9월 17일 상업 운영 인증, 9월 28일 첫 판매용 정광 1톤 | 1단계 연 64만 톤 광석 처리. 2단계(2027년) 연 120만 톤, 연 46만 MTU 이상 목표. 현재 공장은 하루 13시간 가동 |\n| 판나스케이라 광산 | 포르투갈 | 가동 중. 세계에서 가장 오래 쉬지 않고 돌아간 텅스텐 광산 | 1분기 매출 2,534만 캐나다달러로 회사 매출의 거의 전부. 지하 4레벨 확장으로 연 최대 12.4만 MTU 목표 |\n| 로스 산토스 | 스페인 | 옛 광산 찌꺼기(광미) 재처리 재가동 준비 | 샌드빅 자회사 WBH와 WO₃ 최소 약 1,720톤 구매 확약 계약 (9월 17일) |\n| 겐텅 브라운스 레이크 | 미국 몬태나 | 2025년 인수, 개발 중 | 2026년 하반기 생산 준비 목표, 장기 연 14만 MTU 가능성(회사 주장) |\n| 상동 몰리브덴 | 한국 | 시추 중 | 품위 0.26% MoS₂ |\n| 알몬티 르완다 | 르완다 | 9월 14일 합작 발표 | 르완다 정부가 지분 25% |\n\n#### 미국 회사로 바꾸는 중 (재설립)\n\n- 2025년 2월 28일 주주 99.96% 찬성으로 회사 법적 주소를 캐나다에서 미국 델라웨어로 옮기는 안을 승인했습니다.\n- 하지만 2026년 10월 현재도 SEC에 외국 회사 양식(6-K, 40-F)으로 공시합니다. 그래서 미국 내부자 매매 보고서(Form 4)가 나오지 않습니다. 재설립 완료 날짜는 아직 발표되지 않았습니다.\n- 상장도 정리했습니다. 캐나다 TSX는 7월 31일, 호주 ASX는 9월 1일 상장 폐지되고 지금은 나스닥(ALM)과 독일 프랑크푸르트(ALI1)에만 있습니다.\n\n#### 돈 버는 구조: 텅스텐 값에 거의 전부 달린 회사\n\n알몬티는 정광을 팔고, 값은 국제 텅스텐 중간재 가격(APT)에 연동됩니다. 그래서 생산량이 크게 늘지 않아도 APT 가격이 오르면 매출이 뜁니다. 2분기 매출 +498%도 대부분 가격 덕분입니다.\n\n#### 실적 추이 (단위: 백만 캐나다달러)\n\n| 기간 | 매출 | 광산 영업이익 | 조정 EBITDA | 순이익 | 메모 |\n|---|---|---|---|---|---|\n| 2025년 전체 | 32.5 | 2.4 | −17.1 | −161.9 | 주가 급등으로 파생상품 평가손실 97.4 |\n| 2026년 1분기 | 25.4 | 13.0 | 6.1 | −5.3 | 매출 대부분 판나스케이라 |\n| 2026년 2분기 | 43.0 | 26.1 | 17.6 | +181.8 | 주가 하락으로 파생상품 평가이익 173.1 포함 |\n\n순이익은 주가에 따라 크게 출렁입니다. 회사가 발행한 전환사채·워런트의 장부 가치가 주가와 함께 움직이기 때문입니다. 실제 장사 실력은 '광산 영업이익'과 '조정 EBITDA'를 보는 편이 낫습니다.\n\n#### 텅스텐 가격 (APT, 1 MTU = 텅스텐 산화물 10kg)\n\n| 시점 | 가격 | 출처 |\n|---|---|---|\n| 2025년 2분기 평균 (유럽) | $453 / MTU | 회사 2분기 실적 |\n| 2026년 2분기 평균 (유럽) | $3,075 / MTU (약 6.8배) | 회사 2분기 실적 |\n| 2026년 8월 20일 (유럽 로테르담) | $2,780~3,100 / MTU, 4월 이후 첫 하락 | Argus |\n| 2026년 8월 20일 (중국 내수) | 약 $1,010 / MTU (유럽의 약 3분의 1) | Argus |\n\n쉽게 말해 중국이 수출을 막자 '중국 밖 텅스텐'만 값이 크게 뛰었습니다. 알몬티는 바로 그 '중국 밖 가격'을 받는 회사입니다.\n\n#### 누가 사 가나 (장기 구매 계약)\n\n| 구매자 | 대상 광산 | 내용 |\n|---|---|---|\n| GTP (오스트리아 플란제 그룹의 미국 자회사, 펜실베이니아) | 상동 1단계 | 7월 14일 개정. 기간 15년 → 21년, 총량 441만 MTU(+40%), 2단계 전 연 최소 21만 MTU, 단가 약 6.3% 인상. 회사 계산으로 현재 가격 기준 연 4.9억 달러. 1단계 생산의 약 90% |\n| 스미토모전기 (일본) | 판나스케이라 | 2026년 1월 1일 구매 계약 |\n| WBH (스웨덴 샌드빅 자회사) | 로스 산토스 광미 | 최소 WO₃ 약 1,720톤, 의무 구매 방식 |\n| 미국 방산 고객 (이름 비공개) | – | 미국 방산용 산화텅스텐 장기 공급 계약 (회사 주주서한) |\n\n#### 앞으로의 숫자\n\n- 상동 1단계: 1단계 정상 가동 시 GTP에 연 최소 21만 MTU. 9월 말 기준 공장은 하루 13시간만 돌고 24시간 가동은 '계획'입니다. 현장에 광석 약 4.6개월치를 쌓아 두었습니다.\n- 상동 2단계: 2027년 완공 목표, 처리량 2배.\n- 판나스케이라: 지하 4레벨 확장으로 연 최대 12.4만 MTU 목표 (시점 미정).\n- 회사는 공식 매출 가이던스를 내지 않습니다. 뱅크오브아메리카는 5월에 2026년 매출 6.7억 캐나다달러를 예상했지만, 상반기 실제 매출은 6,840만 캐나다달러였습니다.\n- 자사주 매입: 8월 17일 최대 3억 달러(최대 1,440만 주, 3년) 승인. 9월 29일까지 291만 주를 약 4,800만 달러에 사들여 소각했습니다.","gov_md":"알몬티는 미국 정부에게서 직접 돈(지분 투자·대출·보조금)을 받은 적이 아직 없습니다. 대신 미국이 만든 '중국산 텅스텐 퇴출' 규칙 덕분에 손님이 몰리는 구조입니다. 같은 텅스텐 테마의 엘멧(ELMT)이 9월 국방부에서 4.5억 달러를 받은 것과 대비됩니다.\n\n#### 배경: 미국과 중국의 텅스텐 싸움\n\n- 중국은 세계 텅스텐의 80% 이상을 생산합니다. 2025년부터 텅스텐 제품 수출을 허가제로 묶고, 군사용으로 쓰일 수 있는 품목의 미국 수출을 막았습니다.\n- 그 결과 유럽 APT 가격은 2025년 2분기 $453에서 2026년 2분기 $3,075로 약 7배가 됐습니다.\n- 미국은 반대로 2027년 1월 1일부터 국방 조달품에 중국산 텅스텐을 쓰지 못하게 했습니다. 미국 무기 회사들은 1년 안에 중국 밖 공급처를 찾아야 합니다.\n\n#### 미국·동맹과 연결된 고리\n\n| 고리 | 내용 | 날짜 |\n|---|---|---|\n| 국방 조달 규정 | 2027년부터 중국·러시아 등 산 텅스텐 국방 사용 금지. 알몬티는 '분쟁 없는 서방 텅스텐' 공급자로 수혜 | 2027-01-01 시행 |\n| 미국 방산 공급망 | 상동 1단계 정광의 약 90%를 미국 펜실베이니아의 GTP(플란제 그룹)에 21년간 공급. GTP는 미국 국방·산업용 텅스텐 가루 대형 공급사 | 2026-07-14 개정 |\n| 미국 방산용 산화텅스텐 | 미국 방산 고객과 장기 공급 계약 (상대 이름 비공개) | 2026-01 주주서한에서 언급 |\n| 미 국무부 | 2025년 미국-르완다 경제협력 틀에서 국무부가 소개해 르완다 정부와 합작 (르완다 25%) | 2026-09-14 |\n| 미국 본사·광산 | 본사를 토론토에서 몬태나주 딜런으로 이전. 몬태나 겐텅 광산 인수 | 2026-04-13 |\n| 국방 인맥 이사회 | 이사 앨런 에스테베즈(전 미 상무부 수출통제 담당 차관), 이사 구스타브 퍼나 퇴역 대장, COO 스티븐 앨런 퇴역 준장 | 2025~2026 |\n| 로비 | 국방 분야 로비 신고 6건(각 5만 달러) | 2025-04 ~ 2026-07 |\n\n#### 동맹국 공급망 다시 짜기\n\n- 한국: 상동 광산은 한국 땅에서 나오는 '미국 우방' 텅스텐입니다. 한국도 텅스텐을 핵심 광물로 지정했고, 상동 옆 몰리브덴 광상도 시추 중입니다.\n- 유럽: 포르투갈 판나스케이라, 스페인 로스 산토스. 유럽도 텅스텐 가격 급등을 겪고 있습니다.\n- 아프리카: 르완다 합작은 미국이 중국 대신 아프리카 광물을 서방 쪽으로 끌어오는 전략의 일부입니다.\n\n#### 주의할 점\n\n- 미국 국방부의 비축 계약(DLA)이나 국방물자생산법(DPA) 지원 같은 '정부 돈'은 아직 없습니다. 이런 직접 지원이 나오면 큰 호재가 될 수 있지만, 아직은 기대 단계입니다.\n- 정부 지원 경쟁에서 국방부는 9월에 엘멧(ELMT)을 '미국 텅스텐 대표 선수'로 골랐고, 엘멧은 경쟁사 EQ리소시스와 공급 계약을 맺었습니다.","gov_title":"정부가 이 회사를 쓰는 방법","events":[{"date":"2026-10-06","title":"텅스텐주 동반 하락","detail":"알몬티만의 원인은 확인 못함. 같은 주 텅스텐주가 함께 떨어짐(10/2→10/8 EQ리소시스 −16%, 엘멧 −7.5%). 호주 언론은 EQR 하락을 '대폭등 후 차익 실현'으로 설명. 10월 2일 퓨어텅스텐 소송 합의 발표","move":"사흘간 −14%, 7월 말 이후 최저","close":"$11.57"},{"date":"2026-09-28","title":"상동 첫 정광·자사주","detail":"상동 첫 판매용 정광 1톤 포장. 주주서한: 자사주 291만 주(4,800만 달러) 매입, 공장 하루 13시간 가동","move":"약보합","close":"$13.19"},{"date":"2026-09-25","title":"스티펠 매수 개시","detail":"스티펠  2,540만 캐나다달러, 순손실. 주당이익이 예상보다 낮고 관리비가 2배로 늘어 차익 매물","move":"−11.7%","close":"$19.53"},{"date":"2026-04-17","title":"연중 최고 종가","detail":"연중 최고 종가","move":"장중 $24.41","close":"$23.42"},{"date":"2026-04-13","title":"미국 본사 이전","detail":"본사를 토론토에서 미국 몬태나로 이전","move":"+15.3%","close":"$20.62"},{"date":"2026-03-23","title":"CEO 측 500만주 매도","detail":"CEO 블랙·이사 다마토 공동회사가 500만 주를 $15.25에 매도. 다음 날 블랙이 10만 주 매수","move":"−13.0%","close":"$14.73"},{"date":"2026-03-16","title":"상동 준공·연간 실적","detail":"상동 1단계 준공(3월 17일 기념식), 2025년 실적(순손실 1.6억 캐나다달러)","move":"사흘간 −10%","close":"$17.78"},{"date":"2026-03-02","title":"텅스텐 가격 급등","detail":"회사 공시 없음. 텅스텐 APT 가격 급등(1월 말 약 1,249달러 → 2월 20일 약 1,775달러)이 원인으로 분석됨 (Goldesel 3월 5일)","move":"+12.7%","close":"$20.72"},{"date":"2026-02-27","title":"플란제 매도","detail":"최대 고객 플란제가 250만 주 매도","move":"영향 적음","close":"$18.39"},{"date":"2026-02-03","title":"2월 급등","detail":"직접 원인 확인 못함. 텅스텐 가격 급등기(1월 말 약 1,249달러 → 2월 중순 약 1,737달러)와 겹침","move":"+18.0%","close":"$13.39"},{"date":"2026-01-20","title":"주주서한 발표","detail":"주주서한: 상동 본격 가동·2027년 2단계 계획","move":"+8.9%, 주간 +28%","close":"$9.44"}],"chart_events":["2026-02-03","2026-03-23","2026-04-17","2026-06-04","2026-09-09","2026-10-06"],"bull":["**텅스텐 가격 급등**: 유럽 APT 가격이 2025년 2분기 $453 → 2026년 2분기 $3,075입니다. CEO는 상동 사업 계획을 APT $350에서 짰다고 말했습니다(8월 인터뷰). 가격이 절반으로 떨어져도 처음 계획보다 훨씬 높습니다.","**판매처 확보**: GTP(플란제)와 21년간 441만 MTU, 연 최소 21만 MTU 계약. 회사 계산으로 현재 가격에서 연 4.9억 달러 매출입니다. 최근 12개월 매출(약 6,200만 달러)의 약 8배입니다.","**2단계 확장**: 2027년 상동 2단계가 끝나면 연 46만 MTU 이상 가능하다고 합니다. 회사는 \"중국 밖 텅스텐의 40%\"를 목표로 내걸었습니다.","**돈은 충분**: 6월 말 현금 약 12.3억 캐나다달러(약 9억 미국달러). 빚은 금리 2.25%의 전환사채 8억 달러(2031년 만기)로 이자가 연 1,800만 달러에 불과합니다. 독일 KfW 대출은 다 갚았습니다.","**자사주 매입**: 최대 3억 달러는 현재 시총의 약 9%입니다. 9월 말까지 291만 주를 샀습니다.","**큰손이 늘리는 중**: 피델리티(FMR)가 3월 말 1,829만 주(6.5%) → 7월 말 3,176만 주(11.1%)로 거의 두 배로 늘렸습니다. 쿠퍼 크릭도 상반기에 지분을 2배(478만 주)로 늘렸습니다.","**2027년 규제**: 2027년부터 미 국방 조달에서 중국산 텅스텐이 빠지면 서방 공급자에 주문이 몰릴 수 있습니다.","**전환가보다 한참 아래**: 전환사채 투자자들은 6월에 $27.40(현재가의 2.4배)에 주식으로 바꿀 권리를 샀습니다.","**다른 자산**: 판나스케이라 확장, 미국 몬태나 겐텅, 스페인 광미, 르완다, 상동 몰리브덴이 더 있습니다."],"bear":["**상동은 계속 늦었음**: 2025년 12월 첫 광석 → 3월 '준공' → 7월 선광 시작 → 9월 28일에야 판매용 정광 1톤입니다. 9월 말에도 공장은 하루 13시간만 돕니다.","**EQ리소시스와 비교**: 호주 EQ리소시스는 7~9월 한 분기에 5만 1,233 MTU를 생산하고 매출 1.58억 호주달러(약 1억 미국달러)를 냈습니다. 알몬티의 2분기 매출은 4,300만 캐나다달러(약 3,100만 미국달러)입니다. X의 약세론자들은 \"생산은 EQR이 훨씬 많은데 시총은 알몬티가 약 4배\"라고 지적합니다.","**판나스케이라 생산량 비공개**: 현재 매출의 대부분을 내는 광산인데, 회사는 분기별 MTU 생산량을 따로 밝히지 않습니다.","**매우 비싼 몸값**: 시총 33.4억 달러는 최근 12개월 매출의 약 54배입니다. 골드만삭스는 \"텅스텐 가격과 증산 계획이 이미 주가에 반영됐다\"며 목표가 $13을 제시했습니다.","**8억 달러 빚**: 주가가 2031년까지 $27.40를 넘지 못하면 현금으로 갚아야 합니다. 반대로 주가가 오르면 약 2,920만 주(현재 주식의 약 10%)가 새로 생길 수 있습니다.","**내부자·대주주 매도**: CEO 측 500만 주(7,600만 달러), 플란제 250만 주, 도이체 로스토프 500만 주, 이사 트라척 약 85만 주를 올해 팔았습니다.","**주식 수 증가**: 2025년 12월 말 2.63억 주 → 현재 약 2.88억 주(+10%). 전환사채·워런트 전환이 주원인입니다.","**텅스텐 가격 꺾일 가능성**: 8월 유럽 APT가 4월 이후 처음 내렸고, 중국 내수 가격은 유럽의 3분의 1(약 $1,010)입니다. 중국이 수출을 풀면 가격 차이가 줄어들 수 있습니다. CEO도 \"5~6년 뒤 균형가 APT $1,000~1,400\"을 언급했습니다.","**고객 쏠림**: 상동 1단계 생산의 약 90%가 한 고객(GTP)에게 갑니다.","**정부 돈 없음**: 엘멧과 달리 미 국방부의 직접 투자나 비축 계약이 아직 없습니다.","**큰 변동성**: 하루 ±10% 이상 움직인 날이 올해 10번이 넘고, 연간 변동성은 75~87%로 보도됐습니다."],"analysts_md":"증권사 12곳의 평균 목표가는 약 $24.4로 현재가의 2배가 넘습니다. 다만 대부분 주가가 17~20달러일 때 나온 값이고, 가장 최근에 커버를 시작한 골드만삭스는 13달러를 제시했습니다.\n\n#### 증권사 목표가\n\n| 증권사 | 의견 | 목표가 | 날짜 | 현재가 대비 |\n|---|---|---|---|---|\n| 스티펠 | 매수 (신규) | $25 | 2026-09-25 | +116% |\n| 골드만삭스 | 중립 (신규) | $13 | 2026-09-24 | +12% |\n| DA 데이비슨 | 매수 | $33 (7월 10일 25달러에서 상향) | 2026-09-18 유지 | +185% |\n| 제퍼리스 | 매수 (신규) | $26.25 | 2026-09-02 | +127% |\n| 오펜하이머 | 시장상회 | $25 (22달러에서 상향) | 2026-06-03 | +116% |\n| B. 라이언리 | 매수 | $23 (17달러에서 상향) | 2026-03-20 | +99% |\n| 뱅크오브아메리카 (로슨 윈더) | 매수 (유지) | $23. 5월에 2026년 매출 6.7억·2027년 13억 캐나다달러 이상 예상 | 2026-08-31 | +99% |\n| 컨센서스 (12명) | 강력 매수 | 평균 $24.42 (범위 12.89~32.34달러) | 2026-10-08 기준 | +111% |\n\n읽는 법: 강세 증권사는 \"2028년 말 중국 밖 1위 텅스텐 생산자\"(스티펠)를, 골드만은 \"가격·증산이 이미 주가에 반영\"을 봅니다. 상동 증산 속도가 두 의견을 가르는 열쇠입니다.","insider_title":"내부자·유명인 매매 (2025~)","insider_md":"알몬티는 아직 외국 회사로 분류돼 미국 내부자 보고서(Form 4)가 없습니다. 아래는 캐나다 내부자 공시(SEDI), SEC의 매도 예고(Form 144)·5% 지분 공시(13G)를 모은 것입니다. 한 줄로 말하면 CEO는 조금 사고 많이 팔았고, 강하게 사들인 쪽은 피델리티입니다.\n\n#### 내부자 매수\n\n| 누가 | 직책 | 날짜 | 주식 수 | 가격 | 금액 | 현재가 대비 |\n|---|---|---|---|---|---|---|\n| 루이스 블랙 | 회장 겸 CEO | 2026-03-24 | 100,000 | 14.95달러 | 약 150만 달러 | −23% |\n| 루이스 블랙 | 회장 겸 CEO | 2025-11-26 | 50,000 | 6.33달러 | 약 32만 달러 | +83% |\n| 루이스 블랙 | 회장 겸 CEO | 2025-03-28 | 100,000 (병합 전) | 2.17 캐나다달러 (TSX) | 약 21.7만 캐나다달러 | 약 +400% (2025년 7월 1.5주→1주 병합·환율 반영 추정) |\n\n2025년 이후 내부자 장내 매수는 블랙 CEO 한 사람뿐입니다.\n\n#### 내부자·대주주 매도\n\n| 누가 | 날짜 | 주식 수 | 평균 가격 | 금액 | 메모 |\n|---|---|---|---|---|---|\n| 알몬티 파트너스 LLC (블랙 CEO와 다마토 이사 공동 소유) | 2026-03-23 | 5,000,000 | 15.25달러 | 약 7,600만 달러 | Form 144 사전 신고(메릴린치). 다음 날 주가 −13% |\n| 도이체 로스토프 (독일, 전 5% 주주) | 2026-07 | 5,000,000 | 약 16달러 | 약 8,000만 달러 | 이후 550만 주 보유 |\n| 플란제 홀딩 (최대 고객, 10% 주주) | 2026-02-27 | 2,500,000 | 13.87달러 | 약 3,470만 달러 | 이후 2,766만 주(약 9.6%) 보유 |\n| 마크 트라척 (이사) | 2025-12 ~ 2026-07 | 약 840,000 | 약 14.4달러 | 약 1,210만 달러 (SEDI의 캐나다달러 가격을 당일 환율로 환산. 12월 4일 2만 주는 가격이 없어 약 7달러로 추정) | 7월 1~8일에만 60만 주 |\n| 데이비드 하닉 | 2026-01-08 | 125,418 | 9.61달러 | 약 120만 달러 |  |\n| 토마스 구트샤크 | 2026-01-21 | 79,630 | 10.20달러 | 약 78만 달러 |  |\n| 브라이언 폭스 (전 CFO) | 2026-01-08, 03-25 | 42,222 | 약 12.4달러 | 약 52만 달러 |  |\n| 권경록 | 2026-08-21 | 20,000 | 약 18.7달러 | 약 37만 달러 |  |\n\n- 임원·이사 매도 합계는 약 9,100만 달러입니다(대주주 도이체 로스토프·플란제 제외). 대부분은 3월 23일 블록 매도 한 건입니다.\n- 블랙 CEO는 3월 말 기준 1,946만 주(6.9%)를 여전히 보유합니다.\n- 자동 매도 계획(10b5-1) 여부는 공개된 자료에서 확인되지 않았습니다.\n\n#### 기관·유명 투자자\n\n| 누가 | 지분 | 언제 | 들어온 가격대 | 현재가 대비 |\n|---|---|---|---|---|\n| 피델리티 (FMR) | 3,176만 주 (11.1%). 그중 택티커럴 하이인커봄 펀드 1,619만 주(5.7%) | 3월 말 1,829만 주 → 7월 말 3,176만 주 | 추가 매수 기간(4~7월) 주가 약 11~24달러 | 대부분 손실 구간으로 추정 |\n| 플란제 홀딩 (오스트리아) | 2,766만 주 (약 9.6%) | 2018년부터 전략 투자 | – | 2월 매도가 13.87달러 대비 −17% |\n| 반에크 / T. 로우 프라이스 / 뱅가드 / 블랙록 | 1,177만 / 1,077만 / 830만 / 608만 주 | 2026년 | – | – |\n| 쿠퍼 크릭 파트너스 | 478만 주 (1.7%) | 2026년 상반기에 251만 주 추가 | 상반기 주가 약 9~24달러 | – |\n\n#### 대주주 신고(13G/13D)\n\n| 신고자 | 지분 | 주식 수 | 기준일 (신고일) | 변화 |\n|---|---|---|---|---|\n| 피델리티 (FMR) | 11.1% | 3,176만 주 | 2026-07-31 (8/7) | 3/31 6.5% → 6/30 9.6% → 7/31 11.1%로 계속 늘림 |\n| 플란제 홀딩 | 9.78% | 2,766만 주 | 2025-09-30 기준, 2/27 매도 반영 (6/17) | 3,016만 주에서 2/27에 250만 주 매도 |\n| 루이스 블랙 (CEO) | 6.9% | 1,946만 주 | 2026-03-24 (3/31) | 2025-07-14 8.3%(1,795만 주)에서 비율 감소 |\n| 도이체 로스토프 | 4.9% | 1,402만 주 (전환사채 354만 주 포함) | 2026-03-31 (4/1) | 2025-09-30 10.2%(2,398만 주)에서 절반 이하로 줄임. 7월에 500만 주 추가 매도 |\n\n13D(경영 참여 목적) 신고는 없습니다. 모두 단순 투자 목적의 13G입니다.\n\n- 미 의회 의원(낸시 펠로시 등) 거래: 없음. Quiver Quantitative 의회 거래 페이지에 'ALM 의회 활동 없음'으로 나옵니다. Capitol Trades는 접속이 안 돼 확인 못함 (Quiver 종목 페이지 기준 \"의회 거래 데이터 없음\").\n- 트럼프 대통령: 2025년 8월 이후 OGE 278-T 거래 보고서 19건(2026년 7월 31일 거래분까지)을 모두 확인했지만 알몬티 거래는 없습니다.\n- 정부·군 출신 인사는 매매보다 '이사회 참여'로 연결돼 있습니다: 앨런 에스테베즈(전 상무부 차관), 구스타브 퍼나(퇴역 대장).","next_md":"| 시기 | 확인할 것 | 왜 중요한가 |\n|---|---|---|\n| 2026년 10~12월 | 상동 첫 수출·GTP 첫 납품, 공장 24시간 가동 전환 | 증산이 실제로 되는지 보여주는 첫 증거 |\n| 2026년 11월 중순 (예상) | 3분기 실적 (2분기는 8월 12일 발표) | 상동 첫 매출 반영 여부, 판나스케이라 생산량 공개 여부 |\n| 매월 | 유럽 APT 가격 (8월 말 2,780~3,100달러) | 매출이 이 가격에 연동 |\n| 수시 | 중국 텅스텐 수출 통제 완화 또는 강화 | 중국이 풀면 가격 하락 위험 |\n| 수시 | 자사주 매입 진행 (3억 달러 한도 중 약 4,800만 달러 사용) | 주가 받침 역할 |\n| 2026년 하반기 | 미국 몬태나 겐텅 프로젝트 생산 준비 목표 | 미국 내 생산 자산 |\n| 미정 | 미국 델라웨어 재설립 완료 | 완료되면 Form 4 내부자 보고·10-Q 공시 시작, S&P 지수 요건에도 영향 |\n| 미정 | 미 국방부 비축(DLA)·지원금(DPA) 등 정부 직접 지원 | 엘멧처럼 정부 돈이 들어오면 큰 재료 |\n| 2027-01-01 | 미 국방 조달에서 중국산 텅스텐 금지 시행, 전환사채 첫 이자 지급 | 수요 증가 기대 |\n| 2027년 초 | EQ리소시스 10~12월 분기 생산 발표 | 경쟁사와 생산량 비교 |\n| 2027년 3월 (예상) | 새 감사인 PwC의 첫 연간 감사 (9월 29일 교체) | 회계 신뢰도 |\n| 2027년 | 상동 2단계 완공 목표 (연 120만 톤) | 생산 2배 계획의 핵심 |\n| 2031-07-01 | 전환사채 8억 달러 만기 (전환가 27.40달러) | 주가가 전환가 아래면 현금 상환 |","glossary_md":"| 용어 | 쉬운 뜻 |\n|---|---|\n| 텅스텐 | 녹는점이 가장 높고 아주 무거운 금속. 철갑탄, 미사일, 반도체, 공구에 쓰임 |\n| 정광 | 광석을 부수고 골라 금속 함량을 높인 가루. 광산이 파는 제품 |\n| 선광장 | 광석을 정광으로 만드는 공장 |\n| APT | 파라텅스텐산암모늄. 텅스텐 거래의 기준이 되는 중간재로, 정광 값도 이 가격에 맞춰 정해짐 |\n| MTU | 텅스텐 무게 단위. 1 MTU = 산화텅스텐(WO₃) 10kg |\n| 오프테이크 | 생산하기 전에 미리 맺는 장기 구매 계약 |\n| 전환사채 | 나중에 정해진 가격(여기서는 27.40달러)에 주식으로 바꿀 수 있는 빚. 금리는 낮지만 주식 수가 늘 수 있음 |\n| 캡드콜 | 전환사채로 주식 수가 늘어나는 것을 주가 41.36달러까지 막아주는 보험 같은 계약 |\n| 조정 EBITDA | 이자·세금·감가상각과 일회성 비용을 빼고 본 영업 현금 창출력 |\n| 파생상품 평가손익 | 주가가 오르면 손실, 내리면 이익으로 잡히는 장부상 숫자. 현금과는 무관 |\n| 재설립 (도메스티케이션) | 회사의 법적 국적을 캐나다에서 미국으로 옮기는 절차 |\n| 6-K / 40-F | 외국 회사가 SEC에 내는 수시·연간 보고서 |\n| Form 144 | 내부자가 주식을 팔기 전에 내는 예고서 |\n| 13G | 한 투자자가 지분 5% 이상을 가지면 내는 보고서 |\n| SEDI | 캐나다 내부자 매매 공시 시스템 |\n| 국방 조달 규정(DFARS) | 미 국방부가 무기를 살 때 지켜야 하는 규칙. 2027년부터 중국산 텅스텐 금지 |\n| 자사주 매입 | 회사가 자기 주식을 사서 없애는 것. 남은 주식의 가치가 올라감 |","sources":[{"t":"Almonty 2026년 2분기 실적 보도자료 (SEC 6-K, 2026-08-12)","u":"https://www.sec.gov/Archives/edgar/data/0001670061/000149315226037264/ex99-1.htm"},{"t":"Almonty 2026년 1분기 재무제표 (SEC 6-K, 2026-05-12)","u":"https://www.sec.gov/Archives/edgar/data/0001670061/000149315226022338/ex99-2.htm"},{"t":"Almonty 2025년 4분기·연간 실적 (SEC 6-K, 2026-03-18)","u":"https://www.sec.gov/Archives/edgar/data/1670061/000149315226011481/ex99-1.htm"},{"t":"Almonty 주주서한 (2026-01-20)","u":"https://www.sec.gov/Archives/edgar/data/1670061/000149315226002784/ex99-1.htm"},{"t":"상동 1단계 준공 (2026-03-16)","u":"https://www.sec.gov/Archives/edgar/data/1670061/000149315226010195/ex99-1.htm"},{"t":"미국 본사 이전 (2026-04-13)","u":"https://www.sec.gov/Archives/edgar/data/1670061/000149315226016286/ex99-1.htm"},{"t":"전환사채 가격 결정 (2026-06-04)","u":"https://www.sec.gov/Archives/edgar/data/0001670061/000149315226027390/ex99-1.htm"},{"t":"전환사채 발행 완료 (2026-06-09)","u":"https://www.sec.gov/Archives/edgar/data/1670061/000149315226028532/ex99-1.htm"},{"t":"상동 선광 시작 (2026-07-01)","u":"https://www.sec.gov/Archives/edgar/data/1670061/000149315226031435/ex99-1.htm"},{"t":"GTP 구매 계약 확대 (2026-07-14)","u":"https://www.sec.gov/Archives/edgar/data/1670061/000149315226033123/ex99-1.htm"},{"t":"TSX 상장폐지 (2026-07-17)","u":"https://www.sec.gov/Archives/edgar/data/1670061/00014931  약 4.7억 달러 vs 매수 약 81만 달러. 이사 1명이 8월 말 $57 근처에서 약 62만 달러 매수"],["증권사 평균 목표가","약 $78 (12명, 야후 기준) ~ $85 (MarketBeat). 종합 의견 '보유'"],["공매도 비율","유통주식의 약 22%"]],"overview_md":"#### 기업 개요: 이 회사는 무엇을 하나\n\nAST는 산이나 바다처럼 기지국이 없는 곳에서도 평소 쓰던 스마트폰으로 통화·문자·영상을 쓸 수 있게 하려는 회사입니다. 2017년 설립, 본사와 공장은 미국 텍사스주 미들랜드입니다. 창업자 아벨 아베얀 CEO가 약 22%를 가진 최대주주입니다.\n\n**1. 블루버드(BlueBird) 위성이란?**\n\n- 하늘에 띄운 '거대한 기지국'입니다. 2세대 블루버드는 펼친 안테나가 약 2,400제곱피트(약 223㎡, 농구장 절반 크기)로, 저궤도 상업 통신위성 중 가장 큽니다.\n- 안테나가 커야 아주 약한 휴대폰 전파를 우주에서 들을 수 있습니다. 그래서 폰을 바꾸지 않고도 연결됩니다.\n- 1세대(블록1)는 최대 약 100Mbps, 2세대(블록2)는 약 200Mbps까지 기대합니다.\n- 위성 1기 비용은 발사비 포함 약 2,100만~2,300만 달러입니다.\n\n**2. 위성 숫자: 계획 vs 실제**\n\n| 시점 | 회사 계획 | 실제 |\n|---|---|---|\n| 2026년 3월 2일 | 2026년 말까지 45~60기 | 2세대는 블루버드 6호 1기만 궤도에 |\n| 4월 19일 | → 2026년 말 약 45기로 축소 | 블루오리진 뉴글렌이 7호를 너무 낮은 궤도에 놓아 폐기 (보험 처리) |\n| 5월 28일 | — | 뉴글렌 로켓이 발사장에서 폭발 (다음 발사체 차질) |\n| 6월 | — | 블루버드 8~10호 정상 작동 확인 |\n| 7월 15일 | → 약 45기를 '2027년 초'로 연기 | — |\n| 8월 5일 | — | 스페이스X 팔콘 9로 11~13호 발사. 총 13기 궤도 |\n| 10월 현재 | 14~16호 발사 대기, 17~48호 생산 중 | 아직 14호 발사 발표 없음 |\n\n쉽게 말해 연초 목표의 약 4분의 1만 하늘에 있고, 나머지는 로켓 일정에 달려 있습니다. 회사는 두 곳 발사사와 10번의 발사를 예약했고, 블루오리진에는 더 이상 기대지 않는다고 밝혔습니다.\n\n**3. 서비스 시작 시점**\n\n- FCC(미국 통신 규제기관)는 4월 21일 248기 위성으로 상업 서비스를 하는 것을 승인했습니다 (AT&T·버라이즌의 700·800MHz 저대역 주파수).\n- 미국 일부 고객 대상 '베타(시범) 서비스'는 2026년 하반기 목표입니다. 끊김 없는 상시 서비스는 약 45기가 필요해 2027년으로 밀렸습니다.\n\n#### 돈 버는 구조: 지금은 '장비·정부 계약', 나중에는 '통신사와 수익 나눔'\n\nAST는 소비자에게 직접 요금을 받지 않습니다. AT&T 같은 통신사가 자기 고객에게 위성 요금을 받고, 그 돈을 AST와 나누는 '도매상' 구조입니다. 아직 상시 서비스 전이라 지금 매출은 대부분 지상 장비(게이트웨이) 판매와 정부 계약에서 나옵니다.\n\n| 매출원 | 2026년 2분기 | 설명 |\n|---|---|---|\n| 제품 (게이트웨이 등) | 2,440만 달러 | 위성과 통신사 망을 잇는 지상국. 2분기에만 5개 대륙 7개 고객에 13개 납품 |\n| 서비스 (정부 등) | 710만 달러 | 미국 정부 계약의 단계별 대금 |\n| **합계** | **3,150만 달러** (1분기의 2배) | 상반기 누적 4,630만 달러 |\n\n**주요 통신사 파트너** (60곳 이상, 가입자 합계 30억 명 이상)\n\n| 지역 | 파트너 | 비고 |\n|---|---|---|\n| 미국 | AT&T, 버라이즌, FirstNet(경찰·소방 전용망) | AT&T는 지분 약 2.7%, 미국 3대 통신사 합작 구상도 언급 |\n| 유럽 | 보다폰, 오랑주, 텔레포니카, 도이치텔레콤, 보다폰 우크라이나 | 보다폰는 지분 약 6% |\n| 아시아·중동 | 라쿠텐(일본), stc(사우디) | 일본은 정부 보조금 사업으로 확대 중 |\n| 캐나다 | 벨 캐나다, 텔러스 | 규제 승인 필요 |\n\n**주파수(전파 도로) 확보**\n\n- 기본은 통신사가 가진 주파수를 빌려 씁니다. 더불어 미국에서 자기 몰로 약 100MHz를 확보하려 합니다.\n- 리가도(Ligado)의 L밴드 주파수 40MHz(미국·캐나다) 사용권을 얻는 대가로 (리가도는 2025년 12월 FCC에 면허 변경을 신청, 연간 사용료 등 세부 조건은 확인 못함) 2025년 4.2억 달러, 2026년 상반기 1억 달러를 먼저 지급했습니다.\n- 8월 중순 FCC가 800MHz 주파수 시험용 임시 허가를 내줬습니다.\n\n**재무 상태 (6월 30일 기준)**\n\n- 현금(제한현금 포함) 약 27억 달러. 7월 전환사채 후 약 37억 달러.\n- 7월 21일 11.5억 달러 전환사채 발행: 이자 연 1.625%, 2034년 만기, 실질 전환가 $149.20. 현재가보다 훨씬 높아 당장 주식으로 바뀔 가능성은 낮습니다.\n- 총부채 약 30억 달러 (대부분 전환사채). 상반기에 주식 발행으로 8,570만 달러도 조달했습니다.\n- 돈 쓰는 속도: 2분기 설비투자 약 6.1억 달러, 3분기 예상 3.5억~4.25억 달러. 2분기 순손실 2.31억 달러(주당 −$0.77), 그중 1.26억 달러는 7호 위성 손실 처리.\n\n#### 앞으로의 숫자\n\n| 항목 | 숫자 |\n|---|---|\n| 2026년 매출 목표 | 1.5억~2억 달러 (하반기, 특히 4분기에 몰림) |\n| 3분기 시장 예상 매출 | 약 4,700만 달러 |\n| 수주잔고 | 약 13억 달러 (미국 정부 1.25억 달러 이상 포함) |\n| UBS 매출 추정 | 2026년 1.8억 → 2027년 8.7억 → 2028년 18.4억 → 2030년 35.5억 달러 |\n| 위성 목표 | 2027년 초 약 45기, 장기 90기 이상 (FCC 승인은 248기) |\n| 생산 속도 목표 | 월 6기 |","gov_md":"미국 정부는 AST에 직접 지분 투자를 하지는 않았습니다. 대신 '군인이 들고 다니는 무전기·폰이 위성과 바로 통하는지' 시험하는 작은 계약을 여러 개 주고 있습니다. 합계는 1.25억 달러 이상으로, 회사 수주잔고(13억 달러)의 약 10%입니다. 가장 큰 '정부 돈'은 미국이 아니라 일본 정부에서 나올 예정입니다.\n\n| 목적 | 정부가 한 일 | AST의 역할 |\n|---|---|---|\n| 군 전술 통신 | 우주개발청(SDA, 우주군 소속) 4,300만 달러 계약 (2025년 2월 26일, 원청업체 경유) | 2세대 블루버드를 군 저궤도 위성망(PWSA)에 활용 |\n| 일반 단말 위성 통신 | SDA HALO 유로파 프로그램 3,000만 달러 원청 계약 (2026년 2월 22일) | 기존 군용 무전기와 위성을 직접 연결하는 궤도 시험 |\n| 미사일 방어 (골든돔) | 미사일방어청(MDA) SHIELD 원청 자격 (2026년 1월 15일) | 골든돔 사업 수주 자격. 단, 천 곳 넘는 회사가 함께 뽑힌 '다수 업체 후보 명단'이라 확정 매출은 아님. 발표 다음 날 주가 +14% |\n| 경찰·소방 비상망 | FCC 4월 21일 상업 서비스 승인 때 FirstNet도 포함 | AT&T가 운영하는 공공안전망을 재난 현장에서도 연결 |\n| 2026~27년 예산 | 정부 계약 3건에 1억 달러 이상 예산 확보 (8월 실적 발표) | 회사는 2027년부터 '매년 수십억 달러' 정부 사업을 기대 (근거 미공개) |\n\n**동맹국: 일본 '주권 위성망'**\n\n- 일본 정부의 'J-LEO'(자국 저궤도 위성 인프라) 사업에 라쿠텐·AST 합작사(RAST)가 예비 선정됐습니다 (7월 15일 공시).\n- 보조금은 최대 1,480억 엔(약 10억 달러)입니다. 빚도 신주도 아닌 돈이라 기존 주주 지분이 줄지 않습니다. 단, 최종 승인과 라쿠텐과의 계약이 남아 있습니다.\n- 10월 6일 미 국무부가 발표한 '미·일 기술 번영 협정' 공동성명에서 두 정부는 \"저궤도 위성 인프라 개발·배치를 위한 라쿠텐과 AST의 협력을 환영한다\"고 밝혔습니다 (백악관 크라치오스 과학기술정책실장·후루카와 장관 회담 후. Stocktwits 보도 인용, state.gov 원문 페이지는 열리지 않아 직접 확인 못함). 이날 주가 +8.0%.\n- 유럽에서는 보다폰·도이치텔레콤 등과 망 연동을 진행 중이고, 전쟁 중인 보다폰 우크라이나도 파트너입니다.\n\n**경쟁 구도: 미국 안에서는 스페이스X, 밖에서는 중국**\n\n| 경쟁자 | 현황 | AST에 주는 의미 |\n|---|---|---|\n| 스페이스X(스타링크) | 6월 상장(SPCX). 5월 에코스타 주파수 약 65MHz 인수 승인. 직접 로켓을 쏘고 T모바일과 제휴. 6월 30일 FT는 스페이스X가 직접 휴대폰 요금제 판매를 검토한다고 보도 | 가장 큰 위협. 10월 8~9일 스페이스X가 그레인의 전국 800MHz 주파수(최대 14MHz 쌍, 약 80억 달러로 보도) 인수 합의를 발표하고 '스타링크 모바일' 통신 서비스 계획을 밝힘. AST도 노리던 주파수(8월 입찰 경쟁)였고, 9일 AT&T·버라이즌은 −6~7% |\n| 비아샧·스페이스42 합작사(이퀴타스) | 위성-폰 직접 통신 신규 경쟁자 | B. 라이언리가 가격 경쟁 우려로 언급 |\n| 중국 (국영 저궤도 위성망) | 수만 기 규모 위성망 계획 | 미국·동맹이 '스타링크 하나에만 기대지 않는' 두 번째 미국산 선택지로 AST를 키울 이유 |\n\n정리하면, 미국 정부에게 AST는 '스타링크 독점을 막는 예비 선수'이자 군 통신 시험 대상입니다. 하지만 정부가 돈을 직접 넣은 회사(MP, 엘멧 등)만큼 '국가 대표'로 지정된 상태는 아닙니다.","gov_title":"정부가 이 회사를 쓰는 방법","events":[{"date":"2026-10-08","title":"스페이스X 그레인 주파수","detail":"스페이스X가 그레인의 800MHz 주파수(약 80억 달러 보도) 인수와 '스타링크 모바일' 통신사 계획 발표(9일 보도 집중). AST도 인수를 노리던 주파수. 같은 날 클리어스트리트는 FCC 안건이 AST에 '엇갈린다'고 평가","move":"−6.1%"},{"date":"2026-10-06","title":"미·일 공동성명 환영","detail":"미 국무부 미·일 기술 협정 공동성명이 라쿠텐·AST 저궤도 위성 협력을 '환영'","move":"+8.0%"},{"date":"2026-10-02","title":"B.라이언리 하향","detail":"B. 라이언리 '중립'으로 하향, 목표가 $85 → $65. 발사 지연·비용 증가·가격 경쟁 우려. RBC도 하향","move":"+2.5% (주간 약세)"},{"date":"2026-09-15","title":"집단소송 모집","detail":"여러 법무법인이 집단소송 참여자 모집 (대상 기간 2025년 3월 4일~2026년 7월 15일, 신청 마감 11월 13일)","move":"부담"},{"date":"2026-09-02","title":"베렌버그 신규 매수","detail":"베렌버그 신규 '매수', 목표가 $92. UBS도 신규 커버","move":"+11.8%"},{"date":"2026-08-10","title":"2분기 실적","detail":"2분기 실적: 매출 3,150만 달러, 연간 목표 1.5억~2억 달러 유지, 수주잔고 13억 달러","move":"다음 날 +4.2%"},{"date":"2026-08-05","title":"11~13호 발사 성공","detail":"팰컨 9로 블루버드 11~13호 발사 성공 (궤도 위 13기)","move":"−2.7%"},{"date":"2026-07-21","title":"전환사채 확정","detail":"11.5억 달러 전환사채 확정 (이자 1.625%, 전환가 $149.20)","move":"+10.3%"},{"date":"2026-07-15","title":"전환사채·45기 연기","detail":"10억 달러 전환사채 발표 + 약 45기 목표를 '2026년 말'에서 '2027년 초'로 연기. 일본 J-LEO 예비 선정도 같은 날 공시","move":"−17.0% (올해 최대 하락)"},{"date":"2026-06-29","title":"8~10호 정상 작동","detail":"블루버드 8~10호 궤도에서 정상 작동 확인","move":"+21.4% (올해 최대 상승)"},{"date":"2026-06-12","title":"스페이스X 상장","detail":"스페이스X 나스닥 상장. 투자금이 스페이스X로 옮겨 감","move":"−15.5%"},{"date":"2026-05-28","title":"뉴글렌 폭발","detail":"장중·종가 최고 $133.09 직후, 주력 발사체 블루오리진 뉴글렌이 발사장에서 폭발","move":"−14.8%"},{"date":"2026-05-22","title":"우주주 열풍","detail":"스페이스X 상장을 앞둔 우주주 열풍 (5월 한 달 +53.5%)","move":"3거래일 +34%"},{"date":"2026-04-19","title":"7호 폐기·FCC 승인","detail":"뉴글렌이 블루버드 7호를 너무 낮은 궤도에 올려 폐기. 연말 목표 45~60기 → 약 45기. 4월 21일 FCC 상업 서비스 승인","move":"사흘간 −11% 후 반등"},{"date":"2026-04-14","title":"미키타니 매도","detail":"미키타니 히로시(라쿠텐 회장) 304만 주 매도 (약 2.7억 달러)","move":"이틀간 −13%"},{"date":"2026-03-02","title":"2025년 실적 발표","detail":"2025년 실적 발표 (연매출 7,090만 달러), 이후 반등","move":"3일간 +32%"},{"date":"2026-02-22","title":"SDA HALO 계약","detail":"우주개발청(SDA) HALO 3,000만 달러 계약","move":"+4.6%"},{"date":"2026-02-12","title":"원인 불명 급락","detail":"원인 확인 못함 (회사 공시 없음)","move":"−15.2%"},{"date":"2026-01-15","title":"SHIELD 원청 자격","detail":"미사일방어청 SHIELD(골든돔) 원청 자격","move":"+14.3%"}],"chart_events":["2026-01-15","2026-03-02","2026-05-28","2026-06-29","2026-07-15","2026-10-08"],"bull":["**통신사 연합군**: 60곳 이상, 가입자 30억 명 이상과 제휴했습니다. AT&T·버라이즌·보다폰·라쿠텐은 지분까지 가진 주주입니다. 스페이스X가 직접 통신사가 되면 기존 통신사는 오히려 AST와 더 강하게 뭉칠 수밖에 없다는 해석이 X에서 나왔습니다.","**수주잔고 13억 달러**: 최근 12개월 매출(1.15억 달러)의 약 11배가 이미 계약돼 있습니다. UBS는 매출이 2026년 1.8억 → 2027년 8.7억 → 2030년 35.5억 달러로 늘 것으로 봅니다.","**돈은 충분**: 7월 전환사채 후 현금 약 37억 달러. 위성 1기당 2,100만~2,300만 달러라 수치상 90기 이상을 만들 수 있는 돈입니다. 전환사채 이자는 연 1.625%로 낮고, 전환가 $149.20은 현재가의 2.6배라 당장 주식 희석은 적습니다.","**정부 매출의 성장**: 골든돔(SHIELD) 원청 자격, SDA 계약 2건, 2026~27년 1억 달러 이상 예산 확보. 일본 정부 보조금 최대 약 10억 달러는 현재 시총(222억 달러)의 약 4.5%에 해당하는 '공짜 돈'입니다.","**규제 승인과 주파수**: 4월 21일 FCC 상업 서비스 승인(248기). 리가도 L밴드에 이미 5.2억 달러를 선지급해 자기 주파수를 만들어 가고 있습니다.","**가격이 많이 내려옴**: 현재가 $56.93은 고점 대비 −57%, 증권사 평균 목표가(약 $78~85)보다 37~49% 아래입니다. 공매도가 유통주식의 약 22%로 많아, 발사 성공 같은 호재에 급등하기 쉽습니다 (6월 29일 하루 +21%)."],"bear":["**위성 일정이 반복해서 밀림**: 3월 목표 '2026년 말 45~60기' → 4월 '45기' → 7월 '2027년 초 45기'. 10월 현재 궤도 위는 13기입니다. 상시 서비스와 본격 매출도 2027년으로 밀렸습니다.","**스페이스X라는 거인**: 스타링크는 가입자 약 1,000만 명, 자체 로켓, 5월 에코스타 주파수 약 65MHz 인수 승인. 6월 30일 FT 보도에 따르면 직접 휴대폰 요금제 판매를 검토 중입니다. AST의 파트너 통신사와 정면 경쟁이 될 수 있습니다. 10월 8~9일에는 AST도 노리던 그레인의 800MHz 저대역 주파수를 스페이스X가 가져가기로 합의해(약 80억 달러 보도) '스타링크 모바일' 계획이 현실이 됐습니다.","**돈을 빨리 씀**: 2분기 설비투자 약 6.1억 달러, 순손실 2.31억 달러. 총부채 약 30억 달러. 상반기에도 주식 8,570만 달러어치를 새로 발행했습니다. 추가 자금 조달(희석) 가능성이 남아 있습니다.","**주가가 매출에 비해 비싼 편**: 기업가치를 향후 12개월 예상 매출로 나눈 배수가 약 53배로, 스페이스X(약 25배), 이리듀(약 7배)보다 높습니다.","**발사체 의존**: 뉴글렌은 4월 7호 위성 실패, 5월 28일 발사장 폭발. 대안인 팔콘 9은 경쟁자 스페이스X의 로켓입니다.","**내부자·대주주 매도와 소송**: 2025년 이후 내부자·대주주 매도 약 4.7억 달러. 라쿠텐 회장(4월, 2.7억 달러)과 아메리칸타워(2025년 12월, 1.6억 달러)가 크게 팔았습니다. \"경쟁 우위와 자금 사정을 부풀렸다\"는 주주 집단소송(마감 11월 13일)과, 중개수수료 1,500만 달러 이상을 요구하는 및동 소송(8월 20일)도 있습니다.","**새 경쟁자와 가격 압박**: B. 라이언리는 비아샧·스페이스42 합작사 등으로 요금이 낮아질 수 있다며 10월 2일 목표가를 $65로 낮췄습니다."],"analysts_md":"증권사 의견은 크게 갈립니다. 목표가는 $50.80~$108로 두 배 넘게 벌어져 있고, 종합 의견은 '보유'입니다. 최근(10월) 움직임은 하향 쪽입니다.\n\n| 날짜 | 증권사 | 의견 | 목표가 | 현재가 대비 |\n|---|---|---|---|---|\n| 10월 9일 | 베렌버그 | 매수 (재확인, X 글 기준) | $92 | +62% |\n| 10월 5일 | 윌리엄블레어 | 시장수익 | – | – |\n| 10월 2일 | B. 라이언리 | 매수 → 중립 | $85 → $65 | +14% |\n| 10월 2일 | RBC | 하향, 섹터퍼폼 | – | – |\n| 9월 2일 | 베렌버그 | 신규 매수 | $92 | +62% |\n| 9월 2일 | UBS | 신규 커버 (매수) | – | – |\n| 8월 12일 | 도이치뱅크 | – | $93 | +63% |\n| 8월 11일 | 파이퍼샌들러 | 비중확대 | $100 → $98 | +72% |\n| 8월 11일 | 칸터 피츠제럴드 | 비중확대 | $80 → $90 | +58% |\n| 7월 29일 | 스코샤뱅크 | 비중축소 → 섹터퍼폼 | $50.80 | −11% |\n| 5월 29일 | 뉴스트리트 | – | $106 | +86% |\n| 5월 12일 | 로스 캐피털 | 매수 | $108 (최고) | +90% |\n| 4월 9일 | 바클레이스 | 비중축소 | $60 → $65 | +14% |\n\n종합: 매수 5, 보유 7, 매도 2, 평균 목표가 $84.58 (MarketBeat, 12개월). 야후 기준 평균은 $77.94(12명). 베렌버그는 \"일반 스마트폰에 진짜 위성 광대역을 입증한 유일한 회사\"를, B. 라이언리는 \"가입자·요금 데이터가 나오기 전까지는 지금 가격이 적정\"을 근거로 들었습니다.","insider_title":"내부자·유명인 매매 (2025~)","insider_md":"2025년 이후 내부자·대주주는 28번에 걸쳐 약 4.7억 달러를 팔았고, 산 것은 이사 2명의 약 81만 달러(8번)뿐입니다. 매도액의 약 92%는 라쿠텐 회장과 아메리칸타워 두 대주주입니다. 현재가는 $56.93 (10월 8일 종가)입니다.\n\n**내부자 매수 (SEC Form 4, 장내 매수)**\n\n| 누가 | 역할 | 날짜 | 주식 수 | 가격 | 금액 | 현재가 대비 |\n|---|---|---|---|---|---|---|\n| 아드리아나 시스네로스 | 사외이사 | 2026년 8월 31일 | 10,822주 (3건) | 평균 $57.22 | 약 61.9만 달러 | −0.5% |\n| 키스 라슨 | 사외이사 | 2025년 12월 24일 | 625주 | $80.00 | 5.0만 달러 | −29% |\n| 키스 라슨 | 사외이사 | 2025년 12월 17일 | 715주 | $70.02 | 5.0만 달러 | −19% |\n| 키스 라슨 | 사외이사 | 2025년 12월 10일 | 675주 | $72.71 | 4.9만 달러 | −22% |\n| 아드리아나 시스네로스 | 사외이사 | 2025년 11월 20일 | 750주 (2건) | $50.79 | 3.8만 달러 | +12% |\n\n라슨 이사는 미리 정한 계획(10b5-1)에 따라 매주 약 5만 달러씩 샀습니다. 시스네로스 이사의 8월 말 매수는 현재가와 거의 같은 가격입니다. 경영진(CEO·CFO 등)의 장내 매수는 없습니다.\n\n**내부자·대주주 매도 요약 (2025년 1월~2026년 9월)**\n\n| 누가 | 역할 | 기간 | 주식 수 | 평균 가격 | 금액 | 계획 매도(10b5-1) |\n|---|---|---|---|---|---|---|\n| 미키타니 히로시 | 이사 (라쿠텐 회장) | 2026년 4월 14~15일 | 304만 주 | $89.11 | 2.71억 달러 | 아니오 |\n| 아메리칸타워 | 10% 이상 대주주 | 2025년 12월 9일 | 229만 주 | $69.75 | 1.60억 달러 | 아니오 |\n| 후이웬 야오 | CTO | 2025년 5월~2026년 9월 | 27.5만 주 | $60.75 | 1,670만 달러 | 대부분 예 (분기마다 4만 주) |\n| 스콧 위스니어스키 | 사장 | 2025년 3월~2026년 5월 | 15.9만 주 | $66.34 | 1,050만 달러 | 아니오 |\n| 앤드류 존슨 | CFO | 2025년 8월~2026년 6월 | 8.1만 주 | $78.68 | 640만 달러 | 아니오 |\n| 샨티 굽타 | COO | 2025년 3월~2026년 9월 | 7.1만 주 | $43.73 | 310만 달러 | 아니오 |\n| 기타 3명 | 이사·회계책임자 | – | – | – | 약 240만 달러 | – |\n| **합계** | 28건 |  |  |  | **약 4.70억 달러** |  |\n\n가장 최근에는 9월 16일 CTO(4만 주, $58.93, 계획 매도)와 COO(1.2만 주, $58.89)가 현재가 근처에서 팔았습니다. CFO는 6월 11일 $93.81에 4.6만 주를 팔아, 지금보다 39% 높은 가격에 현금화했습니다.\n\n**대주주 (13D/13G 지분 신고)**\n\n| 주주 | 지분율 | 신고 시점 | 비고 |\n|---|---|---|---|\n| 아벨 아베얀 (CEO·창업자) | 25% → 22% | 2025년 1월 → 10월 29일 | 7,816만 주. 팔지 않았고 신주 발행으로 비율만 줄어듦 |\n| 보다폰 벤처스 | 6% | 2025년 3월 | 통신사 파트너 |\n| 블랙록 | 4.7% | 2025년 3월 | 자산운용사 |\n| AT&T | 2.7% | 2025년 2월 (13D) | 통신사 파트너 |\n\n2025년 2~3월 신고 당시 주가는 약 $28~32(같은 시기 Form 4 거래가)로, 현재가는 그보다 약 80~100% 높습니다. 2026년 구글·버라이즌의 새 13D/13G는 확인되지 않았습니다.\n\n**유명인·정치인**\n\n- **트럼프 대통령 (OGE 278-T 공시)**: 위탁 운용계좌에서 건당 1,001~15,000달러의 소액 거래입니다.\n\n| 구분 | 날짜 | 그날 종가 | 현재가 대비 |\n|---|---|---|---|\n| 매수 2건 | 2026년 3월 17일 | $95.70 | −41% |\n| 매수 | 2026년 4월 7일 | $92.57 | −39% |\n| 매수 | 2026년 4월 15일 | $86.91 | −34% |\n| 매도 | 2026년 5월 18일 | $86.83 | – |\n| 매도 | 2026년 6월 16일 | $82.25 | – |\n| 매수 | 2026년 7월 17일 | $57.80 | −1.5% |\n\n- **낸시 펠로시 및 의회 의원**: 2025년 이후 ASTS 거래 기록이 없습니다 (Quiver Quantitative 의회 거래 추적 기준).\n\n참고: kit의 Form 4 자료에서 위스니어스키 사장의 $126.64·$94.75 매도 2건은 날짜가 2025년으로 적혀 있었지만, 가격으로 보아 2026년 5월 27일·3월 17일 거래로 보고 계산했습니다.","next_md":"- 2026년 10월 중 (예상): 블루버드 14~16호 팔콘 9 발사. 날짜 발표와 성공 여부가 가장 가까운 주가 변수\n- 10월: FCC 안건(클리어스트리트는 AST에 '엇갈린다'고 평가)과 스페이스X의 통신사 진출 구체안\n- 2026년 11월 10일 전후 (추정): 3분기 실적. 시장 예상 매출 약 4,700만 달러, 연간 1.5억~2억 달러 목표 유지 여부 (하반기에만 1.04억~1.54억 달러가 필요)\n- 2026년 11월 13일: 주주 집단소송 대표원고 신청 마감\n- 2026년 연말: 미국 베타(시범) 서비스 시작 여부, 위성 추가 발사 횟수 (예약 10회)\n- 일본 J-LEO: 라쿠텐 합작사 최종 선정과 최대 10억 달러 보조금 확정\n- 정부 계약: SHIELD(골든돔) 실제 발주, SDA 시험 결과, 새 계약\n- 2027년 초: 약 45기 목표 달성과 미국·유럽·일본 상시 서비스 시작\n- 추가 자금 조달(주식 발행·전환사채)과 내부자 매도 흐름\n- 블루오리진 뉴글렌 비행 재개 시점","glossary_md":"| 용어 | 뜻 |\n|---|---|\n| 위성-폰 직접 통신 (D2D) | 전용 장비 없이 평소 쓰던 휴대폰이 위성과 바로 연결되는 것 |\n| 저궤도(LEO) | 지구 위 수백~2,000km 높이. 가까워서 지연이 적지만 위성이 많이 필요함 |\n| 통신사(MNO) | AT&T, 보다폰처럼 휴대폰 요금을 받는 회사 |\n| 게이트웨이 | 위성과 통신사 지상망을 잇는 땅 위 안테나 기지 |\n| 주파수(MHz) | 전파가 다니는 '도로'. 넓을수록 더 많은 데이터를 보냄 |\n| 수주잔고 | 이미 계약했지만 아직 매출로 잡히지 않은 금액 |\n| 전환사채 | 나중에 정해진 가격(전환가)으로 주식으로 바꿀 수 있는 빚. 주가가 전환가를 넘으면 주식 수가 늘어 희석됨 |\n| 희석 | 새 주식이 발행돼 기존 주주의 지분 비율이 줄어드는 것 |\n| 설비투자(capex) | 위성·공장·발사비처럼 오래 쓸 자산에 들인 돈 |\n| 골든돔 / SHIELD | 미국 본토 미사일 방어망 계획 / 그에 필요한 제품을 여러 회사에서 사들이는 대형 묶음 계약 |\n| SDA | 미 우주군 소속 우주개발청. 군용 저궤도 위성망을 만듦 |\n| FirstNet | AT&T가 운영하는 경찰·소방 등 공공안전 전용 통신망 |\n| 10b5-1 | 내부자가 미리 정해 둔 일정에 따라 자동으로 사고파는 계획 |\n| 13D / 13G | 지분 5% 이상 대주주가 내는 신고서 (13D는 경영 참여 의도 포함) |\n| 공매도 비율 | 주가 하락에 베팅한 주식이 유통주식에서 차지하는 비중 |","sources":[{"t":"SEC 8-K: 2026년 2분기 실적 보도자료","u":"https://www.sec.gov/Archives/edgar/data/0001780312/000119312526342540/asts-ex99_1.htm"},{"t":" adf2dba3-4234-4daf-8aa2-8bc731b469ad","lead":"에어로바이런먼트(AVAV)는 미 육군의 자폭 드론 '스위치블레이드'와 소형 정찰 드론 '퓨마'를 만드는 미국 최대 소형 군용 드론 회사이고, 2025년 블루헤일로 합병으로 레이저 대드론 무기 'LOCUST'까지 갖게 됐습니다. 매출과 수주잔고는 사상 최고인데, 우주군 대형 계약 해지·실적 부진·드론주 전체 약세가 겹쳐 주가는 1월 고점에서 65% 내려왔습니다.","glance":[["현재가","$137.60"],["시가총액","약 70억 달러 (발행주식 5,082만 주)"],["2026년 고점 / 저점 (종가)","$392.86 (1월 16일) / $136.68 (6월 25일)"],["고점 대비","−65% (연초 $256.19 대비 −46%)"],["매출 (최근 12개월)","약 20억 달러. 2027 회계연도(2026년 5월~2027년 4월) 회사 목표 21.25억~22.25억 달러"],["수익성","매출총이익률 약 26%, GAAP 기준 소폭 적자 (1분기 순손실 510만 달러), 조정 EPS 흑자"],["정부 개입","지분 투자는 없음. 대신 최대 고객이 미 국방부(전쟁부)이고, 8월 13일 수입 드론 관세(최대 100%)·육군 레이저 양산 계약(4.65억 달러)으로 간접 지원"],["국방 필수도","높음. 스위치블레이드는 육군 차세대 자폭 드론 사업(LASSO) 선정, 레이저 무기는 미국 첫 양산 계약"],["내부자 동향","2025년 이후 장내 매수 0건, 매도 25건 약 1,150만 달러 (대부분 사전 계획 매도)"],["의원 매매","하원 길 시스네로스 의원: 2025년 10월~2026년 3월 4차례 매수 후 7월 2일 일부 매도 ($1천~1.5만 달러)"],["애널리스트 평균 목표가","$216.63 (20명, 범위 $148.57~$315). 현재가 대비 +57%"],["공매도 비율","유통주식의 약 11.8%"]],"overview_md":"#### 기업 개요\n\n에어로바이런먼트(줄여서 AV)는 1971년에 세워진 미국 방산 기술 회사입니다. 본사는 버지니아주 알링턴, 직원은 약 4,000명입니다. 회계연도는 5월에 시작해 다음 해 4월에 끝납니다(예: 2027 회계연도 = 2026년 5월~2027년 4월).\n\n| 제품 | 무엇인가 | 쉬운 설명 |\n|---|---|---|\n| 스위치블레이드 300/400/600 | 배회형 탄약(자폭 드론) | 병사가 들고 다니다 발사하면 하늘에서 맴돌다 표적에 뛰어들어 터지는 드론. 우크라이나 전쟁으로 유명해짐 |\n| 퓨마·레이븐·JUMP 20·P550 | 소형·중형 정찰 드론 | 손으로 던져 띄우는 정찰기. 적 위치를 찍어 보냄. P550은 육군 장거리 정찰 사업 선정 |\n| LOCUST (로카스트) | 레이저 대드론 무기 | 30kW 레이저로 드론을 태워 떨어뜨림. 한 발 비용이 수 달러 수준 |\n| 타이탄 등 | 전파 방식 대드론 | 드론의 통신을 막거나 교란해 무력화 |\n| 우주·사이버 | 위성 안테나, 레이저 통신, 사이버 전자전 | 블루헤일로에서 들어온 사업 |\n\n**블루헤일로 합병**\n\n- 2024년 11월 발표, 2025년 5월 1일 완료한 약 41억 달러 규모의 전액 주식 교환 인수입니다. 블루헤일로의 주인이던 사모펀드 알링턴 캐피털 측(Altitude V Holdings)은 현금 대신 AV 신주 약 673만 주(당시 지분 14.7%)를 받았습니다. 레이저(LOCUST), 우주 안테나, 사이버 사업을 가져왔습니다.\n- 그 결과 2026 회계연도 매출은 19.8억 달러로 141% 늘었습니다. 대신 주식 수가 크게 늘고, 서비스 매출 비중이 커져 매출총이익률은 36% → 32%(4분기)로 낮아졌습니다.\n- 블루헤일로가 따온 우주군 위성 안테나 계약(BADGER, 17억 달러)이 2026년 3월 해지되면서 1.51억 달러의 영업권(인수 프리미엄) 손상을 처리했습니다.\n\n#### 돈 버는 구조\n\n매출의 대부분은 미 국방부와 동맹국 정부가 무기를 사면서 내는 돈입니다. 드론을 한 번 팔고 끝나는 게 아니라, 자폭 드론은 쓰면 없어지므로 계속 다시 주문됩니다.\n\n| 사업부 | 2027 회계연도 1분기 매출 (2026년 5~7월) | 조정 EBITDA | 내용 |\n|---|---|---|---|\n| 자율시스템(AxS) | 3.46억 달러 (72%) | +6,230만 달러 | 스위치블레이드, 퓨마, P550, 전파 대드론 |\n| 우주·사이버·지향에너지(SCDE) | 1.35억 달러 (28%) | −890만 달러 | LOCUST 레이저, 위성 안테나, 사이버 |\n| 합계 | 4.805억 달러 (+6%) | 5,340만 달러 | 수주 7억 달러, 수주/매출 비율 1.4 |\n\n- 드론 사업은 돈을 벌고, 블루헤일로에서 온 우주·레이저 사업은 아직 적자입니다.\n- GAAP 순이익은 인수 관련 무형자산 상각 때문에 적자(1분기 −510만 달러, 주당 −$0.10)이고, 이를 뺀 조정 EPS는 $0.59입니다.\n- 현금·단기투자 약 5.8억 달러, 장기부채 7.3억 달러 (2026년 8월 1일).\n\n#### 앞으로의 숫자\n\n| 항목 | 값 | 비고 |\n|---|---|---|\n| 2027 회계연도 매출 목표 | 21.25억~22.25억 달러 | 9월 9일 유지 (상향 없음) |\n| 조정 EBITDA 목표 | 3.05억~3.25억 달러 |  |\n| 조정 EPS 목표 | $3.02~$3.34 | 6월 발표 당시 시장 기대 $4.00보다 낮아 실망 |\n| GAAP EPS 목표 | $0.21~$0.53 | 인수 상각 반영 |\n| 수주잔고(자금 확보분) | 15억 달러 | 1년 전보다 +37% |\n| 2030 회계연도 목표 (7월 8일 투자자의 날) | 매출 35억~40억 달러, 연 15~20% 자체 성장, 조정 EBITDA 마진 18~20% | X에서는 육군 레이저 양산(E-HEL) 계약이 이 목표에 빠져 있다고 봅니다 |\n\n주가를 목표치에 대입하면: 현재가 $137.60은 올해 조정 EPS 목표 중간값($3.18)의 약 43배, 시총 70억 달러는 올해 매출 목표의 약 3.2배입니다.","gov_md":"미 정부는 AV에 지분 투자를 하진 않았지만, 가장 큰 고객이자 규칙을 만드는 쪽입니다. 방식은 세 가지입니다. ① 무기를 산다, ② 공장을 짓도록 돈을 대준다, ③ 외국(특히 중국) 드론을 막는다.\n\n**왜 중요한가 (강대국 경쟁)**\n\n- 우크라이나 전쟁과 이란 분쟁에서 값싼 드론이 비싼 무기를 부수는 일이 계속됐습니다. 미국은 수백만 달러짜리 미사일 대신 한 발에 수 달러인 레이저로 드론을 막으려 합니다.\n- 세계 상업용 드론은 중국 DJI가 장악했습니다. 미국은 국방용 드론과 부품을 미국·동맹국에서 만들도록 바꾸려 합니다(리쇼어링).\n- 대만·그리스 등 동맹국도 중국·러시아 위협에 대비해 스위치블레이드를 사거나 합작 공장을 세웁니다.\n\n| 날짜 | 정부 조치 | 금액 | 의미 |\n|---|---|---|---|\n| 2026년 9월 2일 | 육군 E-HEL(지속 고에너지 레이저) 계약 체결 (8월 18일 선정 발표) | 4.648억 달러 | 미국 역사상 첫 레이저 무기 양산 계약. LOCUST X3(30kW) 수십 대 납품 |\n| 2026년 9월 3일 | 수입 드론 관세 발효 (8월 13일 서명, 무역확장법 232조) | 25kg 초과·열화상 드론 100%, 그 외 25% | 중국산 드론 가격이 오르고 미국 제조사가 유리. EU·일본·한국·대만은 15% 제한 |\n| 2026년 8월 말 | 국경 합동임무단이 AV의 AMP-HEL 레이저로 카르텔 연계 드론 3대 격추 | – | 실제 작전 사용 |\n| 2026년 7월 8일 | 첫 해외 LOCUST 주문 (직접 상업 판매) | 5,000만 달러 이상 | 동맹국으로 판매 확대 |\n| 2026년 5월 26일 | 정부 투자로 앨라배마 헌츠빌 공장 확장 (프리덤 이글-1 요격기) | 2,020만 달러 | 드론 요격 미사일 생산 |\n| 2026년 5월 28일 | 공군 연구소 차세대 세라믹 소재 계약 + WSJ \"국방부, 드론 회사 지분 투자 검토\" 보도 | 2,000만 달러 | AV는 투자 대상으로 지명되지 않았음 |\n| 2026년 5월 4일 | 육군이 스위치블레이드 400을 차세대 배회형 탄약 사업(LASSO)에 선정 | 미공개 | 장기 구매 사업의 핵심 부품이 됨 |\n| 2026년 3월 | 우주군이 BADGER 위성 안테나 계약 해지, SCAR 사업 재입찰 | 17억 달러 규모 | 정부가 발을 뺄 사례. 상업 판매 권리를 두고 협상 결렬 |\n| 2026년 3월 | 뉴멕시코 앨버커키 레이저 공장 투자 (주 정부 인센티브 600만 달러) | 3,000만 달러 | LOCUST 양산 준비 |\n| 2026년 2월 26일 | 육군 스위치블레이드 600 블록2·300 블록20 주문 | 1.86억 달러 | 자폭 드론 반복 주문 |\n\n**동맹국과의 연결**\n\n- 그리스: 현지 기업 아이오닉스와 합작사 'AV 이글' 설립 (8월 20일 회사 발표. 2027년 운영 시작, 2028년 생산 목표. 그리스 정부의 외국인 투자 승인이 필요).\n- 대만·우크라이나: 스위치블레이드와 퓨마가 지원·판매됐고, 우크라이나 전장이 실전 검증 무대가 됐습니다.\n- 수입 드론 관세는 동맹국에 15%로 낮게 매기고 중국에는 높게 매겨, '동맹 공급망'을 키우려는 구조입니다.\n\n참고: 국경 레이저 사용은 잡음도 있었습니다. 2026년 2월 엘파소 인근에서 레이저가 오인 격추를 해 미 항공청(FAA)이 공역을 일시 폐쇄했고, 4월 화이트샌즈 시험 뒤에야 국방부·FAA가 안전 합의를 했습니다.","gov_title":"정부가 이 회사를 쓰는 방법","events":[{"date":"2026-09-11","title":"실적 뒤 목표가 하향","detail":"실적 뒤 목표가 하향 잇따름 (BofA $225 → $185, 제프리스 $229 → $204). 연간 목표 유지에 대한 실망","move":"9월 25일 −3.8%"},{"date":"2026-09-09","title":"1분기 실적","detail":"2027 회계연도 1분기 실적: 매출 4.805억 달러(+6%), 조정 EPS $0.59, 수주잔고 15억 달러 사상 최고. 연간 목표는 그대로","move":"주간 +1% ($146.71), 이후 다시 하락"},{"date":"2026-09-02","title":"E-HEL 계약 체결","detail":"육군 E-HEL 레이저 양산 계약 4.648억 달러 공식 체결","move":"반응 미미 (8월 7일 보도에 이미 반영)"},{"date":"2026-08-13","title":"수입 드론 관세 서명","detail":"트럼프 대통령, 수입 드론 관세(최대 100%) 서명. 9월 3일 발효","move":"주간 +3% ($192.81) 후 다음 주 −17%"},{"date":"2026-08-07","title":"육군 레이저 구매 보도","detail":"블룸버그 \"육군, LOCUST 레이저 최소 4억 달러 구매\" 보도","move":"당일 +8%, 주간 +25% ($186.73)"},{"date":"2026-07-08","title":"투자자의 날·RBC 하향","detail":"투자자의 날(2030년 매출 35억~40억 달러 목표) 직후 RBC 등급 하향(목표가 $210 → $180), 여러 곳 목표가 하향","move":"주간 −24% ($190.89 → $144.58)"},{"date":"2026-07-02","title":"실적 후 상승 지속","detail":"실적 후 상승 이어짐. 시스네로스 의원 매도일","move":"+10.7% ($190.89)"},{"date":"2026-06-30","title":"4분기 실적 발표","detail":"2026 회계연도 4분기 실적: 매출 6.416억 달러(+133%), 조정 EPS $1.84 (예상 $1.49)","move":"+18.8% ($165.07). 단 새해 EPS 목표는 기대보다 낮음"},{"date":"2026-06-22","title":"실적 정정 공시","detail":"3분기(2026년 1월 말) 실적 정정 공시(8-K): 영업권 손상 계산 오류로 순손실 8,730만 달러 과소 계상, 내부통제 '중요한 미비점' 확인 (현금 영향 없음)","move":"−10.8% ($151.33)"},{"date":"2026-05-28","title":"국방부 지분 투자 보도","detail":"WSJ \"국방부, 드론 회사 지분 투자 검토\" 보도 + 공군 2,000만 달러 계약","move":"+18.3% ($214.39)"},{"date":"2026-05-04","title":"LASSO 선정","detail":"스위치블레이드 400, 육군 LASSO(차세대 자폭 드론) 사업 선정","move":"주간 −9% (호재에도 하락)"},{"date":"2026-03-10","title":"3분기 실적 부진","detail":"3분기 실적 부진: 매출 4.08억 달러(예상 4.76억), 순손실 1.79억 달러(손상 1.51억 포함), 연간 매출 목표 하향","move":"시간외 −9.7%, 3월 한 달 −27%"},{"date":"2026-03-02","title":"SCAR 재입찰·강등","detail":"우주군 SCAR(BADGER) 위성 안테나 사업 재입찰 + 레이먼드제임스 '강력매수 → 시장하회' 강등","move":"−17.4% ($208.32)"},{"date":"2026-02-26","title":"스위치블레이드 주문","detail":"육군 스위치블레이드 1.86억 달러 주문","move":"다음 날 −4.6% (재료 소멸)"},{"date":"2026-01-20","title":"작업중지 명령 공개","detail":"회사가 우주군 SCAR(BADGER 위성 안테나) 계약에 정부의 작업중지 명령(stop work order)이 내려졌다고 공개","move":"−15.8% ($330.89)"},{"date":"2026-01-16","title":"연중 최고 종가","detail":"연중 최고 종가","move":"$392.86"},{"date":"2026-01-05","title":"육군 드론 계약 보도","detail":"육군 5년짜리 약 8.74억 달러 드론·대드론 계약(JUMP 20·P550·퓨마)과 P550 1,320만 달러 추가 주문 보도","move":"+16.1% ($297.41)"}],"chart_events":["2026-01-05","2026-01-20","2026-03-02","2026-05-28","2026-06-30","2026-08-07"],"bull":["**레이저 대드론 무기 1등** 육군 E-HEL 4.648억 달러는 미국 첫 레이저 무기 양산 계약입니다. 해외에서도 5,000만 달러 이상 첫 주문을 받았습니다. 한 발 비용이 5달러 미만(회사 설명)이라, 수십만~수백만 달러짜리 요격 미사일보다 싸게 드론을 막습니다. X에서는 이 계약이 2030년 목표(매출 35억~40억 달러)에 들어가 있지 않다고 봅니다. 맞다면 목표 상향 여지입니다.","**수주잔고 사상 최고** 자금이 확보된 수주잔고 15억 달러(+37%), 1분기 수주 7억 달러로 매출의 1.4배를 새로 받았습니다.","**자폭 드론의 장기 수요** 스위치블레이드 400이 육군 LASSO 사업에 선정돼, 여러 해 동안 반복 주문을 기대할 수 있습니다. 2월에는 1.86억 달러 주문이 있었습니다.","**정책 순풍** 수입 드론 관세(최대 100%, 9월 3일 발효)로 중국산과의 가격 경쟁이 줄었습니다. X에서는 AV를 '미국 최대 소형 드론 제조사'로 꼽습니다. X에서 언급되는 1.5조 달러 국방예산 논의, 이란 분쟁 등으로 드론·대드론 수요는 늘고 있습니다.","**가격이 많이 내려옴** 주가는 1월 고점 대비 −65%, 2025년 10월 최고가 $409.83 대비 −66%입니다. 최저 목표가($148.57)보다도 낮습니다."],"bear":["**실적이 기대를 자주 못 따라감** 3분기(3월) 매출은 예상보다 6,800만 달러 부족, 2027 회계연도 EPS 목표($3.02~$3.34)는 시장 기대 $4.00보다 낮았습니다. 1분기 매출 성장은 6%에 그쳤고, 레이저 계약에도 연간 목표를 올리지 않았습니다.","**블루헤일로 합병의 후유증** 우주군 BADGER(17억 달러) 계약 해지로 1.51억 달러 손상. 레이먼드제임스는 최악의 경우 수주잔고 28억 달러 중 10억~14억이 줄 수 있다고 봤습니다. 우주·사이버·레이저 사업부는 아직 적자(1분기 조정 EBITDA −890만 달러)입니다.","**아직 비싼 주가** GAAP으로는 적자이고, 조정 EPS 목표 중간값 기준으로도 주가가 이익의 약 43배입니다. 장기부채 7.3억 달러가 현금·단기투자(5.8억)보다 많고, 설비투자도 매출의 12~14%로 큽니다.","**경쟁과 정부 의존** 드론·대드론 시장에는 안두릴, 크라토스, 레드캣 등 경쟁자가 많습니다. 5월 WSJ 보도에서 국방부 지분 투자 후보로 AV는 언급되지 않았습니다. 매출 대부분이 정부 예산이라, 예산 지연이나 재입찰에 흔들립니다.","**수급** 공매도가 유통주식의 약 11.8%입니다. 2분기에 블랙록이 약 148만 주(−30%)를 줄였고, 내부자는 팔기만 했습니다. X에서도 \"호재(이란 전쟁, 국방수권법, 관세)가 쏟아져도 드론주는 내리기만 한다\"는 불만이 많습니다 (AVAV −65%, KTOS −61%, RCAT −55%)."],"analysts_md":"증권사 대부분은 여전히 매수 의견이지만, 7월과 9월 실적 뒤 목표가를 계속 낮췄습니다. 평균 목표가는 3개월 전 $266.68 → 현재 $216.63~$228.37(집계 기관별 차이)로 내려왔고, 가장 최근 의견(10월 6일)은 '중립'입니다.\n\n| 날짜 | 증권사 | 의견 | 목표가 | 현재가 대비 |\n|---|---|---|---|---|\n| 10월 6일 | 로스차일드 레드번 | 중립 (신규) | $165 | +20% |\n| 9월 17일 | 골드만삭스 | 매수 | $326 → $285 | +107% |\n| 9월 17일 | 클리어스트리트 (브라이언 돕슨) | 매수 | $247 | +80% |\n| 9월 16일 | 제프리스 | 매수 | $229 → $204 | +48% |\n| 9월 11일 | 뱅크오브아메리카 | 매수 | $225 → $185 | +34% |\n| 9월 10일 | JP모건 | 비중확대 | $200 → $210 | +53% |\n| 9월 10일 | UBS | 중립 | $166 → $170 | +24% |\n| 9월 10일 | 시티즌스 JMP | 시장수익률 상회 | $230 | +67% |\n| 9월 10일 | 니드햄 | 매수 | $225 | +64% |\n| 9월 10일 | BTIG | 매수 | $205 | +49% |\n| 7월 16일 | 레이먼드제임스 | 시장수준 → 시장수익률 상회 (상향) | $210 | +53% |\n| 7월 10일 | 캐나코드 | 매수 | $280 → $240 | +74% |\n| 7월 9일 | 파이퍼샌들러 | 비중확대 | $248 → $235 | +71% |\n| 7월 9일 | RBC | 시장수익률 상회 → 시장수준 (하향) | $210 → $180 | +31% |\n| 6월 30일 | 스티펠 | 매수 | $315 → $220 | +60% |\n| 6월 30일 | 웨드부시 | 시장수익률 상회 (신규) | $250 | +82% |\n\n종합 (MarketBeat, 10월 6일): 강력매수 2, 매수 18, 보유 4, 매도 1. 범위 $165~$355. 레이먼드제임스는 3월에 '시장하회'로 내렸다가 7월에 다시 올렸습니다.","insider_title":"내부자·유명인 매매 (2025~)","insider_md":"2025년 1월 이후 임원·이사의 장내 매수는 한 건도 없고, 매도만 25건(약 5.7만 주, 약 1,150만 달러)입니다. 현재가는 $137.60 (10월 8일 종가)입니다.\n\n**내부자 매수 (SEC Form 4)**\n\n| 누가 | 직책 | 날짜 | 주식 수 | 가격 | 금액 | 현재가 대비 |\n|---|---|---|---|---|---|---|\n| 없음 | – | 2025년 1월~2026년 10월 | 0 | – | – | – |\n\n**내부자 매도 요약**\n\n| 누가 | 직책 | 건수 (기간) | 주식 수 | 금액 | 평균 단가 | 사전 계획(10b5-1) | 현재가 대비 |\n|---|---|---|---|---|---|---|---|\n| 와히드 나와비 | 회장 겸 CEO | 2건 (2025.3.24, 2025.7.16) | 46,666 | 약 832만 달러 | $178.19 ($128.20, $263.05) | 아님 | −23% |\n| 케빈 맥도널 | CFO | 7건 (2025.10~2026.3) | 4,296 | 약 139만 달러 | $323.04 | 예 | −57% |\n| 스티븐 페이지 | 이사 | 11건 (2026.1~9, 매월 약 250주) | 3,748 | 약 96만 달러 | $255.34 | 예 | −46% |\n| 트레이스 스티븐슨 | 자율시스템 사장 | 1건 (2025.10.6) | 1,717 | 약 65만 달러 | $381.00 | 아님 | −64% |\n| 브라이언 샤클리 | 최고회계책임자 | 5건 (2025.12~2026.9) | 1,005 | 약 19만 달러 | $191.24 | 예 | −28% |\n| 합계 |  | 25건 | 57,432 | 약 1,151만 달러 | $200.35 |  | −31% |\n\n- 매도액의 72%는 CEO 나와비의 2025년 두 차례 매도입니다. 2026년 매도는 대부분 미리 정해둔 계획에 따른 소량 자동 매도입니다.\n- 내부자 지분은 발행주식의 약 0.9%로 작습니다. 기관 보유는 약 88%입니다.\n\n**의원 매매: 길 시스네로스 하원의원 (민주당, 캘리포니아)**\n\n제119대 의회에서 하원 군사위원회(군사인력·정보특수작전 소위원회) 소속이라 방산주 매매가 주목받았습니다. 의원 신고(PTR)는 금액을 범위로만 공개합니다.\n\n| 거래일 | 구분 | 금액 범위 (신고일) | 그때 주가 | 현재가 대비 | 확인 수준 |\n|---|---|---|---|---|---|\n| 2025년 10월 3일 | 매수 | 1,001~15,000달러 (11월 12일) | 확인 못함 (10월 초 내부자 매도가 $381~$400 수준) | 약 −64% (추정) | 하원 PTR 원문 |\n| 2025년 12월 15일 | 매수 | 1,001~15,000달러 (2026년 1월 9일) | $235.32 | −42% | 하원 PTR 원문 (가격은 MEXC 보도) |\n| 2026년 1월 27일 | 매수 | 1,001~15,000달러 (2월 11일) | 약 $280~$308 (그 주 종가) | 약 −53% | 하원 PTR 원문 |\n| 2026년 3월 3일 | 매수 | 1,001~15,000달러 (4월 6일) | 약 $208 (전날 종가) | 약 −34% | 하원 PTR 원문 |\n| 2026년 7월 2일 | 매도 | 1,001~15,000달러 (8월 14일 서명, 9월 4일 공개) | $190.89 | 그 뒤 −28% | 하원 PTR 원문 (계좌: 150 Main Street Trust > Bank of America) |\n\n- X의 \"시스네로스가 계속 샀다\"는 말은 2025년 12월~2026년 3월 매수에 해당합니다. 하원 서기처 PTR 원문(2025~2026년 전체)으로 확인한 AVAV 매수는 4번(각 1,001~15,000달러)입니다. Finbold의 '5번, 최대 7.5만 달러'는 원문과 다릅니다.\n- \"7월 2일 매도\"는 맞습니다. 단 1,001~15,000달러의 작은 규모라 보유분 일부만 팔았을 가능성이 큽니다. 매도일은 4분기 실적 후 급등한 날(+10.7%)이었고, 그 뒤 주가는 8월 중순 잠깐 넘어섰을 뿐 대체로 그 아래였습니다.\n- Trendlyne에 나오는 '2026년 4월 8일 거래'는 하원 PTR 원문에 없습니다. 3월 3일 매수 신고(4월 6일 서명, 4월 7일 공개)를 날짜만 다르게 표시한 것으로 보입니다.\n\n**다른 유명인·유명 펀드**\n\n- 트럼프 대통령: 2025년 8월 이후 제출된 OGE 278-T 정기거래보고서 19건(2025년 1월 6일~2026년 7월 31일 거래, 2026년 9월 제출분 포함)을 모두 확인했고 AVAV 거래는 없습니다 (Open Cabinet·OGE). 펠로시 의원의 AVAV 거래 기록도 찾지 못했습니다. 최근 6개월 의회 거래는 시스네로스의 7월 2일 매도 1건뿐입니다(Quiver).\n- 큰 펀드는 대체로 줄였습니다. 블랙록 2026년 2분기 −148만 주(−30%), 1분기 −71만 주. 배일리 기퍼드 2025년 4분기 −34%, 드리하우스 1분기 전량 매도.\n- 늘린 곳도 있습니다. 알래스카 인베스트먼트 그룹 2026년 1분기 +33만 주(+85%), 스테이트스트리트 +31만 주(+16%). 1분기 평균 주가(약 $180~$250)를 감안하면 이들도 현재 손실 구간으로 추정됩니다.\n\n**대주주 신고(13G/13D)**\n\n5% 이상 가진 주주는 SEC에 신고합니다. 13D는 경영에 영향을 줄 수 있는 주주, 13G는 단순 투자 목적 주주의 신고입니다.\n\n| 신고일 | 양식 | 보유자 | 지분율 | 주식 수 | 기준일 | 비고 |\n|---|---|---|---|---|---|---|\n| 2026년 7월 27일 | 13G/A | 블랙록 | 6.7% | 336.8만 주 | 2026년 6월 30일 | 2025년 5월 9.6%(436.4만 주) → 9월 8.2% → 6.7%. 꾸준히 줄임 |\n| 2026년 6월 24일 | 13D/A | Altitude V Holdings (알링턴 캐피털 측, 옛 블루헤일로 주주) | 13.5% | 672.8만 주 | 2026년 6월 17일 | 합병 대가로 받은 주식(현금 매수 아님). 2025년 5월 13D 14.7%와 주식 수 같음 = 아직 안 팔았고, 신주 발행으로 비율만 낮아짐 |\n| 2026년 3월 26일 | 13G/A | 뱅가드 그룹 | 0% | 0 | 2026년 3월 13일 | 2025년 6월 7.61%(347.8만 주). 같은 날 다른 종목들도 모두 0%로 신고돼, 뱅가드 내부 신고 주체 변경으로 보임. 실제 매도 여부는 확인 못함 |\n| 2025년 8월 11일 | 13G | 스테이트스트리트 | 3.8% | 172.2만 주 | 2025년 6월 30일 | 2025년 3월 7% → 3.8% (합병 신주로 희석) |\n| 2025년 8월 8일 | 13G | 배일리 기퍼드 | 4.2% | 193.9만 주 | 2025년 6월 30일 | 이후 2025년 4분기에 −34% 추가 축소 (Quiver) |\n\n진입 가격은 신고서에 나오지 않습니다. 블랙록·뱅가드는 지수 펀드 비중이 커서 보통 '투자 아이디어'로 보지 않습니다.","next_md":"- 2026년 12월 초 (추정, 작년은 12월 9일): 2027 회계연도 2분기 실적. 연간 목표(매출 21.25억~22.25억 달러, 조정 EPS $3.02~$3.34) 유지·상향 여부, 레이저 계약 반영\n- LOCUST X3 첫 양산 납품 시점과 추가 해외 주문\n- 육군 LASSO(스위치블레이드 400) 본 생산 계약 규모\n- 우주군 SCAR 재입찰 결과 (AV 재수주 여부)\n- 국방부의 드론 회사 지분 투자 대상 발표 (5월 WSJ 보도 후속)\n- 2027 회계연도 국방예산·국방수권법(NDAA) 처리와 드론·대드론 예산\n- 2027년 2월 9일: 수입 드론 관세 3단계(부품) 발효\n- 2027년 3월 (추정): 3분기 실적. 증권 집단소송(대상 기간 2025년 6월 25일~2026년 6월 18일, SCAR 관련 공시 문제) 진행 상황\n- 시스네로스 등 의원 추가 신고(PTR), 내부자 장내 매수 등장 여부","glossary_md":"| 용어 | 뜻 |\n|---|---|\n| 배회형 탄약(자폭 드론) | 하늘에서 맴돌며 표적을 찾다가 스스로 부딪혀 터지는 드론 |\n| 대드론(C-UAS) | 적 드론을 찾아내 떨어뜨리는 무기·장비 |\n| 지향에너지 무기 | 총알 대신 레이저나 전자파를 쏘는 무기 |\n| E-HEL | 육군의 '지속 고에너지 레이저' 사업. AV LOCUST를 양산 구매 |\n| LASSO | 육군의 차세대 보병용 자폭 드론 구매 사업 |\n| 프로그램 오브 레코드 | 예산에 정식 항목으로 잡혀 여러 해 구매하는 사업 |\n| 수주잔고(자금 확보분) | 주문은 받았고 예산도 배정됐지만 아직 납품 안 한 금액 |\n| 수주/매출 비율(book-to-bill) | 새 주문 ÷ 매출. 1보다 크면 일감이 쌓이는 중 |\n| 영업권 손상 | 비싸게 산 회사의 가치가 줄었다고 장부에서 깎는 것. 현금은 나가지 않음 |\n| GAAP / 조정(non-GAAP) | 회계 규칙대로 난 이익 / 인수 상각 등 일부를 빼고 회사가 다시 계산한 이익 |\n| 조정 EBITDA | 이자·세금·감가상각·일회성 비용을 뺀 영업 현금 이익에 가까운 숫자 |\n| 무역확장법 232조 | 국가안보를 이유로 대통령이 수입품에 관세를 매길 수 있는 법 |\n| 10b5-1 계획 | 임원이 미리 정해둔 일정·수량대로 자동 매도하는 약속. 내부 정보 의심을 줄임 |\n| PTR | 미 의원의 주식 거래 신고. 거래 후 45일 안에 금액 범위만 공개 |\n| 공매도 비율 | 주가 하락에 베팅한 주식이 유통주식에서 차지하는 비율 |","sources":[{"t":"SEC 8-K: 2027 회계연도 1분기 실적 보도자료 (9월 9일)","u":"https://www.sec.gov/Archives/edgar/data/0001368622/000110465926106304/avav-20260909xex99d1.htm"},{"t":"Business Wire: 2026 투자자의 날, 2030 회계연도 목표 (7월 8일)","u":"https://www.businesswire.com/news/home/20260708330776/en/AeroVironment-Inc.-Highlights-Growth-Strategy-and-Unveils-Fiscal-Year-2030-Financial-Targets-at-2026-Investor-Day"},{"t":"Business Wire: LOCUST, 육군 E-HEL 계약 선정","u":"https://secure.businesswire.com/news/home/20260818921666/en/AVs-LOCUST-Selected-for-Nearly-%24500-million-Army-Counter-UAS-Contract-for-Enduring-High-Energy-Laser-E-HEL-Program"},{"t":"DefenseScoop: 육군, AV에 약 5억 달러 레이저 계약 (9월 2일)","u":"https://defensescoop.com/2026/09/02/army-awards-aerovironment-nearly-500m-contract-laser-weapons/"},{"t":"Stocktwits: 블룸버그 4억 달러 보도에 +8% (8월 7일)","u":"https://stocktwits.com/news-articles/markets/equity/avav-stock-jumps-8-percent-on-reported-400m-army-deal-retail-sees-laser-weapons-moving-beyond-testing/cZofhe6RJ9M"},{"t":"DroneXL: 트럼프 드론 관세(232조) 세부 내용","u":"https://dronexl.co/2026/08/15/trump-drone-tariffs-section-232/"},{"t":"TIKR: 2026 회계연도 4분기 실적과 주가 급등","u":"https://www.tikr.com/blog/avav-aerovironment-nasdaq-stock-surges-19-on-record-annual-revenue-and-earnings-beat"},{"t":"Motley Fool: AV 주가가 3월에 27% 폭락한 이유","u":"https://www.fool.com/investing/2026/ ,140.8,147.07,146.71,153.4,156.99,156.45,163.38,159.95,160.9,156.15,155.94,158.55,152.05,147.23,143.24,142.22,140.31,140.82,139.3,143.54,138.86,137.6,137.11,131.51,127.13,120.6,123.22]},"mc":6262126962.47699},{"ticker":"BE","company":"Bloom Energy","name_ko":"블룸에너지","category":"미국우선","field":"전력","doc_url":"https://claude.ai/code/artifact/39c0808b-eccd-4061-8f77-6b5225984d14","lead":"블룸 에너지는 천연가스로 전기를 '태우지 않고' 만드는 연료전지 발전기를 파는 회사입니다. AI 데이터센터가 전력망 연결을 몇 년씩 기다리지 못해 '현장에서 바로 전기를 만드는' 수요가 터지면서, 주가가 2025년 말 $86.89에서 2026년 6월 22일 $345.85까지 약 4배 올랐습니다. 지금은 고점보다 21% 낮은 $272.82이고, 증권사 평균 목표가와 거의 같은 자리입니다.","glance":[["상장","미국 NYSE (티커 BE), 2026년 9월 S&P 500 편입"],["현재가","$272.82"],["시가총액","약 803억 달러 (약 110조 원)"],["2026년 고점 / 저점 (종가)","$345.85 (6월 22일) / $98.69 (1월 2일). 2025년 마지막 날 $86.89"],["고점 대비","−21.1%"],["연초 대비","+214% ($86.89 → $272.82)"],["매출 (최근 12개월)","약 31.1억 달러 (1년 새 +91%), 순이익 약 2.4억 달러"],["주가수익비율(PER)","최근 이익 기준 약 330배, 내년 예상 이익 기준 약 55~77배"],["정부 개입","정부 지분·대출 없음. 연료전지 투자세액공제(ITC) 등 세금 혜택과 '전력망 병목' 정책 흐름의 간접 수혜"],["국방 필수도","낮음~중간. 무기 부품이 아니라 군 기지·데이터센터용 '끊기지 않는 전기' 공급원"],["내부자 동향","2025년 이후 장내 매수 0건, 매도 87건 약 4.63억 달러 (한국 SK에코플랜트 2.76억 달러 포함)"],["유명인","낸시 펠로시 측이 7월 24·28일 주식 1.5만 주 + 콜옵션 200계약 매수 (당일 종가 $184.89·$166.84) → 현재 +48~64%"],["애널리스트 평균 목표가","$283.78 (26명, 범위 $97~390) → 현재가 대비 +4%"],["다음 실적 발표","2026년 10월 하순 (추정 10월 27일)"]],"overview_md":"#### 기업 개요: 이 회사는 무엇을 하나\n\n블룸 에너지는 2001년 미국 캘리포니아에서 시작한 연료전지 회사입니다. 본사는 새너제이, 주 공장은 캘리포니아 프리몬트에 있습니다. 대표 제품은 냉장고 몇 대 크기의 상자를 여러 개 붙인 '블룸 에너지 서버'입니다.\n\n**1. 연료전지란?**\n\n- 연료(천연가스·바이오가스·수소)를 불로 태우지 않고, 화학 반응으로 바로 전기를 뽑아내는 장치입니다. 건전지와 비슷하지만 연료를 계속 넣어 주면 멈추지 않습니다.\n- 블룸은 그중 **고체산화물 연료전지(SOFC)**를 씁니다. 약 800°C의 뜨거운 세라믹 판에서 반응이 일어나 효율이 높습니다.\n- 회사 설명으로는 같은 전기를 만들 때 가스터빈보다 연료를 15~20% 덜 씁니다.\n\n**2. 왜 갑자기 인기가 됐나**\n\n- AI 데이터센터는 작은 도시 하나만큼 전기를 씁니다. 그런데 미국 전력망에 새로 연결하려면 몇 년씩 기다려야 합니다.\n- 블룸 서버는 공장에서 만든 상자를 트럭으로 옮겨 붙이면 됩니다. 오라클 현장에는 계약 후 **55일 만에** 전기를 공급했습니다(목표 90일).\n- 그래서 '전력망을 기다리지 말고 내 전기를 직접 가져오라(BYOP)'는 수요를 사실상 대표하는 회사가 됐습니다.\n\n**3. 주요 고객**\n\n| 고객 | 내용 |\n|---|---|\n| 오라클 | 2026년 4월 최대 2.8GW 기본계약, 그중 1.2GW 확정 |\n| AEP (미국 대형 전력회사) | 2026년 1월 26.5억 달러 규모 주문 (와이오밍 샤이엔 발전소) |\n| 브룩필드 (세계 최대급 인프라 운용사) | 2025년 10월 50억 달러 협력 → 2026년 6월 250억 달러로 확대 |\n| 에퀴닉스·코어위브 등 | 데이터센터 운영사, 100MW 이상 설치 |\n| 미국 하이퍼스케일러 전부 | 회사는 \"미국 주요 하이퍼스케일러 모두와 10여 개 네오클라우드·AI 연구소가 블룸 전력을 승인했다\"고 발표 (7월 28일) |\n\n#### 돈 버는 구조: 발전기를 팔고, 오래 관리해 준다\n\n매출의 대부분은 발전기 자체(제품)를 파는 데서 나옵니다. 여기에 설치, 20년 가까운 유지보수(서비스), 전기 판매 계약이 붙습니다.\n\n**2026년 2분기 (4~6월) 실적**\n\n| 항목 | 금액 | 1년 전 대비 |\n|---|---|---|\n| 매출 | 10.65억 달러 (처음으로 분기 10억 달러 돌파) | +166% |\n| 그중 제품 매출 | 9.35억 달러 | +215% |\n| 매출총이익률 | 33.4% | +6.7%p |\n| 영업이익 | 1.82억 달러 | 1년 전 적자 350만 달러 |\n| 순이익 | 1.96억 달러 | 1년 전 적자 4,260만 달러 |\n| 주당순이익(조정) | $0.78 | 예상치 약 $0.41의 거의 2배 |\n| 영업현금흐름 | +2.26억 달러 | 1년 전 −2.13억 달러 |\n\n**분기별 흐름**\n\n| 분기 | 매출 | 증가율 | 영업이익 |\n|---|---|---|---|\n| 2025년 3분기 | 5.19억 달러 | +57% | 780만 달러 |\n| 2026년 1분기 | 7.51억 달러 | +130% | 7,220만 달러 |\n| 2026년 2분기 | 10.65억 달러 | +166% | 1.82억 달러 |\n\n**쉽게 비유하면**\n\n- 블룸은 '데이터센터 옆에 바로 세우는 조립식 발전소' 회사입니다. 전력회사가 송전선을 깔아 줄 때까지 기다릴 수 없는 고객이 줄을 서 있습니다.\n- 다만 연료는 대부분 천연가스라서, 가스관이 연결돼야 돌아갑니다.\n\n**재무 상태 (6월 30일 기준)**\n\n- 현금 약 26.7억 달러, 총부채 약 28.2억 달러.\n- 부채의 대부분은 2030년 만기 22억 달러 **전환사채(이자 0%)**입니다. 주가가 약 $194.97 위에 있으면 주식으로 바뀔 수 있어, 현재가($272.82)에서는 약 1,130만 주(발행주식의 약 4%)가 새로 생길 수 있습니다.\n\n#### 앞으로의 숫자\n\n| 항목 | 회사 목표 / 숫자 |\n|---|---|\n| 2026년 매출 가이던스 | 39~42억 달러 (7월 상향. 4월엔 34~38억, 연초엔 약 60% 성장) |\n| 2026년 조정 영업이익 | 8~9억 달러 (4월 6~7.5억 달러) |\n| 2026년 조정 주당순이익 | $2.55~2.85 (4월 $1.85~2.25) |\n| 조정 매출총이익률 | 약 34% |\n| 수주잔고 | 약 200억 달러, 그중 제품 수주잔고 약 60억 달러 |\n| 생산능력 | 연 1GW → 2026년 말 연 2GW로 두 배 (프리몬트 공장) |\n| 다음 실적 발표 | 10월 하순 (추정 10월 27일) |","gov_md":"블룸은 엘멧·에너지 퓨얼스처럼 정부가 직접 지분을 사거나 대출을 준 회사가 아닙니다. 대신 \"AI 경쟁에서 중국을 이기려면 전기부터 확보해야 한다\"는 미국 정부의 큰 방향에서, 세금 혜택·규제 완화·군 기지 임대로 간접 수혜를 받습니다.\n\n| 목적 | 정부가 한 일 | 블룸에 주는 의미 |\n|---|---|---|\n| AI 데이터센터 전력난 해결 | 연방에너지규제위원회(FERC)가 대형 전력 사용자의 전력망 연결을 빨리하는 규칙 발표 (2026년 6월 18일 주가 반영) | '현장 발전 + 나중에 망 연결' 방식이 제도적으로 인정받음. 그날 주가 +15.4% |\n| 연료전지 세금 혜택 | 2025년 7월 트럼프 세법(OBBB)에서 태양광·풍력 혜택은 줄였지만, 연료전지는 2026년 1월부터 청정전력 투자세액공제(48E ITC) 대상에 들어감 | 고객의 설치 비용이 낮아져 가격 경쟁력 ↑. JP모간은 이를 이유로 2025년 7월 투자의견 상향 |\n| 군 기지 전력 안보 | 육군이 유휴 군 부지에 발전소를 짓도록 장기 임대권 부여 (2026년 9월 18일). 'Indelible-Bloom'이 포트 디트릭·레터켄니 육군창·웨스트포인트 3곳 따냄 | 조건부 선정. MW·금액은 확인 못함(미공개). 육군 돈은 들어가지 않고 사업자가 자금을 대며, 육군 공고상 임대 기간은 최초 약 50년. 군 마이크로그리드 시장 진입 신호 |\n| 국방 시설 실적 | 2014년 국가안보국(NSA) 포트 미드 캠퍼스에 1.6MW 설치 (\"국방부 시설 최초 SOFC\") | 오래된 작은 사례. 국방 매출 비중은 작음 |\n| 전력회사를 통한 공급 | AEP(규제를 받는 공익 전력회사)가 26.5억 달러어치 주문 (2026년 1월 8일) | 공익사업자도 연료전지를 '발전소'로 인정 |\n\n**미중 경쟁과의 연결**\n\n- 미국 정부는 AI를 국가 안보 경쟁으로 봅니다. 중국은 발전소를 빨리 짓지만, 미국은 송전망·가스터빈 부족이 병목입니다. 블룸은 이 빈칸을 '몇 달 만에' 메우는 수단입니다.\n- 반대로 중국 의존 위험도 있습니다. 공매도 연구사 헌터브룩은 2026년 7월 8일 보고서에서 블룸이 연료전지 핵심 재료인 **스칸듐(희토류 금속)**을 중국 후난성 회사에서 사온다고 주장했습니다. 회사는 \"거짓\"이라고 반박했지만 집단소송이 이어졌습니다.\n- 중국도 SOFC를 키우고 있습니다. 중국 산둥성의 웨이차이 파워는 2025년 11월 5일 영국 세리스 파워와 SOFC 셀·스택 제조 라이선스를 맺고 'AI 데이터센터·상업용 건물·산업용' 발전 공장을 짓겠다고 밝혔습니다(생산 규모·일정은 미공개). 다만 미국 데이터센터·군 기지는 보안상 중국산 발전기를 쓰기 어렵기 때문에, 미국 내 생산인 블룸이 유리합니다.\n\n**에너지 안보의 양면: 천연가스 의존**\n\n- 블룸 발전기는 대부분 천연가스로 돌아갑니다. 미국은 세계 최대 가스 생산국이라 안보 측면에서는 장점입니다.\n- 하지만 가스관이 없으면 못 씁니다. 뉴멕시코 '프로젝트 주피터'(오라클·오픈AI 스타게이트, 블룸 연료전지 최대 2.45GW 계획)는 주 정부가 가스관 통행권을 3월· 7월 두 번 거부해 지연됐고, 오라클은 9월 24일 '불가항력' 통지를 보냈습니다.\n\n**동맹국과의 연결: 한국 SK에코플랜트**\n\n- SK에코플랜트는 2018년부터 블룸의 한국 파트너입니다. 경북 구미에 합작 공장(블룸SK퓨얼셀)을 세워 한국 시장에 공급해 왔고, 한때 지분 10% 이상 대주주였습니다.\n- 2025년 7월 10일 1,000만 주를 주당 $27.60(2.76억 달러)에 팔았고, 8월 14일 기준 지분이 4.7%로 5% 아래가 돼 공시 의무에서 빠졌습니다. 그 주식은 지금 $272.82로 약 10배가 됐습니다.","gov_title":"정부가 이 회사를 쓰는 방법","events":[{"date":"2026-10-08","title":"UBS 목표가 상향","detail":"UBS 목표가 $325 → $350 상향 (7일). 8일엔 회사 뉴스 없이 하락","move":"$272.82 (8일 −6.3%)"},{"date":"2026-09-29","title":"프리몬트 공장 추가","detail":"프리몬트에 1.58만㎡(15.8만 제곱피트) 공장 추가 확보 소식, RBC '시장수익률 상회' 유지","move":"$291.25 (+10.8%)"},{"date":"2026-09-28","title":"오라클 불가항력 통지","detail":"오라클이 뉴멕시코 '프로젝트 주피터'(블룸 연료전지 최대 2.45GW 계획)에 불가항력 통지. 24일(−3.1%)은 소문 단계, 블룸버그 보도가 퍼진 28일(월) 오후에 본격 하락. 오라클·블루아울은 \"일정·자금 약속 변화 없음\" 해명","move":"$262.87 (28일) (28일 −8.9%)"},{"date":"2026-09-18","title":"육군 부지 임대권","detail":"육군, 군 부지 발전 임대권을 'Indelible-Bloom'에 3곳 부여","move":"$265.63 (−5.4% (영향 작음))"},{"date":"2026-09-05","title":"S&P 500 편입","detail":"S&P 500 지수 편입","move":"$277.22 (9월 8일) (8일 +9.6%, 그 주 +26%)"},{"date":"2026-08-21","title":"펠로시 매수 공개","detail":"펠로시 의원 배우자 BE 매수 신고 공개","move":"$204 부근 (24일) (+2% 내외)"},{"date":"2026-07-30","title":"2분기 실적 급등","detail":"2분기 실적(28일 장 마감 후 발표)에 대한 뒤늦은 반응: 첫 10억 달러 분기, 연간 가이던스 상향","move":"$207.12 (+26.5%)"},{"date":"2026-07-28","title":"실적 앞 매도","detail":"실적 발표 직전 매도 (공매도 압박)","move":"$166.84 (−11.3%)"},{"date":"2026-07-21","title":"JP모간 목표가 상향","detail":"JP모간 목표가 $267 → $346 상향","move":"$226.26 (+14.8%)"},{"date":"2026-07-08","title":"헌터브룩 공매도 보고서","detail":"헌터브룩 공매도 보고서 \"Bloom's Big Lie\": 중국산 스칸듐 의존 주장. 이후 16일 −13.6%, 24일 −14.9%","move":"$254.29 (−5.7%, 7월 한 달 −32%)"},{"date":"2026-06-30","title":"브룩필드 250억 달러","detail":"브룩필드 협력 50억 → 250억 달러로 확대","move":"$302.70 (+10.1%)"},{"date":"2026-06-26","title":"최고가 뒤 차익 실현","detail":"사상 최고가 뒤 차익 실현","move":"$252.02 (−18.5%)"},{"date":"2026-06-18","title":"FERC 전력망 규칙","detail":"FERC(연방에너지규제위) 대형 전력 사용자 전력망 연결 규칙. 22일 종가 최고 $345.85","move":"$328.91 (+15.4%)"},{"date":"2026-04-29","title":"1분기 실적 서프라이즈","detail":"1분기 실적: 매출 7.51억 달러(+130%), 연간 성장 목표 60% → 80%","move":"$287.97 (+27.2%)"},{"date":"2026-04-14","title":"오라클 2.8GW 계약","detail":"오라클과 최대 2.8GW 공급 계약 (13일 발표, 1.2GW 확정)","move":"$219.03 (+24.0%)"},{"date":"2026-03-06","title":"오라클 텍사스 철회","detail":"오라클·오픈AI 텍사스 데이터센터 확장 철회 보도","move":"$135.19 (−15.5%)"},{"date":"2026-01-08","title":"AEP 연료전지 주문","detail":"AEP 26.5억 달러 연료전지 주문 (와이오밍)","move":"$121.84 (+12.8%, 1월 한 달 +74%)"}],"chart_events":["2026-01-08","2026-04-14","2026-06-18","2026-06-26","2026-07-08","2026-09-28"],"bull":["**실적이 주가를 따라오고 있음**: 2분기 매출 10.65억 달러(+166%), 조정 EPS $0.78로 예상치의 약 2배. 4분기 연속 예상 초과. 1년 전 적자였던 영업이익이 분기 1.82억 달러 흑자, 영업현금흐름도 +2.26억 달러. 올해 매출 목표를 연초 약 60% 성장 → 4월 80% → 7월 39~42억 달러(약 100% 성장)로 두 번 올렸습니다.","**주문이 쌓여 있음**: 수주잔고 약 200억 달러(올해 매출 가이던스의 약 5배). 오라클 최대 2.8GW, AEP 26.5억 달러, 브룩필드 250억 달러 자금 틀. 회사는 \"앞으로 25GW 규모의 설치 가시성이 있다\"고 말합니다(현재 연 생산 능력의 10배 이상).","**속도가 무기**: 가스터빈은 주문 후 몇 년을 기다려야 하지만, 블룸은 오라클에 55일 만에 전기를 공급했습니다. 공장 생산능력을 2026년 말 연 2GW로 두 배로 늘리고, 9월에는 프리몬트에 공장을 더 확보했습니다. CEO: \"생산능력은 우리의 제약이 아닐 것\".","**정책 바람**: 연료전지 투자세액공제(2026년부터), FERC의 대형 전력 사용자 연결 규칙, 육군 부지 발전 임대 등 정부 방향이 우호적입니다.","**지수 편입과 수급**: 9월 22일 S&P 500 편입으로 인덱스 펀드의 규칙적 매수가 생겼습니다. JP모간은 2030년 연료전지 설치 규모를 4.1GW로 전망합니다."],"bear":["**비싼 가격**: 시가총액 약 803억 달러는 올해 예상 매출(39~42억 달러)의 약 20배, 예상 이익 기준 PER 약 55배입니다. 주가가 이미 평균 목표가 근처여서 추가 상승에는 새 호재가 필요합니다. MarketBeat 집계로는 매수 12·보유 13·매도 1로 의견이 반반입니다.","**오라클 의존**: 오라클 관련 뉴스 하나에 3월 6일 −15.5%, 9월 28일 −8.9%가 나왔습니다. 뉴멕시코 '프로젝트 주피터'는 블룸 연료전지 최대 2.45GW를 쓸 계획이었는데, 가스관 허가가 두 번 거부됐고 오라클이 불가항력을 통지했습니다. 오라클은 4월 9일 블룸 주식 워런트(신주인수권)도 받았습니다.","**헌터브룩 공매도 의혹과 소송**: 7월 8일 보고서: 핵심 재료 스칸듐을 중국 후난성 업체에서 사면서 CEO는 다르게 말했다는 주장. 회사는 부인했지만 집단소송이 제기됐습니다(대표원고 신청 마감 9월 28일). 중국이 희토류 수출을 막으면 생산에 차질이 생길 수 있다는 우려가 남아 있습니다.","**내부자 대량 매도, 매수는 0건**: 2025년 이후 매도 87건 약 4.63억 달러. SK에코플랜트를 빼고도 임원·이사가 약 1.87억 달러를 팔았고, CEO는 2월 24일 하루에 20만 주($170, 3,400만 달러)를 팔았습니다.","**희석(주식 수 증가)**: 2025년 10월 전환사채 22억 달러를 발행하면서 기존 사채를 바꾸는 데 약 4,240만 주를 새로 내주었습니다. 새 전환사채(전환가 $194.97)도 현재가에서는 '돈이 되는' 상태라 약 1,130만 주가 더 생길 수 있습니다.","**천연가스 의존과 탄소 배출**: '청정' 이미지와 달리 연료는 대부분 천연가스입니다. 가스관·배출 허가가 막히면 프로젝트가 멈춥니다(뉴멕시코 사례).","**변동성과 공매도**: 올해 하루 ±10% 이상 23번, 6월 고점에서 7월 저점($163.75)까지 −53%. 공매도 비율은 유통주식의 약 7.3%입니다."],"analysts_md":"증권사 의견은 크게 갈립니다. 평균 목표가는 집계에 따라 $258(MarketBeat)~$284(야후 26명)로 현재가 $272.82와 거의 같고, 가장 낮은 목표가와 높은 목표가는 약 4배 차이가 납니다.\n\n| 날짜 | 증권사 | 의견 | 목표가 | 현재가 대비 |\n|---|---|---|---|---|\n| 10월 7일 | UBS | 매수 | $350 (기존 $325) | +28% |\n| 10월 7일 | 번스타인 | 시장수익률 | $282 | +3% |\n| 10월 1일 | 바클레이스 | 비중유지 | $308 (기존 $276) | +13% |\n| 9월 29일 | 제프리스 | 보유 | $264 (기존 $229) | −3% |\n| 9월 28일 | RBC | 시장수익률 상회 | $335 | +23% |\n| 9월 14일 | 미즈호 | 시장수익률 상회 | $351 (기존 $242) | +29% |\n| 7월 30일 | 웰스파고 | 비중유지 | $176 (기존 $217) | −35% |\n| 7월 29일 | JP모간 | 비중확대 | $314 (기존 $346) | +15% |\n| 7월 29일 | BTIG | 매수 | $295 | +8% |\n| 7월 29일 | BMO | 시장수익률 | $227 (기존 $279) | −17% |\n| 7월 29일 | 트루이스트 | 보유 | $218 (기존 $250) | −20% |\n| 7월 10일 | 서스케하나 | 긍정적 | $298 | +9% |\n| 7월 9일 | 베어드 | 시장수익률 상회 | $310 | +14% |\n\n종합 (MarketBeat, 26명): 매수 12 · 보유 13 · 매도 1, 평균 $258.32 (범위 $39~351). 야후 집계: 평균 $283.78 (범위 $97~390). 7월 말 헌터브룩 사태 때는 목표가를 낮추는 곳이 많았고, 9월 S&P 500 편입 이후에는 다시 올리는 쪽입니다.","insider_title":"내부자·유명인 매매 (2025~)","insider_md":"2025년 1월 이후 내부자의 장내 매수는 **한 건도 없고**, 매도는 87건 약 4.63억 달러입니다. 반대로 낸시 펠로시 의원 측은 7월 말 급락 구간에 샀고, 지금 크게 이익 중입니다. 현재가는 $272.82 (10월 8일 종가)입니다.\n\n**내부자 매수 (SEC Form 4)**\n\n2025년 1월~2026년 10월 장내 매수 0건. 표로 정리할 매수가 없습니다.\n\n**내부자 매도 요약 (금액 순)**\n\n| 누가 | 역할 | 판 주식 | 금액 | 평균 매도가 | 현재가 대비 |\n|---|---|---|---|---|---|\n| SK에코플랜트 | 10% 이상 대주주(당시) | 1,000만 주 (2025년 7월 10일) | 2.76억 달러 | $27.60 | 현재가가 매도가의 약 10배 |\n| 쇼나 소더버그 | 법무총괄 | 34.9만 주 | 5,243만 달러 | $150.14 | +82% |\n| KR 스리다르 | 회장 겸 CEO | 53.5만 주 | 4,867만 달러 | $90.98 | +200% |\n| 존 체임버스 (전 시스코 CEO) | 이사 | 8.5만 주 | 2,321만 달러 | $273.02 | 0% |\n| 아만 조시 | 최고사업책임자 | 12.0만 주 | 1,871만 달러 | $155.70 | +75% |\n| 메리 부시 | 이사 | 6.1만 주 | 1,182만 달러 | $193.70 | +41% |\n| 사티시 치투리 | 최고운영책임자 | 8.7만 주 | 1,148만 달러 | $132.31 | +106% |\n| 제프리 이멜트 (전 GE CEO) | 이사 | 3만 주 (2026년 8월 17일) | 717만 달러 | $238.91 | +14% |\n| 마치에이 쿠르짐스키 | 최고회계책임자 | 4.7만 주 | 685만 달러 | $145.20 | +88% |\n| 기타 이사 3명 | 이사 | 5.1만 주 | 약 638만 달러 | – | – |\n\n- 합계: 87건, 약 4.63억 달러. SK에코플랜트를 빼면 86건 약 1.87억 달러이고, 그중 2026년에만 1.44억 달러입니다.\n- 86건 중 41건(약 1.0억 달러)은 미리 정해 둔 자동 매도 계획(10b5-1)으로 표시돼 있습니다.\n- 눈에 띄는 매도: CEO가 2026년 2월 24일 하루에 20만 주를 $170에 팔았습니다(3,400만 달러, 10b5-1 표시 없음). 체임버스 이사는 5월 28일 $297.69에 5.5만 주를 팔아 거의 고점에서 팔았습니다.\n- 대부분 주식보상으로 받은 주식을 파는 것이라 그 자체로 나쁜 신호는 아니지만, 주가가 4배 오르는 동안 자기 돈으로 산 내부자는 없습니다.\n\n**낸시 펠로시 (하원, 배우자 폴 펠로시 명의) — 하원 서기국 PTR 원문 확인**\n\n| 거래일 | 내용 | 신고 금액 구간 | 그날 종가 | 현재가 대비 |\n|---|---|---|---|---|\n| 2026년 7월 24일 | 보통주 1만 주 매수 | 100만~500만 달러 | $184.89 | +47.6% |\n| 2026년 7월 24일 | 콜옵션 100계약 매수 (행사가 $100, 만기 2027년 6월 17일) | 100만~500만 달러 | $184.89 | 주가 기준 +47.6% |\n| 2026년 7월 28일 | 보통주 5,000주 매수 | 50만~100만 달러 | $166.84 | +63.5% |\n| 2026년 7월 28일 | 콜옵션 100계약 매수 (행사가 $100, 만기 2027년 6월 17일) | 50만~100만 달러 | $166.84 | 주가 기준 +63.5% |\n\n- 신고일: 2026년 8월 21일 (Filing ID 20035143). 같은 날 인텔(INTC) 주식·콜옵션도 샀습니다. 10월 2일 신고에는 BE 매도가 없습니다.\n- 합계: 주식 1.5만 주 + 콜옵션 200계약(주식 2만 주에 해당). 신고 금액 합계는 300만~1,200만 달러입니다. X의 \"1,200만 달러\"는 상단값입니다.\n- 당일 종가로 추정한 주식 매수 비용은 약 268만 달러(평균 약 $178.87), 지금 가치는 약 409만 달러입니다.\n- 콜옵션은 행사가 $100이라 현재가에서 주당 최소 $172.82의 가치(내재가치)가 있어, 200계약 전체는 최소 약 346만 달러입니다. 실제 지불한 옵션 가격은 공개되지 않았습니다.\n- X의 \"매수 후 +66%\"는 7월 28일 종가 기준으로 계산하면 대체로 맞고, 현재가 기준으로는 +63.5%입니다.\n\n**다른 의원**\n\n| 의원 | 거래 | 금액 | 비고 |\n|---|---|---|---|\n| 길버트 시스네로스 (하원, 민주) | 2025년 9월 26일·10월 17일·11월 18일 매수, 12월 24일 매도, 2026년 1월 30일 매수 | 각 1,001~15,000달러 | 소액. 1월 30일 종가 $151.37 → 현재 +80% |\n| 오슨 스콧 (하원, 공화) | 2024년 7월 15일 1,000주 매도 ($14.245) | – | 2025년 이전 거래 |\n| 상원 | 확인된 BE 거래 없음 | – | Quiver Quant 기준 |\n\n**트럼프 대통령 (OGE 278-T)**\n\n- 2026년 3월 26일 매수 1,001~15,000달러(그날 종가 $133.52 → 현재 +104%), 5월 18일 매도 1,001~15,000달러(그날 종가 $258.71). 외부 운용사가 관리하는 계좌의 아주 작은 거래로, 의미 있는 포지션은 아닙니다.\n\n**대형 기관 (13G/13D, 5% 이상 보유 신고)**\n\n| 기관 | 지분 변화 | 비고 |\n|---|---|---|\n| 블랙록 | 9.4% (2025년 말) → 8.2% (2026년 3월 말) | 인덱스 펀드 성격, 일부 축소 |\n| 에이미리프라이즈 | 20.0% (2025년 6월) → 12.9% (2025년 9월) | 큰 폭 축소 |\n| D.E. 쇼 | 5.3% → 3.4% | 5% 아래로 축소 |\n| 모건스탠리 | 5.1% → 3.4% | 5% 아래로 축소 |\n| SK에코플랜트 | 5.8% (2025년 7월) → 4.7% (2025년 8월) | 5% 아래로 내려가 신고 의무 종료 |\n| 쿠웨이트 투자청 | 1.38% | 국부펀드 |\n\n신규로 5% 이상을 사들인 유명 펀드는 확인되지 않았고, 대형 기관들은 주가가 오르는 동안 비중을 줄이는 쪽이었습니다.","next_md":"- 2026년 10월 하순 (추정 10월 27일): 3분기 실적. 연간 매출 39~42억 달러 가이던스 유지·상향 여부, 수주잔고(약 200억 달러)와 신규 하이퍼스케일러 고객 이름\n- 오라클 '프로젝트 주피터'(뉴멕시코): 불가항력 통지 후 계약 유지 여부, 가스관 공사 시작 예정일 2027년 2월 1일\n- 오라클 2.8GW 중 확정 1.2GW 외 추가 물량 전환 (배치는 2027년까지)\n- 2026년 12월: 연 생산능력 2GW 달성 여부 (프리몬트 신규 공장 포함)\n- 헌터브룩 의혹 관련 집단소송 진행, 스칸듐 등 희토류에 대한 중국 수출 통제 변화\n- 구글 등 다른 하이퍼스케일러의 공식 계약 발표 (X에서는 미확인 소문 단계)\n- 브룩필드 250억 달러 틀에서 실제 프로젝트 발표\n- 육군 부지 발전 임대(포트 디트릭 등 3곳) 본계약·규모 공개\n- 내부자 추가 매도와 펠로시 측의 매도 신고 여부 (콜옵션 만기 2027년 6월 17일)\n- 연료전지 투자세액공제(48E) 세부 규칙, FERC 전력망 연결 규칙 시행 일정","glossary_md":"| 용어 | 뜻 |\n|---|---|\n| 연료전지 | 연료를 태우지 않고 화학 반응으로 전기를 만드는 장치 |\n| SOFC (고체산화물 연료전지) | 뜨거운 세라믹 판을 쓰는 연료전지. 효율이 높고 천연가스를 바로 쓸 수 있음 |\n| GW / MW (기가와트/메가와트) | 발전 능력 단위. 1GW = 1,000MW, 대략 원자력 발전소 1기 수준 |\n| 하이퍼스케일러 | 아마존·마이크로소프트·구글·메타·오라클 같은 초대형 데이터센터 운영 회사 |\n| 비하인드 더 미터(BTM) | 전력망 계량기 안쪽, 즉 고객 부지 안에서 직접 전기를 만드는 방식 |\n| 마이크로그리드 | 군 기지·병원 등이 자체적으로 운영하는 작은 전력망. 정전 때도 돌아감 |\n| 수주잔고 | 주문은 받았지만 아직 매출로 잡히지 않은 금액 |\n| 가이던스 | 회사가 스스로 밝힌 올해 실적 예상치 |\n| 전환사채 | 나중에 정해진 가격(전환가)으로 주식으로 바꿀 수 있는 빚. 바뀌면 주식 수가 늘어 희석 |\n| 희석 | 새 주식이 늘어 기존 주주의 지분 비율이 줄어드는 것 |\n| 워런트 | 정해진 가격에 새 주식을 살 수 있는 권리 |\n| 투자세액공제(ITC, 48E) | 발전 설비에 투자하면 그 비용의 일부를 세금에서 빼 주는 제도 |\n| FERC | 미국 연방에너지규제위원회. 전력망 연결 규칙을 정함 |\n| 불가항력(force majeure) | 통제할 수 없는 사건으로 계약 의무를 미루거나 면하는 조항 |\n| 공매도 보고서 | 주가 하락에 베팅한 투자자가 회사의 문제점을 공개하는 글 |\n| 10b5-1 계획 | 내부자가 미리 정해 둔 일정·가격에 따라 자동으로 파는 계획. 내부자 거래 오해를 피하려는 장치 |\n| PTR | 미국 의원의 주식 거래 신고서. 금액은 구간으로만 공개 |\n| 콜옵션 | 정해진 가격(행사가)에 주식을 살 권리. 1계약 = 100주 |\n| PER | 주가를 주당순이익으로 나눈 값. 높을수록 미래 성장을 많이 반영 |","sources":[{"t":"SEC 8-K: 2026년 2분기 실적 보도자료 (7월 28일)","u":"https://www.sec.gov/Archives/edgar/data/0001664703/000162828026050150/ex991_q226financialresults.htm"},{"t":"SEC 8-K: 2026년 1분기 실적 보도자료 (4월 28일)","u":"https://www.sec.gov/Archives/edgar/data/0001664703/000162828026027913/ex991_q126financialresults.htm"},{"t":"SEC 8-K: 22억 달러 전환사채 발행 조건 (2025년 10월)","u":"https://www.sec.gov/Archives/edgar/data/0001664703/000162828025049016/a992pressreleasedatedoctob.htm"},{"t":"Business Wire: 전환사채 발행 계획","u":"https://www.businesswire.com/news/home/20251030033915/en/Bloom-Energy-Corporation-Announces-Proposed-Convertible-Senior-Notes-Offering"},{"t":"Bloom Energy: 오라클 최대 2.8GW 협력 확대","u":"https://www.bloomenergy.c 35,270.02,280.76,265.63,272.89,276.53,275.19,266.65,288.7,262.87,291.25,276.98,277.58,289.15,286.65,295.78,291.29,272.82,280.5,262.28,263.45,239.34,236.3]},"mc":69596812758.62613},{"ticker":"ELMT","company":"Elmet Group","name_ko":"엘멧 그룹","category":"미국우선","field":"텅스텐","doc_url":"https://claude.ai/code/artifact/ac754c9f-04b2-4347-b5e4-21e2241a9f56","lead":"엘멧 그룹은 미국 회사 중 유일하게 텅스텐·몰리브덴을 가루부터 완제품 부품까지 직접 만드는 방산 소재 회사입니다. 4월 상장 후 9월 미 국방부의 4.5억 달러 투자로 주가가 공모가보다 65% 올랐지만, 아직 순이익은 적자이고 국방부 몫의 신주가 지분을 크게 희석할 예정입니다.","glance":[["상장","미국 나스닥 (티커 ELMT), 2026년 4월 23일 상장"],["공모가 → 현재가","$14.00 → $23.16 (+65%)"],["상장 후 범위 (종가)","$12.74 (7월 29일) ~ $23.16 (10월 6일). 장중 최고 $25.03 (9월 14일)"],["시가총액","약 7억 달러 (약 9,500억 원)"],["발행주식 / 유통주식","3,046만 주 / 약 1,167만 주"],["최근 12개월 매출","2.285억 달러, 조정 EBITDA 3,180만 달러, 순손실 약 270만 달러"],["증권사 평균 목표가","약 $24 (범위 $20~26)"],["공매도 비율","유통주식의 약 14%"]],"overview_md":"한 줄 판단: 강세론은 '중국 없는 텅스텐 공급망'의 핵심 회사라는 점과 국방부의 직접 투자를, 약세론은 국방부 워런트로 인한 약 25% 희석과 작은 유통 물량에 따른 큰 변동성을 봅니다.\n\n#### 기업 개요: 이 회사는 무엇을 하나\n\n엘멧은 아주 무겁고 녹지 않는 금속(텅스텐·몰리브덴)으로 미사일, 항공기, 의료기기, 반도체 장비에 들어가는 부품을 만드는 회사입니다. 1929년 미국 메인주에서 시작했고, 공장은 메인주 루이스턴, 오하이오주 유클리드, 미시간주 콜드워터에 있습니다.\n\n**1. 텅스텐이란?**\n\n- 녹는점이 약 3,400°C로 모든 금속 중 가장 높고, 납보다 1.7배 무겁습니다.\n- 이 성질 때문에 철판을 뚫는 포탄 탄심, 미사일 부품, 잠수함 무게추, 엑스레이 차폐판, 로켓 노즐에 쓰입니다.\n- 문제는 전 세계 텅스텐 원료의 약 80%를 중국이 생산한다는 점입니다. 중국은 2025년 2월부터 텅스텐 수출을 허가제로 묶었습니다.\n\n**2. 몰리브덴이란?**\n\n- 녹는점이 약 2,600°C로 높고 열을 받아도 모양이 잘 변하지 않습니다.\n- 고온 용광로 부품, 의료용 엑스레이 장비, 반도체 공장 장비, 항공기 엔진 단조 금형에 쓰입니다.\n\n**3. 고출력 마이크로파란?**\n\n- 전자레인지보다 훨씬 강한 전자파를 만드는 장치입니다.\n- 레이더, 플라스마 장비, 산업용 건조기, 그리고 드론을 무력화하는 방어 무기 연구에 쓰입니다.\n\n**4. 이 회사만의 특징**\n\n- 미국 소유 기업 중 텅스텐·몰리브덴을 **가루 만들기 → 압축 → 소결(굽기) → 성형 → 정밀 가공**까지 전부 직접 하는 유일한 회사입니다.\n- 원료도 중국이 아닌 곳에서 조달합니다. 그래서 \"중국산을 쓰면 안 되는\" 미국 무기 프로그램에 납품할 수 있습니다.\n- 패트리어트, 재블린, 헬파이어, 이지스, 트라이던트 II, 사드(THAAD), 차세대 요격미사일(NGI), 정밀타격미사일(PrSM), 버지니아급·컬럼비아급 잠수함 등에 부품을 공급합니다.\n\n#### 돈 버는 구조: 텅스텐 부품이 매출의 86%\n\n매출의 대부분은 텅스텐·몰리브덴 부품(CMC 사업부)에서 나오고, 이 사업부는 이미 흑자입니다. 회사 전체가 적자인 이유는 상장 관련 주식보상 비용 때문입니다.\n\n엘멧은 원래 3·4단계(가루부터 부품까지)만 하던 회사였고, 올해 인수와 계약으로 1·2단계 원료까지 끌어오는 중입니다.\n\n**사업부별 (2026년 2분기, 4월 4일~7월 3일)**\n\n| 사업부 | 매출 | 매출총이익 | 영업이익 | 하는 일 |\n|---|---|---|---|---|\n| 핵심소재 부품 (CMC, 엘멧 테크놀로지스) | 5,705만 달러 | 1,492만 달러 (26%) | +619만 달러 | 텅스텐·몰리브덴 부품 |\n| 마이크로파 제품 (EMP) | 935만 달러 | 169만 달러 (18%) | −78만 달러 | 레이더·플라스마·산업용 마이크로파 |\n| 본사·기타 | – | – | −1,304만 달러 | 상장 비용, 주식보상 |\n| **합계** | **6,640만 달러 (전년 대비 +35%)** | 1,661만 달러 (25%) | −763만 달러 |  |\n\n**누가 사 가나 (2분기 매출 비중)**\n\n| 시장 | 매출 | 비중 | 전년 대비 |\n|---|---|---|---|\n| 항공우주·방산·정부 | 2,608만 달러 | 39% | +18% |\n| 산업 | 2,460만 달러 | 37% | +64% |\n| 의료 | 1,107만 달러 | 17% | +37% |\n| 반도체·전자 | 367만 달러 | 6% | +56% |\n| 에너지 | 99만 달러 | 2% | −35% |\n\n**쉽게 비유하면**\n\n- 엘멧은 '특수 금속 대장간'입니다. 다른 대장간(중국)에서 쇠를 사 오지 않고, 쇳가루부터 직접 만들어 완성품까지 두드립니다.\n- 무기 회사들은 2027년부터 중국산 텅스텐을 못 쓰게 되기 때문에, 이 대장간의 주문이 늘고 있습니다.\n\n**재무 상태 (7월 3일 기준)**\n\n- 수주잔고(아직 납품 안 한 주문)가 약 1.32억 달러로 1년 전보다 55% 늘었고, 그중 방산·정부 주문은 2배가 됐습니다.\n- 2분기 순손실은 449만 달러지만, 상장 관련 주식보상 비용 약 1,000만 달러가 일반관리비에 한꺼번에 반영된 영향이 큽니다.\n- 현금 6,610만 달러, 총부채 약 1,040만 달러로 빚은 적습니다. 9월 국방부 투자로 2억 달러가 추가로 들어왔습니다.\n- 매출의 약 11%가 한 고객에게서 나옵니다.","gov_md":"트럼프 행정부는 엘멧을 '중국 없는 미국 텅스텐 공급망의 중심 회사'로 키우려 합니다. 에너지 퓨얼스에는 대출을 줬지만, 엘멧에는 국방부가 직접 돈을 넣고 사실상 2대 주주가 되는 방식을 택했습니다.\n\n| 목적 | 정부가 한 일 | 엘멧의 역할 |\n|---|---|---|\n| 텅스텐 가공을 중국에서 독립 | 국방부 4.5억 달러 투자 약속 (9월 14일). 마감 시 2억 달러, 이후 6개월마다 5천만 달러씩 5회 | 메인·미시간·오하이오 공장 증설에 1.65억 달러 이상 투입 |\n| 원료(광석) 확보 | 투자금 중 약 1.5억 달러를 네바다 스프링거 텅스텐 단지 재가동에 배정 | 텅스텐 중간재(APT) 공장 합작사 지분 70% 확보, 블루문·EQ리소시스와 공동 운영 |\n| 국가 비상 비축 | 국방조달청(DLA) 최대 20억 달러 비축 계약 (9월), 3,600만 달러 별도 계약 (9월 30일) | 텅스텐 광석·정광, 몰리브덴·텅스텐 합금과 와이어를 국가 비축 창고에 공급 |\n| 무기 공급망에서 중국 배제 | 2027년 1월 1일부터 중국·러시아·이란·북한산 텅스텐을 방산 제품에 사용 금지 | 미국 소유·미국 생산 업체라 규제 수혜 |\n\n**국방부 투자 조건 (주주에게 중요)**\n\n- 국방부는 보통주가 아니라 **상환 가능 우선주**를 받습니다. 연 5.5% 배당을 현금 대신 우선주로 쌓아 줍니다.\n- 여기에 보통주 **757만 주**를 살 수 있는 워런트(신주인수권)를 받습니다. 거래 후 기준 지분 19.9%입니다.\n  - 75%(약 570만 주)는 사실상 공짜로 받는 '페니 워런트'입니다.\n  - 25%(약 190만 주)는 정해진 행사가에 사는 워런트입니다.\n- 독립이사 1명 지명권과 이사회 옵서버 1명 자리도 받습니다.\n- 지분 투자라 정부는 주가가 오를수록 이익을 봅니다. 이 점에서 정부와 일반 주주의 이해가 같은 방향입니다.\n\n**동맹국 원료망도 함께 짜는 중**\n\n- 스페인: EQ리소시스 지분 확대, 살로로 광산 5년 구매 계약 (약 3,000만 호주달러)\n- 영국: 텅스텐 웨스트 구매 계약 (9월 22일)\n- 베트남: 마산 하이테크 머티리얼스 지분 4.99%를 약 1.25억 달러에 매입 (9월 23일). 중국 밖 최대급 텅스텐 생산 회사입니다.\n- 독일: ams OSRAM 슈바브뮌헨 텅스텐·몰리브덴 금속 공장 인수 (9월 8일 발표)","gov_title":"정부가 이 회사를 쓰는 방법","events":[{"date":"2026-10-06","title":"캐나코드 목표가 상향","detail":"캐나코드 목표가 $21 → $26 상향","move":"$23.16"},{"date":"2026-10-01","title":"회사 소개 자료 업데이트","detail":"회사 소개 자료 업데이트 (국방부 투자 세부 조건 공개)","move":"$20.35"},{"date":"2026-09-30","title":"DLA 비축 계약","detail":"국방조달청 3,600만 달러 국가비축 계약 (몰리브덴·텅스텐 합금, 정밀 와이어)","move":"$19.96"},{"date":"2026-09-23","title":"베트남 마산 지분 매입","detail":"베트남 마산 하이테크 머티리얼스 지분 4.99% 1.25억 달러에 매입","move":"$20.58"},{"date":"2026-09-22","title":"영국 텅스텐 웨스트 계약","detail":"영국 텅스텐 웨스트(헤머던 광산) 장기 구매 계약. 연 1,000톤 이상 정광, 현재 가격 기준 연 2.3억 달러 이상","move":"$20.82"},{"date":"2026-09-21","title":"블루문 워런트 발행","detail":"블루문 메탈스에 116.7만 주 워런트 발행","move":"$21.83"},{"date":"2026-09-14","title":"국방부 4.5억 달러 투자","detail":"국방부 4.5억 달러 투자 약속 + 국방조달청 최대 20억 달러 비축 계약 + 네바다 텅스텐 단지 재가동","move":"$21.50"},{"date":"2026-09-08","title":"독일 OSRAM 공장 인수","detail":"독일 ams OSRAM 슈바브뮌헨 텅스텐·몰리브덴 공장 인수 계약","move":"$16.93"},{"date":"2026-08-21","title":"스페이스X 공급사 소문","detail":"\"스페이스X 비밀 금속 공급사\" 소문 (회사 확인 없음)","move":"$19.89"},{"date":"2026-08-13","title":"2분기 실적 발표","detail":"2분기 실적: 매출 6,640만 달러(+35%), 수주잔고 +55%","move":"$17.15"},{"date":"2026-07-29","title":"상장 후 최저 종가","detail":"상장 후 최저 종가","move":"$12.74"},{"date":"2026-06-25","title":"스페인 EQ리소시스 확대","detail":"스페인 EQ리소시스 지분 확대, 5년 텅스텐 정광 구매 계약","move":"$18.68"},{"date":"2026-06-23","title":"러셀 3000 편입","detail":"러셀 3000 지수 편입 확정","move":"$18.45"},{"date":"2026-06-09","title":"몰리브덴 지원금","detail":"정부의 요격미사일용 몰리브덴 생산 확대 지원금 430만 달러","move":"$18.76"},{"date":"2026-06-01","title":"이틀간 +45% 급등","detail":"여러 X 계정의 분석 글 확산 후 급등. 2일 자회사가 브룩헤이븐 국립연구소 아크 감지 기술 라이선스","move":"$22.09"},{"date":"2026-05-29","title":"1분기 실적 발표","detail":"1분기 실적: 매출 5,600만 달러(+21%), 조정 EBITDA 917만 달러(+106%), 상장 비용으로 순손실","move":"$15.28"},{"date":"2026-04-23","title":"나스닥 상장","detail":"나스닥 상장. 공모가 $14, 약 1.2억 달러 조달","move":"$17.91"}],"chart_events":["2026-04-23","2026-06-01","2026-07-29","2026-08-21","2026-09-14","2026-10-06"],"bull":["**정부가 고른 '국가 대표' 회사** 국방부가 4.5억 달러를 넣고 지분 19.9%까지 받는 주주가 됐습니다. 국방부는 엘멧을 고른 이유로 \"미국 소유의 유일한 완전 통합 텅스텐·몰리브덴 생산자\"라는 점을 들었습니다. 국방조달청 비축 계약 최대 20억 달러는 회사 최근 12개월 매출(2.3억 달러)의 약 9배 규모입니다. 계약 상한일 뿐 확정 매출은 아니지만, 수요의 크기를 보여줍니다.","**2027년 1월 1일 규제가 만드는 독점적 수요** 이날부터 중국·러시아·이란·북한산 텅스텐은 미국 방산 제품에 쓸 수 없습니다. 미국 안에서 대체할 수 있는 업체가 거의 없습니다.","**실적이 이미 좋아지고 있음** 2분기 매출 +35%, 조정 EBITDA +58%(890만 달러), 매출총이익률 25%(+4.3%p). 수주잔고 1.32억 달러로 사상 최대, 방산·정부 수주잔고는 1년 새 2배. PrSM, 차세대 요격미사일, 헬파이어, 재블린, 이지스 등이 이끌고 있습니다.","**텅스텐 가격 급등이 판매가에 반영** 유럽 기준 텅스텐 중간재(APT) 가격이 2024년 mtu(약 10kg 단위)당 약 340달러에서 2026년 3,000달러 안팎으로 약 9배 올랐습니다. 회사는 이를 제품 가격에 넘기고 있습니다.","**동맹국 원료망을 빠르게 확보** 스페인(EQ리소시스), 영국(텅스텐 웨스트: 현재 가격 기준 연 2.3억 달러 이상 규모 구매), 베트남(마산 4.99%), 미국 네바다(스프링거 합작사 70%), 독일(OSRAM 공장)까지 묶었습니다. X에서는 \"광산과 제련소를 사실상 두 곳 확보했다\"는 평가가 나왔습니다.","**빚이 거의 없고 현금이 넉넉함** 7월 기준 현금 6,610만 달러, 부채 1,040만 달러에, 9월 국방부 투자금 2억 달러가 들어왔습니다.","**창업자가 주식의 36%를 보유** 피터 아나니아 CEO 측이 36%, 또 다른 대주주가 17%를 가지고 있어 경영진과 주주의 이해가 같은 방향입니다. 이사 2명은 상장 때 공모가 $14에 직접 매수했습니다."],"bear":["**국방부 워런트로 약 25% 희석** 국방부가 받을 757만 주는 지금 발행주식(3,046만 주)의 약 25%입니다. 그중 570만 주는 사실상 공짜로 받습니다. 블루문 메탈스에도 116.7만 주 워런트를 발행했습니다. 국방부 우선주에는 연 5.5% 배당이 쌓이므로, 이를 갚기 전까지는 보통주 주주보다 먼저 챙겨야 할 돈이 늘어납니다.","**보호예수 해제가 임박** 상장 후 180일인 10월 하순에 기존 주주 매도 제한이 풀릴 예정입니다. 내부자 지분이 60%를 넘어, 일부만 팔아도 유통 물량(약 1,167만 주) 대비 부담이 큽니다. X에서도 \"곧 대규모 언락\"을 이유로 차익 실현한 사례가 있었습니다.","**변동성이 극단적** 상장 후 하루 ±10% 이상 움직인 날이 19번이었습니다. 공매도도 유통주식의 약 14%입니다. 8월 21일 +19%는 \"스페이스X 비밀 공급사\"라는 확인되지 않은 소문 때문이었습니다.","**텅스텐 가격이 되돌려지면 이중 타격** 지금 매출 증가의 일부는 텅스텐 가격 급등 덕입니다. 가격이 내려가면 판매가 하락과 재고 평가 손실이 함께 올 수 있다는 분석이 있습니다.","**이익의 질 문제** 1분기 조정 EBITDA에는 EQ리소시스 지분 평가이익 약 370만 달러가 포함됐습니다. 본업 이익보다 부풀려 보였다는 지적이 나왔습니다. 마이크로파 사업부(EMP)는 2분기 영업적자였습니다.","**원료는 아직 남의 광산에 의존** 엘멧은 광산을 직접 운영하지 않습니다. 스페인·영국·베트남 등에서 원료를 사 오므로, 공급사 사정에 따라 차질이 생길 수 있습니다.","**투자 규모가 회사에 비해 큼** 국방부 투자 4.5억 달러는 연매출의 약 2배입니다. 미국·독일·베트남에서 동시에 증설과 인수를 진행해야 해 실행 위험이 큽니다."],"analysts_md":"증권사 대부분이 매수 의견이지만, 주가($23.16)가 이미 평균 목표가(약 $24)에 거의 닿아 추가 상승 여력은 크지 않다고 보는 셈입니다.\n\n| 날짜 | 증권사 | 의견 | 목표가 |\n|---|---|---|---|\n| 10월 6일 | 캐나코드 | 매수 | $26 (상향, 기존 $21) |\n| 9월 15일 | 로스 | 매수 | $26 (상향, 기존 $21) |\n| 9월 15일 | 니덤 | 매수 | $25 (상향, 기존 $21) |\n| 8월 17일 | 캐나코드 | 매수 | $21 (상향, 기존 $20) |\n\n종합: 매수 4, 보유 1, 매도 1, 목표가 범위 $20~26 (MarketBeat 집계). 니덤은 같은 그룹의 자산운용 펀드가 지분 7.3%를 보유하고 있어, 의견을 볼 때 이해관계를 감안해야 합니다.","insider_title":"내부자·유명인 매매","insider_md":"상장 이후 내부자의 장내 매도는 한 건도 없고, 매수는 이사 2명이 공모가 $14에 산 약 16.8만 달러뿐입니다. 가장 큰 '유명 투자자'는 지분 최대 19.9%를 받게 된 미 국방부입니다. 현재가는 $23.16 (10월 6일 종가)입니다.\n\n**내부자 매매 (SEC Form 4)**\n\n| 날짜 | 누가 | 내용 | 가격 | 금액 | 현재가 대비 |\n|---|---|---|---|---|---|\n| 2026년 4월 22일 | 킴벌리 아나니아 (이사) | 공모 참여 매수 7,000주 | $14.00 | 9.8만 달러 | +65% |\n| 2026년 4월 22일 | 캐시 레너드 (이사) | 공모 참여 매수 5,000주 | $14.00 | 7.0만 달러 | +65% |\n| 2026년 5월 14일 | 데릭 폭스 (CMC 사업부 사장) | 주가연동보상 31만 주 행사 후 회사에 반납 (세금·행사가 정산) | $14.00 | – | 장내 매도 아님 |\n| 2026년 5월 19일 | 임원·이사 약 15명 | 주식 보상 지급 (무상) | – | – | 매수 아님 |\n\n**대주주 (상장 후 지분 신고)**\n\n| 주주 | 지분율 | 비고 |\n|---|---|---|\n| 피터 아나니아 (CEO·회장) 측 | 36.0% | 6월 기준 1,080만 주 |\n| 조지 쇼트 | 17.0% | 개인 대주주 |\n| 니덤 투자운용 펀드 | 7.3% | 니덤 증권은 매수 의견 |\n| 스콧 놀 (부사장) | 5.2% |  |\n| 미 국방부 | 최대 19.9% (워런트) | 페니 워런트 약 570만 주는 사실상 0원 매수 |\n\n**유명인·유명 펀드**\n\n- 펠로시, 트럼프 개인, 의회 의원의 ELMT 매매 기록은 없습니다. 트럼프 '개인'이 아니라 트럼프 '행정부'(국방부)가 투자한 것입니다.\n- 드러켄밀러, 아셴브레너 등 앞서 본 유명 펀드의 13F에도 없습니다. 2분기에 웰링턴 매니지먼트(약 1,050만 달러), 스테이트 스트리트 등 대형 기관이 새로 편입했습니다.\n- 공모가에 산 투자자 기준 수익률은 +65%이고, 국방부의 페니 워런트는 현재가 거의 전부가 이익입니다.\n\n출처: [SEC EDGAR Form 4·13G (Elmet)](https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=0002101698), [SEC 8-K 국방부 투자](https://www.sec.gov/Archives/edgar/data/2101698/000121390026099734/ea0304682-8k_elmet.htm)","next_md":"- [ ] 2026-10-20 전후: 상장 180일 보호예수 해제 (정확한 날짜는 공모 계약 기준, 내부자 매도 여부)\n- [ ] 2026-11-16 전후 (추정): 3분기 실적. 수주잔고, 국방부 투자 회계 처리, 텅스텐 가격 영향\n- [ ] 국방부 추가 투자금(6개월마다 5천만 달러) 집행 여부\n- [ ] 국방조달청 20억 달러 비축 계약 중 실제 주문 규모\n- [ ] 네바다 스프링거 텅스텐 중간재(APT) 공장 재가동 일정\n- [ ] 독일 OSRAM 공장, 베트남 마산 지분 거래 완료\n- [ ] 2027-01-01 국방 조달 규제 시행 후 주문 변화\n- [ ] 유럽 텅스텐(APT) 가격 추이","glossary_md":"| 용어 | 뜻 |\n|---|---|\n| 워런트 | 정해진 가격에 새 주식을 살 수 있는 권리. 행사되면 주식 수가 늘어 기존 주주 지분이 희석됨 |\n| 페니 워런트 | 행사가가 거의 0원인 워런트. 사실상 공짜 주식 |\n| 상환 가능 우선주 | 회사가 나중에 되사들일 수 있는 주식. 보통주보다 먼저 배당·원금을 받음 |\n| 현물배당(PIK) | 배당을 현금 대신 주식으로 주는 것 |\n| 보호예수(락업) | 상장 후 일정 기간 기존 주주가 주식을 팔지 못하게 묶어두는 약속 |\n| 수주잔고 | 이미 주문받았지만 아직 납품하지 않은 금액. 앞으로의 매출 |\n| APT | 텅스텐 광석을 정제한 중간 원료(파라텅스텐산암모늄). 텅스텐 가격의 기준 |\n| mtu | 텅스텐 거래 단위. 산화텅스텐 10kg |\n| 조정 EBITDA | 일회성 비용 등을 뺀 영업 현금 이익에 가까운 숫자 |\n| 국가비축 | 전쟁 등 비상시에 대비해 정부가 전략 물자를 미리 사두는 것 |","sources":[{"t":"SEC 10-Q (2026년 2분기, 7월 3일 마감)","u":"https://www.sec.gov/Archives/edgar/data/2101698/000162828026056460/elmt-20260703.htm"},{"t":"SEC 8-K: 국방부 4.5억 달러 투자","u":"https://www.sec.gov/Archives/edgar/data/2101698/000121390026099734/ea0304682-8k_elmet.htm"},{"t":"SEC 증권신고서 (회사 소개)","u":"https://www.sec.gov/Archives/edgar/data/2101698/000121390026043190/ea0270360-05.htm"},{"t":"Military Times: 국방부가 텅스텐에 4.5억 달러를 넣은 이유","u":"https://www.militarytimes.com/news/pentagon-congress/2026/09/30/why-the-pentagon-just-dropped-450m-on-tungsten-mining/"},{"t":"MINING.COM: 블루문 텅스텐 재가동","u":"https://www.mining.com/us-department-of-war-commits-450-million-to-tungsten-supply-chain/"},{"t":"StockTitan: 국방부 투자 조건","u":"https://www.stocktitan.net/sec-filings/ELMT/8-k-elmet-group-co-reports-material-event-2b7408ae2248.html"},{"t":"StockTitan: EQ리소시스 지분 확대","u":"https://www.stocktitan.net/news/ELMT/the-elmet-group-co-increases-ownership-in-eq-resources-limited-9e7x6hbzjq8h.html"},{"t":"Aurelix Research: The Wolfram Premium (7월 12일)","u":"https://aurelixresearch.substack.com/p/the-wolfram-premium-el
