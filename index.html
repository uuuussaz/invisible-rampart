입","정부 지분·국방 계약 없음. 대신 관세·전기차 보조금 폐지·자율주행 규제(NHTSA)·중국 정책의 영향을 크게 받음"],["국방 필수도","낮음. 군수 회사가 아님 (국방 계약은 머스크의 다른 회사 스페이스X 쪽)"],["내부자 동향","머스크 CEO가 2025년 9월 12일 약 10억 달러(257만 주, 평균 $389) 장내 매수. 반면 이사들은 2025년 이후 약 6.1억 달러 매도"],["머스크 지분","19.9% (2026년 6월 16일 13G 공시, 약 7억 주)"],["증권사 평균 목표가","$392.42 (현재가 대비 +4.6%, 범위 $128~600)"],["다음 실적 발표","2026년 10월 21일 (3분기)"]],"overview_md":"#### 기업 개요: 이 회사는 무엇을 하나\n\n테슬라는 미국 텍사스주 오스틴에 본사가 있는 전기차·에너지 회사입니다. 직원은 약 13만 5천 명이고, CEO는 일론 머스크입니다. 머스크는 로켓 회사 스페이스X(2026년 6월 상장, 티커 SPCX)도 이끌고 있습니다.\n\n**1. 지금 하는 일**\n\n- **전기차**: 모델 3·모델 Y가 판매의 거의 전부입니다(3분기 48.7만 대 중 47.8만 대). 공장은 미국(캨리포니아·텍사스·네바다), 중국 상하이, 독일 베를린에 있습니다.\n- **에너지 저장장치**: 전력회사·데이터센터용 대형 배터리 '메가팩'과 가정용 '파워월'. 2026년 3분기 13.7GWh를 설치했습니다.\n- **서비스**: 수리, 보험, 충전소(슈퍼차저), 자율주행 소프트웨어(FSD) 구독.\n\n**2. 미래에 걸고 있는 일**\n\n- **FSD(완전 자율주행)**: 지금은 운전자가 지켜봐야 하는 '감독형(Supervised)'입니다. 미국·중국 일부·유럽 7개국·한국 등에서 쓸 수 있습니다.\n- **로보택시·사이버캡**: 사람 없이 달리는 택시. 핸들·페달이 없는 2인승 '사이버캡'이 2026년 9월 3일 오스틴에서 운행을 시작했습니다. 9월 2일 기준 텍사스에 로보택시 314대(그중 사이버캡 45대)가 등록돼 있습니다.\n- **옵티머스**: 공장·가정에서 일할 인간형 로봇. 아직 대량 생산 전입니다.\n- **AI 칩(AI5)**: 자체 자율주행 칩. 2026년 4월 설계를 끝내고, 2027년 대량 생산 예정입니다(삼성·TSMC 생산).\n\n#### 돈 버는 구조: 매출은 차, 기대는 AI\n\n매출의 대부분은 아직 자동차에서 나옵니다. 하지만 2026년에는 차를 더 팔기 위해 가격을 깎고, 로보택시·AI에 돈을 크게 쓰면서 이익이 얇아졌습니다.\n\n| 사업 | 2025년 매출 (10-K) | 비중 | 전년 대비 | 특징 |\n|---|---|---|---|---|\n| 자동차 | 695.3억 달러 | 73% | −10% | 차 판매 + 탄소 크레딧(19.9억 달러, −28%) + 리스 |\n| 에너지 저장·발전 | 127.7억 달러 | 13% | +27% | 메가팩·파워월. 가장 빨리 크는 사업 |\n| 서비스·기타 | 125.3억 달러 | 13% | +19% | 수리·보험·충전·중고차 |\n| 합계 | 948.3억 달러 | 100% | −3% |  |\n\n**최근 6개 분기 실적** (단위: 억 달러)\n\n| 분기 | 매출 | 영업이익 | 순이익 | 잉여현금흐름 |\n|---|---|---|---|---|\n| 2026년 2분기 | 282.4 | 4.0 | 11.2 | −10.9 |\n| 2026년 1분기 | 223.9 | 9.4 | 4.8 | 14.4 |\n| 2025년 4분기 | 249.0 | 11.7 | 8.4 | 14.2 |\n| 2025년 3분기 | 281.0 | 18.6 | 13.7 | 39.9 |\n| 2025년 2분기 | 225.0 | 9.2 | 11.7 | 1.5 |\n| 2025년 1분기 | 193.4 | 4.9 | 4.1 | 6.6 |\n\n- 연간 매출은 2024년 977억 → 2025년 948억 달러로 줄었고, 2026년은 약 1,069억 달러(증권사 평균 예상)로 다시 늘 것으로 봅니다.\n- 2026년 2분기 순이익 11억 달러에는 테슬라가 갖고 있는 스페이스X 주식의 평가이익이 포함돼 있습니다. 본업의 영업이익은 4억 달러뿐입니다.\n- '탄소 크레딧' 매출(다른 차 회사에 판 돈)은 2024년 27.6억, 2025년 19.9억 달러에서 2026년 2분기 1.46억 달러로 급감했습니다. 이유는 아래 '정부' 섹션에 있습니다.\n\n#### 앞으로의 숫자\n\n| 항목 | 내용 |\n|---|---|\n| 2026년 설비투자 | 250억 달러 이상 (회사 가이던스). 향후 2년간 더 늘어날 것이라고 CFO가 말함 |\n| 3분기 판매 | 48.65만 대 (예상 46.2만 대보다 5% 많음, 작년 같은 분기보다 2.1% 적음) |\n| 사이버캡 가격 | 2027년 전 3만 달러 미만 목표 (머스크) |\n| AI5 칩 | 2027년 대량 생산 |\n| 머스크 2025년 보상안 | 2025년 11월 6일 주주총회 승인. 최대 4억 2,370만 주(약 1조 달러 규모)를 12단계로 지급. 조건: 시총 2조→8.5조 달러, 누적 차량 2,000만 대, FSD 구독 1,000만, 로보택시 100만 대, 옵티머스 100만 대, 조정 EBITDA 4,000억 달러 |\n| 현재 위치 | 시총 1.48조 달러 → 첫 단계(2조 달러)까지 약 +35% 남음 |","gov_md":"미국 정부나 국방부가 테슬라에 돈을 대거나 지분을 사지는 않았습니다. 테슬라에게 정부는 '고객'이 아니라 '규칙을 정하는 심판'입니다. 보조금 폐지, 탄소 크레딧 제도 약화, 자율주행 승인, 중국 정책이 실적과 주가를 크게 흔듭니다.\n\n**1. 미국 정책: 테슬라에게 불리하게 바뀜 것들**\n\n| 정책 | 내용 | 테슬라 영향 |\n|---|---|---|\n| 전기차 세금 혜택 폐지 | 2025년 7월 감세법으로 차 1대당 최대 7,500달러 세액공제가 2025년 9월 30일 종료 | 미국 판매 약화. 콕스 오토모티브는 테슬라 미국 판매 20% 감소를 예상. 2026년 테슬라는 할인·무이자 판매로 버텨 |\n| 연비 규제(CAFE) 벌금 폐지 | 같은 법으로 연비 기준 미달 벌금을 0으로. 교통부는 2028년형부터 크레딧 거래 제도 폐지 추진 | 다른 차 회사가 테슬라 크레딧을 살 이유가 사라짐. 크레딧 매출 2024년 27.6억 달러 → 2026년 2분기 1.46억 달러 |\n| 자율주행 규제 (NHTSA) | 미국 도로교통안전국이 2026년 9월 3일 사이버캡 안전 인증 과정 조사 시작. 핸들·페달·미러 없는 차가 연방 안전기준을 어떻게 맞추냐는 질문 | 9월 4일 주가 −5.9%. 로보택시 확대 속도가 규제에 달려 있음 |\n| 캘리포니아 차량국(DMV) | 광고에서 '오토파일럿' 표현을 쓰지 않기로 합의 | 과장 광고 논란 일단락 |\n\n**2. 미국 정책: 테슬라에게 유리한 것들 (미·중 경쟁)**\n\n- **중국 전기차 차단**: 미국은 2024년부터 중국산 전기차에 100% 관세를 매기고, 중국 소프트웨어가 들어간 '커넥티드카'를 금지하는 규칙을 만들었습니다. BYD 같은 싼 중국 차가 미국에 못 들어오니, 미국 안에서 테슬라는 보호를 받는 셈입니다.\n- **미국 내 생산**: 미국에서 파는 테슬라 차는 대부분 미국 공장에서 만듭니다. 수입차 관세의 직접 피해는 다른 회사보다 작지만, 중국산 배터리·부품 관세는 비용을 올립니다.\n\n**3. 중국: 가장 큰 기회이자 가장 큰 위험**\n\n| 항목 | 내용 |\n|---|---|\n| 상하이 공장 | 2026년 2분기 중국 공장 출하 25.5만 대(+33%). 전 세계 판매(48만 대)의 절반 이상이 중국에서 만들어짐 (수출 포함) |\n| 중국 FSD | 2026년 5월 21일 감독형 FSD 판매 확인('테슬라 보조주행'으로 이름 변경, 6.4만 위안). CFO가 목표로 말한 '3분기 중 완전 승인'은 아직 확인되지 않음 |\n| 희토류 자석 | 옵티머스 로봇 팔 모터에는 희토류 자석이 필수. 중국이 세계 자석의 약 92%를 만듦. 2025년 4월 중국 수출 통제 때 머스크는 \"로봇용 자석 수출 허가를 받길 바란다\"고 말함 |\n| 합병 변수 | 캐시 우드는 \"중국이 테슬라–스페이스X 합병의 가장 큰 장애물일 수 있다\"고 말함(9월 30일, X). 로켓·군사위성 회사와 합치면 중국 사업이 민감해질 수 있기 때문 |\n\n**4. 머스크–트럼프 관계와 스페이스X 연결고리**\n\n| 시기 | 사건 |\n|---|---|\n| 2025년 1~5월 | 머스크가 정부효율부(DOGE)를 이끔. 테슬라 불매·매장 시위로 판매 하락 |\n| 2025년 6월 | 감세법(전기차 혜택 폐지)을 두고 트럼프와 공개 충돌. 트럼프가 머스크 회사들의 보조금·계약 중단을 언급 |\n| 2025년 하반기~2026년 | 관계 회복. 트럼프가 10월 8일 백악관 '과학 황금기 서밋'에서 머스크에게 국가과학훈장을 수여할 예정이라는 보도는 확인(브린·젠슨 황·리사 수와 함께). 실제 수여 기사는 확인 못함 |\n| 2026년 | 트럼프의 위탁 계좌가 TSLA를 여러 차례 사고팔았음 (아래 내부자·유명인 섹션) |\n| 스페이스X | 2026년 xAI를 흡수하고 6월 12일 상장(공모가 $135, 기업가치 1.75조 달러). 테슬라는 xAI에 투자했던 지분이 스페이스X 주식으로 바뀌어 보유 중. 스페이스X는 NASA·국방부의 핵심 로켓·위성 공급사라, 합병하면 테슬라도 간접적으로 국방 연관성이 생김 |\n| 합병 기대 | 스페이스X 사장 그윈 쇼트웰: \"합병은 일론의 삶을 조금 더 쉽게 할 것\". 예측시장 칼시는 2027년 5월 전 합병 확률을 46%로 봄(6월 기준). 회사 공식 발표는 없음 |\n\n**5. 해외 자율주행 승인**\n\n| 지역 | 상황 |\n|---|---|\n| 유럽 | 2026년 4월 네덜란드(RDW)가 감독형 FSD를 임시 승인. 리투아니아·에스토니아·덴마크·벨기에·슬로베니아·체코까지 7개국. EU 전체 투표는 10월에서 12월 이후로 밀림. 독일은 10월 7일 지지 의사를 밝힘 |\n| 한국 | 감독형 FSD는 2025년 11월 출시됐지만, 한·미 FTA로 인정되는 미국산 모델 S·X·사이버트럭만 합법(2026년 4월 기준 4,292대, 테슬라 등록차의 2.4%). 중국산 모델 3·Y는 국내 인증이 없어 쓸 수 없고, 국토부는 불법 활성화 85건을 수사 의뢰함. 10월 4일 국토부가 FSD 시험차 제공 제안을 거절했다는 X 보도는 확인 못함. 9월 한국 판매 1만 2,372대로 수입차 1위(X) |\n| 중국 | 위 3번 참고 |\n\n정리: 테슬라는 국방 예산으로 돈을 버는 회사가 아닙니다. 다만 미·중 경쟁(중국차 차단, 희토류 자석), 규제 승인, 머스크의 정치적 위치, 스페이스X 합병 여부가 주가를 크게 움직입니다.","gov_title":"정부·국방과의 관계: 테슬라는 방산주가 아니다","events":[{"date":"2026-10-08","title":"머스크 훈장 수여 예정","detail":"백악관 과학 서밋에서 머스크 국가과학훈장 수여 예정 보도 (실제 수여 기사는 확인 못함)","move":"−0.7%"},{"date":"2026-10-07","title":"독일 FSD 지지","detail":"독일이 FSD 유럽 승인 지지 표명. 하지만 EU 전체 투표는 12월 이후로 연기","move":"−0.8%"},{"date":"2026-10-02","title":"3분기 판매 서프라이즈","detail":"3분기 판매 48.65만 대, 예상(46.2만 대)보다 5% 많음. 에너지 저장 13.7GWh는 예상(15.9GWh)보다 적음","move":"+4.7% (전날 $354.11)"},{"date":"2026-09-21","title":"체코 FSD 승인","detail":"체코가 유럽 7번째로 FSD 승인 (X 보도)","move":"중립"},{"date":"2026-09-04","title":"NHTSA 사이버캡 조사","detail":"NHTSA가 사이버캡 안전 인증 조사 착수 (9월 3일 오스틴 운행 시작 직후)","move":"−5.9%"},{"date":"2026-07-29","title":"연중 최저 종가","detail":"연중 최저 종가","move":"저점"},{"date":"2026-07-23","title":"2분기 실적 쇼크","detail":"2분기 실적: 매출 282억 달러(예상 상회), 조정 주당순이익 $0.33(예상 $0.54), 자동차 이익률 16%, 잉여현금흐름 −11억 달러, 설비투자 250억 달러 이상 예고","move":"−14.5% (올해 최대 하락)"},{"date":"2026-07-06","title":"판매 호조 뒤 반등","detail":"2분기 판매 서프라이즈 뒤 반등","move":"+6.7%"},{"date":"2026-07-02","title":"2분기 판매 발표","detail":"2분기 판매 48만 대(+25%), 예상 40.7만 대를 크게 넘었지만 \"소문에 사고 뉴스에 판다\"","move":"−7.5%"},{"date":"2026-06-29","title":"스페이스X 합병 기대","detail":"스페이스X 상장(6월 12일) 이후 머스크 관련주 열기, 합병 기대","move":"+8.5%"},{"date":"2026-06-23","title":"4주 조정 마감","detail":"4주간 −12% 조정, 5월 이후 최저","move":"−5.8%"},{"date":"2026-06-12","title":"스페이스X 상장","detail":"스페이스X 나스닥 상장 (공모가 $135, 기업가치 1.75조 달러)","move":"합병 기대 시작"},{"date":"2026-06-05","title":"금리 우려 급락","detail":"강한 고용지표로 금리 상승 우려, 나스닥 −4.2% 급락. 같은 날 JP모건은 매도→중립, 목표가 $145→$475","move":"−6.6%"},{"date":"2026-05-21","title":"중국 FSD 판매 확인","detail":"중국에서 감독형 FSD 판매 확인","move":"중립"},{"date":"2026-04-15","title":"AI5 칩 설계 완료","detail":"머스크 \"AI5 칩 설계 완료\". UBS 매도→중립 상향","move":"+7.6% (주간 +14%)"},{"date":"2026-04-13","title":"네덜란드 FSD 승인","detail":"네덜란드가 유럽 처음으로 FSD 임시 승인","move":"호재"},{"date":"2026-01-05","title":"연중 최고 종가","detail":"연중 최고 종가","move":"고점"}],"chart_events":["2026-01-05","2026-04-15","2026-06-12","2026-07-23","2026-07-29","2026-10-02"],"bull":["**판매가 다시 늘었다**: 2026년 2분기 48.0만 대(작년보다 +25%), 3분기 48.65만 대로 두 분기 연속 예상을 넘었습니다. 2분기 말 주문 대기 물량은 2023년 이후 최대였습니다.","**로보택시가 실제로 달린다**: 사이버캡이 2026년 9월 3일 오스틴에서 운행을 시작했고, 텍사스·플로리다·캨리포니아로 로보택시 지역이 늘고 있습니다. 머스크는 사이버캡 가격을 3만 달러 미만으로 만들겠다고 했습니다.","**FSD 승인이 늘고 있다**: 유럽 7개국, 중국(감독형), 한국에서 판매 중. 독일이 10월 7일 지지해 12월 EU 투표가 통과되면 유럽 전체 시장이 열립니다.","**AI 기업으로 보는 시각**: JP모건은 6월 목표가를 $145→$475로 올리며 \"가치는 이제 차 이익보다 로보택시·로봇·AI 칩·소프트웨어에서 나온다\"고 했습니다. 2030년 주당순이익 약 $7.50, 매출 약 2,030억 달러를 예상합니다(2026년 약 $1.95).","**스페이스X 합병 기대**: 댄 아이브스(목표가 $500)는 합병 가능성을 80%로 봅니다. 테슬라는 이미 스페이스X 주식을 갖고 있어, 스페이스X 주가가 오르면 테슬라 순이익도 늘어납니다.","**머스크의 이해관계 일치**: 머스크는 2025년 9월 자기 돈 약 10억 달러로 257만 주를 샀고, 시총 8.5조 달러까지 가야 다 받는 보상안을 받았습니다. 회사를 떠날 가능성이 줄었습니다.","**지원용 사업이 탄탄**: 현금 약 435억 달러, 부채 약 161억 달러로 투자할 여력이 있고, 에너지 저장 사업은 분기 13~14GWh 수준입니다."],"bear":["**이익이 줄고 있다**: 2026년 2분기 영업이익 4억 달러(작년보다 −57%), 영업이익률 1.4%. 차를 할인·무이자로 팔아 자동차 이익률이 19%→16%로 떨어졌습니다.","**돈을 많이 쓴다**: 2026년 설비투자 250억 달러 이상. 2분기 잉여현금흐름은 −11억 달러로 2년 만에 마이너스가 됐고, CFO는 \"앞으로 2년간 더 늘어난다\"고 했습니다.","**주가가 매우 비싸다**: 주가수익비율(PER) 약 350~390배, 내년 예상 기준도 약 175~200배입니다. 일반 차 회사는 5~10배입니다.","**정부 혜택이 사라졌다**: 미국 전기차 세액공제 종료(2025년 9월 30일), 탄소 크레딧 매출 급감(2024년 27.6억 → 2026년 2분기 1.46억 달러). 3분기 판매는 작년보다 2.1% 줄었습니다.","**규제 위험**: NHTSA가 사이버캡 인증을 조사 중입니다. EU FSD 투표는 계속 밀리고, 중국 완전 승인도 목표(3분기)를 넘기고 있습니다. 웨이모는 이미 11개 도시에서 로보택시를 운영합니다.","**내부자 매도**: 이사들이 2025년 이후 약 6.1억 달러를 팔았습니다(의장 덴홀름 1.4억, 에렌프레이스 1.7억 달러 등).","**머스크 리스크**: 머스크가 스페이스X·xAI·정치에 시간을 나눠 씁니다. 합병이 되면 테슬라 주주가 적자 회사(스페이스X)와 지분을 나눠야 할 수도 있습니다.","**가장 낮은 목표가**: HSBC 매도 $157, BNP파리바 엑사너 매도 $268, 최저 $128. 현재가 대비 −29~−66%입니다."],"analysts_md":"증권사 44곳의 평균 목표가는 $392.42(현재가 대비 +4.6%), 중간값은 $410입니다. 하지만 최고 $600와 최저 $128의 차이가 4.7배나 돼, 테슬라를 '차 회사'로 보느냐 'AI 회사'로 보느냐에 따라 의견이 크게 갈립니다.\n\n| 날짜 | 증권사 | 의견 | 목표가 | 현재가 대비 |\n|---|---|---|---|---|\n| 10월 8일 | Tigress Financial | 매수 유지 | $550 | +47% |\n| 10월 8일 | Oppenheimer | 중립 유지 | 목표가 없음 | – |\n| 10월 7일 | Yorkville Ives & Co (댄 아이브스) | 매수 (신규) | $500 | +33% |\n| 10월 7일 | UBS | 중립 | $385 → $391 | +4% |\n| 10월 5일 | Deutsche Bank | 매수 | $420 | +12% |\n| 10월 5일 | Goldman Sachs | 중립 → 매수 상향 (MarketBeat에만 나옴, 두 번째 출처 확인 못함) | – | – |\n| 10월 5일 | HSBC | 비중축소(매도) | $157 | −58% |\n| 9월 28일 | JP모건 | 중립 | $445 → $415 | +11% |\n| 9월 24일 | BNP파리바 엑사너 | 시장하회(매도) | $280 → $268 | −29% |\n| 8월 3일 | Stifel | 매수 | $508 → $491 | +31% |\n| 7월 27일 | Baird | – | $475 | +27% |\n| 7월 23일 | Mizuho | 시장상회 | $480 → $450 | +20% |\n\n- 2분기 실적 뒤(7월 말~8월) 목표가 '하향'이 많았고, 10월 들어 3분기 판매 호조 뒤 '유지·상향'이 늘었습니다.\n- 댄 아이브스는 이전 회사(웨드부시)에서 목표가 $600를 냈던 대표 강세론자로, 새 회사에서는 $500로 시작했습니다.","insider_title":"내부자·유명인 매매 (2025~)","insider_md":"2025년 이후 내부자의 장내 매수는 2명, 약 10.01억 달러이고 그중 99.9%가 머스크 한 사람의 2025년 9월 12일 매수입니다. 같은 기간 이사·임원 7명은 약 6.1억 달러를 팔았습니다. 현재가는 $375.00 (2026년 10월 8일 종가)입니다.\n\n**내부자 매수 (SEC Form 4 장내 매수 전체)**\n\n| 날짜 | 누가 | 수량 | 매수가 | 금액 | 현재가 대비 |\n|---|---|---|---|---|---|\n| 2025년 9월 12일 | 일론 머스크 (CEO) | 2,568,732주 | 평균 $389.28 ($371.90~396.36, 25건) | 약 10.0억 달러 | −3.7% |\n| 2025년 4월 24일 | 조 게비아 (이사, 에어비앤비 공동창업자) | 4,000주 | $256.31 | 약 103만 달러 | +46.3% |\n\n머스크의 10억 달러 매수는 2020년 이후 첫 장내 매수였고, 발표 다음 거래일(9월 15일) 주가가 크게 올랐습니다. 지금 주가는 그 매수가보다 약간 아래입니다.\n\n**내부자 매도 요약 (2025년 1월~2026년 9월)**\n\n| 누가 | 역할 | 매도 주식 수 | 금액 | 평균 매도가 | 기간 | 사전 계획(10b5-1) |\n|---|---|---|---|---|---|---|\n| 이라 에렌프레이스 | 이사 | 47.8만 주 | 약 1.71억 달러 | $357 | 2025년 5월 27일 하루 | 아니오 |\n| 로빈 덴홀름 | 이사회 의장 | 45.0만 주 | 약 1.40억 달러 | $311 | 2025년 2~5월 | 예 |\n| 제임스 머독 | 이사 | 29.5만 주 | 약 1.07억 달러 | $364 | 2025년 3월~2026년 1월 | 일부 |\n| 킴벌 머스크 | 이사(일론의 동생) | 22.3만 주 | 약 8,590만 달러 | $385 | 2025년 2월~12월 | 일부 |\n| 캐슬린 윌슨-톰슨 | 이사 | 17.8만 주 | 약 7,110만 달러 | $400 | 2025년 1월~2026년 4월 | 예 |\n| 바이브타브 타네자 | CFO | 6.9만 주 | 약 2,370만 달러 | $344 | 2025년 1월~2026년 9월 | 일부 |\n| 주샤오통(톰 주) | 자동차 부문 수장 | 3.5만 주 | 약 1,210만 달러 | $347 | 2025년 6월~9월 | 아니오 |\n| **합계** |  | **약 173만 주** | **약 6.1억 달러** |  |  |  |\n\n이사들의 매도는 대부분 오래전에 받은 스톡옵션을 행사해 바로 파는 형태입니다. 가장 최근에는 CFO가 2026년 9월 8일 $360에 약 2,600주를 팔았습니다.\n\n**대주주 (13G 공시)**\n\n| 보고일 | 누가 | 지분 | 주식 수 |\n|---|---|---|---|\n| 2025년 9월 30일 | 일론 머스크 | 20.3% | 7억 1,732만 주 |\n| 2026년 4월 21일 | 일론 머스크 | 20.3% | 7억 1,711만 주 |\n| 2026년 6월 16일 | 일론 머스크 | 19.9% | 6억 9,958만 주 (약 1,750만 주 감소, 이유는 공시 요약에 없음) |\n| 2026년 3월 31일 | 뱅가드 캐피털 매니지먼트 | 5.61% | 2억 1,080만 주 |\n\n머스크는 2025년 11월 승인된 보상안으로 최대 4억 2,370만 주를 더 받을 수 있습니다(조건 달성 시).\n\n**트럼프 대통령 (OGE 278-T 거래 보고서)**\n\n트럼프의 거래는 외부 운용사가 관리하는 계좌에서 일어났고(상당수 '고객 요청 없이 운용사가 직접' 표시), 금액은 범위로만 공개됩니다. 가격은 공개되지 않아 그 주 종가로 어림잡았습니다.\n\n| 날짜 | 거래 | 금액 범위 | 그 무렵 주가(주간 종가) | 현재가 대비 |\n|---|---|---|---|---|\n| 2026년 7월 27일 | 매수 | 10만~25만 달러 | 약 $311 | 약 +20% |\n| 2026년 7월 17·23·24일 | 매도 3건 | 각 1천~5만 달러 | 약 $313~381 | – |\n| 2026년 6월 15일 | 매수 | 10만~25만 달러 | 약 $406 | 약 −8% |\n| 2026년 5월 11일 | 매도 | 25만~50만 달러 | 약 $428 | (매도 뒤 −12%) |\n| 2026년 4월 9·10일 | 매수 | 50만~100만 + 5만~10만 달러 | 약 $349 | 약 +7% |\n| 2026년 3월 2일 | 매도 | 10만~25만 달러 | 약 $400 | (매도 뒤 −6%) |\n\n그 밖에 4월 27일 매수 2건(최대 30만 달러), 5월 15일 매수·5월 18·22일 매도 등 작은 거래가 양방향으로 여러 건 있습니다. 한쪽으로 모으는 흐름은 아닙니다.\n\n**미국 의회 의원 (2025년 이후)**\n\n- **낸시 펠로시**: 2025~2026년 TSLA 거래 없음(주식·옵션 모두). 그의 TSLA 거래는 2020~2024년입니다.\n- **로 칸나(민주·캘리포니아)**: 가장 자주 거래. 건당 대부분 1천~1.5만 달러. 2026년 8월에는 매도 3건(8월 3·10·24일, 약 $329~363).\n- **앨런 암스트롱(공화·상원)**: 2026년 3월 27·30일 매수 (합계 최대 6.5만 달러, 약 $362) → 현재가 대비 약 +4%.\n- **길버트 시스네로스(민주)**: 2026년 1·4·5월 소액 매수, 3·8월 매도.\n- **마조리 테일러 그린(공화)**: 2025년 1~10월 소액 매수 여러 차례.\n- 모두 건당 수천~수만 달러 수준이라 큰 의미를 두기는 어렵습니다.","next_md":"- **2026년 10월 15일경**: 로드스터 행사. X에는 스페이스X 합병 발표 루머가 있음. 행사 일정·합병 모두 확인 못함\n- **2026년 10월 21일**: 3분기 실적. 자동차 이익률이 16%에서 회복했는지, 잉여현금흐름이 다시 플러스인지, 2026·2027년 설비투자 숫자\n- **3분기 실적 때**: 로보택시 대수·도시 수, 사이버캡 생산 속도, 옵티머스 생산 계획, FSD 구독자 수\n- **수시**: NHTSA의 사이버캡 인증 조사 결과\n- **수시**: 중국 FSD 완전 승인 여부 (회사 목표였던 3분기를 넘김)\n- **수시**: 테슬라–스페이스X 합병 공식 발표 여부, 그리고 합병 비율(테슬라 주주에게 유리한지)\n- **2026년 12월**: EU 자동차 기술위원회(TCMV)의 FSD 유럽 전체 승인 투표 (27개국 중 15개국·인구 65% 찬성 필요)\n- **2027년 1월 초**: 4분기 판매 발표와 2026년 연간 판매 (2025년 대비 증가 여부)\n- **2027년**: AI5 칩 대량 생산, 사이버캡 3만 달러 미만 판매 여부\n- **장기**: 머스크 보상안 첫 단계(시총 2조 달러, 현재 대비 +35%) 달성 여부, 2028년형부터 탄소 크레딧 거래 폐지\n- **매 분기**: 트럼프 OGE 보고서·의원 거래 공시, 이사들의 Form 4 매도","glossary_md":"| 용어 | 뜻 |\n|---|---|\n| FSD (Full Self-Driving) | 테슬라의 자율주행 소프트웨어. 지금은 운전자가 지켜봐야 하는 '감독형(Supervised)' |\n| 로보택시 | 운전사 없이 스스로 달리는 택시 |\n| 사이버캡 | 핸들·페달 없이 로보택시 전용으로 만든 2인승 테슬라 차 |\n| 옵티머스 | 테슬라의 인간형 로봇 |\n| NHTSA | 미국 도로교통안전국. 차의 안전 기준을 정하고 조사하는 정부 기관 |\n| 탄소(규제) 크레딧 | 환경 기준을 넘친 회사가 못 미친 회사에 파는 '통과권'. 기준이 약해지면 값이 떨어짐 |\n| CAFE | 미국의 평균 연비 규제. 못 지키면 벌금을 냈지만 2025년 벌금이 없어짐 |\n| 영업이익률 | 매출 100달러 중 본업으로 남기는 돈. 1.4%면 100달러 팔아 1.4달러 남김 |\n| 잉여현금흐름(FCF) | 벌어들인 현금에서 공장·장비 투자를 뺀 돈. 마이너스면 가진 현금을 쓰는 중 |\n| 설비투자(Capex) | 공장·장비·데이터센터를 사는 데 쓰는 돈 |\n| PER(주가수익비율) | 주가 ÷ 1주당 순이익. 350배는 지금 이익으로 주가를 벌려면 350년 걸린다는 뜻 |\n| Form 4 | 임원·이사가 자기 회사 주식을 사고팔 때 2영업일 안에 SEC에 내는 신고서 |\n| 10b5-1 계획 | 미리 정해 둔 일정대로 자동 매도하는 계획. 내부 정보 거래 의심을 피하려는 장치 |\n| 13G | 회사 지분 5% 이상을 가진 주주가 내는 신고서 |\n| OGE 278-T | 미국 고위 공직자가 주식 거래를 신고하는 서류. 금액은 범위로만 공개 |\n| 예측시장(칼시) | 사건이 일어날지에 돈을 거는 시장. 가격이 곧 확률처럼 읽힘 |","sources":[{"t":"Stock Analysis: TSLA 개요","u":"https://stockanalysis.com/stocks/tsla/"},{"t":"Stock Analysis: TSLA 애널리스트 전망","u":"https://stockanalysis.com/stocks/tsla/forecast/"},{"t":"Stock Analysis: TSLA 분기 재무","u":"https://stockanalysis.com/stocks/tsla/financials/?p=quarterly"},{"t":"Stock Analysis: TSLA 매출","u":"https://stockanalysis.com/stocks/tsla/revenue/"},{"t":"MarketBeat: TSLA 목표가 변경","u":"https://www.marketbeat.com/stocks/NASDAQ/TSLA/forecast/"},{"t":"TeslaNorth: 3분기 판매 486,532대","u":"https://teslanorth.com/2026/10/02/tesla-q3-2026-deliveries/"},{"t":"Mitrade/TradingKey: 2분기 실적 뒤 14% 하락","u":"https://www.mitrade.com/insights/news/live-news/article-8-1931910-20260724"},{"t":"24/7 Wall St: 2분기 판매 후 7% 하락","u":"https://247wallst.com/investing/2026/07/02/tesla-drops-7-despite-blowout-q2-delivery-beat-nio-slips-after-its-own-delivery-update/"},{"t":"CoinCentral: AI5 칩 설계 완료로 7.6% 상승","u":"https://coincentral.com/tesla-tsla-stock-rises-7-6-as-musk-confirms-ai5-chip-design-is-complete/"},{"t":"Tiger: 6월 29일 8% 상승","u":"https://www.itiger.com/hans/news/2647301705"},{"t":"Watcher.Guru: 스페이스X 상장과 테슬라 주가","u":"https://watcher.guru/news/tesla-stock-rises-after-spacex-ipo-fuels-musk-mega-boom"},{"t":"Motley Fool: 테슬라–스페이스X 합병 임박했나","u":"https://www.fool.com/investing/2026/06/22/is-a-tesla-spacex-merger-imminent/"},{"t":"TS2: 6월 5일 6.6% 하락과 JP모건","u":"https://ts2.tech/?p=21079389"},{"t":"Trading Economics: 6월 23일 7주 최저","u":"https://tradingeconomics.com/tsla:us/news/561265"},{"t":"Eastern Progress(AP): NHTSA 사이버캡 조사","u":"https://www.easternprogress.com/us-safety-regulator-probes-teslas-cybercab/article_1a740d01-d02b ","약 6,220만 달러, 빚은 거의 없음 (6월 말)"],["정부 개입","국방물류청(DLA) 2.45억 달러 5년 단독 공급 계약, 국방부 국방생산법(DPA) 보조금 1,280만 달러 수령, 정부 지분 투자 협상 중 (CEO 발언)"],["국방 필수도","높음. 안티모니는 총알·포탄 뇌관, 철갑탄, 야간투시경, 방염재에 들어감. 서반구 유일의 군용 규격 안티모니 잉곳 생산자"],["내부자 동향","2025년 이후 장내 매도 없음. 주가 급락 뒤 8~9월 CEO·이사 4명이 $4.6~5.0에 매수"],["공매도 비율","유통주식의 약 23% (높은 편)"],["애널리스트 평균 목표가","$10.44 (4명, 범위 $9~13.5), 현재가의 약 2.8배"]],"overview_md":"한 줄 판단: 강세론은 '국방 독점 공급자 + 정부 지분 투자 가능성'을, 약세론은 '안티모니 가격 폭락과 실적 부진'을 봅니다. 지금 주가는 약세론 쪽에 훨씬 무게가 실려 있습니다.\n\n#### 기업 개요: 이 회사는 무엇을 하나\n\n1968년에 세워진 오래된 광산 회사입니다. 본사는 텍사스주 댄러스, 직원은 약 100명입니다. 게리 에번스(Gary Evans)가 회장 겸 CEO입니다.\n\n**1. 안티모니란?**\n\n- 은빛을 띠는 금속 원소(Sb)입니다. 다른 금속에 섞으면 단단해지고, 불에 잘 타지 않게 해 줍니다.\n- 쓰임새: 총알·포탄을 터뜨리는 뇌관(프라이머), 철갑탄, 야간투시경, 납축전지, 플라스틱·섬유 방염재, 태양광 유리.\n- 전 세계 안티모니 채굴과 제련의 대부분을 중국이 합니다. 그래서 중국이 수출을 막으면 미국 탄약 생산이 흔들립니다.\n\n**2. 이 회사의 시설**\n\n| 시설 | 위치 | 하는 일 | 규모·상태 (2026년) |\n|---|---|---|---|\n| 톰슨 폴스(Thompson Falls) 제련소 | 미국 몬태나 | 원료를 녹여 순도 높은 안티모니 금속·산화물로 만듦. 미국 유일의 안티모니 제련소 | 증설 후 월 약 230톤 설계 (기존 75톤). 2분기 말 \"거의 완공\" |\n| 마데로(Madero) 제련소 | 멕시코 코아우일라 | 1차 제련 | 원료 월 약 225톤 입고 |\n| 스티브니트 힐(Stibnite Hill) 광산 | 미국 몬태나 | 자체 안티모니 광석 채굴 | 2026년 4월 채굴 재개, 40만 파운드 이상 비축 |\n| 래더스버그(Radersburg) 선광장 | 미국 몬태나 | 광석에서 안티모니를 골라내 농축 | 480만 달러에 인수, 7월 시운전 |\n| 아이다호 습식제련 공장 (JV) | 미국 아이다호 실버밸리 | 약품으로 99.9% 안티모니 추출 | 월 1,000톤 목표, 2028년 완공 목표. USAS 51% : UAMY 49% |\n| 베어리버 제올라이트(BRZ) | 미국 아이다호 | 비료·수처리용 광물 | 2분기 매출 190만 달러 (+110%) |\n| 알래스카·캐나다 광구 | 알래스카, 캐나다 온타리오 | 안티모니·텅스텐 탐사 | 생산 전 단계 |\n\n#### 돈 버는 구조: 원료를 사서 녹여 파는 회사\n\n지금 매출의 대부분은 안티모니 판매입니다. 회사는 해외(볼리비아 등)에서 원료를 사서 몬태나·멕시코에서 녹여 파는 '제련 마진'으로 돈을 벌고, 자체 광산 비중을 늘리는 중입니다.\n\n| 사업 | 2025년 매출 | 2026년 상황 |\n|---|---|---|\n| 안티모니 (민간 판매) | 3,540만 달러 (+219%) | 2분기 판매량 +26%인데 가격이 파운드당 $28.32 → $13.70으로 반토막 |\n| 안티모니 잉곳 (국방부 DLA) | 없음 | 누적 주문 5,730만 달러. 3분기부터 매출 인식 시작 |\n| 제올라이트 | 340만 달러 | 사상 최대 출하 |\n| 라보토(Larvotto) 지분 | 호주 안티모니·금 광산 회사 약 10% 보유 | 8월 기준 시가 약 4,670만 달러 |\n\n**쉽게 비유하면**\n\n- 이 회사는 '원두를 사서 볶아 파는 로스터리'와 비슷합니다. 원두(원료)는 파운드당 $4~6에 사서, 볶은 원두(안티모니)를 시장 가격에 팔아요.\n- 2025년에는 안티모니 가격이 폭등해 매출이 2.6배가 됐습니다. 2026년에는 가격이 반으로 떨어져 같은 양을 팔아도 매출이 줄었습니다.\n- 대신 국방부 납품은 계약 가격이 정해져 있어 시장 가격에 덜 흔들립니다.\n\n**재무 상태**\n\n| 항목 | 2025년 | 2026년 1분기 | 2026년 2분기 |\n|---|---|---|---|\n| 매출 | 3,926만 달러 (+163%) | 680만 달러 | 793만 달러 (예상 2,170만 달러) |\n| 매출총이익률 | 약 25% | 약 16% | 약 7% |\n| 순이익 | −434만 달러 | −1,130만 달러 | +11만 달러 (라보토 평가이익 680만 달러 덕분) |\n| 현금+국채 | 9,130만 달러 (투자금 포함) | 2,370만 달러 | 6,220만 달러 |\n\n- 5월에 평균 $11.57에 주식을 새로 팔아 4,860만 달러를 모았습니다. 지금 주가는 그 가격의 약 3분의 1입니다.\n- 빚은 거의 없습니다 (약 36만 달러).\n\n#### 앞으로의 숫자\n\n- 2026년 매출 가이던스: 3월 1.25억 달러(기존 1억 달러에서 상향) → 8월 11일 6,000만~7,500만 달러로 절반 가까이 하향. 상반기 매출이 1,470만 달러라, 하반기에 4,500만~6,000만 달러를 팔아야 합니다.\n- 3분기 매출: 회사는 국방부 납품만으로 최소 900만~1,000만 달러를 예상했습니다.\n- CEO는 2026년 남은 기간 안티모니 가격을 파운드당 약 $10으로 봅니다 (예전 약 $30).\n- 생산 능력 목표: 톰슨 폴스 월 230톤 + 마데로 + 볼리비아 원료 월 약 150톤 + 아이다호 월 1,000톤(2028년). X에서는 2028년 합계 월 1,750톤이라는 주장이 도는데, 회사 공식 자료에서 이 합계는 확인하지 못했습니다.","gov_md":"미국 정부는 이 회사를 '중국 없이 탄약용 안티모니를 구하는 통로'로 씁니다. 국방부(트럼프 정부에서는 '전쟁부, DoW'라고 부름)의 핵심광물 목록에서 안티모니가 1순위라고 CEO는 말합니다.\n\n| 목적 | 정부가 한 일 | 이 회사의 역할 |\n|---|---|---|\n| 국방 비축물자 채우기 | 2025년 9월 23일 국방물류청(DLA)이 최대 2.45억 달러, 5년 단독 공급 계약(IDIQ) 체결 | 국가국방비축물자에 순도 99.6% 이상 안티모니 잉곳 납품. 서반구 유일 생산자 |\n| 제련 능력 키우기 | 국방생산법(DPA) 3장 보조금 총 2,700만 달러 배정 (2026년 3월 5일 발표, 톰슨 폴스 2,000만, 알래스카 700만, 회사 부담 390만). 2026년 4월 1,280만 달러 수령 | 몬태나 제련소를 월 75톤에서 약 230톤으로 증설 |\n| 추가 보조금 | 에너지부·전쟁부에 약 2.74억 달러 보조금 4건 신청 (습식제련 4,400만, 텅스텐 1.05억 등) | 결과 미정 |\n| 정부 지분 투자 | 8월 11일 실적 발표에서 CEO가 \"정부가 보조금 대신 지분 투자 쪽으로 기울고 있다\"고 발언 | 협상 중. \"기존 주주에게 이로운 조건이어야 한다\"는 입장 |\n| 최저가격 보장 | CEO가 파운드당 약 $20 최저가격을 예시로 제안 (4월 인터뷰) | 실제 제도는 아직 없음 |\n\n**DLA 잉곳 납품 현황 (2026년 8월 11일 발표)**\n\n| 트럭 | 양 | 금액 | 상태 |\n|---|---|---|---|\n| 1·2호 | 약 8.2만 파운드 | 약 260만 달러 | 6월 납품, 7월 승인 (3분기 매출) |\n| 3·4호 | 약 8.1만 파운드 | 약 260만 달러 | 운송 중 |\n| 5·6·7호 | 약 12.6만 파운드 | 약 397만 달러 | 검사 대기, 4분기 출하 예상 |\n| 누적 주문 | – | 5,730만 달러 | 2026년 안 완료 목표 (정부 승인에 달림) |\n\n- 주의: IDIQ는 '최대' 금액 계약입니다. 2.45억 달러를 모두 사주겠다는 보장이 없고, 실제 주문은 지금까지 5,730만 달러입니다.\n- 9월 30일 회사는 \"창사 후 약 60년 만에 처음으로 군에 완제품을 본격 납품 중\"이라고 밝혔습니다. 다만 3분기 납품량·금액은 공개하지 않았습니다.\n\n**미·중 경쟁과의 연결**\n\n- 중국은 세계 안티모니 공급의 약 80%, 제련의 약 90%를 잡고 있다고 CEO는 말합니다. 러시아·타지키스탄도 주요 생산국입니다.\n- 중국은 2024년 9월 안티모니 수출을 허가제로 묶고, 2024년 12월에는 미국으로의 수출을 아예 금지했습니다. 이 때문에 안티모니 가격이 파운드당 $4~5에서 약 $30까지 올랐습니다.\n- 2025년 11월 9일 미·중 합의 뒤 중국이 미국행 수출 금지를 **2026년 11월 27일까지 유예**했습니다. 다만 수출 허가제와 '미국 군 사용자행 금지'는 그대로입니다.\n- 유예 이후 가격이 떨어져 이 회사 매출에 타격을 주었습니다. CEO는 \"가격은 틀림없이 중국이 조작한 것\"이라고 말합니다.\n- 11월 27일 유예가 끝날 때 중국이 연장할지, 다시 막을지가 안티모니 가격과 이 회사 주가의 큰 변수입니다.\n\n**동맹·공급망 재구성**\n\n- 원료는 볼리비아(협력사 습식제련 공장, 월 약 150톤 목표), 멕시코, 호주(라보토 지분 10%)처럼 중국 밖에서 구합니다.\n- 미국 안에서는 몬태나 자체 광산과 아이다호 합작 공장으로 '광산부터 금속까지'를 미국에서 하는 것이 목표입니다.\n- 같은 안티모니 분야에서 퍼페튜아 리소스(PPTA)의 아이다호 스티브니트 광산도 정부 지원을 받지만, 생산은 2029년 전후로 예상됩니다 (X 게시물 기준).","gov_title":"정부가 이 회사를 쓰는 방법","events":[{"date":"2026-10-08","title":"핵심광물주 동반 약세","detail":"희토류·핵심광물주 동반 약세","move":"−4%, 연중 최저 $3.72"},{"date":"2026-10-07","title":"Texas Capital 매수","detail":"Texas Capital 신규 '매수', 목표가 $9.50","move":"반응 없음"},{"date":"2026-10-05","title":"52주 신저가","detail":"52주 신저가. 2026년 전망 하향과 중국 수출 유예 종료(11/27) 우려가 X에서 거론","move":"주간 $4.50 → $3.99"},{"date":"2026-09-30","title":"3분기 납품 업데이트","detail":"3분기 국방부 납품 업데이트. 볼리비아 원료 도착, 몬태나 광석 40만 파운드 비축. 납품 금액은 미공개. 같은 날 CFO 교체(리처드 아이작 해임, 숀 윙클러 정식 선임)","move":"반응 약함"},{"date":"2026-08-28","title":"CEO·이사 장내 매수","detail":"CEO 2만 주($4.92), 이사 3명 등 장내 매수 (약 30만 달러)","move":"일시 반등 ($5.20) 후 다시 하락"},{"date":"2026-08-25","title":"스티브니트 힐 성과","detail":"몬태나 스티브니트 힐 채굴 성과 발표 (광석 운반 2배)","move":"영향 작음"},{"date":"2026-08-19","title":"1억 달러 자사주","detail":"최대 1억 달러 자사주 매입 승인. \"주가가 저평가\"라고 이사회 판단","move":"장중 +9%"},{"date":"2026-08-12","title":"2분기 실적 쇼크","detail":"2분기 매출 790만 달러 (예상 2,170만 달러), 2026년 매출 전망 1.25억 → 6,000만~7,500만 달러로 하향","move":"**−24.5% ($4.97)**, 거래량 평소의 3배"},{"date":"2026-08-05","title":"자체 광산 원료 사용","detail":"\"2026년 처음으로 자체 광산 원료 사용\" 업데이트","move":"+4.3%"},{"date":"2026-07-01","title":"7월 납품·시운전","detail":"국방부 납품 업데이트(7/1), 래더스버그 선광장 시운전(7/7)","move":"월간 $7.43 → $5.07"},{"date":"2026-06-12","title":"주주총회 증자 한도","detail":"주주총회: 발행 가능 주식 수 2.5억 → 5억 주로 확대 승인","move":"주간 $7.71 → $7.04"},{"date":"2026-05-14","title":"1분기 실적·증자","detail":"1분기 실적: 매출 680만 달러, 순손실 1,130만 달러. 주당 $11.57에 4,860만 달러 증자","move":"주간 −19% ($10.66 → $8.61)"},{"date":"2026-05-06","title":"연중 최고가","detail":"연중 최고가. 같은 날 CFO 휴직, 임시 CFO 선임 발표","move":"$12.61 (최고)"},{"date":"2026-04-30","title":"4월 말 급등","detail":"회사 발표 없음. 원인 확인 못함","move":"+20.3% ($12.01)"},{"date":"2026-04-02","title":"스티브니트 힐 재개","detail":"몬태나 스티브니트 힐 채굴 재개","move":"주간 횡보"},{"date":"2026-03-19","title":"2025년 실적 발표","detail":"2025년 실적: 매출 3,926만 달러(+163%), 2026년 1.25억 달러 전망 유지","move":"주간 −11%"},{"date":"2026-03-16","title":"3월 16일 급등","detail":"실적 발표일 공지 외 회사 발표 없음. 원인 확인 못함","move":"+19.1% ($10.98)"},{"date":"2026-03-10","title":"DPA 지원·NYSE 이전","detail":"국방부 국방생산법(DPA) 2,700만 달러 지원 발표(3/5) + NYSE 본시장 이전 승인(3/6, 3/11부터 거래)","move":"+17.0% ($11.23), 거래량 2,100만 주 이상"},{"date":"2026-03-02","title":"3월 2일 급등","detail":"회사 발표 없음. 원인 확인 못함","move":"+19.1% ($10.65)"},{"date":"2026-02-24","title":"B. Riley 목표가 상향","detail":"B. Riley 목표가 $9 → $11 상향 (아이다호 JV 근거)","move":"장중 최대 +7.9%"},{"date":"2026-02-10","title":"아이다호 JV 발표","detail":"아메리카스 골드앤실버(USAS)와 아이다호 습식제련 합작 발표","move":"주간 −11%"},{"date":"2026-02-03","title":"핵심광물 비축 계획","detail":"2월 2일 미국 정부의 120억 달러 핵심광물 비축 계획 'Project Vault' 발표 직후 핵심광물주 동반 급등. UAMY 등락을 직접 다룬 기사는 확인 못함","move":"+22.8% 뒤 다음 날 −16.4%"},{"date":"2026-01-28","title":"볼리비아 투자 공개","detail":"볼리비아 습식제련 시설에 2025년부터 투자해 왔다고 공개","move":"같은 주 $10.85 → $7.33 (연결 여부 확인 못함)"},{"date":"2026-01-20","title":"래더스버그 인수","detail":"몬태나 래더스버그 선광장 475만 달러 현금 인수","move":"주간 $8.29 → $10.85"},{"date":"2026-01-02","title":"새해 첫 거래일 급등","detail":"회사 발표 없음. 원인 확인 못함 (새해 첫 거래일)","move":"+18.1% ($5.93)"}],"chart_events":["2026-02-03","2026-03-10","2026-05-06","2026-05-14","2026-08-12","2026-10-08"],"bull":["**국방부 독점 공급자** 국방물류청(DLA)과 최대 2.45억 달러, 5년 단독 계약. 지금 시가총액(약 5.6억 달러)의 약 44%에 해당하는 크기입니다. 누적 주문 5,730만 달러, 3분기에만 최소 900만~1,000만 달러 국방부 매출을 회사가 예상했습니다. 회사는 '서반구 유일의 군용 규격 안티모니 잉곳 생산자'라고 말합니다.","**정부 지분 투자 가능성** CEO는 8월 실적 발표에서 \"정부가 보조금보다 지분 투자 쪽으로 기운다\"고 말했습니다. X에서는 CEO가 방송에서 '5억 달러 이상 규모, 지분·최저가격·워런트·장기구매·대출 묶음'을 언급했다는 글이 돌았습니다 (회사 공식 자료로는 확인 못함). 정부가 MP머티리얼즈·리튬아메리카스 등에 지분을 넣었던 흐름과 같습니다.","**싸 보이는 가격과 튼튼한 금고** 현금+국채 6,220만 달러, 빚은 거의 없음. 라보토 지분(약 4,670만 달러)까지 더하면 1억 달러가 넘어 시가총액의 약 5분의 1입니다. 최대 1억 달러 자사주 매입 승인 (8월 19일). 애널리스트 평균 목표가 $10.44는 현재가의 약 2.8배입니다.","**원가가 낮아지는 중** 몬태나 자체 광산 광석(40만 파운드 이상 비축)은 사 오는 원료보다 마진이 약 3배라고 CEO는 말합니다. 원료는 파운드당 $4~6에 사오기 때문에, 가격이 $10이어도 남는 장사라는 주장입니다.","**중국 리스크가 다시 커질 수 있음** 중국의 미국행 수출 금지 유예가 11월 27일 끝납니다. 다시 막히면 2024~2025년처럼 안티모니 가격이 뛸 수 있습니다.","**내부자 매수** 주가가 떨어진 8~9월 CEO와 이사 3명이 장내에서 샀고, 2025년 이후 장내 매도는 없습니다."],"bear":["**안티모니 가격 폭락** 평균 판매가가 파운드당 $28.32 → $13.70으로 52% 떨어졌고, CEO는 남은 2026년 가격을 약 $10으로 봅니다. 매출총이익률이 27% → 7%로 줄었습니다. 2분기 흑자(11만 달러)도 라보토 주식 평가이익 덕분이었습니다.","**약속을 못 지킨 가이던스** 2026년 매출 전망을 1억 → 1.25억 달러로 올렸다가 8월에 6,000만~7,500만 달러로 내렸습니다. 상반기 매출이 1,470만 달러라 하반기에 3~4배를 팔아야 합니다. 2분기 매출은 예상(2,170만 달러)의 약 3분의 1이었습니다.","**'최대 2.45억 달러'는 보장이 아님** IDIQ 계약이라 정부가 최소 구매량을 약속하지 않았습니다. 실제 주문은 5,730만 달러이고, 납품도 검사·승인 일정에 따라 밀립니다.","**주식 희석** 2026년 상반기에만 약 4,900만 달러어치 새 주식을 팔았습니다 (5월 평균 $11.57). 정부 지분 투자도 새 주식 발행이라 기존 주주 몫이 줄 수 있습니다. 6월 12일 주주총회에서 발행 가능 주식 수를 2.5억 주에서 5억 주로 늘리는 안도 통과됐습니다.","**공매도와 비싼 기대** 공매도가 유통주식의 약 23%로 높습니다. 2026년 예상 이익 기준 주가수익비율(PER)도 약 35배입니다.","**실행 위험** 톰슨 폴스 증설은 당초 5월 → 7월 → 3분기로 완전 가동이 늦어졌습니다. 아이다호 공장(월 1,000톤)은 2028년 목표라 멀리 있습니다. 정부 보조금 신청 약 2.74억 달러는 아직 결과가 없습니다."],"analysts_md":"증권사는 대부분 '매수'이고 평균 목표가는 현재가의 2.5~2.8배입니다. 하지만 담당 애널리스트가 4~5명뿐이고, 최근 90일 동안 나온 보고서는 2개뿐입니다. 대부분 주가가 훨씬 높을 때 정한 목표가입니다.\n\n| 날짜 | 증권사 | 의견 | 목표가 | 현재가 대비 |\n|---|---|---|---|---|\n| 2026년 10월 7일 | Texas Capital (매튜 키) | 매수 (신규) | $9.50 | +155% |\n| 2026년 9월 14일 | Weiss Ratings | 매도 (D−) | – | – |\n| 2026년 8월 13일 | William Blair | 매수 유지 | – | – |\n| 2026년 8월 12일 | HC Wainwright | 매수 유지 | $11.75 → $9.25 (하향) | +149% |\n| 2026년 5월 15일 | Alliance Global Partners | 매수 유지 | $14 | +276% |\n| 2026년 3월 24일 | B. Riley | 매수 | $11 → $13 (상향) | +249% |\n| 2026년 2월 24일 | B. Riley | 매수 | $9 → $11 (상향) | – |\n| 2025년 10월 20일 | William Blair | 시장수익률 상회 (신규) | – | – |\n| 컨센서스 | MarketBeat 5명 / StockAnalysis·Yahoo 4명 | 매수 4, 매도 1 | $10.13 / $10.44 | +172% / +181% |","insider_title":"내부자·유명인 매매 (2025년 이후)","insider_md":"2025년 이후 내부자의 장내 매수는 6건, 약 100만 달러이고, 장내 매도는 0건입니다. 다만 모든 매수가 지금 주가보다 비싼 값이었습니다. 현재가는 $3.72 (2026년 10월 8일 종가)입니다.\n\n**내부자 매수 (SEC Form 4 장내 매수 전체)**\n\n| 날짜 | 누가 | 역할 | 수량 | 매수가 | 금액 | 현재가 대비 |\n|---|---|---|---|---|---|---|\n| 2026년 9월 1일 | 로이드 바즈위치 | 이사, 채광 총책임 EVP | 20,000주 | $4.64 | 약 9.3만 달러 | −19.7% |\n| 2026년 9월 1일 | 조셉 카라바 | 사외이사 (전 클리블랜드클리프스 회장·CEO) | 21,300주 | $4.72 | 약 10.1만 달러 | −21.2% |\n| 2026년 8월 31일 | 블레이즈 아기레 | 사외이사 (하버드 의대 정신과 교수) | 1,400주 | $5.04 | 약 0.7만 달러 | −26.1% |\n| 2026년 8월 28일 | 게리 에번스 | 회장 겸 CEO | 20,000주 | $4.92 | 약 9.8만 달러 | −24.4% |\n| 2026년 6월 15일 | 존 마리넬리 | 사외이사 (투자사 1042 Capital 대표) | 12,500주 | $7.45 | 약 9.3만 달러 | −50.1% |\n| 2025년 9월 26일 | 게리 에번스 | 회장 겸 CEO | 100,000주 | $6.13 | 약 61.3만 달러 | −39.3% |\n\n**내부자 매도**\n\n- 2025년 이후 Form 4 장내 매도(코드 S)는 없습니다. 10b5-1(미리 정해 둔 자동 매매) 계획에 따른 매수도 없이 모두 직접 매수였습니다.\n- 대신 회사는 2026년 상반기 임직원 주식 보상의 세금을 내기 위해 약 778만 달러어치 주식을 돌려받았습니다 (장내 매도는 아님).\n\n**읽는 법**\n\n- CEO는 2025년 9월 $6.13, 2026년 8월 $4.92에 샀고, 두 번 모두 지금 기준 손실입니다. 내부자도 바닥을 맞히지는 못했습니다.\n- 그래도 주가가 떨어지는 동안 아무도 팔지 않았다는 점은 보통 좋은 신호로 봅니다.\n- 다만 금액은 작습니다. 8~9월 매수 합계 약 30만 달러는 시가총액 5.6억 달러의 0.05%입니다.\n- 회사는 5월에 평균 $11.57에 새 주식을 팔았는데, 지금은 그보다 −68%입니다. 그때 산 기관은 큰 손실입니다.\n\n**유명인·유명 펀드**\n\n- 의회: Quiver Quantitative 기준 UAMY의 의회 의원 거래 기록은 없습니다 (펠로시 포함). Capitol Trades는 접속 차단(403)으로 확인 못함.\n- 트럼프: 2025년 8월~2026년 9월에 낸 거래 보고서(OGE 278-T) 19건 전부에서 UAMY 거래가 없습니다.\n- 미국 정부: 아직 지분이 없습니다. 지분 투자 협상이 타결되면 그때의 가격이 새로운 기준점이 됩니다.\n- 와이오밍주: 2026년 2분기 13F(8월 6일 제출)에서 신규 보유 확인. 13,693주, 6월 30일 평가액 약 9.9만 달러(주당 약 $7.26)로, 지금은 그보다 약 −49%입니다. 1분기에는 없었고, 금액은 아주 작습니다.\n- 2025년 10월 '대형 뮤추얼펀드' 한 곳이 약 2,500만 달러 직접 증자에 참여했습니다 (펀드명·가격 미공개).\n\n**대주주 신고 (13G, 5% 이상 보유)**\n\n13G에는 매수 가격이 없어서, 기준일이 속한 분기의 주간 종가 범위와 비교했습니다.\n\n| 신고일 | 기관 | 지분 | 주식 수 | 기준일 | 그 분기 주가 범위 → 현재가 대비 |\n|---|---|---|---|---|---|\n| 2026년 8월 7일 | 스테이트스트리트 | 7.7% | 1,134만 주 (12월 말 767만 주에서 +367만 주) | 2026년 6월 30일 | $6.97~12.15 → −47~−69% |\n| 2026년 8월 14일 | T. Rowe Price | 6.8% | 1,003만 주 (신규) | 2026년 6월 30일 | $6.97~12.15 → −47~−69% |\n| 2026년 8월 14일 | 반에크 (VanEck) | 5.8% | 856만 주 (3월 말 1,037만 주에서 −181만 주) | 2026년 6월 30일 | $6.97~12.15 → −47~−69% |\n| 2026년 4월 27일 | 블랙록 | 6.5% | 934만 주 | 2026년 3월 31일 | $5.93~10.85 → −37~−66% |\n| 2026년 1월 30일 | 뱅가드 | 5.31% | 744만 주 | 2025년 12월 31일 | 확인 못함 |\n\n- X에 돈 '스테이트스트리트 1,134만 주' 주장은 13G로 확인됐습니다.\n- 뱅가드는 2026년 3월 '뱅가드 그룹 0%' 신고를 냈는데, 회사 내부 조직 개편에 따른 신고로 보입니다. 보유 데이터 사이트에는 뱅가드 캐피털 매니지먼트가 약 552만 주로 나옵니다.","next_md":"| 시기 | 확인할 것 | 왜 중요한가 |\n|---|---|---|\n| 2026년 11월 11일 전후 (StockAnalysis 추정, 회사 미발표) | 3분기 실적 | 국방부 매출 900만~1,000만 달러 달성 여부, 매출총이익률 회복 여부 |\n| 2026년 11월 27일 | 중국의 미국행 안티모니 수출 금지 유예 종료 | 연장되면 가격 약세 지속, 다시 막히면 가격 급등 가능 |\n| 2026년 4분기 | DLA 5·6·7호 트럭(약 400만 달러) 출하, 주문 5,730만 달러 완료 속도 | 6,000만~7,500만 달러 연간 전망 달성의 열쇠 |\n| 수시 | 정부 지분 투자 협상 타결 여부 | 규모·가격·최저가격 보장 포함 여부가 희석과 주가를 좌우 |\n| 수시 | 자사주 1억 달러 중 실제 매입액 | 승인만 하고 안 사는 경우도 많음. 3분기 보고서에서 확인 |\n| 수시 | 에너지부·전쟁부 보조금 신청(약 2.74억 달러) 결과, 남은 DPA 800만 달러 수령 | 주식 발행 없이 증설 자금 확보 |\n| 2026년 하반기 | 톰슨 폴스 9개 로 전부 가동 (월 약 230톤) | 납품 속도와 원가 |\n| 2026년 하반기 | 몬태나 자체 광석(40만 파운드) 처리 | 마진 3배 주장이 숫자로 확인되는지 |\n| 2026~2028년 | 아이다호 습식제련 JV 착공·자금 | 월 1,000톤 목표가 현실이 되는지 |\n| 상시 | 안티모니 국제 가격 (CEO 예상 파운드당 약 $10) | 매출과 이익에 가장 직접적인 변수 |","glossary_md":"| 용어 | 뜻 |\n|---|---|\n| 안티모니 (Sb) | 탄약 뇌관, 방염재, 납축전지에 쓰는 금속. 중국이 공급을 주도 |\n| 제련소 | 광석·원료를 녹여 순수한 금속을 뽑는 공장 |\n| 습식제련 (하이드로멧) | 불 대신 약품(물에 녹인 용액)으로 금속을 뽑는 방식 |\n| 잉곳 | 녹인 금속을 틀에 부어 굳힌 덩어리 |\n| DLA | 국방물류청. 미군의 물자 구매와 국가국방비축물자 관리를 맡음 |\n| IDIQ 계약 | '최대 금액'만 정하고 실제 양은 주문할 때마다 정하는 계약 |\n| DPA 3장 | 국방생산법. 국방에 필요한 공장을 정부가 돈으로 지원하는 근거 |\n| 가이던스 | 회사가 스스로 밝힌 앞으로의 실적 전망 |\n| 매출총이익률 | (매출 − 원가) ÷ 매출. 물건 하나 팔아 남는 비율 |\n| 희석 | 새 주식을 찍어 기존 주주의 지분 비율이 줄어드는 것 |\n| 자사주 매입 | 회사가 자기 주식을 사들여 주식 수를 줄이는 것 |\n| 공매도 비율 | 주가 하락에 돈을 건 주식이 유통주식 중 얼마인지. 높을수록 비관론이 많음 |\n| Form 4 / 13F | 내부자 매매 신고서 / 대형 펀드의 분기별 보유 주식 신고서 |","sources":[{"t":"SEC 8-K: 2026년 2분기 실적 보도자료 (8월 11일)","u":"https://www.sec.gov/Archives/edgar/data/0000101538/000110465926094130/tm2622899d1_ex99-1.htm"},{"t":"SEC 8-K: 2026년 2분기 실적 발표 대본","u":"https://www.sec.gov/Archives/edgar/data/0000101538/000110465926097708/tm2622899d2_ex99-1.htm"},{"t":"SEC 8-K: 2026년 1분기 실적 보도자료 (5월 14일)","u":"https://www.sec.gov/Archives/edgar/data/0000101538/000110465926061217/tm2614673d1_ex99-1.htm"},{"t":"SEC 8-K: 2026년 1분기 실적 발표 대본","u":"https://www.sec.gov/Archives/edgar/data/0000101538/000110465926062742/tm2614820d1_ex99-1.htm"},{"t":"SEC 8-K: 2025년 연간 실적 (3월 19일)","u":"https://www.sec.gov/Archives/edgar/data/101538/000110465926032050/tm269168d1_ex99-1.htm"},{"t":"24/7 Wall St.: 2026 전망 하향 뒤 25% 급락 (8월 12일)","u":"https://247wallst.com/investing/2026/08/12/united-states-antimony-plummets-25-after-slashing-2026-guidance-on-plunging-antimony-prices/"},{"t":"Mugglehead: 매출 미달·전망 하향으로 25% 하락","u":"https://mugglehead.com/united-states-antimony-drops-25-on-missed-revenue-target-and-slashed-guidance/"},{"t":"Stocktwits: 1억 달러 자사주 매입 (8월 19일)","u":"https://stocktwits.com/news-articles/markets/equity/united-states-antimony-launches-100-m-buyback-program-here-s-what-triggered-the-move/cZYdZxdRJla"},{"t":"Finviz/ACCESSWIRE: 3분기 국방부 납품 업데이트 (9월 30일)","u":"https://finviz.com/news/396971/united-states-antimony-corporation-provides-third-quarter-update-on-antimony-shipments-to-the-dow"},{"t":"Benzinga: 2.45억 달러 국방 비축 계약 (2025년 9월 23일)","u":"https://benzinga.com/z/47828853"},{"t":"Mugglehead: 2.45억 달러 국방부 계약","u":"https://mugglehead.com/us-antimony-surges-after-landing-us245m-pentagon-supply-contract/"},{"t":"Mining.com: 아이다호 JV (2월 10일)","u":"https://www.mini 븀(Tb)은 양이 적어 더 귀합니다.\n- 이것으로 만드는 **NdFeB 자석**(네오디뮴·철·붕소 자석)은 세상에서 가장 강한 자석입니다. 전기차 모터, 로봇, 드론, 미사일, 데이터센터 냉각팬에 들어갑니다.\n- 전 세계 희토류 자석의 대부분(약 90%)을 중국이 만듭니다. 그래서 미국은 '자기 땅에서 만드는 자석'을 원합니다.\n\n**2. 이 회사가 가진 것 (광산부터 자석까지)**\n\n| 단계 | 자산 | 어디 | 지금 상태 |\n|---|---|---|---|\n| 광산 (원료) | 세라 베르데 펠라 에마 광산 | 브라질 고이아스 | 2026년 9월 3일 인수 완료. 아시아 밖 유일한 대규모 4대 자석용 희토류 생산 광산 |\n| 광산 (원료) | 라운드톱 광상 | 미국 텍사스 | 타당성 조사 중, 2028년 말 상업 생산 목표. 8월 파트너(TMRC) 인수로 100% 확보 |\n| 분리·정제 | 휘트리지 시범 공장 | 미국 콜로라도 | 2026년 6월 가동, 디스프로슘·NdPr 산화물 샘플 생산 |\n| 금속·합금 | LCM (Less Common Metals) | 영국 체셔, 프랑스 락(계획) | 2025년 인수. 현재 매출의 대부분. 4월 이트륨 금속 첫 생산 |\n| 자석 | 스틸워터 공장 | 미국 오클라호마 | 2026년 3월 1단계 시운전, 연말 연 600톤 목표. 아직 자석 판매 없음 |\n| 자석 (다음) | 블랙스버그 공장 | 미국 사우스캐롤라이나 | 9월 착공, 2028년 가동 목표 (자석 연 6,400톤) |\n\n**3. 1년에 CEO가 세 번**\n\n- 조쉬 밸러드(상장 당시 CEO, 2025년 9월까지) → 바버라 험프턴(2025년 9월 29일 발표, 10월 1일 취임, 전 지멘스 USA CEO) → 트라스 모라이티스(2026년 10월 1일, 전 세라 베르데 CEO, 전 엑스트라타 임원).\n- 7월 20일 발표 때 의장 마이클 블리처(스팩 인플렉션 포인트 대표)가 실권을 가진 '집행 의장'이 됐습니다.\n- 새 CEO가 브라질 광산 출신이라 '광산 운영 중심' 회사로 바뀔 수 있다는 해석과, 잦은 교체가 불안하다는 해석이 나뉩니다.\n\n#### 돈 버는 구조: 지금은 영국 금속, 앞으로는 브라질 광산과 미국 자석\n\n지금 매출은 거의 모두 영국 LCM이 다른 회사에 파는 희토류 금속·합금에서 나옵니다. 2분기 매출 580만 달러는 원가(740만 달러)보다도 작아, 팔수록 손해입니다.\n\n| 분기 | 매출 | 조정 순손실 (주당) | 영업현금 유출 | 현금 |\n|---|---|---|---|---|\n| 2026년 1분기 (5월 13일 발표) | 570만 달러 | −2,410만 달러 (−$0.12) | − | 약 17.5억 달러 |\n| 2026년 2분기 (8월 10일 발표) | 580만 달러 (예상치 하회. 예상치는 출처마다 다름: X 보도 710만, AllInvestView 804만 달러) | −3,350만 달러 (−$0.15, 예상 −$0.09(X 보도)~−$0.11(AllInvestView)) | −5,690만 달러 | 약 15.3억 달러 |\n\n**쉽게 비유하면**\n\n- 이 회사는 아직 '가게 문을 열기 전'입니다. 주주와 정부에게 받은 돈(약 15억 달러)으로 광산·공장을 사고 짓는 중입니다.\n- 브라질 광산은 이미 운영 중이었고, 9월부터 실적에 합쳐집니다. 그래서 3분기부터 매출이 크게 달라질 수 있습니다.\n- 스틸워터 자석은 연말에 첫 판매를 목표로 합니다. 고객 100곳 이상과 대화 중이고, 20곳 이상이 품질 시험(인증) 중입니다.\n\n**인수 비용과 희석**\n\n- 세라 베르데 인수가는 약 28억 달러입니다. 현금 3억 달러와 신주 1.268억 주를 줬습니다. 지금 발행주식(약 3.75억 주)의 약 34%가 이 인수로 새로 생긴 주식입니다.\n- 1월에는 $21.50에 신주 약 6,980만 주를 팔아 15억 달러를 모았습니다 (PIPE).\n\n#### 앞으로의 숫자 (회사 목표)\n\n| 항목 | 목표 | 시기 |\n|---|---|---|\n| 스틸워터 자석 생산 능력 | 연 600톤 → 1,200톤 | 2026년 4분기 → 2027년 1분기 |\n| LCM 영국 금속·합금 | 연 3,000톤 | 2026년 4분기 |\n| 세라 베르데 희토류 산화물 | 연 4,000톤 → 6,400톤 | 2026년 말 → 2027년 말 |\n| 세라 베르데 연간 EBITDA | 5.5억~6.5억 달러 (연환산) | 2027년 말 |\n| 미국 내 자석 총량 (스틸워터+블랙스버그) | 연 1만 톤 | 2028년 이후 |\n| 라운드톱 최종 타당성 조사 | 완료 4분기, 공개 2027년 1분기 | 상업 생산 2028년 말 |\n| 회사 장기 목표 | 매출 26억 달러, 자유현금흐름 9억 달러 | 2030년 |\n\n월가 증권사들은 흑자를 2028년 이후, 현금흐름 흑자를 2029년 이후로 봅니다 (S&P 글로벌, 5월 기준).","gov_md":"트럼프 행정부는 이 회사를 '미국판 희토류 자석 공장'으로 키우려 합니다. 돈을 빌려주는 데 그치지 않고 직접 주주가 됐다는 점이 핵심입니다. 목표는 중국이 희토류 수출을 막아도 미국 무기·공장이 멈추지 않게 하는 것입니다.\n\n| 날짜 | 정부가 한 일 | 금액·조건 |\n|---|---|---|\n| 2026년 1월 26일 | 상무부 CHIPS 프로그램 의향서(LOI) 발표 | 최대 16억 달러 = 보조금 2.77억 + 선순위 담보대출 13억 (15년, 금리 국채+1.5%p) |\n| 같은 날 | 정부가 주주가 됨 | 보조금 2.77억 달러만큼 $17.17에 약 1,610만 주. 대출에 따라 워런트 약 1,750만 주(행사가 $17.17, 10년). 지분 약 8~16% (상장 시 '약 10%'로 보도) |\n| 2026년 6월 | 상무부와 본계약 체결 | 돈은 한 번에 주지 않고 라운드톱·정제·금속·자석 단계별 목표를 달성할 때마다 지급. 2년 넘게 늦으면 환수 가능 |\n| 2026년 8월 24일 | 전쟁부(옛 국방부)가 세라 베르데 희토류를 사 줄 특수목적회사(SPV)에 출자 | 7.5억 달러 + 은행 대출 최대 5억 = 15.5억 달러. 15년간 1단계 생산량 100% 구매, 디스프로슘·테르븀 최저가격 보장 |\n| 같은 발표 | 정부 선도 구매 계약 | 5년간 최소 3억 달러어치 희토류 제품 구매 |\n| 2026년 | 텍사스주 반도체 혁신기금, 에너지부(DOE) | 라운드톱 보조금 최대 1,420만 달러, DOE 분리 기술 과제 최대 1,930만 달러(협상 중) |\n| 2026년 2월 2~3일 | 120억 달러 규모 핵심광물 비축 계획 '프로젝트 볼트' 발표 | 희토류 등 50여 광물을 정부가 쌓아둠. 미국 내 생산자에 수요를 만들어 줌 (USAR 당일 +17%) |\n\n**미·중 경쟁과의 연결**\n\n- 중국은 2025년 4월과 10월 희토류 수출을 조였고, 2026년 6월 말에는 USAR과 MP 머티리얼즈를 기술 수출 제한 명단에 올렸습니다. 중국이 '경쟁 상대'로 찍었다는 뜻입니다.\n- 7월 나바로 무역 고문은 \"중국이 미국에 희토류 자석을 공급하지 않고 있다\"고 말했고, 트럼프는 7월 15일 펜실베이니아 국방·혁신 서밋에서 \"자석을 만들어라(Do magnets)\"고 말했습니다. \"문제는 가공\" 발언은 X에서 공유됐지만 원문은 확인 못함.\n- 미국 국방부는 2027년 1월 1일부터 무기에 중국산 희토류 자석 사용을 제한합니다. 미국산 자석 수요가 제도로 생기는 셈입니다.\n\n**동맹국과의 공급망 (리쇼어링)**\n\n- 브라질(세라 베르데 광산) → 영국·프랑스(LCM 금속) → 미국(자석)으로 이어지는 '중국 밖 공급망'입니다.\n- 프랑스 정부와는 락(Lacq) 금속·합금 공장(1.75억 유로 이상, 2030년까지 300명 이상 고용)을 협력하고, 프랑스 희토류 분리회사 카레스터 지분 약 13.6%를 사기로 했습니다.\n\n**다른 회사들과 비교**\n\n- MP 머티리얼즈: 국방부가 지분 + NdPr 최저가격(kg당 $110) 보장. USAR도 지분 + (브라질 광산) 최저가격이라 비슷한 틀입니다.\n- 다만 정부의 매입가 $17.17보다 현재가($12.63)가 약 26% 낮습니다. 정부도 지금은 평가손입니다.\n- 대출은 단계별 목표 달성이 조건이라, 공장·광산이 늦어지면 돈도 늦게 들어옵니다. 그래서 실행력이 가장 중요합니다.\n\n출처: [SEC 8-K (2026년 1월 26일, 상무부 LOI 조건)](https://www.sec.gov/Archives/edgar/data/1970622/000121390026007457/ea0274031-8k_usarare.htm), [Pulse 2.0: 15.5억 달러 SPV](https://pulse2.com/usa-rare-earth-secures-1-55-billion-capitalization-for-government-backed-serra-verde-rare-earth-spv/)","gov_title":"정부가 이 회사를 쓰는 방법","events":[{"date":"2026-10-08","title":"AIA 경고·연중 최저","detail":"2026년 들어 처음 $12대 진입. 120억 달러 비축 계획 '프로젝트 볼트'가 희토류 가격을 흔들 수 있다는 항공우주산업협회(AIA) 경고 (X 보도, 원문 확인 못함)","move":"$12.63"},{"date":"2026-10-01","title":"새 CEO 취임","detail":"트라스 모라이티스 새 CEO 취임. 전 CEO 험프턴이 10월 2일 $13.75에 8.8만 주 매도","move":"$13.59 (10/2)"},{"date":"2026-09-21","title":"정부 지분투자 보도","detail":"트럼프 행정부가 희토류 기업 지분에 20억 달러 이상 투자했다는 보도 (X 보도)","move":"$16.78"},{"date":"2026-09-09","title":"블랙스버그 공장 착공","detail":"사우스캐롤라이나 블랙스버그 금속·자석 공장 착공","move":"$16.04 (9/10)"},{"date":"2026-09-03","title":"세라 베르데 인수 완료","detail":"세라 베르데 인수 완료 (현금 3억 달러 + 신주 1.268억 주)","move":"$17.61 (9/4)"},{"date":"2026-08-24","title":"15.5억불 SPV 완성","detail":"전쟁부 7.5억 달러 등 15.5억 달러 SPV 완성, 브라질 희토류 15년 구매·최저가 보장","move":"$18.29"},{"date":"2026-08-10","title":"2분기 실적 발표","detail":"2분기 실적: 매출 580만 달러, 조정 주당 −$0.15. 예상치 하회 (예상치는 출처마다 다름: X 보도 710만 달러·−$0.09, AllInvestView 804만 달러·−$0.11)","move":"$19.04"},{"date":"2026-08-07","title":"희토류 섹터 반등","detail":"희토류 섹터 반등 (직접 원인 확인 못함). 트럼프의 \"자석을 만들어라(Do magnets)\" 발언은 7월 15일 국방 서밋에서 나왔고 X에서 7/31~8/5 다시 퍼짐. \"문제는 가공\" 발언은 확인 못함","move":"$19.33 (8/7)"},{"date":"2026-07-20","title":"CEO 교체 발표","detail":"험프턴 CEO 은퇴(10/1)·모라이티스 후임 발표, 블리처 집행의장","move":"$15.23"},{"date":"2026-06-22","title":"중국 수출 제한 명단","detail":"중국이 USAR·MP를 기술 수출 제한 명단에 올림","move":"–"},{"date":"2026-06-05","title":"재매도 등록 서류","detail":"기존 주주 보유 9,382만 주(희석 기준 35%) 재매도 등록 서류(S-3/A) 제출","move":"$22.47"},{"date":"2026-06-02","title":"연중 최고 종가","detail":"연중 최고 종가","move":"$30.70"},{"date":"2026-05-22","title":"MP 기술 유출 소송","detail":"MP 머티리얼즈가 자석 기술 유출 혐의로 텍사스 법원에 소송 (5/22 제기 추정, 5/27 보도)","move":"$25.30 (5/22)"},{"date":"2026-05-20","title":"반발 매수","detail":"7일 연속 약 25% 하락 뒤 반발 매수. 트럼프·시진핑 회담에서 희토류 진전 없어 미·중 협상 불확실성 부각","move":"$22.57"},{"date":"2026-05-13","title":"1분기 실적 발표","detail":"1분기 실적: 매출 570만 달러, 스틸워터 3월 시운전 완료","move":"$25.42"},{"date":"2026-04-30","title":"인수 계약 재부각","detail":"증시 전반 강세 속 세라 베르데 인수 계약(현금 3억 달러 + 1.268억 주) 재부각","move":"$25.97"},{"date":"2026-04-20","title":"세라 베르데 인수 발표","detail":"브라질 세라 베르데 28억 달러 인수 발표","move":"$22.58"},{"date":"2026-04-08","title":"4월 급등 시작","detail":"프랑스 카레스터 지분 제휴(4/9), 영국 LCM 이트륨 금속 첫 생산(4/15). 4/8 급등 원인은 확인 못함","move":"$16.78 (4/8)"},{"date":"2026-03-02","title":"이란 충돌 수혜 기대","detail":"이란 군사 충돌 격화, 국내 희토류 수요 기대","move":"$20.87"},{"date":"2026-02-03","title":"프로젝트 볼트","detail":"정부 광물 비축 계획 '프로젝트 볼트'에 50개 이상 광물 포함 소식","move":"$25.97"},{"date":"2026-01-26","title":"상무부 16억 달러 LOI","detail":"상무부 16억 달러 지원 의향서, 정부 약 10% 지분, 15억 달러 PIPE($21.50). 주말(1/24~25) FT가 먼저 보도","move":"$26.72"},{"date":"2026-01-22","title":"1월 주간 +40%","detail":"원인 확인 못함. 같은 주 라운드톱 설계사(플루어·WSP) 선정 소식이 주간 상승 이유로 보도됨","move":"$22.71"},{"date":"2026-01-02","title":"연초 희토류 랠리","detail":"연초 희토류 랠리. 당일 원인은 확인 못함 (1/12 기사는 스틸워터 시운전 기대·베네수엘라 광물 기대를 꼽음)","move":"$14.15"}],"chart_events":["2026-01-26","2026-04-20","2026-06-02","2026-06-05","2026-07-20","2026-08-24"],"bull":["**정부가 직접 주주** 상무부 최대 16억 달러(보조금 2.77억 + 대출 13억), 정부 지분 약 8~16%. 전쟁부는 브라질 희토류 구매 SPV에 7.5억 달러를 넣었습니다. 정부 매입가 $17.17보다 지금 주가가 26% 낮아, '정부보다 싸게 산다'는 주장이 X에서 나옵니다.","**이미 돌아가는 광산을 샀습니다** 세라 베르데는 아시아 밖에서 유일하게 디스프로슘·테르븀 등 4대 자석용 희토류를 대규모로 캐는 광산입니다. 회사는 2027년 말 연환산 EBITDA 5.5억~6.5억 달러를 기대합니다. 맞다면 지금 시총(약 47억 달러)의 약 7~9배 수준입니다. 15년간 생산량 100% 구매 + 최저가격 보장이 붙어 있어, 희토류 가격이 떨어져도 바닥이 있습니다.","**현금이 많고 빚이 적습니다** 6월 말 현금 약 15.3억 달러, 차입금 약 300만 달러. 분기 현금 소모(약 5,700만 달러)로 보면 오래 버틸 수 있습니다 (단, 세라 베르데 현금 3억 달러와 블랙스버그 건설비는 빠집니다).","**미국 국방 규제가 수요를 만듭니다** 2027년 1월 1일부터 미국 무기에 중국산 자석 사용이 제한됩니다. 미국에서 소결 자석을 대량으로 만들 회사는 MP와 USAR 등 소수입니다. 고객 100곳 이상과 대화 중, 연 2,500톤 규모의 양해각서(MOU)·의향서를 확보했습니다.","**단계마다 생산이 시작됩니다** 스틸워터 3월 시운전, LCM 이트륨 금속 첫 생산(4월), 콜로라도 시범 공장 가동(6월)으로 '발표만 하는 회사'에서 벗어나는 중입니다.","**증권사 목표가와의 차이** 9명 모두 매수 의견, 평균 목표가 $35.56(+182%). 가장 낮은 제프리스 $21도 현재가보다 66% 높습니다."],"bear":["**크게 희석됐습니다** 1월 PIPE 6,980만 주, 세라 베르데 인수 1.268억 주, 정부 1,610만 주 + 워런트 1,750만 주. 현재 발행주식은 약 3.75억 주입니다. 희석은 피자를 더 많은 조각으로 나누는 것과 같습니다. 회사 가치가 그만큼 늘지 않으면 한 주의 몸이 줄어듭니다.","**매도 대기 물량(오버행)** 6월 5일 기존 주주 9,382만 주(희석 기준 35%)의 재매도가 등록됐고, 이날 주가는 −17% 빠졌습니다. 대부분 지금보다 훨씬 싼 값에 산 주식입니다. 세라 베르데 전 주주들도 이제 약 34%를 가진 큰 주주입니다.","**매출이 작고 적자가 큽니다** 최근 12개월 매출 약 1,320만 달러에 시총 47억 달러. 매출의 약 360배입니다. 2분기는 매출·이익 모두 예상에 못 미쳤습니다. 스틸워터는 원래 2026년 1분기 상업 생산을 말했지만, 10월 현재 자석 매출은 아직 없고 첫 판매는 '연말'로 밀렸습니다.","**1년 사이 CEO 3명** 밸러드 → 험프턴(약 1년) → 모라이티스. 험프턴은 퇴임 다음 날 $13.75에 주식을 팔았습니다. 전략이 자석·기술 중심에서 광산 중심으로 바뀔 수 있다는 불확실성이 있습니다.","**법적·지정학 위험** MP 머티리얼즈가 5월 기술 유출 소송을 냈고, 라운드톱 매장량의 신뢰성도 문제 삼았습니다. 중국 기술 수출 제한 명단(6월 말)에 올랐습니다. 브라질 광산은 새로운 나라 위험(정책·환율)을 더합니다. 세라 베르데에는 기존 대출과 제한 조항이 따라옵니다.","**정부 돈은 조건부입니다** 상무부 자금은 단계별 목표 달성 시 지급되고, 늦으면 환수될 수 있습니다. 연말까지 2.5억 달러 리볼빙 한도 확보, 총 41억 달러 설비투자 자금 마련도 조건입니다.","**차트와 분위기** 10월 8일 올해 처음 $12대에 들어섰고, 공매도 비율은 유통주식의 약 10.4%입니다. X에서는 \"$13.5 아래면 피하라\"는 기술적 경고가 나왔습니다."],"analysts_md":"증권사 9곳이 모두 매수 의견이고 평균 목표가는 $35.56(현재가 대비 약 +182%), 범위는 $21~45입니다. 다만 대부분 8월 주가 $18~20 때 나온 목표가라, 이후 하락을 반영하지 않았습니다. 가장 최근(9월) 새로 들어온 제프리스가 가장 낮은 $21을 제시한 점도 눈여겨볼 만합니다.\n\n| 날짜 | 증권사 | 의견 | 목표가 | 현재가 대비 |\n|---|---|---|---|---|\n| 2026년 9월 2일 | 제프리스 (신규) | 매수 | $21 | +66% |\n| 2026년 8월 25일 | 노스랜드 | 매수 유지 | $45 | +256% |\n| 2026년 8월 20일 | 로스 MKM | 매수 유지 | $30 | +138% |\n| 2026년 8월 12일 | 스톤X | 매수 재확인 | $45 | +256% |\n| 2026년 8월 11일 | 캐나코드 제뉴이티 | 매수 재확인 | $32 | +153% |\n| 2026년 1월 26~27일 | 로스 / 벤치마크 | 목표가 상향 | $35 (기존 $25) / $45 | – |\n| 합계 (9명) | S&P 글로벌 집계 | 강력 매수 8, 매수 1 | 평균 $35.56, 중간 $35 | +182% |","insider_title":"내부자·유명인 매매 (2025년 이후)","insider_md":"2025년 이후 내부자 장내 매수는 2건, 약 217만 달러이고 둘 다 2026년 1월 29일 $21~23에 샀습니다. 장내 매도는 3건, 약 3,446만 달러로 매수의 약 16배이며, 그중 96%가 블리처 의장의 2025년 8월 매도입니다. 현재가는 $12.63 (2026년 10월 8일 종가)입니다.\n\n**내부자 매수 (SEC Form 4 장내 매수 전체)**\n\n| 날짜 | 누가 | 수량 | 매수가 | 금액 | 현재가 대비 |\n|---|---|---|---|---|---|\n| 2026년 1월 29일 | 마이클 블리처 (이사회 의장, 7월부터 집행의장. 스팩 인플렉션 포인트 대표) | 100,000주 | $21.44 | 약 214만 달러 | −41.1% |\n| 2026년 1월 29일 | 캐롤린 트라부코 (사외이사) | 1,300주 | $22.60 | 약 2.9만 달러 | −44.1% |\n\n**내부자 매도 (장내 매도 전체)**\n\n| 날짜 | 누가 | 수량 | 매도가 | 금액 | 현재가 대비 |\n|---|---|---|---|---|---|\n| 2026년 10월 2일 | 바버라 험프턴 (전 CEO, 10/1 퇴임) | 88,391주 | $13.75 | 약 122만 달러 | −8.1% |\n| 2026년 6월 8일 | 캐롤린 트라부코 (사외이사) | 13,000주 | $22.77 | 약 30만 달러 | −44.5% |\n| 2025년 8월 13일 | 마이클 블리처 (의장) | 2,091,849주 | $15.75 | 약 3,295만 달러 | −19.8% |\n| 합계 | 3명 | 2,193,240주 | 평균 $15.71 | 약 3,446만 달러 | −19.6% |\n\n세 건 모두 Form 4에 10b5-1(미리 정해 둔 자동 매매 계획) 표시가 없습니다.\n\n**읽는 법**\n\n- 블리처는 2025년 8월 $15.75에 약 209만 주를 팔고, 2026년 1월 정부 발표 직후 $21.44에 10만 주를 다시 샀습니다. 판 양이 산 양의 약 21배입니다.\n- 1월 매수 두 건은 지금 기준 −41~44%로, 내부자도 고점 부근에서 샀습니다. 따라 들어가면 내부자보다 약 41% 싸게 사는 위치입니다.\n- 험프턴 전 CEO는 퇴임 다음 날 팔았습니다. 퇴임자의 매도는 흔한 일이지만, '전 CEO가 현 주가에 남지 않았다'는 신호로 읽힌 수 있습니다.\n- 새 CEO 모라이티스의 장내 매수는 아직 없습니다. 세라 베르데 주주였다면 인수 대가로 주식을 받았을 수 있지만 확인하지 못했습니다.\n\n**유명인·정부·큰 투자자**\n\n| 누가 | 언제 | 매입가 | 현재가 대비 |\n|---|---|---|---|\n| 미국 정부 (상무부) | 2026년 1월 발표, 6월 본계약 | 1,610만 주 $17.17 + 워런트 약 1,750만 주(행사가 $17.17) | −26.4% (워런트는 현재 행사 이익 없음) |\n| PIPE 투자자 (인플렉션 포인트 등) | 2026년 1월 28일 예정 납입 | 6,980만 주 $21.50 (15억 달러) | −41.3% |\n| 세라 베르데 전 주주 | 2026년 9월 3일 | 신주 1.268억 주 (현금 3억 달러 별도) | 등록된 매입가 없음 |\n\n**대주주 신고 (13G/13D, SEC EDGAR)**\n\n5% 넘게 가진 투자자는 SEC에 신고해야 합니다. 13D는 경영에 관여할 수 있는 대주주, 13G는 단순 투자자입니다. 신고서에는 매입가가 없어 현재가 대비는 계산할 수 없습니다.\n\n| 기준일 | 보유자 | 서류 | 지분 | 주식 수 | 비고 |\n|---|---|---|---|---|---|\n| 2026년 9월 3일 | Serra Verde Rare Earths Ltd. | 13G | 12.5% | 약 4,681만 주 | 세라 베르데 인수 대가 주식 |\n| 2026년 9월 3일 | VB (Rare Earths) Ltd | 13D | 7.9% | 약 2,954만 주 | 인수 대가 주식 |\n| 2026년 9월 3일 | EMG Fund V SVRE Holdings (에너지·광산 펀드 EMG) | 13G | 7.8% | 약 2,922만 주 | 인수 대가 주식 |\n| 2026년 6월 5일 | 모르드추이 제브 구트닉 | 13D/A | 6.8% | 약 1,558만 주 | 2025년 3월 상장 때 16.7%에서 줄어듦 |\n| 2026년 3월 31일 | 블랙록 | 13G | 5.9% | 약 1,285만 주 | 인덱스·운용사 |\n| 2026년 3월 31일 | 스테이트 스트리트 | 13G | 5.5% | 약 1,207만 주 | 인덱스·운용사 |\n| 2026년 6월 30일 | 알래스카 인베스트먼트 (헤지펀드) | 13G/A | 4.61% | 약 1,129만 주 | 3월 7.60% → 6월 4.61%로 줄임 |\n| 2025년 9월 15일 | 마이클 블리처 (의장) | 13D/A | 5.8% | 약 581만 주 | 2025년 3월 17.5% → 6월 14.9% → 8월 7.1% → 9월 5.8% |\n\n- 세라 베르데 전 주주 3곳이 합쳐 약 28%(약 1.06억 주)를 갖고 있습니다. 이들이 파는지가 앞으로의 매도 물량 변수입니다.\n- 블리처는 1년 반 동안 지분을 17.5%에서 5.8%로 크게 줄였습니다 (일부는 주식 수 증가로 인한 비율 하락).\n\n- 낸시 펠로시를 포함한 미 의회 의원의 USAR 매매 기록은 찾지 못했습니다 (Quiver Quantitative: \"의회 거래 데이터 없음\").\n- 트럼프 대통령의 OGE 278-T 거래 보고서 19건(2025년 8월~2026년 9월 제출분)을 모두 확인했지만 USAR 매매는 없습니다. 다만 미국 정부 자체가 가장 큰 '유명 주주'입니다.\n- 회사는 2025년 7월~2026년 1월 로비 비용으로 총 54만 달러를 쓴 것으로 공개됐습니다 (천연자원 분야).\n\n출처: [SEC EDGAR Form 4 (USA Rare Earth)](https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=0001970622&type=4), [MarketBeat: 블리처 매수](https://www.marketbeat.com/instant-alerts/insider-buying-usa-rare-earth-nasdaqusar-director-purchases-214400000-in-stock-2026-01-29/), [Quiver Quantitative USAR](https://www.quiverquant.com/stock/USAR/)","next_md":"지금 매출은 거의 모두 영국 LCM이 다른 회사에 파는 희토류 금속·합금에서 나옵니다. 2분기 매출 580만 달러는 원가(740만 달러)보다도 작아, 팔수록 손해입니다.\n\n| 분기 | 매출 | 조정 순손실 (주당) | 영업현금 유출 | 현금 |\n|---|---|---|---|---|\n| 2026년 1분기 (5월 13일 발표) | 570만 달러 | −2,410만 달러 (−$0.12) | − | 약 17.5억 달러 |\n| 2026년 2분기 (8월 10일 발표) | 580만 달러 (예상치 하회. 예상치는 출처마다 다름: X 보도 710만, AllInvestView 804만 달러) | −3,350만 달러 (−$0.15, 예상 −$0.09(X 보도)~−$0.11(AllInvestView)) | −5,690만 달러 | 약 15.3억 달러 |\n\n**쉽게 비유하면**\n\n- 이 회사는 아직 '가게 문을 열기 전'입니다. 주주와 정부에게 받은 돈(약 15억 달러)으로 광산·공장을 사고 짓는 중입니다.\n- 브라질 광산은 이미 운영 중이었고, 9월부터 실적에 합쳐집니다. 그래서 3분기부터 매출이 크게 달라질 수 있습니다.\n- 스틸워터 자석은 연말에 첫 판매를 목표로 합니다. 고객 100곳 이상과 대화 중이고, 20곳 이상이 품질 시험(인증) 중입니다.\n\n**인수 비용과 희석**\n\n- 세라 베르데 인수가는 약 28억 달러입니다. 현금 3억 달러와 신주 1.268억 주를 줬습니다. 지금 발행주식(약 3.75억 주)의 약 34%가 이 인수로 새로 생긴 주식입니다.\n- 1월에는 $21.50에 신주 약 6,980만 주를 팔아 15억 달러를 모았습니다 (PIPE).\n\n#### 앞으로의 숫자 (회사 목표)\n\n| 항목 | 목표 | 시기 |\n|---|---|---|\n| 스틸워터 자석 생산 능력 | 연 600톤 → 1,200톤 | 2026년 4분기 → 2027년 1분기 |\n| LCM 영국 금속·합금 | 연 3,000톤 | 2026년 4분기 |\n| 세라 베르데 희토류 산화물 | 연 4,000톤 → 6,400톤 | 2026년 말 → 2027년 말 |\n| 세라 베르데 연간 EBITDA | 5.5억~6.5억 달러 (연환산) | 2027년 말 |\n| 미국 내 자석 총량 (스틸워터+블랙스버그) | 연 1만 톤 | 2028년 이후 |\n| 라운드톱 최종 타당성 조사 | 완료 4분기, 공개 2027년 1분기 | 상업 생산 2028년 말 |\n| 회사 장기 목표 | 매출 26억 달러, 자유현금흐름 9억 달러 | 2030년 |\n\n월가 증권사들은 흑자를 2028년 이후, 현금흐름 흑자를 2029년 이후로 봅니다 (S&P 글로벌, 5월 기준).","glossary_md":"| 용어 | 뜻 |\n|---|---|\n| NdFeB 자석 | 네오디뮴·철·붕소로 만든 가장 강한 영구자석. 모터·미사일·드론에 씀 |\n| 중희토류 | 디스프로슘·테르븀처럼 양이 적고 비싼 희토류. 자석이 열에 강해지게 함 |\n| NdPr | 네오디뮴과 프라세오디뮴. 자석의 주재료 |\n| 스팩(SPAC) | 다른 회사와 합병해 그 회사를 상장시키려고 만든 빈 상장회사 |\n| PIPE | 상장회사가 큰 투자자에게 새 주식을 직접 파는 것 |\n| 워런트 | 정해진 가격(여기서는 $17.17)에 나중에 주식을 살 수 있는 권리 |\n| 희석 | 새 주식이 생겨 기존 주주의 지분 비율이 줄어드는 것 |\n| 오버행 | 언제든 시장에 나올 수 있는 대기 매도 물량 |\n| SPV (특수목적회사) | 한 가지 일(여기서는 브라질 희토류 구매)만 하려고 따로 만든 회사 |\n| 오프테이크 · 최저가격 | 생산한 물건을 미리 사기로 한 약속 · 시장 가격이 떨어져도 보장하는 바닥 가격 |\n| EBITDA | 세금·이자·감가상각 전 이익. 사업이 버는 현금에 가까운 숫자 |\n| 타당성 조사 (PFS·DFS) | 광산을 지으면 돈이 되는지 따져보는 보고서. 예비(PFS) → 최종(DFS) 순서 |\n| Form 4 · 10b5-1 | 내부자 매매 신고서 · 미리 정해 둔 자동 매매 계획 |","sources":[{"t":"SEC 8-K: 2026년 2분기 실적 발표 (8월 10일)","u":"https://www.sec.gov/Archives/edgar/data/0001970622/000197062226000056/exhibit991-earningsrelease.htm"},{"t":"SEC 8-K: 2026년 1분기 실적 발표 (5월 13일)","u":"https://www.sec.gov/Archives/edgar/data/0001970622/000197062226000034/exhibit991-earningsrelease.htm"},{"t":"SEC 8-K: 상무부 LOI·PIPE 조건 (1월 26일)","u":"https://www.sec.gov/Archives/edgar/data/1970622/000121390026007457/ea0274031-8k_usarare.htm"},{"t":"Mining.com: US agrees to buy 10% of USA Rare Earth in $1.6B deal","u":"https://www.mining.com/?p=1197844"},{"t":"Mining Weekly: 험프턴 은퇴, 모라이티스 후임 (7월 20일)","u":"https://www.miningweekly.com/article/usa-rare-earth-ceo-humpton-to-retire-serra-verdes-moraitis-to-succeed-2026-07-20"},{"t":"Benzinga: 세라 베르데 인수 완료 공장은 유타주의 화이트 메사(White Mesa) 제련소입니다.\n\n**1. 우라늄이란?**\n\n- 원자력 발전소의 연료입니다. 우라늄 원자가 쪼개질 때 나오는 열로 물을 끓여 전기를 만듭니다.\n- 탄소를 거의 내뿜지 않고, 날씨와 상관없이 24시간 전기를 만들 수 있습니다. 그래서 AI 데이터센터처럼 전기를 많이 쓰는 곳이 늘자 다시 주목받고 있습니다.\n- 에너지 퓨얼스는 미국 안에서 우라늄을 가장 많이 생산하는 회사입니다. 2017년 이후 미국산 우라늄의 약 3분의 2를 만들었습니다.\n\n**2. 희토류란?**\n\n- 이름은 '드문 흙'이지만, 사실은 17가지 금속 원소를 묶어 부르는 말입니다. 네오디뮴(Nd), 프라세오디뮴(Pr), 테르븀(Tb), 디스프로슘(Dy) 등이 있습니다.\n- 가장 중요한 쓰임새는 **영구자석**입니다. 전기차 모터, 로봇 관절, 드론, 풍력발전기, 미사일 유도장치에 들어갑니다. 냉장고 자석보다 수십 배 강한 자석이라고 보면 됩니다.\n- 문제는 전 세계 희토류 정제와 자석 생산의 대부분을 중국이 하고 있다는 점입니다. 중국이 수출을 막으면 미국 공장과 무기 생산이 멈출 수 있습니다.\n- 테르븀·디스프로슘 같은 '중희토류'는 양이 특히 적어서 더 귀합니다. 자석이 뜨거워져도 힘을 잃지 않게 해 줍니다.\n\n**3. 이 회사만의 특징**\n\n- 화이트 메사 제련소는 미국에서 유일하게 우라늄을 정제할 수 있는 전통 제련소이면서, 희토류 원료(모나자이트라는 모래 광물)를 녹여 희토류를 뽑아낼 수 있는 유일한 미국 시설입니다.\n- 모나자이트에는 우라늄도 조금 섞여 있어서, 희토류를 뽑으면서 우라늄도 함께 얻습니다. 한 공장으로 두 가지를 만드는 셈입니다.\n- 회사는 \"광산부터 자석까지(mine-to-magnet)\" 전 과정을 갖추려 하고 있습니다. 원료 캐기 → 정제 → 금속·합금 만들기 → 자석 만들기 순서입니다. 2026년 4월 마크 차머스 CEO가 은퇴하고 로스 바푸가 새 CEO가 됐습니다.\n\n#### 돈 버는 구조: 지금은 우라늄, 앞으로는 희토류 자석\n\n현재 매출의 대부분은 우라늄 판매에서 나옵니다. 희토류와 자석은 아직 돈을 쓰는 단계이고, 회사는 2027~2029년에 이 사업이 커질 것으로 계획합니다.\n\n유타 공장 하나가 희토류와 우라늄을 함께 만들고, 지금 매출은 아래쪽 우라늄 상자에서 대부분 나옵니다.\n\n| 사업 | 지금 상태 | 숫자 | 언제 돈이 되나 |\n|---|---|---|---|\n| 우라늄 | 주력 매출원 | 상반기 판매 82만 파운드, 원가 파운드당 약 $23, 장기계약 6건(2032년까지) | 지금 |\n| 희토류 정제 (NdPr) | 상업 규모 생산 성공, 아직 소량 | 2029년까지 연 6,000톤 목표 | 2027년 이후 |\n| 중희토류 (테르븀·디스프로슘) | 7월 공장 착공, 일본 자석 회사 인증 통과 | 2027년 말 회로 완공 목표 | 2028년 이후 |\n| 합금 (한국 오창 공장) | 8월 ASM 인수로 확보 | 연 1,300톤, 2026년 말 3,600톤으로 확장 | 인수 완료, 매출 반영 시작 |\n| 자석 (독일 VAC) | 인수 계약만 체결 | VAC 2025년 이익(EBITDA) 2,900만 달러 | 2027년 초 인수 완료 예정 |\n| 원료 광산 (호주 도널드, 마다가스카르) | 개발 단계 | 도널드 최종 투자 결정 2026년 4분기 예정 | 2028년 이후 |\n\n**쉽게 비유하면**\n\n- 지금의 에너지 퓨얼스는 '빵집' 하나(우라늄)로 돈을 벌면서, 그 돈과 정부 대출로 '밀가루 공장부터 케이크 가게까지'(희토류 자석) 전부를 새로 짓는 중입니다.\n- 빵집은 장사가 잘 됩니다. 우라늄 원가가 파운드당 $23인데 판매가는 $74~80이라, 남는 돈이 큽니다.\n- 하지만 새로 짓는 공장들이 돈을 벌기 전까지는 회사 전체로는 적자입니다.\n\n**재무 상태 (2분기 말)**\n\n- 2분기 매출 2,510만 달러는 1년 전(420만 달러)보다 크게 늘었지만 1분기(3,580만 달러)보다는 30% 줄었고, 영업손실 약 3,000만 달러로 적자 폭이 다시 커졌습니다. 1분기에는 주당 −$0.04로 적자가 작았고 영업현금흐름도 +830만 달러였습니다.\n- 현금은 약 8.78억 달러로 넉넉한 편입니다. 다만 VAC 인수에 현금 7.18억 달러가 들어갑니다.\n- 미 국방부 전략자본실이 7.25억 달러 대출을 조건부로 약속했습니다. 희토류 분리·금속화 공장을 짓는 데 쓰입니다.\n- 증권사들은 2027년에 2013년 이후 처음으로 흑자(주당 약 $0.03)를 낼 것으로 봅니다.\n\n**회사가 제시한 미래 숫자 (1월 타당성 조사, 회사 추정)**\n\n- 유타 희토류 2단계 증설: 투자비 4.1억 달러, NdPr 연 6,000톤 이상, 디스프로슘 연 240톤, 테르븀 연 66톤.\n- 이 증설만으로 첫 15년 연평균 EBITDA 3.11억 달러, 마다가스카르 원료와 합치면 7.65억 달러. 지금 시가총액(약 30억 달러)과 비교하면 큰 숫자지만, 규제 승인 2027년 중반, 가동 2029년 1분기 예정이라 먼 미래의 계획입니다.\n- 2026년 우라늄 가이던스: 판매 150만~200만 파운드, 채굴 200만~250만 파운드.","gov_md":"트럼프 행정부는 이 회사를 '미국판 희토류 정제소이자 원전 연료 공장'으로 키우려 합니다. 목표는 중국 없이도 미국이 희토류 자석과 원전 연료를 스스로 만드는 것입니다.\n\n| 목적 | 정부가 한 일 | 이 회사의 역할 |\n|---|---|---|\n| 희토류 정제를 중국에서 독립 | 국방부 전략자본실 7.25억 달러 대출 약속 (6월 18일). 트럼프: \"문제는 희토류가 아니라 가공\" | 유타에 희토류 분리·금속화 공장 신설 |\n| 무기용 자석 공급망 확보 | 2027년 1월 1일부터 국방 무기에 중국산 자석 사용 제한 | 테르븀 일본 인증, 한국 합금·독일 자석 공장 인수로 동맹국 공급망 구성 |\n| 원전 연료를 국내에서 조달 | 러시아산 우라늄 수입 단계적 금지, 원전 확대 | 미국에서 가동 중인 유일한 전통 우라늄 제련소 운영 |\n| 광산 땅 확보 | 베어스이어스 국립기념물 90% 이상 축소 (7월 13일), 약 300만 에이커 채굴 개방 | 새로 열린 우라늄·바나듐 광맥(화이트캐니언, 엘크리지)의 광석을 유타 제련소에서 처리 |\n\n**다른 회사들과 다른 점**\n\n- MP 머티리얼즈, ELMT, 인텔에는 정부가 **지분 투자**를 해서 주주가 됐습니다.\n- 에너지 퓨얼스에는 **대출**, **규제 완화**(광산 개방), **수요 만들기**(국방 조달 규제)로 지원합니다. 정부가 주주는 아닙니다.\n- 그래서 정부가 주가를 떠받칠 이유는 직접적이지 않습니다. 대출 조건을 맞추려면 공장을 제때 짓는 실행력이 가장 중요합니다.\n- 베어스이어스 축소 6일 전 CEO가, 5일 전 이사회 의장이 주식을 사서 하원 민주당 의원들이 내부자 거래를 조사 중입니다.\n\n출처: [하원 천연자원위원회 민주당 보도자료](https://democrats-naturalresources.house.gov/media/press-releases/huffman-dexter-open-investigation-into-insider-trading-at-energy-fuels-after-trump-guts-bears-ears), [Yahoo Finance: 7.25억 달러 대출](https://finance.yahoo.com/energy/articles/energy-fuels-rallies-securing-conditional-135749520.html)","gov_title":"정부가 이 회사를 쓰는 방법","events":[{"date":"2026-10-06","title":"비중국산 희토류 가격 급등","detail":"비중국산 희토류(테르븀·이트륨) 가격 급등 보도. 국방 조달 규제(2027년 1월 1일)를 앞둔 사재기","move":"$11.26"},{"date":"2026-09-30","title":"도널드 투자결정","detail":"호주 도널드 프로젝트 최종 투자 결정이 4분기로 예정 (합작 파트너 발표)","move":"$11.03"},{"date":"2026-09-09","title":"ATM 2.5억 달러 소진","detail":"2.5억 달러 수시 주식 발행(ATM) 소진 확인","move":"–"},{"date":"2026-09-01","title":"희토류 섹터 약세","detail":"희토류 섹터 전체 약세, 미·중 회담에서 희토류 문제 미해결","move":"월간 $14.47 → $11.03"},{"date":"2026-08-28","title":"호주 ASM 인수 완료","detail":"호주 ASM 인수 완료 (약 2.43억 달러, 대부분 주식). 한국 오창 합금 공장 확보","move":"$14.67"},{"date":"2026-08-19","title":"테르븀 일본 인증 통과","detail":"테르븀 산화물, 일본 최대 영구자석 제조사 상업 사용 인증","move":"$14.85"},{"date":"2026-08-12","title":"내부자 거래 조사 착수","detail":"하원 민주당 의원들, CEO·의장 7월 매수 관련 내부자 거래 조사 착수","move":"$14.47"},{"date":"2026-08-07","title":"백악관 광업 회의 초청","detail":"트럼프 백악관 광업 회의 초청","move":"$14.14"},{"date":"2026-08-05","title":"2분기 실적 발표","detail":"2분기 실적: 매출 2,510만 달러(예상 3,080만 달러 하회), 주당 −$0.13","move":"$12.44"},{"date":"2026-07-29","title":"중희토류 공장 착공","detail":"화이트 메사에서 상업 규모 중희토류 공장 착공","move":"$10.74"},{"date":"2026-07-13","title":"베어스이어스 축소","detail":"트럼프, 베어스이어스 국립기념물 90% 이상 축소 (우라늄 광맥 개방)","move":"$13.05"},{"date":"2026-07-07","title":"CEO·의장 장내 매수","detail":"CEO가 $13.08에 7.4만 주, 이사회 의장이 4,000주 장내 매수","move":"$12.86"},{"date":"2026-06-23","title":"VAC 19억 달러 인수","detail":"독일 자석 회사 VAC 19억 달러 인수 발표 (현금 7.18억 달러 + 신주 6,585만 주)","move":"$15.47"},{"date":"2026-06-18","title":"국방부 대출 약속","detail":"국방부 전략자본실 7.25억 달러 조건부 대출 약속","move":"$16.56"},{"date":"2026-06-11","title":"우라늄 목표 달성","detail":"연간 우라늄 생산 목표를 상반기 중 달성할 것으로 발표","move":"$15.08"},{"date":"2026-05-06","title":"1분기 실적 발표","detail":"1분기 실적: 매출 3,580만 달러(전년 1,690만 달러), 주당 −$0.04, 영업현금흐름 +830만 달러","move":"$23.52"},{"date":"2026-04-15","title":"CEO 교체 발표","detail":"마크 차머스 CEO 은퇴, 로스 바푸 새 CEO 선임 발표","move":"$21.00"},{"date":"2026-03-25","title":"중희토류 첫 1차 생산","detail":"미국에서 수십 년 만의 첫 중희토류 1차 생산 발표","move":"$18.75"},{"date":"2026-02-26","title":"2025년 실적·가이던스","detail":"2025년 실적과 2026년 가이던스: 매출은 예상 상회, 주가는 하락","move":"$22.84"},{"date":"2026-01-28","title":"연중 최고가","detail":"연중 최고가 $27.72 기록 후 이틀간 약 −19%","move":"$27.72"},{"date":"2026-01-20","title":"호주 ASM 인수 발표","detail":"호주 ASM 인수 발표 (2.99억 달러, 대부분 주식)","move":"$23.52"},{"date":"2026-01-15","title":"희토류 증설 타당성 조사","detail":"희토류 2단계 증설 타당성 조사: 투자비 4.1억 달러, NdPr 연 6,000톤 이상, 연평균 EBITDA 3.11억 달러","move":"$20.92"},{"date":"2026-01-08","title":"마다가스카르 타당성 조사","detail":"마다가스카르 톨리아라 희토류·광물모래 프로젝트 타당성 조사: 순현재가치 18억 달러, 연 EBITDA 5억 달러 이상","move":"$18.59"}],"chart_events":["2026-01-28","2026-05-06","2026-06-18","2026-06-23","2026-07-29","2026-08-05"],"bull":["**미국 정부의 전폭 지원** 국방부 전략자본실이 7.25억 달러 대출을 조건부로 약속했습니다. 앞서 텅스텐 회사 ELMT에 국방부가 4.5억 달러를 넣은 것과 같은 흐름입니다. 8월 트럼프 백악관 광업 회의에 초청됐습니다. 트럼프는 \"자석을 만들어라\", \"문제는 희토류가 아니라 가공\"이라고 말했습니다.","**2027년 1월 1일 국방 조달 규제** 이날부터 미 국방부 무기에 중국산 희토류 자석을 쓰기 어려워집니다. 비중국산 테르븀·이트륨 가격이 이미 급등하고 있다는 보도가 10월 초 나왔습니다. 미국에서 희토류를 정제할 수 있는 몇 안 되는 회사라 수혜가 직접적입니다.","**서방 최초의 중희토류 인증** 8월 19일 테르븀 산화물(순도 99.9%)이 일본 최대 자석 제조사의 상업 사용 인증을 추가 검증 없이 통과했습니다. X에서는 \"중국을 거치지 않고 최상급 자석을 만드는 길이 처음 열렸다\"는 평가가 많았습니다.","**'광산부터 자석까지' 수직계열화** 원료(호주·마다가스카르) → 정제(유타) → 합금(한국 오창) → 자석(독일 VAC)을 한 회사가 갖추게 됩니다. 서방에 이런 회사가 거의 없습니다. VAC는 100년 역사의 독일 자석 회사로 방산 인증과 1,000곳 넘는 고객을 이미 가지고 있습니다. 이 기술 가치가 아직 주가에 반영되지 않았다는 주장이 있습니다.","**우라늄 사업의 원가 경쟁력** 핀연 플레인 광산의 총원가가 파운드당 $23로, 회사가 제시한 범위($23~30)의 최저치였습니다. 장기 공급계약이 4건에서 6건으로 늘었고, 확정 물량 320만 파운드가 2032년까지 이어집니다. AI 데이터센터 전력 수요와 러시아산 우라늄 수입 금지 흐름도 우라늄 가격을 받쳐 줍니다.","**내부자와 스마트 머니의 매수** 로스 바푸 CEO가 7월 7일 $13.08에 7.4만 주(약 97만 달러)를 사서 지분을 41% 늘렸습니다. 지금 주가는 그보다 약 14% 낮습니다. 보유 헤지펀드가 26곳에서 32곳으로 늘었습니다 (2분기).","**장기 원료 확보** 마다가스카르 바라마다 프로젝트가 회사 원료 수요의 약 50%를 최대 100년간 공급할 수 있다는 회사 측 설명이 있습니다. 호주 도널드 프로젝트에 지금까지 9,740만 호주달러를 투입했고, 4분기에 최종 투자 결정이 예정돼 있습니다."],"bear":["**주식 희석이 큽니다** VAC 인수 대금으로 신주 6,585만 주를 줍니다. 지금 발행주식(약 2.65억 주)의 약 25%입니다. ASM 인수도 대부분 주식으로 냈습니다. 희석이란 피자를 더 많은 조각으로 나누는 것과 같습니다. 회사 가치가 그만큼 늘지 않으면 한 주의 몫이 줄어듭니다. 2.5억 달러 수시 주식 발행(ATM)을 9월에 다 써서 당장은 멈췄지만, 공장 건설비 때문에 곧 다시 시작할 가능성이 크다는 지적이 있습니다.","**인수 조건이 불리해졌습니다** VAC 인수가는 주가 $16.12를 기준으로 정했는데, 주가가 $20.93 아래면 최대 1.35억 달러어치 우선주를 추가로 줘야 합니다. 지금 $11 대라 이 조항이 발동될 가능성이 큽니다.","**아직 적자이고 기대가 비쌉니다** 2분기 매출이 예상보다 18% 적었고 1분기보다도 30% 줄었으며, 주당 −$0.13 적자였습니다. 2026년 전체도 주당 약 −$0.25 적자가 예상됩니다. 앞으로 1년 매출 대비 주가(P/S)가 약 19.6배로, 업종 평균 5.3배의 네 배 가까이 됩니다. 최근 60일간 2026·2027년 이익 추정치가 내려갔고, Zacks는 8월에 '강력 매도'로 낮췄습니다.","**실행 위험이 겹칩니다** 미국·호주·한국·독일에서 인수 통합, 공장 건설, 시운전을 동시에 해야 합니다. 하나만 늦어도 일정 전체가 밀릴 수 있습니다. 3분기에는 정기 보수로 우라늄 처리가 멈춰, 매출 공백이 예상됩니다.","**내부자 거래 조사** 하원 민주당 의원들이 8월 12일 조사를 시작했습니다. CEO의 7월 매수가 트럼프의 베어스이어스 국립기념물 축소 결정 직전이었다는 이유입니다. 회사 서류 제출 기한(8월 24일) 이후 진행 상황은 공개되지 않았습니다. 이전 경영진이 마다가스카르 지역 주민에게 지키지 못한 약속을 했다는 비판도 X에서 나왔습니다.","**차트와 시장 분위기** 8월 고점 이후 갭 하락, 헤드앤숄더 패턴, 50일 이동평균선 이탈을 지적하는 기술적 분석가가 많았습니다. 대형 투자자 매집 지표가 줄고 있다는 분석도 있습니다. \"좋은 회사지만 거시 환경이 불안해 아직 안 산다\"는 관망 의견이 9월 이후 늘었습니다."],"analysts_md":"증권사 7곳 중 5곳이 매수 의견이고 평균 목표가는 $21.85(현재가 대비 약 +94%)이지만, 목표가 범위가 $16~29로 넓어 의견 차이가 큽니다.\n\n| 날짜 | 출처 | 의견 | 목표가 |\n|---|---|---|---|\n| 9월 15일 | Red Cloud (캐나다) | 우라늄 최선호주 3개 중 하나 | C$44 (토론토 상장가 기준) |\n| 9월 1일 | HC Wainwright | 매수 | $29.25 (상향) |\n| 8월 14일 | BMO | 시장수익률 상회 (신규) | $18 |\n| 8월 14일 | UBS | 중립으로 상향 | – |\n| 8월 11일 | Zacks | 강력 매도로 하향 | – |\n| 8월 10일 | B. Riley | 매수 | $25 (하향, 기존 $27) |\n| 8월 7일 | Roth | 매수로 상향 | $16 |","insider_title":"내부자·유명인 매매 (2025년 이후)","insider_md":"2025년 이후 내부자의 장내 매수는 5건, 약 109만 달러이고, 그중 89%가 CEO 한 사람의 7월 매수입니다. 같은 기간 내부자 매도는 약 1,700만 달러로 매수보다 훨씬 많았습니다. 현재가는 $11.26 (2026년 10월 6일 종가)입니다.\n\n**내부자 매수 (SEC Form 4 장내 매수 전체)**\n\n| 날짜 | 누가 | 수량 | 매수가 | 금액 | 현재가 대비 |\n|---|---|---|---|---|---|\n| 2026년 7월 8일 | 브루스 핸슨 (이사회 의장) | 4,000주 | $12.70 | 약 5.1만 달러 | −11.3% |\n| 2026년 7월 7일 | 로스 바푸 (CEO) | 74,000주 | $13.08 | 약 96.8만 달러 | −13.9% |\n| 2025년 3월 19일 | 브루스 핸슨 (이사회 의장) | 6,000주 | $4.25 | 약 2.5만 달러 | +165% |\n| 2025년 3월 4일 | 데브라 베네텀 (핵심광물 담당 VP) | 3,700주 | $4.08 | 약 1.5만 달러 | +176% |\n| 2025년 2월 28일 | 로건 슘웨이 (공정운영 VP) | 7,500주 | $4.10 | 약 3.1만 달러 | +175% |\n\n**주요 내부자 매도 (10만 달러 이상)**\n\n| 시기 | 누가 | 수량 | 평균 매도가 | 금액 | 현재가 대비 |\n|---|---|---|---|---|---|\n| 2026년 3~4월 | 다니엘 카포스타시 (기술 VP) | 40,000주 | $18.78 | 약 75만 달러 | −40.0% |\n| 2026년 3월 | 데니스 힉스 (이사) | 14,000주 | $20.06 | 약 28만 달러 | −43.9% |\n| 2026년 3월 2일 | 커티스 무어 (마케팅 SVP) | 10,000주 | $23.12 | 약 23만 달러 | −51.3% |\n| 2025년 11~12월 | 알렉스 모리슨 (이사) | 77,608주 | $14.60 | 약 113만 달러 | −22.9% |\n| 2025년 11월 19일 | 마크 차머스 (전 CEO) | 150,000주 | $15.60 | 약 234만 달러 | −27.8% |\n| 2025년 8~11월 | 데니스 힉스 (이사) | 138,417주 | $12.84 | 약 178만 달러 | −12.3% |\n| 2025년 8월 25일 | 살림 드레라 (방사성동위원소 VP) | 266,595주 | $11.01 | 약 293만 달러 | +2.3% |\n| 2025년 8월 8일 | 케빈 밸록 (프로젝트금융 SVP) | 210,760주 | $9.88 | 약 208만 달러 | +14.0% |\n| 2025년 6~12월 | 티모시 카스텐스 (광물사업 EVP) | 620,206주 | $9.79 | 약 607만 달러 | +15.0% |\n\n**읽는 법**\n\n- 내부자들은 2025년 11월~2026년 3월, 주가가 $15~23일 때 많이 팔았습니다. 지금 가격은 그보다 23~51% 낮아서, 결과적으로 잘 판 셈입니다.\n- 반대로 2026년 7월 CEO와 이사는 $13 근처에서 샀습니다. 지금은 그보다 11~14% 낮아, 따라 들어가면 CEO보다 싸게 사는 위치입니다.\n- 다만 이 7월 매수는 트럼프의 베어스이어스 국립기념물 축소 결정 직전이어서 하원 민주당 의원들이 내부자 거래 여부를 조사하고 있습니다. 조사 결과는 아직 공개되지 않았습니다.\n- 2025년 2~3월의 소액 매수($4 대)는 지금 기준 +165~176%로, 바닥에서 산 매수였습니다.\n\n**유명인·유명 펀드**\n\n- 펠로시, 트럼프, 2025년 이후 의회 의원의 UUUU 매매 기록은 찾지 못했습니다. 마지막 의원 거래는 2022년 크리스 제이콥스 하원의원의 소액 매매입니다.\n- 앞서 분석한 드러켄밀러(듀케인)와 레오폴드 아셴브레너(시추에이셔널 어웨어니스) 13F에도 UUUU는 없습니다.\n- 개인 유명인 대신 미국 정부가 사실상 가장 큰 '후원자'입니다. 국방부 전략자본실의 7.25억 달러 대출 약속이 이에 해당합니다. 지분 투자가 아닌 대출이라, 정부의 '매수가'는 없습니다.\n- 헤지펀드 보유 수는 2026년 1분기 26곳에서 2분기 32곳으로 늘었습니다.\n\n출처: [SEC EDGAR Form 4 (Energy Fuels)](https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=0001385849&type=4), [Quiver Quantitative UUUU](https://www.quiverquant.com/stock/UUUU/), [하원 천연자원위원회 민주당 보도자료](https://democrats-naturalresources.house.gov/media/press-releases/huffman-dexter-open-investigation-into-insider-trading-at-energy-fuels-after-trump-guts-bears-ears), [Tracefour 아셴브레너 13F](https://tracefour.com/trackers/aschenbrenner)","next_md":"현재 매출의 대부분은 우라늄 판매에서 나옵니다. 희토류와 자석은 아직 돈을 쓰는 단계이고, 회사는 2027~2029년에 이 사업이 커질 것으로 계획합니다.\n\n유타 공장 하나가 희토류와 우라늄을 함께 만들고, 지금 매출은 아래쪽 우라늄 상자에서 대부분 나옵니다.\n\n| 사업 | 지금 상태 | 숫자 | 언제 돈이 되나 |\n|---|---|---|---|\n| 우라늄 | 주력 매출원 | 상반기 판매 82만 파운드, 원가 파운드당 약 $23, 장기계약 6건(2032년까지) | 지금 |\n| 희토류 정제 (NdPr) | 상업 규모 생산 성공, 아직 소량 | 2029년까지 연 6,000톤 목표 | 2027년 이후 |\n| 중희토류 (테르븀·디스프로슘) | 7월 공장 착공, 일본 자석 회사 인증 통과 | 2027년 말 회로 완공 목표 | 2028년 이후 |\n| 합금 (한국 오창 공장) | 8월 ASM 인수로 확보 | 연 1,300톤, 2026년 말 3,600톤으로 확장 | 인수 완료, 매출 반영 시작 |\n| 자석 (독일 VAC) | 인수 계약만 체결 | VAC 2025년 이익(EBITDA) 2,900만 달러 | 2027년 초 인수 완료 예정 |\n| 원료 광산 (호주 도널드, 마다가스카르) | 개발 단계 | 도널드 최종 투자 결정 2026년 4분기 예정 | 2028년 이후 |\n\n**쉽게 비유하면**\n\n- 지금의 에너지 퓨얼스는 '빵집' 하나(우라늄)로 돈을 벌면서, 그 돈과 정부 대출로 '밀가루 공장부터 케이크 가게까지'(희토류 자석) 전부를 새로 짓는 중입니다.\n- 빵집은 장사가 잘 됩니다. 우라늄 원가가 파운드당 $23인데 판매가는 $74~80이라, 남는 돈이 큽니다.\n- 하지만 새로 짓는 공장들이 돈을 벌기 전까지는 회사 전체로는 적자입니다.\n\n**재무 상태 (2분기 말)**\n\n- 2분기 매출 2,510만 달러는 1년 전(420만 달러)보다 크게 늘었지만 1분기(3,580만 달러)보다는 30% 줄었고, 영업손실 약 3,000만 달러로 적자 폭이 다시 커졌습니다. 1분기에는 주당 −$0.04로 적자가 작았고 영업현금흐름도 +830만 달러였습니다.\n- 현금은 약 8.78억 달러로 넉넉한 편입니다. 다만 VAC 인수에 현금 7.18억 달러가 들어갑니다.\n- 미 국방부 전략자본실이 7.25억 달러 대출을 조건부로 약속했습니다. 희토류 분리·금속화 공장을 짓는 데 쓰입니다.\n- 증권사들은 2027년에 2013년 이후 처음으로 흑자(주당 약 $0.03)를 낼 것으로 봅니다.\n\n**회사가 제시한 미래 숫자 (1월 타당성 조사, 회사 추정)**\n\n- 유타 희토류 2단계 증설: 투자비 4.1억 달러, NdPr 연 6,000톤 이상, 디스프로슘 연 240톤, 테르븀 연 66톤.\n- 이 증설만으로 첫 15년 연평균 EBITDA 3.11억 달러, 마다가스카르 원료와 합치면 7.65억 달러. 지금 시가총액(약 30억 달러)과 비교하면 큰 숫자지만, 규제 승인 2027년 중반, 가동 2029년 1분기 예정이라 먼 미래의 계획입니다.\n- 2026년 우라늄 가이던스: 판매 150만~200만 파운드, 채굴 200만~250만 파운드.","glossary_md":"| 용어 | 뜻 |\n|---|---|\n| 희석 | 회사가 새 주식을 찍어 기존 주주의 지분 비율이 줄어드는 것 |\n| 시가총액 | 주가 × 주식 수. 시장이 매긴 회사 전체의 값 |\n| P/S (주가매출비율) | 시가총액 ÷ 매출. 높을수록 미래 성장에 대한 기대가 크다는 뜻 |\n| EBITDA | 세금·이자·감가상각 전 이익. 사업 자체가 버는 현금에 가까운 숫자 |\n| ATM 발행 | 시장 가격으로 주식을 조금씩 수시로 팔아 돈을 모으는 방식 |\n| NdPr | 네오디뮴과 프라세오디뮴. 영구자석의 주재료 |\n| 중희토류 | 테르븀·디스프로슘처럼 양이 적고 비싼 희토류. 자석이 열에 강해지게 함 |\n| 모나자이트 | 희토류와 약간의 우라늄이 섞인 모래 광물. 이 회사의 희토류 원료 |\n| 50일 이동평균선 | 최근 50거래일 종가의 평균을 이은 선. 단기 추세 판단에 쓰임 |","sources":[{"t":"Yahoo Finance: Energy Fuels Down 28% in the Past 6 Months (9월 9일)","u":"https://finance.yahoo.com/markets/stocks/articles/energy-fuels-down-28-past-153400034.html"},{"t":"Yahoo Finance: $72 식 생산설비(FPSO) '에레아 위투'가 출항해 2026년 4분기 하루 25만 배럴을 더합니다.\n3. **LNG (액화천연가스):** 카타르·파푸아뉴기니·미국 골든패스 등에 지분이 있습니다. 9월 2030년 LNG 판매 목표를 연 4,000만 톤에서 5,000만 톤으로 올렸습니다.\n\n#### 왜 '지주회사'로 바뀌었나\n\n| 항목 | 내용 |\n|---|---|\n| 무엇이 바뀌었나 | 뉴저지 법인이던 Exxon Mobil Corp(CIK 34088) 위에 텍사스 법인 ExxonMobil Holdings Corp(CIK 2115436)를 올려 상장사를 바꾼 것 |\n| 언제 | 3월 발표 → 5월 27일 주총 승인 (찬성 71.2%, 반대 28.8%) → 7월 1일 효력, 7월 2일부터 새 회사가 XOM으로 거래 |\n| 주주에게는 | 옛 주식 1주가 새 주식 1주로 자동 교환. 할 일 없음 |\n| 회사가 밝힌 이유 | 1989년부터 본사가 텍사스에 있었고, 텍사스의 새 회사법과 '텍사스 기업법원'이 복잡한 회사 분쟁을 빨리 해결해 준다는 것 (다런 우즈 CEO) |\n| 왜 합병 방식인가 | 옛 회사는 자회사로 남아 채권·계약을 그대로 갖고, 새 지주회사가 채권을 보증합니다. 상장사의 법적 주소만 텍사스로 옮기는 가장 매끄러운 방법입니다 |\n| 반대 목소리 | 약 29%가 반대했습니다. 텍사스 법은 회사가 주주제안 자격을 더 까다롭게 할 수 있어, 기후·지배구조 관련 주주 목소리가 약해진다는 것이 비판의 핵심입니다 |\n\n쉬운 비유: 가게(옛 회사)는 그대로 두고, 그 가게를 소유하는 '본사 회사'를 텍사스에 새로 만든 것입니다. 주주는 이제 본사 회사의 주식을 갖고 있고, 장사 내용은 바뀌지 않았습니다. 그래서 SEC 서류도 7월 이전은 옛 번호(34088), 이후는 새 번호(2115436)로 나뉘어 있습니다.\n\n#### 돈 버는 구조: 유가가 오르면 위쪽, 마진이 좋으면 아래쪽\n\n엑슨모빌은 사업을 네 개로 나눕니다. 이익의 대부분은 '업스트림(캐는 사업)'에서 나오고, 유가에 가장 민감합니다.\n\n| 사업 | 하는 일 | 2분기 이익 | 무엇에 움직이나 |\n|---|---|---|---|\n| 업스트림 | 석유·가스 탐사·생산 (퍼미안, 가이아나, LNG) | 92억 달러 | 유가·가스 가격 |\n| 에너지 제품 | 정유: 원유 → 휘발유·경유·항공유 | 41억 달러 | 정제 마진(원유값과 기름값 차이) |\n| 화학 제품 | 플라스틱 원료(올레핀·폴리에틸렌) | 1분기 1억 달러 수준 | 중국 경기, 공급 과잉 |\n| 특수 제품 | 윤활유(모빌 1), 합성수지 | 1분기 7억 달러 수준 | 비교적 안정 |\n\n#### 2026년 2분기 성적표 (7월 31일 발표)\n\n| 항목 | 숫자 |\n|---|---|\n| 순이익 | 145억 달러 (주당 $3.48). 조정 주당 $3.52로 예상 $3.60에 못 미침 |\n| 1분기 대비 | 조정 이익 +67%, 1년 전의 2배 이상 |\n| 영업현금흐름 / 자유현금흐름 | 236억 / 172억 달러 |\n| 주주환원 | 94억 달러 (배당 43억 + 자사주 51억) |\n| 순부채 | 분기 중 70억 달러 감소 |\n| 생산량 | 하루 451만 배럴 (1분기 459만) |\n| 중동 피해 | 카타르 LNG 등 하루 약 45만 배럴이 멈춤. 호르무즈가 3분기 내내 닫히면 중동 생산이 작년보다 하루 약 75만 배럴 줄어듦 |\n\n쉬운 비유: 엑슨모빌은 '우물(유전)'과 '주방(정유소)'을 둘 다 가진 식당입니다. 재료값(유가)이 오르면 우물에서 돈을 벌고, 재료값이 내려도 주방 마진이 어느 정도 버텨줍니다. 그래서 석유 한 가지만 하는 회사보다 주가 흔들림이 작은 편입니다.\n\n#### 앞으로의 숫자\n\n| 항목 | 내용 |\n|---|---|\n| 3분기 실적 | 10월 30일 발표. 시장 예상 주당 $3.93, 매출 약 1,049억 달러 |\n| 실적 미리보기(8-K) | 회사는 분기마다 끝난 뒤 첫째 주에 '실적 고려사항' 8-K를 냅니다 (2분기분은 7월 7일). 3분기분은 10월 9일 확인 시점까지 EDGAR에 올라오지 않았습니다 (마지막 8-K는 9월 25일 채권 발행). 2분기분에서는 유가 상승 효과 +35~39억 달러, 중동 물량 차질 −6~8억 달러를 예고했습니다 |\n| 자사주 매입 | 2026년 200억 달러 목표 유지. 회사는 \"재무를 더 탄탄히 한 뒤 환원을 늘리겠다\"고 밝힘 |\n| 배당 | 3분기 주당 $1.03 (9월 10일 지급). 보통 10월 말 실적 때 4분기 배당을 결정 |\n| 가이아나 | 5번째 FPSO 4분기 가동, +25만 배럴/일 |\n| 퍼미안 | 2030년까지 연 9% 성장, 2030년 이후 하루 250만 배럴 목표 |\n| 골든패스 LNG (미국) | 2027년 말 완전 가동, 연 1,800만 톤 수출 |\n| 부채 관리 | XTO 회사채(2036~2038년 만기) 9월 27일 조기 상환 |","gov_md":"엑슨모빌은 미국 정부의 돈을 받는 회사가 아닙니다. 대신 트럼프 행정부의 '에너지 지배(energy dominance)' 전략에서 가장 큰 선수입니다. 2026년에는 이란 전쟁으로 중동 석유·LNG가 막히자, 미국·남미에서 나오는 엑슨의 석유가 더 귀해졌습니다. 동시에 트럼프는 엑슨이 돈을 너무 많이 번다고 공개 압박하기도 했습니다.\n\n#### 이란 전쟁과 유가 흐름 (2026년)\n\n| 날짜 | 일어난 일 | 유가 |\n|---|---|---|\n| 2월 28일 | 미국·이스라엘 이란 공습, 하메네이 사망. 이란이 호르무즈 해협 봉쇄 | 전쟁 전 약 $72 |\n| 3월 초 | 브렌트유 2022년 8월 이후 처음 $100 돌파. IEA 비축유 4억 배럴 방출 | WTI 3월 2일 $71 → $100 이상 |\n| 4월 초 | 유가 장중 최고 $126 | 연중 최고 |\n| 4월 7~8일 | 파키스탄 중재로 2주 휴전, 호르무즈 일부 재개방 | 급락 |\n| 4월 17일 | 호르무즈 재개방 | 브렌트 $90 아래 |\n| 6월 15~17일 | 이란과 임시 합의, 호르무즈 위험 감소 | 전쟁 후 최저 수준 |\n| 7월 초 | 브렌트 약 $70~73 | 전쟁 전보다 낮아짐 |\n| 7월 13~14일 | 휴전 붕괴, 이란 해협 재봉쇄. 미국 해상 봉쇄 재개, 트럼프 '통과 선박에 화물값 20% 수수료' 언급. 7월 23일 후티 반군이 홍해에서 유조선 2척 공격 (호르무즈 대신 사우디 수출 통로가 된 홍해도 위험. 엑슨 직접 영향은 확인 못함) | 13일 +9%, 브렌트 $87 |\n| 7월 24일 | 해협 통행 '가느다란 줄기' 수준, 미국 전략비축유 1983년 이후 최저 | 브렌트 $88 (주간 +16%) |\n| 7월 27일 | 미·이란 군사작전 일시 중단 보도 | 브렌트 −8%, 약 $90 |\n| 8월 10일 | 호르무즈 협상 교착, 이란 혁명수비대 \"해협 통제 유지\" | 약 +3% |\n| 9월 중순 | 브렌트 다시 $100 돌파 보도 | $100 안팎 |\n\n#### 정부와 엑슨이 얽히는 지점\n\n| 주제 | 정부 쪽 움직임 | 엑슨에 주는 의미 |\n|---|---|---|\n| 유가 이익 비판 | 8월 3~4일 트럼프: 셰브론·엑슨이 \"너무 많이 번다\", \"이익을 국민에게 돌려줘라\" | 단기 악재. 횴활 수장세(windfall tax) 같은 법안은 확인되지 않음 |\n| 베네수엘라 | 1월 미군이 마두로 대통령을 붙잡은 뒤 석유사들에 1,000억 달러 투자 요청. 우즈 CEO가 \"투자 불가능(uninvestable)\"이라 하자 트럼프가 \"엑슨은 빼겠다\" 반발(1월 11일) | 5월 우즈 \"긍정적\", 9월 16일 WSJ: 엑슨이 오리노코 유전 투자 합의에 근접. 법·계약 조건이 관건 |\n| 가이아나 | 베네수엘라가 가이아나 영토 일부를 자기 땅이라 주장 | 일부 광구가 국제사법재판소(ICJ) 판결을 기다리며 '불가항력' 상태 |\n| LNG와 동맹 | 전쟁 전 세계 LNG의 약 5분의 1이 페르시아만에서 나왔는데 막힘. 아시아·유럽이 미국산을 찾음 | 카타르 LNG(하루 약 45만 배럴) 손실은 악재, 미국 골든패스 LNG·2030년 5,000만 톤 목표는 호재 |\n| 중국 수요 | 미·중 경쟁 속에서도 아시아는 최대 에너지 시장 | 엑슨: 2050년 세계 LNG 수요의 70%가 아시아. 다만 중국 화학 공장 증설은 엑슨 화학 사업의 마진을 누름 |\n| 미국 생산 확대 | 퍼미안 시추 확대, 전략비축유 재축적 필요 | 퍼미안 하루 180만 배럴로 중동 손실을 메움 |\n\n**핵심:** 엑슨 주가는 '전쟁이 길어질수록 유리'한 방향으로 움직였습니다. 휴전·협상 소식이 나오면 하루에 4~5%씩 빠졌고, 해협이 다시 닫히면 올랐습니다. 그래서 대통령의 휴전 발표와 대통령 계좌의 엑슨 주식 매매 시점이 겹친 것이 문제로 제기됐습니다 (아래 '내부자·유명인 매매' 참고).","gov_title":"정부·에너지 안보와의 관계","events":[{"date":"2026-10-08","title":"현재가 $168.50","detail":"현재","move":"$168.50 (3월 고점 대비 −1.7%)"},{"date":"2026-10-01","title":"웰스파고 중립 하향","detail":"웰스파고, 매수 → 중립으로 하향 (목표가 $182 유지)","move":"$163.82 (소폭 하락)"},{"date":"2026-09-16","title":"베네수엘라 투자 근접","detail":"WSJ: 엑슨이 베네수엘라 오리노코 유전 투자 합의에 근접","move":"$162.01 (17일 장중) (−0.8%, 반응 작음)"},{"date":"2026-09-14","title":"LNG 목표 5천만 톤","detail":"2030년 LNG 판매 목표 4,000만 → 5,000만 톤 상향","move":"$169.32 (15일) (하반기 최고)"},{"date":"2026-09-11","title":"브렌트 $100 재돌파","detail":"브렌트유 다시 $100 돌파 보도","move":"에너지주 강세"},{"date":"2026-08-12","title":"워런 서한","detail":"워런 상원의원 등, 트럼프 주식 거래 해명 요구 서한 (엑슨 매수 포함)","move":"$159.75 (영향 작음)"},{"date":"2026-08-10","title":"호르무즈 협상 교착","detail":"호르무즈 재개방 협상 교착, 이란 \"해협 통제 유지\"","move":"$159.79 (+4.4%)"},{"date":"2026-08-03","title":"트럼프 이익 환수 압박","detail":"트럼프 \"셰브런·엑슨이 너무 많이 번다, 국민에게 돌려줘라\"","move":"$153.96 (4일) (약세)"},{"date":"2026-07-31","title":"2분기 실적","detail":"2분기 실적: 조정 주당 $3.52 (예상 $3.60 하회), 자사주 51억 달러","move":"$155.44 (장 전 −2%, 일부 회복)"},{"date":"2026-07-27","title":"미·이란 작전 중단 보도","detail":"미·이란 군사작전 일시 중단 보도, 브렌트 −8%","move":"$154.77 (장 전 −3%)"},{"date":"2026-07-13","title":"휴전 붕괴","detail":"휴전 붕괴, 이란 해협 재봉쇄, 유가 +9%","move":"$144.51 (+4.1%)"},{"date":"2026-07-01","title":"텍사스 지주회사 전환","detail":"텍사스 지주회사(ExxonMobil Holdings) 전환 완료","move":"중립"},{"date":"2026-06-15","title":"이란 임시 합의","detail":"이란과 임시 합의로 호르무즈 위험 감소, 에너지주 급락","move":"$140.92 (−4.1%, 2월 이후 최저)"},{"date":"2026-05-27","title":"주총 텍사스 이전 승인","detail":"주총에서 텍사스 이전 승인 (찬성 71.2%)","move":" 일)와 웰스파고(10월 1일)가 매수에서 중립으로 낮췄습니다. MarketBeat 집계로는 25명 중 매수 11, 중립 14로 '보유'가 다수입니다.","**평화가 오면 유가가 떨어짐:** 4월 1일(−5.2%), 4월 8일(−4.7%), 6월 15일(−4.1%)처럼 휴전·합의 때마다 크게 빠졌습니다. 스탠다드차터드는 유가가 연말 $70 쪽으로 내려갈 것으로 봅니다. 7월 초 브렌트는 전쟁 전보다도 낮은 $70 안팎까지 내려간 적이 있습니다.","**전쟁은 엑슨에도 피해:** 카타르 LNG 등 하루 약 45만 배럴이 멈췄고, 올해 중동 관련 손실이 9억 달러, 2분기 자산 손상 11억 달러가 잡혔습니다. 유가가 높아도 2분기 실적은 예상을 못 미쳤습니다 (CFO: \"가격이 너무 급하게 흔들려 예측이 어렵다\").","**정치 위험:** 트럼프가 \"너무 많이 번다\"고 공개 비판했고, 호르무즈 통과 선박 20% 수수료 같은 예측하기 어려운 정책도 나왔습니다. 베네수엘라는 자산을 두 번 빼앗긴 곳이고, 계약은 아직 확정되지 않았습니다.","**화학 사업 부진:** 중국의 대규모 증설로 플라스틱 원료 마진이 낮아, 화학 부문 이익은 1분기 1억 달러 수준에 머물렀습니다.","**지배구조 비판:** 텍사스 이전에 주주 29%가 반대했습니다. 주주제안이 어려워져 소액 주주의 목소리가 줄어든다는 지적입니다."],"analysts_md":"증권사 평균 목표가는 $173.64(22명, Yahoo 기준)로 현재가보다 약 3% 높습니다. 목표가는 8~9월에 대부분 올랐지만, 주가가 더 빨리 올라서 의견은 '매수'에서 '중립'으로 옮겨가는 중입니다. 최고 $200(제프리스), 최저 $142.\n\n| 날짜 | 증권사 | 의견 | 목표가 | 현재가 대비 |\n|---|---|---|---|---|\n| 10월 5일 | 바클레이즈 | 매수 유지 | $177 | +5% |\n| 10월 1일 | 웰스파고 | 매수 → 중립 (하향) | $182 | +8% |\n| 9월 28일 | TD 코움 | 매수 | $168 → $180 | +7% |\n| 9월 25일 | HSBC | 보유 | $158 → $172 | +2% |\n| 9월 25일 | UBS | – | $172 | +2% |\n| 9월 22일 | 골드만삭스 | 중립 | $168 → $169 | +0% |\n| 9월 21~24일 | RBC | 시장수익률 | $160 → $180 | +7% |\n| 9월 3일 | 파이퍼샌들러 | 중립 | $158 → $185 | +10% |\n| 8월 19일 | 모건스탠리 | 비중 확대 | $168 → $177 | +5% |\n| 8월 17일 | 제프리스 | 매수 | $184 → $200 (최고) | +19% |\n| 8월 12일 | BMO | 시장수익률 | $160 → $170 | +1% |\n| 8월 3일 | JP모건 | 비중 확대 | $158 → $166 | −1% |\n| 7월 28일 | 뱅크오브아메리카 | 매수 → 중립 (하향) | $154 → $158 | −6% |\n\nMarketBeat는 HSBC 목표가를 $90으로 표시하지만, StockAnalysis는 $172로 적고 있어 $90은 입력 오류로 보입니다.","insider_title":"내부자·유명인 매매 (2025~)","insider_md":"현재가는 $168.50 (2026년 10월 8일 종가)입니다. '현재가 대비'는 그 날 가격에서 지금까지 주가가 얼마나 움직였는지입니다. 매도인데 +면 '팔고 나서 더 올랐다'는 뜻입니다.\n\n#### 내부자 (SEC Form 4)\n\n**장내 매수: 2025년 이후 0건.** 우즈 CEO를 포함해 임원·이사 누구도 자기 돈으로 주식을 사지 않았습니다. 대형주에서는 흔한 일입니다 (임원은 주식 보상으로 이미 많이 보유). 7월 새 지주회사(CIK 2115436)로 바뀐 뒤에도 Form 4 장내 거래는 없었습니다.\n\n**장내 매도: 1명, 10번, 총 23,818주, 약 310만 달러 (평균 $130.25).** 다른 임원·이사의 장내 매도는 없었습니다. 10b5-1(미리 정해둔 자동 매도 계획) 표시는 없습니다.\n\n| 시기 | 누구 | 수량 | 매도가 | 금액 | 현재가 대비 |\n|---|---|---|---|---|---|\n| 2026년 3월 2일, 16일 | 다린 탈리 (전략기획 부사장) | 3,230주 | $155.50~157.82 | 약 51만 달러 | +7~8% |\n| 2026년 2월 2일, 9일 | 같은 사람 | 8,230주 | $139.75~149.18 | 약 118만 달러 | +13~21% |\n| 2025년 12월 15일, 17일 | 같은 사람 | 6,000주 | $117.19~118.75 | 약 71만 달러 | +42~44% |\n| 2025년 2·3·8월 | 같은 사람 | 6,358주 | $110.00~113.00 | 약 71만 달러 | +49~53% |\n\n읽는 법: 꼬박꼬박 나눠 파는 모양이라 회사 전망보다는 개인 자금 관리로 보입니다. 금액도 시총 6,930억 달러 회사에서는 아주 작습니다.\n\n#### 트럼프 대통령 계좌 (OGE 278-T 신고서)\n\n트럼프의 주식은 외부 운용사가 관리하는 계좌에서 거래됩니다 (일부는 '운용사 재량' 표시). 신고서에는 금액 범위만 있고 가격은 없어서, 아래 가격은 그날 종가입니다. Newsweek 계산으로 2025년 말 엑슨 보유액은 318만~1,245만 달러였습니다.\n\n| 날짜 | 거래 | 금액 범위 | 그날 종가 | 현재가 대비 | 그날 무슨 일이 |\n|---|---|---|---|---|---|\n| 7월 31일 | 매수 | 25만~50만 달러 | $155.44 | +8.4% | 2분기 실적 발표일 |\n| 7월 17일, 24일 | 매도 각 1건 | 각 1,001~15,000달러 | $147.36 / $156.94 | +14% / +7% | 휴전 붕괴 직후 |\n| 6월 12·16·23일 | 소액 거래 3건 (대부분 매도) | 각 1,001~15,000달러 | $139.73~147.01 | +15~21% | 이란 임시 합의 전후 |\n| 5월 18일 | 매도 | 5만~10만 달러 | $160.49 | +5.0% |  |\n| 5월 15일 | 매수 | 5만~10만 달러 | $157.92 | +6.7% | 하루 +4.1% |\n| 5월 11일 | 매수 | 10만~25만 달러 | $149.68 | +12.6% |  |\n| 4월 27일 | 매수 | 1.5만~5만 달러 | $148.19 | +13.7% |  |\n| 4월 17일 | 매도 | 1.5만~5만 달러 | $146.44 | +15.1% | 호르무즈 재개방 |\n| 4월 15일 | 매수 | 1.5만~5만 달러 | $149.01 | +13.1% |  |\n| 4월 10일 | 매도 | 10만~25만 달러 | $152.51 | +10.5% | 휴전 두어 날 뒤 |\n| **4월 7일** | **매도** | **50만~100만 달러** | **$163.91** | **+2.8%** | **트럼프가 이란 2주 휴전 발표. 다음 날 시가 $153.52 (−6.3%)** |\n| 3월 25일 | 매수 | 1.5만~5만 달러 | $163.26 | +3.2% |  |\n| 3월 23일 | 매수 2건 | 1.5만~5만 + 1,001~15,000달러 | $161.13 | +4.6% | 트럼프 \"이란과 생산적 대화\" 글로 유가 하락한 날 |\n| 3월 17일 | 매수 | 1,001~15,000달러 | $158.81 | +6.1% |  |\n| 3월 11일, 12일 | 매수 | 1.5만~5만, 5만~10만 달러 | $151.58 / $153.53 | +10~11% | 전쟁 2주차 |\n| 3월 6일 | 매도 | 1.5만~5만 달러 | $151.21 | +11.4% |  |\n| 3월 2일 | 매수 | 10만~25만 달러 | $154.22 | +9.3% | 전쟁 후 첫 거래일 |\n\n합계 (2026년): 매수 약 63만~148만 달러, 매도 약 68만~151만 달러로 비슷합니다. 전쟁 초반에는 사고, 휴전 발표일에 가장 크게 팔았고, 주가가 내려온 5·7월에 다시 산 모양입니다. 4월 7일 매도가인 $163.91은 지금보다 2.8% 낮아, 결과적으로는 크게 이긴 거래는 아니지만 바로 다음 날의 급락을 피했습니다.\n\n**워런 상원의원 서한 (8월 12일):** 엘리자베스 워런 상원의원과 로버트 가르시아 하원의원(하원 감독위 민주당 간사)이 트럼프에게 해명을 요구했습니다. 2026년 1분기에만 3,555건(최대 약 5억 달러), 취임 첫해 1.4만 건 이상(최대 10.6억 달러)을 거래했다는 내용입니다. 엑슨 관련으로는 3월 23일 장 전 '이란과 생산적 대화' 글을 올린 날 엑슨·셰브론·필립스66·록히드마틴 등 전쟁 수혜주를 산 것을 예로 들었습니다. 답변 기한은 8월 28일이었고, 트럼프 측은 \"외부 운용사가 독립적으로 거래한다\"는 입장입니다. 서한 자체는 4월 7일 매도를 직접 다루지 않았고, 그 연결은 X·언론에서 나왔습니다.\n\n#### 의회 의원 (2025년 이후, 하원·상원 신고)\n\n낸시 펠로시의 엑슨 거래는 없습니다. 대부분 1,001~15,000달러 소액이고, 아래는 2026년 거래와 금액이 큰 것입니다.\n\n| 거래일 | 의원 | 거래 | 금액 범위 | 그날 종가 | 현재가 대비 |\n|---|---|---|---|---|---|\n| 2026년 8월 31일 | 케빈 허른 (하원, 공화당, 오클라호마) | 매도 | 10만~25만 달러 | $160.95 | +4.7% |\n| 2026년 7월 20일 | 짐 하임스 (하원, 민주당) | 매도 | 1.5만~5만 달러 | $148.36 | +13.6% |\n| 2026년 6월 18일, 5월 22일 | 로 칸나 (하원, 민주당) | 매도 | 각 1,001~15,000달러 | $137.81 / $154.92 | +22% / +9% |\n| 2026년 6월 16일 | 매스필 밴 엑스 (하원, 공화당) | 매도 | 1,001~15,000달러 | $141.86 | +18.8% |\n| 2026년 3월 27일 | 앨런 암스트롱 (상원, 공화당) | 전량 매도 | 1,001~15,000달러 | $170.99 | −1.5% |\n| 2026년 2월 10일 | 길 시스네로스 (하원, 민주당) | 매수 | 5만~10만 달러 | $151.59 | +11.2% |\n| 2026년 2월 2일, 4일 | 조시 고트하이머 (하원, 민주당) | 매수 2건 | 각 1,001~15,000달러 | $138.40 / $147.59 | +22% / +14% |\n| 2026년 1월 9일 | 길 시스네로스 | 매도 | 5만~10만 달러 | $124.61 | +35.2% |\n| 2026년 1월 8일 | 존 부즈먼 (상원, 공화당) | 매수 | 1,001~15,000달러 | $122.91 | +37.1% |\n\n2025년에는 로 칸나, 리사 맥클레인, 제퍼슨 시브(5만~10만 달러 매수·매도), 브루스 웨스터먼·케이티 브릿(상원) 등의 소액 거래가 있었고 당시 주가는 $105~120 수준이었습니다. 7월 2일 '교환(Exchange)' 기록은 지주회사 전환에 따른 자동 주식 교환이지 매매가 아닙니다.\n\n#### 대형 기관 (13G/13D)\n\n| 제출일 | 기관 | 지분 | 주식 수 | 비고 |\n|---|---|---|---|---|\n| 2026년 8월 7일 | 스테이트스트리트 | 5.0% (6월 말) | 2억 704만 주 | 3월 말 5.1%(2억 1,405만 주)에서 소폭 감소 |\n| 2026년 4월 29일 | 뱅가드 캐피털 매니지먼트 | 7.51% (3월 말) | 3억 1,324만 주 | 뱅가드가 조직을 나눠 신고. 본체(The Vanguard Group)는 3월 0%로 정정 (2025년 2월엔 10.06%) |\n| 2026년 5월 20일 | 엑슨모빌 자신 (13D/A) | – | – | 엑슨이 파이오니어 인수로 갖고 있던 유전서비스사 프로페트로(PUMP) 주식 1,660만 주를 $16.66에 블록딜로 전량 매도 (약 2.77억 달러). 엑슨 주식 이야기가 아님 |\n\n뱅가드·스테이트스트리트는 지수 펀드 운용사라 매수 가격이 따로 없고, 시가총액 비중대로 기계적으로 보유합니다. 엑슨 자체가 자사주를 사서 주식 수를 줄이고 있어, 매도하지 않아도 지분율은 조금씩 늘어날 수 있습니다.","next_md":"- **10월 초·중순:** 3분기 '실적 고려사항' 8-K. 유가 효과, 중동 물량 손실(호르무즈 봉쇄 시 하루 약 75만 배럴 감소 예고), 손상 규모\n- **10월 30일 (장 전):** 3분기 실적. 예상 주당 $3.93, 매출 약 1,049억 달러. 2분기처럼 예상을 못 미치는지\n- **10월 말~11월:** 4분기 배당 결정 (현재 분기 $1.03), 2026년 자사주 200억 달러 달성과 2027년 규모\n- **4분기:** 가이아나 5번째 FPSO(에레아 위투) 가동, 하루 +25만 배럴\n- **수시:** 미·이란 협상과 호르무즈 재개방 여부. 휴전·합의 소식은 하루 −4~5% 사례가 많았음\n- **수시:** 브렌트유가 $100 위에 머무는지 (스탠다드차터드는 연말 $70대 예상)\n- **수시:** 베네수엘라 오리노코 투자 계약 체결 여부와 조건, 가이아나 국경 분쟁 ICJ 판결\n- **수시:** 트럼프의 석유사 이익 압박이 실제 조치(세금·수출 제한 등)로 이어지는지\n- **다음 OGE 278-T:** 8월 이후 트럼프 계좌의 엑슨 매매, 워런 서한에 대한 답변 공개 여부\n- **12월 (예년 기준):** 회사 연간 계획 발표. 2027년 투자·생산·환원 목표\n- **2027년 말:** 골든패스 LNG 완전 가동 (연 1,800만 톤)","glossary_md":"| 용어 | 뜻 |\n|---|---|\n| 업스트림 | 석유·가스를 찾고 캐내는 사업. 유가가 오르면 이익이 가장 크게 늘어남 |\n| 정제 마진 | 원유를 사서 휘발유·경유로 만들어 팔 때 남는 차이 |\n| 브렌트유 / WTI | 유럽(북해)과 미국의 대표 원유 가격. 뉴스에서 말하는 '유가' |\n| 호르무즈 해협 | 페르시아만에서 바다로 나가는 좁은 바닷길. 중동 석유·LNG의 통로 |\n| LNG | 천연가스를 영하 162도로 얼려 액체로 만든 것. 배로 멀리 실어 나를 수 있음 |\n| FPSO | 바다 위에 떠 있는 석유 생산·저장 설비. '바다 위 석유 공장' |\n| 셔일오일 | 단단한 암석(셔일) 사이에 갇힌 석유. 물을 쏘아 깨서(수압파쇄) 뽑아냄. 퍼미안이 대표 지역 |\n| 지주회사 | 사업을 직접 하기보다 다른 회사(자회사)를 소유하는 본사 회사 |\n| 자사주 매입 | 회사가 자기 주식을 사서 없애는 것. 주식 수가 줄어 한 주의 몸이 커짐 |\n| 자유현금흐름 | 벌어들인 현금에서 설비 투자를 뺀 나머지. 배당·자사주의 재원 |\n| 선행 PER | 주가 ÷ 앞으로 1년 예상 주당이익. 낮을수록 이익에 비해 싼 편 |\n| 수정주가 | 배당을 내주면 주가가 떨어지는 효과를 보정해 과거 가격을 조금 낮춰 둔 값 |\n| Form 4 | 임원·이사가 자사 주식을 사고팔 때 2영업일 안에 SEC에 내는 신고서 |\n| 13G / 13D | 한 회사 주식을 5% 넘게 가진 투자자의 신고서. 13G는 단순 투자, 13D는 경영 관여 가능성 |\n| OGE 278-T | 미국 대통령·고위 공직자가 주식 거래를 신고하는 서류. 금액은 범위로만 적음 |\n| 10b5-1 계획 | 미리 정해둔 일정·가격에 따라 자동으로 파는 계획. 내부자 거래 오해를 줄임 |","sources":[{"t":"ExxonMobil IR: 2026년 2분기 실적 발표 (7월 31일)","u":"https://investor.exxonmobil.com/company-information/press-releases/detail/1208"},{"t":"SEC 8-K: 2Q26 Earnings Considerations (7월 7일)","u":"https://www.sec.gov/Archives/edgar/data/0002115436/000211543626000003/f8k2q991070726.htm"},{"t":"SEC 8
