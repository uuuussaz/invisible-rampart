+22%, 예상 1.41억), 매출총이익률 −13%(1년 전 −55%), 전해조 매출 4,080만 달러(+343%)","move":"발표 당일 +12.8%(이미 강세), 다음 날 장전 +8%이나 종가 +1.1%"},{"date":"2026-04-29","title":"연료전지주 동반 급등","detail":"블룸에너지 실적 뒤 연료전지주 동반 급등(FuelCell +37%, Bloom +27%) + Clear Street 목표가 $3.50","move":"+12.5%"},{"date":"2026-04-20","title":"시장 약세 속 상승","detail":"뚜렷한 회사 뉴스 없음(시장 약세 속 상승으로 보도)","move":"+15.8%"},{"date":"2026-04-02","title":"Hy2gen 설계 선정","detail":"캐나다 Hy2gen 퀘벡 프로젝트(275MW) 설계 단계 선정 보도","move":"4/2 +7.1%, 4/6 +11.6% (4월 한 달 +38.5%)"},{"date":"2026-03-03","title":"4분기 실적·CEO 취임","detail":"4분기 실적: 매출 약 2.25억 달러(+17.6%), 매출총이익률 +2.4%(수년 만의 첫 플러스), 2026년 4분기 EBITDAS 흑자 목표 재확인. 호세 루이스 크레스포 CEO 취임","move":"+23.2% (공매도 25%대)"},{"date":"2026-02-26","title":"뉴욕 부지 매각 계약","detail":"Stream Data Centers에 뉴욕 게이트웨이 부지를 최대 1.42억 달러에 매각하는 계약","move":"0%"},{"date":"2026-02-12","title":"주식 한도 증액","detail":"주총에서 주식 발행 한도를 15억 → 30억 주로 늘리는 안건 통과 (두 번 연기 끝에 가결)","move":"−7.1%"},{"date":"2026-01-22","title":"마시 레딧 AMA","detail":"창업 CEO 앤디 마시의 레딧 AMA 앞두고 급등 (주식 한도 증액 안건 설명)","move":"+16.7%"},{"date":"2026-01-02","title":"전환사채 교체","detail":"12월에 고금리(15%) 빚을 6.75% 전환사채 4.31억 달러로 교체, NASA 액체수소 공급·AI 데이터센터 기대","move":"+13.2%"}],"chart_events":["2026-01-22","2026-03-03","2026-05-27","2026-06-05","2026-08-04","2026-09-29"],"bull":["**매출총이익이 거의 0까지 올라왔습니다.** 2025년 2분기 −31%, 2026년 1분기 −13%, 2분기 약 0%(−170만 달러). 영업비용은 1년 만에 절반(1.23억 → 6,200만 달러)으로 줄었고, 영업손실도 1.77억 → 6,400만 달러로 줄었습니다.","**이익 목표가 구체적입니다.** 2026년 4분기 EBITDAS 흑자, 2027년 말 영업이익 흑자, 2028년 말 전체 흑자. 8월에 \"4분기 목표는 궤도에 있다\"고 다시 말했고, 올해 매출 성장 전망도 13~15%에서 15~16%로 올렸습니다.","**전해조 주문이 늘고 있습니다.** 1분기 전해조 매출 4,080만 달러(+343%). 덴마크 280MW(+1GW 이상 우선 공급사), 캐나다 275MW(설계 단계), 포르투갈 100MW(시운전), 호주 50MW, 영국 30MW.","**반복 매출이 쌓이고 있습니다.** 지게차 연료전지 납품 1,666대(+125%), 두 대형 고객이 3년 안에 2만 대 이상 교체 예정, 서비스 매출 +82%에 마진 27%.","**돈을 아끼고, 주식 안 찍고 현금을 마련하는 중입니다.** 2분기 현금 순사용 약 6,100만 달러(직전 분기보다 58% 감소). 자산 매각 목표 2.75억 달러 중 약 5,200만 달러를 이미 받았고, 세액공제 판매로 3,920만 달러를 받았습니다. 상반기에는 시장에서 주식을 한 주도 팔지 않았습니다.","**잠재 희석 하나가 사라졌습니다.** 월마트가 보유한 신주인수권(최대 4,219만 주)을 2025년 12월 30일 취소·포기했습니다.","**공매도가 많아 상승 때 급등하기 쉽습니다.** 유통주식의 약 23%가 공매도 상태입니다. 3월 3일(+23%)처럼 좋은 숫자가 나오면 공매도 청산이 상승을 키웠습니다.","**연료전지 세액공제 30%는 유지됐습니다.** 2025년 7월 새 세법에서도 살아남아 고객의 구매 부담을 낮춥니다.","**증권사 평균 목표가는 현재가의 두 배 수준입니다.** 약 $3.5 (현재가 대비 +108%)."],"bear":["**아직 적자이고 현금이 계속 나갑니다.** 2026년 상반기 순손실 4.36억 달러, 영업현금흐름 −2.44억 달러, 누적 적자 87억 달러. 자유롭게 쓸 현금 1.62억 달러는 지금 속도(분기 약 6,100만 달러)면 3분기 정도입니다. 나머지 현금 5.1억 달러는 용도가 묶여 있습니다.","**주식 수가 이미 많이 늘었고 더 늘 수 있습니다.** 2025년 상반기 평균 10.4억 주 → 2026년 상반기 13.9억 주(+34%). 시장 매각 한도 9.44억 달러(ATM)와 요크빌 펀드 10억 달러(SEPA)가 남아 있고, 발행 한도도 30억 주로 두 배가 됐습니다. 2월 증자 안건은 찬성이 부족해 두 번 연기된 끝에 겨우 통과했습니다.","**빚이 큽니다.** 전환사채 4.31억 달러(연 6.75%, 2033년 만기), 분기 이자비용 1,690만 달러. 행사가 $7.75 신주인수권(부채 1.36억 달러)과 전환사채는 주가가 오르면 장부상 손실이 커져, 2분기 순손실 1.9억 달러 중 약 1억 달러가 이런 평가손실입니다.","**정부 지원이 줄었습니다.** 16.6억 달러 DOE 대출보증 해지, 청정수소 세액공제 건설 시한이 2028년 1월 1일로 당겨짐, 2025년 10월 미 정부가 수소 허브 일부 자금 취소. 대출과 관련해 회사를 상대로 한 주주 소송도 진행 중입니다.","**중국 가격 경쟁.** 중국산 알칼라인 전해조 스택이 서구산의 약 4분의 1 가격(IEA 2026년 6월). 플러그의 PEM 방식과의 직접 비교는 확인 못함.","**하반기 쏠림이 큽니다.** 올해 목표를 맞추려면 하반기 매출이 4.75억~4.82억 달러(전년 하반기보다 18~20% 증가)여야 하는데 2분기는 1.78억 달러였습니다. 덴마크 280MW도 고객의 진행 통보와 투자 최종결정(FID) 전이라, 매출로 잡히기까지 시간이 걸립니다.","**'흑자'의 기준이 느슨합니다.** 올해 목표는 주식보상비용 등을 뺀 EBITDAS이고, 수소 연료 사업은 마진 −48%로 여전히 손실입니다.","**내부 변화와 매도 계획.** COO 사임(10월 23일 퇴임), 이사 사임(6월), 앤디 마시 의장이 8월 27일부터 최대 60만 주를 팔 수 있는 거래 계획을 5월 28일 세웠습니다.","**증권사 시각이 엇갈립니다.** 평균은 '보유'이고 매도 의견도 있습니다(BMO 목표가 $1.20, Morgan Stanley $1.65). 하루 ±10% 이상 움직인 날이 올해 13번입니다."],"analysts_md":"증권사 평균 의견은 '보유'이고, 평균 목표가는 약 $3.5로 현재가($1.68)보다 약 108% 높습니다. 다만 목표가 범위가 $0.75~$7로 넓어(현재가 대비 −55% ~ +317%) 의견 차이가 큽니다. 집계 사이트마다 숫자가 조금씩 다릅니다(StockAnalysis: 평균 $3.54, 중간값 $4.00, 대략 18~20명 / MarketBeat: 평균 $3.51, 16명).\n\n| 날짜 | 증권사 | 의견 | 목표가 | 현재가($1.68) 대비 |\n|---|---|---|---|---|\n| 2026-09-30 | Craig-Hallum | 매수 (유지) | $5 (5월 상향 보도, 최근 수치 확인 못함) | +198% |\n| 2026-09-29 | H.C. Wainwright | 매수 (유지) | $7 | +317% |\n| 2026-09-16 | UBS | 보유 (StockAnalysis) / 8월 11일 매수 $5 (MarketBeat) — 자료가 엇갈림 | $4 (9/16 기준) | +138% |\n| 2026-09-03 | Jefferies | 보유로 상향 | 없음 | — |\n| 2026-08-12 | Roth Capital | 매수 | $3.5 → $5 | +198% |\n| 2026-08-12 | Wolfe Research | 보유 | 없음 | — |\n| 2026-08-11 | Oppenheimer | 시장수익률 (보유) | 없음 | — |\n| 2026-07-10 | Susquehanna | 중립 | $3.75 → $2.50 | +49% |\n| 2026-07-09 | Morgan Stanley | 비중축소 (매도성) | $1.50 → $1.65 | −2% |\n| 2026-07 | BMO Capital | 매도성 유지 | $1.20 | −29% |\n| 2026-04-28 | Clear Street | 매수 | $3 → $3.50 | +108% |\n| 2026-03 | Wells Fargo | — | $1.50 → $2 | +19% |\n\n증권사들의 목표가는 대체로 상승 구간(4~5월)에 올렸고, 7월에는 내리는 쪽이 늘었습니다. 날짜·금액이 확인된 것만 적었습니다.","insider_title":"내부자·유명인 매매 (2025~)","insider_md":"2025년 이후 내부자 장내 매수는 3건, 약 101만 달러이고 매도는 10건, 약 97만 달러로 금액이 비슷합니다. 매수의 91%는 CFO 한 사람의 2025년 5~6월 매수입니다. 현재가는 $1.68 (2026년 10월 9일 종가)입니다. 내부자 지분은 약 4.5%, 기관 지분은 약 73%입니다.\n\n#### 내부자 매수 (SEC Form 4 장내 매수 전체)\n\n| 날짜 | 누가 | 직책 | 수량 | 매수가 | 금액 | 현재가 대비 |\n|---|---|---|---|---|---|---|\n| 2025년 12월 15일 | 호세 루이스 크레스포 | 당시 사장 겸 최고매출책임자, 2026년 3월부터 CEO | 37,300주 | $2.34 | 약 8.7만 달러 | −28.2% |\n| 2025년 6월 9일 | 폴 미들턴 | CFO | 650,000주 | $1.0339 | 약 67.2만 달러 | +62.5% |\n| 2025년 5월 16일 | 폴 미들턴 | CFO | 350,000주 | $0.7154 | 약 25.0만 달러 | +134.8% |\n\n- CFO 미들턴의 두 번 매수(100만 주, 약 92만 달러, 평균 $0.92)는 지금 아직 수익권입니다. 현재가 기준 평가액이 약 168만 달러로 매수 금액 대비 +82%입니다. 두 건 모두 사전 매매계획(10b5-1) 없이 시장에서 직접 산 것으로 공시됐습니다. 다만 주가가 $0.7~$1였던 2025년 봄이라 매수가가 지금보다 낮습니다.\n- 크레스포의 12월 매수는 2025년 3월 13일 세운 사전 매매계획(10b5-1)에 따른 정기 매수입니다. 자신의 판단으로 시점을 고른 매수가 아니라는 뜻이라 신호로서의 의미는 작습니다. 2025년 6월 11일에는 같은 37,300주를 $1.32에 팔았습니다.\n\n#### 내부자 매도 (총 10건)\n\n총 430,832주, 약 96.7만 달러, 평균 매도가 약 $2.24. 매도 전부 사전 매매계획(10b5-1)에 따른 것입니다.\n\n| 누가 | 직책 | 건수·기간 | 수량 | 평균 매도가 | 금액 | 현재가 대비 |\n|---|---|---|---|---|---|---|\n| 벤자민 헤이크롤트 | 최고전략책임자(CSO), 유럽·중동·아프리카 총괄 | 8건, 2025년 9월~2026년 9월 | 343,532주 | $2.20 | 약 75.6만 달러 | −24% |\n| 모린 헬머 (Maureen Helmer) | 이사 | 1건, 2026년 6월 8일 | 50,000주 | $3.2324 | 약 16.2만 달러 | −48% |\n| 호세 루이스 크레스포 | 당시 최고매출책임자 | 1건, 2025년 6월 11일 | 37,300주 | $1.32 | 약 4.9만 달러 | +27% |\n\n- 헤이크롤트의 최근 매도: 2026년 9월 11~18일 3건, 23.3만 주를 $2.06~$2.14에 팔았습니다 (약 49.6만 달러). 그 뒤 주가는 $1.68까지 내렸습니다.\n- 가장 비싼 값에 팔린 것은 2025년 10월 10일 헤이크롤트의 $3.80, 2026년 6월 헬머의 $3.23입니다. 이 가격에 산 사람은 지금 −56%, −48%입니다.\n\n#### 앞으로 예정된 매도 (사전 매매계획, 2026년 2분기 보고서)\n\n| 누가 | 직책 | 최대 매도 수량 | 기간 |\n|---|---|---|---|\n| 앤디 마시 (Andrew Marsh) | 이사회 의장(상근), 전 CEO | 600,001주 | 2026년 8월 27일 ~ 2027년 11월 22일 (5월 28일 신규 계획) |\n| 벤자민 헤이크롤트 | CSO | 811,976주 | 2026년 9월 11일 ~ 2027년 12월 31일 |\n| 그레고리 케나우시스 (Gregory Kenausis) | 이사 | 189,000주 | 2026년 8월 21일 ~ 2027년 11월 22일 |\n| 콜린 앤글 (Colin Angle) | 이사 | 28,691주 + 지급받은 주식의 일부(40%) | 2026년 9월 9일 ~ 2027년 6월 10일 |\n\n마시 의장의 매도는 2026년 10월 9일 현재 보고된 Form 4에서 확인되지 않았습니다. 계획된 수량이 아직 많이 남아 있다는 점이 특징입니다.\n\n#### 유명인·큰손 (13G/13D, 의회, 트럼프)\n\n##### 대주주 신고(13G/13D)\n\n| 기관 | 지분 | 신고·기준일 | 대략적 평가액 | 메모 |\n|---|---|---|---|---|\n| BlackRock | 12.8% (1.781억 주) | 13G/A, 기준일 2026-06-30 | 원산 6월 30일 종가 $2.71 약 4.83억 달러 → 현재가 약 2.99억 달러 | 7.2%(2025/6) → 8.3%(2025/9) → 10.5%(2026/3) → 12.8%로 계속 늘림. 인덱스·ETF 운용사라 매수가는 공시되지 않음 |\n| Vanguard Capital Management | 5.23% (7,304만 주) | 13G, 기준일 2026-03-31 | 3월 31일 종가 $2.26 약 1.65억 달러 → 현재가 약 1.23억 달러 | The Vanguard Group는 2026년 3월 13일부로 0%로 신고(두 신고의 관계는 확인 못함) |\n| Norges Bank (노르웨이 중앙은행 펀드) | 0.4% (500만 주) | 13G/A, 기준일 2025-06-30 | — | 5% 이하로 내려감 |\n| Grove Energy Capital | 4.8% (5,497만 주) | 13D/A, 기준일 2025-06-06 | 당시 매수가 확인 못함 | 5% 아래로 내려감 (추정: 매도 중) |\n\n##### 의회·트럼프\n\n- **의회 의원 (펠로시 포함):** Quiver Quantitative 기준 2025년 이후 PLUG 매매 기록이 없습니다. 마지막 기록은 2024년 7월 31일 오스틴 스콧 하원의원의 소액 매도($1,001~$15,000)입니다. 캐피톨트레이즈는 접속이 안 돼 확인하지 못했습니다.\n- **트럼프 대통령(OGE 278-T):** 2025년 8월 이후 제출된 19건 매매보고서를 모두 확인했지만 PLUG 거래는 없습니다.\n- **정부:** 지분 투자를 한 적 없습니다. 대출보증은 사라졌습니다.","next_md":"| 시기 | 확인할 것 | 왜 중요한가 |\n|---|---|---|\n| 2026년 10월 23일 | COO 딘 풀러턴 퇴임 발효, 후임·업무 분담 공시 | 현장 실행력 공백 여부 |\n| 2026년 11월 9일 전후 (추정) | 3분기 실적 | 매출총이익이 플러스로 넘어가는지, 매출이 2분기(1.78억 달러)에서 얼마나 늘는지, 현금 순소진(2분기 약 6,100만 달러)이 더 줄는지 |\n| 2026년 4분기 | 덴마크 Arcadia 280MW 프로젝트의 투자 최종결정(FID)과 진행 통보 | 그때야 계약이 실제 납품·매출로 이어짐 |\n| 2026년 4분기 | 영국 Carlton 나머지 25MW FID, 캐나다 Hy2gen 275MW 실제 공급 계약으로 전환 | 설계 단계 선정이 매출로 넘어가는지 |\n| 2026년 4분기 (2027년 초 발표) | EBITDAS 흑자 달성 여부 | 회사가 내건 철의 첫 목표 |\n| 2026년 중 ~ 2027년 3월 31일 | 뉴욕 게이트웨이 부지(1.42억 달러)와 텍사스 그레이엄 매각 마감, 자산 매각 목표 2.75억 달러 진행률 (8월 말 기준 약 5,200만 달러 수령) | 주식 안 찍고 날 수 있는 현금 |\n| 매 분기 보고서 | ATM(남은 9.44억 달러) · SEPA(10억 달러, 2027년 2월 10일 만료) 사용 여부, 분기 말 발행주식 수 | 이 두 수단이 쓰이면 주식 수가 빠르게 늘어 주가에 부담 |\n| 수시 | 내부자 매도 공시(Form 4): 마시 의장 60만 주, 헤이크롤트 81만 주 계획분 | 매도 속도와 수량 |\n| 수시 | DOE 대출 관련 주주 소송(피고 답변 기한 2026년 10월 9일) 진행과 로펌 조사 공지 | 법적 비용과 경영진 부담 |\n| 2027년 12월 31일까지 | 미국 내 새 수소 공장의 45V 세액공제 공사 착수 시한 | 전해조 수요의 정책 마감 |\n| 2027년 말 / 2028년 말 | 영업이익 흑자 / 전체 흑자 | 계획대로 진행되는지 |\n| 수시 | 중국산 전해조 가격 하락과 \"금지 외국 기업\" 부품 규칙 확정 | 경쟁 구도와 세액공제 조건 |","glossary_md":"| 용어 | 뜻 |\n|---|---|\n| 전해조 (Electrolyzer) | 물에 전기를 흘려 수소와 산소로 나누는 기계. 재생에너지 전기로 수소를 만들면 '그린수소' |\n| 연료전지 (Fuel cell) | 수소와 산소를 합쳐 전기를 만드는 장치. 배출물은 물뿐이라 지게차에 사용 |\n| PEM / 알칼리형 | 전해조의 두 종류. PEM은 상대적으로 빠르게 켜지고 운영 유연성이 좋다는 설명이 있고, 알칼리형은 중국이 싼값에 대량 생산 |\n| MW (메가와트) | 전해조의 규모 단위. 280MW는 하루 약 110톤의 수소를 만드는 규모(회사 보도 기준) |\n| 매출총이익률 | (매출 − 물건을 만드는 비용) ÷ 매출. 마이너스면 팔수록 손해 |\n| EBITDAS | 이자·세금·감가상각비·주식보상비용을 빼고 본 영업 이익. 회사가 만든 비표준 지표라 보통의 이익보다 느슨함 |\n| 희석 | 새 주식을 찍어 기존 주주 지분 비율이 줄어드는 것 |\n| ATM 발행 | 시장 가격에 주식을 조금씩 수시로 팔아 돈을 모으는 방식 |\n| SEPA | 투자사(요크빌)가 정해진 한도까지 회사가 원할 때 주식을 사주기로 약속한 계약. 회사가 고를 수 있어 필요할 때 써서 돈을 마련 |\n| 전환사채 | 나중에 주식으로 바꿀 수 있는 조건이 붙은 빚 |\n| 워런트 (신주인수권) | 정해진 가격에 주식을 살 수 있는 권리. 행사되면 주식수가 늘어남 |\n| 10b5-1 매매계획 | 내부자가 미리 날짜·가격 조건을 정해 두고 기계적으로 사고팔도록 하는 제도. 시점을 고른 거래가 아니라는 증명 |\n| 13G / 13D | 5% 이상 지분을 가진 주주가 SEC에 내는 신고서. 13D는 경영에 영향을 줄 수 있는 주주가 낸 |\n| FEED / FID | FEED는 설계 단계, FID는 \"진짜 짓자\"는 최종 투자 결정. FID 이후에 매출이 잡힐 가능성이 커짐 |\n| 45V | 미국의 청정수소 생산 세액공제. 수소 1kg당 최대 약 $3. 2028년 1월 1일 전 공사 착수 설비만 대상 |\n| 48E (ITC) | 연료전지 설비에 대해 설치 비용의 30%를 세금에서 깎아 주는 투자세액공제 |\n| DOE 대출보증 | 미 에너지부가 회사가 빌린 돈을 못 갚을 경우 대신 갚겠다는 보증. 플러그는 한 푼도 안 씁 채 해지됨 |\n| e-SAF | 재생수소와 포획한 이산화탄소로 만드는 합성 항공유 |\n| 공매도 비율 | 유통주식 중 빌려서 파 주식 비율. 높으면 좋은 소식에 급등(공매도 청산)하기도 함 |","sources":[{"t":"Plug Power 2026년 2분기 10-Q (SEC)","u":"https://www.sec.gov/Archives/edgar/data/1093691/000110465926093454/plug-20260630x10q.htm"},{"t":"Plug Power 2025년 연간보고서 10-K (SEC)","u":"https://www.sec.gov/Archives/edgar/data/1093691/000110465926022286/plug-20251231x10k.htm"},{"t":"Plug 2분기 실적 보도자료, 2026-08-10 (SEC 8-K 붙임 99.1)","u":"https://www.sec.gov/Archives/edgar/data/0001093691/000110465926093339/tm2622713d1_ex99-1.htm"},{"t":"8-K 2026-07-13: Stream Data Centers 매각·게이트웨이 수정 (SEC)","u":"https://www.sec.gov/Archives/edgar/data/1093691/000110465926082854/tm2620282d1_8k.htm"},{"t":"8-K 2026-02-26: Stream Data Centers 뉴욕 부지 매각 계약 (SEC)","u":"https://www.sec.gov/Archives/edgar/data/1093691/000110465926020476/tm267395d1_8k.htm"},{"t":"8-K 2026-02-13: 주식 발행 한도 30억 주 증액 승인 (SEC)","u":"https://www.sec.gov/Archives/edgar/data/1093691/000110465926014846/tm264582d11_8k.htm"},{"t":"8-K 2026-02-05: 주주총회 연기 (SEC)","u":"https://www.sec.gov/Archives/edgar/data/1093691/000110465926010793/tm265369d1_8k.htm"},{"t":"8-K 2026-01-30: 주주총회 투표 결과와 연기 (SEC)","u":"https://www.sec.gov/Archives/edgar/data/1093691/000110465926008732/tm264582d2_8k.htm"},{"t":"8-K 2026-01-06: 월마트 신주인수권 취소 (SEC)","u":"https://www.sec.gov/Archives/edgar/data/1093691/000110465926001336/tm262057d1_8k.htm"},{"t":"8-K 2026-06-15: 연례 주총 결과 (SEC)","u":"https://www.sec.gov/Archives/edgar/data/1093691/000110465926074022/tm2617557d2_8k.htm"},{"t":"8-K 2026-06-04: 이사 사임 (SEC)","u":"https://www.sec.gov/Archives/edgar/data/1093691/000110465926070504/tm2616928d1_8k.htm"},{"t":"8-K 2026-09-23: COO 사임 (SEC)","u":"https://www.sec.gov/Archives/edgar/data/1093691/000110465926110021/tm2626024d1_8k.htm"},{"t":"SEC Form 4: 크레스포 2025-12-15 매수 (사전 매매계획 각주 확인)","u":"https://www.sec.gov/Archives/edgar/data/1093691/000110465925122178/tm2533817-1_4seq1.xml"},{"t":"SEC Form 4: 헬머 이사 2026-06-08 매도 (이사 직책 확인)","u":"https://www.sec.gov/Archives/edgar/data/109369 재가 대비 +52%)"],["애널리스트 평균 목표가","$36.90 (8명, 범위 $30~43.5), 현재가 대비 +83%"],["공매도 비율","유통주식의 약 12.7%"]],"overview_md":"한 줄 판단: 강세론은 '정부가 밀어주는 미국 유일의 안티몬 광산 + 비싼 금값'을, 약세론은 '생산은 아직 몇 년 뒤, 실제 돈은 대부분 금에서 나온다, 소송과 공사 위험'을 봅니다.\n\n#### 기업 개요: 이 회사는 무엇을 하나\n\n퍼페추아는 본사가 아이다호주 보이시에 있는 직원 47명의 광산 개발 회사입니다. 2021년까지 이름은 '마이다스 골드'였습니다. 회사가 가진 것은 사실상 단 하나, 아이다호 산속 밸리 카운티의 **스티브나이트 금 프로젝트**(약 1만 1,500헥타르)입니다.\n\n**1. 안티몬이란?**\n\n- 회색 금속 원소(Sb)입니다. 불이 잘 안 붙게 하는 난연제, 태양광 유리, 납축전지에 쓰입니다.\n- 군사용으로는 **삼황화안티몬**(안티몬+황)이 핵심입니다. 총알을 터뜨리는 뇌관(프라이머), 예광탄, 미사일 부품 등 300종 이상의 탄약에 들어갑니다.\n- 전 세계 채굴·정제의 대부분을 중국이 합니다. 미국은 2016년 이후 안티몬을 캐는 광산이 없습니다.\n\n**2. 이 광산의 특징**\n\n- 스티브나이트는 미국에서 확인된 유일한 안티몬 매장지입니다. 2차 세계대전 때도 미국 안티몬을 대던 곳입니다.\n- 하지만 매장량으로 보면 **금광**입니다. 15년 동안 금 422만 온스, 안티몬 1억 650만 파운드를 캘 계획입니다.\n- 인허가: 2025년 1월 산림청 최종 승인(ROD) → 2025년 9월 19일 개발 착수 승인 → 2025년 10월 21일 착공. 8년 넘게 걸린 인허가 끝났습니다.\n- 최대주주는 헤지펀드 거물 존 폴슨의 폴슨앤드컴퍼니입니다. 2025년 10월에는 세계적 금광 회사 아니코 이글과 JP모건이 함께 2.55억 달러를 투자했습니다.\n\n#### 돈 버는 구조: 지금은 0, 앞으로는 대부분 금\n\n지금은 매출이 없고 공사비만 쓰는 단계입니다. 2026년 상반기 순손실은 1.46억 달러(2분기만 9,750만 달러)였습니다. 광산이 돌기 시작하면 금과 안티몬을 팔아 돈을 벌게 됩니다.\n\n| 제품 | 15년 총 생산 계획 | 연 평균 | 가격 가정 | 연 매출 (단순 계산) | 매출 비중 |\n|---|---|---|---|---|---|\n| 금 | 422만 온스 | 약 29.6만 온스 (초기 4년은 46.3만) | 온스당 $3,250 | 약 9.6억 달러 | 약 93% |\n| 안티몬 | 1억 650만 파운드 | 약 710만 파운드 | 파운드당 $10 | 약 7,100만 달러 | 약 7% |\n| 은 | 소량 부산물 | - | 온스당 $40 | 작음 | - |\n\n연 매출과 비중은 회사가 밝힌 생산량 × 가격 가정으로 직접 계산한 값입니다. 즉 '안티몬 회사'로 알려져 있지만, 돈의 90% 이상은 금에서 나옵니다. 주가가 금값에 크게 흔들리는 이유입니다.\n\n#### 앞으로의 숫자 (2026년 3월 기술보고서 기준)\n\n| 항목 | 값 |\n|---|---|\n| 초기 건설비 | 25.76억 달러 (예비비 1.92억 포함) |\n| 순현재가치(NPV, 5% 할인) | 35억 달러 (금 $3,250) / 50억 (금 $4,000) / 61억 (금 $4,500) |\n| 내부수익률(IRR) | 23.5% (기본) ~ 32.3% (금 $4,500) |\n| 투자금 회수 기간 | 2.4년 (기본) |\n| 금 1온스 총생산비(AISC) | $833 (초기 4년 $498) |\n| 최종 투자결정(FID) | 2026년 하반기 목표 |\n| 금값 하락 보험 | 2031년 생산분 최대 15.8만 온스에 $3,000 풋옵션 매수 (2,890만 달러) |\n\n참고로 현재 시가총액(25억 달러)은 회사가 밝힌 기본 NPV(35억 달러)의 약 0.7배입니다. 생산 시작 시점은 보도자료에 명시되지 않았고, X에서는 2029년 전후를 예상합니다.","gov_md":"미국 정부에게 퍼페추아는 '금광'이 아니라 '탄약 공급망'입니다. 2021년 중국이 탄약용 삼황화안티몬의 미국 공급을 끊었고, 2024년에는 안티몬 수출 자체를 막았습니다. 미국이 우크라이나·중동 전쟁으로 포탄을 더 많이 만들어야 하는데, 핵심 원료를 경쟁국에 기대고 있던 것입니다. 그래서 정부는 돈(대출·지원금)과 절차(빠른 인허가) 두 가지로 이 광산을 밀고 있습니다.\n\n| 날짜 | 정부 기관 | 내용 | 금액 |\n|---|---|---|---|\n| 2022년~2023년 | 국방부 (DPA 3조) | 국방물자생산법 지원금: 인허가·설계 비용 | 5,900만 달러 이상 |\n| 2023년 8월~2026년 6월 | 육군 (OTIA 협약) | 삼황화안티몬 시험 생산·시범 공장 (2026년 6월 470만 달러 추가) | 2,700만 달러 |\n| 2025년 1월 | 산림청 | 최종 승인 결정(ROD) | - |\n| 2025년 9월 19일 | 산림청 | 개발 착수 허가(Notice to Proceed). 연방 '패스트트랙(FAST-41)' 대상 | - |\n| 2025년 9월 8일 | 수출입은행(EXIM) | 예비 프로젝트 서신(PPL)·비구속 조건서. 회사 신청액 20억 달러 (조건서 자체 금액은 미공개) | - |\n| 2026년 3월 31일 | EXIM 이사회 | 27억 달러 대출안 의회 통보 | 27억 달러 |\n| 2026년 5월 21일 | EXIM 이사회 | 만장일치 대출 승인 ('Make More in America') | 29억 달러 |\n| 2026년 7월 29일 | 육군·아이다호 국립연구소(INL) | 안티몬 시범 공장 가동 (광산에서 탄알까지, 'ground-to-round') | 위 2,700만 달러에 포함 |\n\n**숫자로 보면**\n\n- 국방부·육군 지원금 합계: 2022년 이후 8,700만 달러 이상 (갚지 않는 돈).\n- EXIM 대출 29억 달러는 건설비(25.8억 달러)보다 큽니다. 대출이 실제로 나오면 주식을 더 찍지 않고도 광산을 지을 수 있다는 뜻입니다.\n- 단, 대출은 승인만 됐고 계약서 서명(클로징)은 아직입니다. 회사는 '2026년 안'을 목표로 합니다.\n- 정부가 지분을 사진 않았습니다. MP머티리얼즈처럼 국방부가 주주가 되는 구조가 아니라 '대출+지원금' 구조입니다.\n\n**미·중 경쟁과의 연결**\n\n- 중국은 2024년 미국으로의 안티몬 수출을 금지했다가, 2025년 11월 9일 민간용에 한해 금지를 **2026년 11월 27일까지** 유예했습니다. 군사용은 여전히 막혀 있습니다.\n- 안티몬 국제 가격은 2025년 7월 4일 톤당 59,750달러 역대 최고에서 계속 내려왔습니다. 동남아시아 제련소가 늘어난 탓입니다.\n- 미국은 동맹국과 함께 '중국 없는 공급망'을 만드는 중입니다. 퍼페추아는 미국 내에서 광석을 캤 수 있는 유일한 안티몬 공급원이라, 알래스카·호주 등 해외 동맹 프로젝트보다 국방부 입장에서 우선순위가 높습니다.\n- 회사는 광산 안에서 텅스텐(탄약·공구용 필수 금속, 역시 중국 독점)도 찾아 정부 지원금을 신청했지만, 아직 확정된 돈은 없습니다.","gov_title":"정부가 이 회사를 쓰는 방법","events":[{"date":"2026-09-26","title":"핵심광물주 동반 매도","detail":"9월 28일 공사·탐사 업데이트. 최종 투자결정(FID)·대출 서명 소식은 없음. 핵심광물주 전반의 매도와 같은 시기: 9월 28일까지 한 달간 MP −21%, USAR −23%, UAMY −15%, 희토류 ETF(REMX) −17% (미·중 관계 완화 기대가 원인으로 거론됨). 금값은 소폭 하락 (10월 1일 $4,191 → $4,161). PPTA만의 원인은 확인 못함","move":"$23.49 → $20.11 (−14%)"},{"date":"2026-08-18","title":"법원 보호조치 지적","detail":"법원이 '어류·야생동물국 보호조치 미흡'을 지적했지만 공사 중지 명령은 내리지 않음. 환경단체 9순회 항소","move":"$25 안팎에서 횡보"},{"date":"2026-08-05","title":"새 고품위 금·안티몬 발견","detail":"2분기 실적 앞두고 상승, 6일 새 고품위 금·안티몬 발견과 텅스텐 구역 발표","move":"5일 +10.9% ($22.93), 주간 +34% ($24.72)"},{"date":"2026-07-30","title":"육군 안티몬 시범 공장","detail":"육군·아이다호 국립연구소와 안티몬 시범 공장 가동","move":"+9.6% ($18.91)"},{"date":"2026-07-17","title":"연중 최저","detail":"연중 최저. 회사 뉴스는 없고 금값 약세와 같이 움직임. 6월은 2008년 이후 금의 최악의 달, 7월 17일 금 약 $3,992 (1월 고점 대비 −29%), 금광주 주간 −9~11%","move":"$16.90"},{"date":"2026-06-11","title":"6월 11일 급등","detail":"원인 확인 못함 (회사 보도자료 없음)","move":"+9.7% ($23.44)"},{"date":"2026-05-29","title":"공사 금지 가처분 기각","detail":"연방법원이 공사 금지 가처분 기각, 핵심 공사(진입로·숙소) 시작","move":"$27.07 (주간 +7%)"},{"date":"2026-05-20","title":"EXIM 29억 달러 승인","detail":"EXIM 이사회, 29억 달러 대출 만장일치 승인","move":"20일 +11.6% ($27.51) → 그 주 $25.32로 되밀림"},{"date":"2026-03-31","title":"EXIM 의회 통보·경제성 상향","detail":"EXIM 27억 달러 대출 의회 통보 + 경제성 상향 (NPV 35억 달러)","move":"+11.1% ($28.12)"},{"date":"2026-03-02","title":"연중 최고가","detail":"연중 최고가","move":"$37.22"},{"date":"2026-02-12","title":"2월 12일 급락","detail":"원인 확인 못함. 같은 날 임원(맥킨지 라이언) 4.4만 주 매도","move":"−9.6% ($27.57)"},{"date":"2026-01-30","title":"금·은 폭락","detail":"워시 연준 의장 지명 충격에 금 −11%, 은 −31% 폭락. 광산주 동반 급락","move":"−17.0% ($26.62)"},{"date":"2026-01-22","title":"금값 사상 최고","detail":"금값 사상 최고 행진 (1월 27일 금 5,000달러 돌파)","move":"+10.7% ($34.85)"}],"chart_events":["2026-01-22","2026-01-30","2026-03-02","2026-05-20","2026-07-17","2026-08-05"],"bull":["**돈 문제가 거의 풀렸다**: 건설비 25.8억 달러에 EXIM 대출 29억 달러(직접 대출 약 22억 + 이자·수수료)가 승인됐고, 현금도 5.74억 달러가 있습니다. 개발 단계 광산에서 가장 큰 위험인 '자금 조달'이 대부분 사라진 상태입니다.","**싸게 거래되는 중**: 시가총액 25억 달러는 기본 NPV 35억 달러(금 $3,250 가정)의 약 0.7배입니다. 금값이 $4,000이면 NPV는 50억, $4,500이면 61억 달러로 커집니다.","**싸게 캤는 금**: 초기 4년 총생산비(AISC)가 온스당 $498로 업계 최저 수준입니다. 투자금 회수 기간은 2.4년입니다.","**금값 바닥 보험**: 2031년 생산분 15.8만 온스에 $3,000 풋옵션을 샀습니다. 금값이 폭락해도 최소 약 4.7억 달러는 지켜집니다.","**국방 안보 프리미엄**: 미국 유일의 안티몬 매장지이고, 국방부·육군이 8,700만 달러 넘게 지원했습니다. 중국의 수출 금지 유예가 2026년 11월 27일 끝납니다.","**크고 똑똑한 돈이 들어와 있다**: 폴슨앤드컴퍼니(2025년 6월 $13.20에 1억 달러), 아니코 이글·JP모건(2025년 10월 2.55억 달러)이 주주입니다.","**더 커질 수 있다**: 2026년 8월 새 고품위 금·안티몬 발견과 텅스텐 구역을 발표했고, 올해 시추는 1만 m를 넘었습니다.","**애널리스트 목표가**: 평균 $36.90, 가장 낮은 목표가($30)도 현재가보다 49% 높습니다."],"bear":["**아직 매출 0**: 생산 시작은 몇 년 뒤(시장은 2029년 전후로 봄)입니다. 그동안 손실만 납니다. 2026년 상반기 순손실은 1.46억 달러로 1년 전(1,420만 달러)의 10배입니다.","**'안티몬 회사'가 아니라 금광**: 계획상 매출의 약 93%가 금에서 나옵니다. 금값이 떨어지면 주가도 떨어집니다(1월 30일 금 −11%에 주가 −17%).","**안티몬 값 하락**: 국제 가격은 2025년 7월 톤당 59,750달러 역대 최고 이후 계속 내립니다. 동남아시아 제련 능력이 늘고 중국도 수출 금지를 유예했기 때문입니다.","**대출은 아직 '승인'만**: EXIM 계약서 서명과 최종 투자결정(FID)이 모두 2026년 하반기 목표인데, 10월 초 현재까지 발표가 없습니다.","**소송 위험**: 환경단체 5곳이 9순회 항소법원에 항소(2026년 8월 25일)했고, 네즈퍼스 부족도 별도 소송 중입니다. 광산은 연어 서식지 강 상류에 있고, 시안화물로 금을 녹이며 깊이 720피트의 노천 구덩이를 팝니다. X에서는 비소(아르세닉) 오염 우려도 나옵니다.","**희석 이력**: 2025년 6월(약 4.1억 달러, $13.20)과 10월(약 7,800만 달러)에 새 주식을 발행했습니다. 2025년 6월 발행 때는 하루에 20% 넘게 빠졌습니다. 건설비가 늘면 또 찍을 수 있습니다.","**건설 위험**: 산속 오지에 진입로·전력선부터 새로 깔아야 하는 25.8억 달러짜리 공사입니다. 광산 건설은 비용 초과와 지연이 흔합니다.","**내부자 매도와 공매도**: 임원·이사는 2025년 12월~2026년 4월 $26~30에서 약 400만 달러어치를 팔았고, 유통주식의 12.7%가 공매도 상태입니다."],"analysts_md":"**증권사 목표가** (평균 $36.90, 8명, 범위 $30~43.5. 현재가 $20.11)\n\n| 증권사 | 의견 | 목표가 | 날짜 | 현재가 대비 |\n|---|---|---|---|---|\n| H.C. 웨인라이트 | 매수 유지 | $43.50 | 2026년 9월 30일 | +116% |\n| 스코샤뱅크 | 시장보다 좋음(매수) | $39 | 2026년 9월 29일 (9월 1일 커버 시작) | +94% |\n| RBC 캡탈 | 매수 | $42 | 2026년 9월 15일 | +109% |\n| B. 라이언리 | 매수 (커버 시작) | $40 → $30 | 2026년 8월 3일 | +49% |\n| 로스 MKM | 매수 | $32 | 2026년 6월 2일 | +59% |\n| BMO | - | $44 | 2025년 10월 28일 | +119% |\n| UBS | - | $30 | 2025년 10월 9일 | +49% |\n| 자스 리서치 | 보유(강력매도에서 상향) | 없음 | 2026년 6월 8일 | - |\n| 와이스 레이팅스 | 매도 (D−) | 없음 | 2026년 7월 17일 | - |\n\n증권사는 거의 모두 '매수'입니다. 다만 주가가 평균 목표가의 절반 수준이라, 시장은 증권사보다 훨씬 조심스럽습니다. 올해 목표가를 낮춘 곳은 B. 라이언리($40→$30)입니다.","insider_title":"내부자·유명인 매매 (2025~)","insider_md":"**내부자 매수** (SEC Form 4, 장내·사모 매수. 현재가 $20.11 기준)\n\n| 날짜 | 누가 | 직책 | 주식 수 | 가격 | 금액 | 현재가 대비 |\n|---|---|---|---|---|---|---|\n| 2025년 6월 16일 | 폴슨앤드컴퍼니 (존 폴슨) | 10% 이상 대주주 | 7,575,757주 | $13.20 | 약 1억 달러 | +52.3% |\n| 2025년 2월 26일 | 리치 해독 | 이사 | 5,780주 | $8.56 | 약 4.9만 달러 | +134.9% |\n| 2025년 2월 24일 | 앤드류 콜 | 이사 | 9,450주 | $7.99 | 약 7.6만 달러 | +151.7% |\n| 2025년 2월 21일 | 크리스 로비슨 | 이사 | 10,000주 | $8.43 | 약 8.4만 달러 | +138.6% |\n| 2025년 2월 21일 | 로버트 딘 | 이사 | 5,000주 | $8.32 | 약 4.2만 달러 | +141.7% |\n| 2025년 2월 21일 | 존 체리 | CEO | 1,160주 | $8.60 | 약 1만 달러 | +133.8% |\n\n폴슨 매수는 확인했습니다. 2025년 6월 10일 1억 달러 청약 계약 → 6월 16일 7,575,757주를 $13.20에 사모로 샀고, 그 결과 32,347,299주(당시 31.2%)를 보유했습니다. 이 가격은 같은 때 일반 투자자에게 판 가격과 같습니다. 현재가는 그보다 52% 높습니다.\n\n**내부자 매도 요약** (2025년 1월~2026년 10월)\n\n| 항목 | 값 |\n|---|---|\n| 총 매도 | 29건, 302,855주, 약 580만 달러 |\n| 평균 매도가 | $19.14 (현재가와 비슷) |\n| 최대 매도자 | 맥킨지 라이언 (대외협력 부사장(VP External Affairs)): 137,830주, 약 284만 달러, 평균 $20.62 |\n| 그 다음 | 존 체리 CEO 47만 달러($24.92), 로버트 딘 46만($26.89), 제프리 말멘 40만($26.42), 크리스 로비슨 36만($26.32), 알렉산더 스턴헬 36만 달러($27.09) |\n| 2025년 12월~2026년 4월 | 148,218주, 약 403만 달러를 $26~30에 매도 → 현재가는 그보다 25~32% 낮음 |\n| 10b5-1(미리 정한 자동 매도) | Form 4에 표시 없음 |\n\n**읽는 법**\n\n- 2025년 2월 이사들은 $8 대에 샀고, 지금 기준 +134~152%입니다. 그 뒤로 내부자의 장내 매수는 없습니다.\n- 2025년 2·3월 여러 임원이 같은 날 같은 가격($9.24, $8.82)에 판 건은 주식 보상의 세금을 내기 위한 매도로 보입니다.\n- 2025년 말~2026년 초 $26~30에서의 매도는 결과적으로 좋은 가격이었습니다. 다만 금액은 모두 합쳤 도 약 400만 달러로, 시가총액 25억 달러에 비하면 작습니다.\n\n**대주주 신고(13G/13D)와 유명 펀드** (현재가 $20.11 기준)\n\n| 누구 | 신고 (기준일) | 지분·주식 수 | 매수가 | 현재가 대비 |\n|---|---|---|---|---|\n| 존 폴슨 (폴슨앤드컴퍼니) | 13D/A (2025년 6월 10일). 2026년 6월 말 13F에도 그대로, 팔지 않음 | 31.2%, 32,347,299주 (현재 주식 수 기준 약 26%) | 최근 매수 $13.20. 13D 총 매입금 약 1.87억 달러로 나누면 평균 약 $5.8 (추정) | +52% (평균 단가 기준 약 +250%) |\n| 아니코 이글 (세계적 금광 회사) | 13G (2025년 10월 27일) | 8.71%, 10,866,965주 (워런트 포함). 보통주 7,725,321주에 1.8억 달러 | $23.30 (당일 종가와 같음). 워런트 행사가 $31.46/$34.95/$38.45 | −13.7% |\n| JP모건 | 같은 날 사모 참여, 2026년 6월 말 13F 2,943,893주 | 2.7%, 3,218,884주에 7,500만 달러 | $23.30 | −13.7% |\n| 블랙록 | 13G (2025년 9월 30일) | 5.4%, 5,834,675주 | 미공개 (인덱스 펀드 등) | - |\n| 엔컴패스 캡탈 | 13G (2025년 4월 23일) → 13G/A (2025년 6월 30일) | 5.03% → 3.36% (약 360만 주) | 미공개 | - |\n| 시타델 | 13F (2026년 6월 30일) | 850,595주 | 미공개 | - |\n\n- 트럼프 대통령: 2025년 8월~2026년 9월에 낸 OGE 278-T 거래 신고 19건 전부(2025년 1월~2026년 7월 거래)에 PPTA 거래는 없습니다. 낸시 펠로시 등 의회 의원: PPTA 매매 기록은 확인 못함 (Finbold 조회 결과 이름이 나온 거래 없음).","next_md":"- 2026년 4분기: EXIM 29억 달러 대출 계약서 서명(클로징). 회사 목표는 '2026년 안'\n- 2026년 하반기: 최종 투자결정(FID) 발표. 연내에 안 나오면 지연 신호\n- 2026년 11월 중순: 3분기 실적 (작년은 11월 14일 발표). 현금 잔고와 공사비 지출 속도\n- 2026년 11월 27일: 중국의 대미 안티몬 수출 금지 유예 만료. 연장인지 재개인지\n- 2026년 가을: 진입로(번트로그) 다리 반입, 숙소·전력선 공사 진행 상황\n- 시기 미정: 9순회 항소법원 판결 (환경단체 항소), 네즈퍼스 부족 소송\n- 시기 미정: 2026년 시추 분석 결과(텅스텐 포함), 텅스텐 정부 지원금 확정 여부\n- 새 주식 발행(희석) 여부, 금값 흐름 (매출의 약 93%가 금)\n- 2027년 1월 15일: X에서 화제된 $35 콜옵션 만기","glossary_md":"| 용어 | 뜻 |\n|---|---|\n| 안티몬 (Sb) | 난연제·배터리·탄약에 쓰는 금속. 중국이 대부분 공급 |\n| 삼황화안티몬 | 안티몬과 황의 화합물. 총알 뇌관·예광탄 등 탄약 300종 이상에 들어감 |\n| ROD (최종 승인 결정) | 연방 기관이 환경영향평가를 마치고 사업을 허가하는 문서 |\n| EXIM | 미국 수출입은행. 미국 산업에 돈을 빌려주는 정부 은행 |\n| DPA 3조 | 국방물자생산법. 국방부가 전략 물자 생산에 직접 돈을 대는 제도 |\n| FID (최종 투자결정) | 회사가 '이제 본격 건설에 돈을 쓴다'고 결정하는 순간 |\n| NPV (순현재가치) | 광산이 앞으로 벌 돈을 오늘 가치로 환산한 값 |\n| IRR (내부수익률) | 투자한 돈이 연평균 몇 %로 불어나는지 |\n| AISC (총생산비) | 금 1온스를 캐는 데 드는 모든 유지 비용. 낮을수록 좋음 |\n| 풋옵션 | 정해진 가격에 팔 수 있는 권리. 가격 하락에 대비한 보험 |\n| 콜옵션 | 정해진 가격에 살 수 있는 권리. 주가가 그 가격을 넘어야 이익 |\n| 희석 | 새 주식을 찍어 기존 주주의 지분 비율이 줄어드는 것 |\n| 13D / 13F | 13D는 5% 넘게 산 대주주의 신고, 13F는 큰 펀드의 분기별 보유 목록 |\n| Form 4 | 임원·이사·대주주가 주식을 사고팔 때 내는 신고서 |","sources":[{"t":"Perpetua: 2026년 2분기 실적 보도자료 (8월 17일)","u":"https://perpetuaresources.com/wp-content/uploads/2026/08/Perpetua-Resources-Q2-2026-PR.pdf"},{"t":"Perpetua: EXIM 27억 달러 의회 통보·경제성 상향 (3월 31일)","u":"https://perpetuaresources.com/wp-content/uploads/U.S.-EXIMs-Board-Advances-Proposed-2.7-Billion-Loan-to-Congressional-Notice-Perpetua-Announces-Improved-Project-Economics_March-31-2026.pdf"},{"t":"Northern Miner: EXIM nears decision on $2.7B for Perpetua","u":"https://www.northernminer.com/news/exim-taps-perpetuas-gold-antimony-project-with-2-7b/1003889563/"},{"t":"Pulse 2.0: EXIM 29억 달러 승인과 $3,000 금 풋옵션","u":"https://pulse2.c (종가)","$17.36 (1월 22일) / $5.91 (10월 8일)"],["고점 대비","−66%"],["매출 (최근 12개월)","7,150만 달러, 매출총이익률 약 10%"],["2분기 실적","매출 2,020만 달러(+527%), 순손실 3,530만 달러 (주당 −$0.26)"],["보유 현금","3.26억 달러 (6월 말). 상반기 영업으로 7,870만 달러 소진"],["2026년 매출 목표","1.5억~1.8억 달러 (하반기에만 1.14억 달러 이상 필요)"],["정부 개입","지분 투자는 없음. 육군 SRR 계약(약 3,500만 달러), 수입 드론 관세(최대 100%), 국방부 '드론 지배' 구매 정책이 간접 지원"],["국방 필수도","중간. 육군 정식 정찰 드론이지만 경쟁사(스카이디오 등)가 많고 대체 가능"],["내부자 동향","2025년 이후 장내 매수 0건. 매도 약 120만 주, 1,085만 달러. CEO가 매달 15만 주씩 계획 매도 중"],["공매도 비율","유통주식의 약 27%"],["애널리스트 평균 목표가","$16.50 (8명, 범위 $9~25). 현재가의 약 2.8배"],["다음 실적 발표","3분기 실적, 11월 중순 예상 (작년은 11월 13일, 올해 날짜 미발표)"]],"overview_md":"한 줄 판단: 강세론은 '중국산 드론 퇴출 + 미군 드론 대량 구매'의 수혜를, 약세론은 '목표 대비 느린 매출, 계속되는 희석, 경연 탈락과 소송'을 봅니다. 지금 주가는 약세론 쪽에 훨씬 더 무게가 실려 있습니다.\n\n#### 기업 개요: 이 회사는 무엇을 하나\n\n레드캣 홀딩스는 군인과 경찰이 쓰는 작은 드론과 무인 보트를 만드는 회사입니다. 본사는 미국 유타주, 직원은 약 244명입니다. 직접 만들기보다 작은 회사들을 사들여 키운 '지주회사' 형태입니다.\n\n**1. 자회사와 제품**\n\n| 자회사 (위치) | 대표 제품 | 쉽게 말하면 |\n|---|---|---|\n| 틸 드론즈 Teal Drones (유타) | 블랙 위도우 Black Widow, 틸 2, 헬캣(수출용) | 병사가 배낭에 넣고 다니는 정찰 드론. 열화상 카메라로 적을 찾음 |\n| 플라이트웨이브 FlightWave (캘리포니아) | 엣지 130 Edge 130 | 헬기처럼 뜨고 비행기처럼 멀리 나는 장거리 정찰 드론 |\n| 블루 옵스 Blue Ops (조지아) | 무인 수상정 배리언트 7 Variant 7 | 사람 없이 바다를 다니는 보트. 공장 1.55만 평방피트, 연 500척 이상 생산 가능 |\n| 아라크니드 제품군 | FANG FPV 드론 | 조종사가 고글을 쓰고 조종하는 소형 공격·정찰 드론 |\n| 2026년 인수: 아피움(APM), 콰이즈(Quaze) | 떼로 나는 자율 비행(스웜), 무선 충전 | 드론 여러 대를 한 번에 움직이고, 선 없이 충전하는 기술 |\n\n**2. 중요한 협력 관계**\n\n- **팔란티어(Palantir)**: 2024년 12월 발표. 팔란티어의 '시각 항법(VNav)' 소프트웨어를 블랙 위도우에 넣어, GPS가 끊기거나 방해받아도 위성사진과 비교해 스스로 위치를 찾게 합니다. 공장에는 팔란티어 생산관리 프로그램 'Warp Speed'를 씁니다. 금액 조건은 공개되지 않았습니다.\n- 2026년 8월 기준, 팔란티어 소프트웨어를 쓴 카메라 3개짜리 새 부품(AiN)을 육군이 평가 중입니다. 통과하면 두 번째 정식 사업이 될 수 있고, 4~5개 회사가 경쟁 중입니다.\n- **해양**: 8월 해벌(Havoc)과 자율 해상 방어 시스템 공동 개발, 10월 플로리다 애틀랜틱 대학과 협력. 미 해군에 무인 보트를 빌려주는(리스) 계약도 있습니다.\n- 안두릴(Anduril)과는 서로 다른 회사 장비를 함께 운용하는 시연을, 앨런 컨트롤 시스템즈와는 드론 방어 무기 연동을 했습니다.\n\n**3. 눈여겨볼 배경**\n\n- 틸 드론즈 창업자 조지 마투스가 회사를 떠나 경쟁사 '벡터 디펜스(Vector)'를 차렸습니다. 레드캣은 영업비밀 유출로 소송 중이고, 9월 법원은 대부분의 청구를 계속 진행하도록 했습니다. 아이러니하게도 9월 국방부 드론 경연에서는 벡터가 뽑혔고 틸은 빠졌습니다.\n- 8월 미치 맥도널드가 드론 부문 대표(사업부 CEO)로 승진했고, 그룹 CEO는 제프 톰슨입니다.\n\n#### 돈 버는 구조: 정부가 드론을 사 줄 때 매출이 생김\n\n매출은 거의 다 군과 정부가 드론과 예비 배터리·부품을 사는 데서 나옵니다. 미 육군 비중은 2025년 매출의 약 73%에서 2026년 상반기 약 50%로 줄었고, 그만큼 공군·해군·나토·일본 육상자위대·우크라이나 등으로 고객이 넓어졌습니다.\n\n| 기간 | 매출 | 매출총이익률 | 순손실 |\n|---|---|---|---|\n| 2025년 연간 | 4,070만 달러 (+161%) | 3.1% | 7,210만 달러 |\n| 2025년 4분기 (확정, 3월 18일 발표) | 2,620만 달러 (전년 130만 달러, +1,985%) | 4.2% | 1,970만 달러 |\n| 2026년 1분기 | 1,550만 달러 (+849%, 직전 분기보다는 −41%) | 12.7% | 2,660만 달러 |\n| 2026년 2분기 | 2,020만 달러 (+527%, 예상 2,280만 달러 하회) | 16.1% | 3,530만 달러 |\n\n**쉽게 비유하면**\n\n- 레드캣은 손님(미군)이 크게 몰려올 것을 기대하고 식당을 5배로 넓힌 가게입니다. 공장 면적은 2024년보다 약 5배(26만~27만 평방피트)이고, 연 매출 10억 달러를 만들 수 있는 크기라고 합니다.\n- 하지만 아직 손님은 그만큼 오지 않았습니다. 분기 매출 2,000만 달러로는 월세·인건비(분기 영업비용 4,190만 달러)도 못 냅니다.\n- 매출총이익률 16%는 드론 1만 달러어치를 팔면 재료·생산비를 빼고 1,600달러가 남는다는 뜻입니다. 회사는 연말 30%를 목표로 합니다.\n\n**현금과 희석 (돈을 태우는 속도)**\n\n- 2026년 상반기에 영업으로 7,870만 달러, 설비 투자로 1,260만 달러를 썼습니다. 한 달에 약 1,500만 달러씩 현금이 나간 셈입니다. 재고도 3,040만 → 8,480만 달러로 늘었습니다.\n- 부족한 돈은 주식을 새로 팔아 채웠습니다. 상반기 신주 발행으로 2.59억 달러를 모았고, 그중 5월 13일에는 2,394만 주를 $9.40(전날 종가보다 15% 싼 값)에 팔아 2.25억 달러를 마련했습니다.\n- 평균 주식 수는 1년 전 9,130만 주(2025년 2분기) → 지금 약 1.53억 주로 약 67% 늘었습니다. 5월에는 최대 5억 달러까지 추가로 증권을 발행할 수 있는 일괄신고(shelf)도 해두었습니다.\n- 현금 3.26억 달러는 지금 속도라면 1년 반~2년치입니다. 당장 돈이 바닥나지는 않지만, 흑자가 늦어지면 또 신주를 팔 가능성이 큽니다.\n\n#### 앞으로의 숫자\n\n| 항목 | 회사가 내놓은 숫자 | 지금까지 |\n|---|---|---|\n| 매출 목표 | 1.5억~1.8억 달러. 3월 18일 4분기 발표에는 숫자 가이던스가 없었고, 5월 7일 1분기 발표에서 '단기~중기 연간 목표 매출'로 처음 제시. 8월 6일 2분기 발표에서는 '올해 연간 목표'로 재확인 | 상반기 3,570만 달러. 2026년에 맞추려면 하반기 1.14억~1.44억 달러 필요 |\n| 매출총이익률 | 연말 약 30% | 2분기 16.1% |\n| 흑자 전환 | 블루 옵스·틸은 4분기 흑자 목표, 회사 전체는 연내 목표(납품·수주 시기에 달림) | 2분기 조정 EBITDA −3,180만 달러 |\n| 수주 가능성(파이프라인) | 약 20억 달러 (회사 설명) | 확정 수주잔고는 공개하지 않음 |\n| 증권사 예상 | 2026년 주당 −$0.34, 2027년 −$0.06 적자 (Zacks 평균) | 흑자는 빠르면 2028년으로 보는 시각이 많음 |","gov_md":"매출은 거의 다 군과 정부가 드론과 예비 배터리·부품을 사는 데서 나옵니다. 미 육군 비중은 2025년 매출의 약 73%에서 2026년 상반기 약 50%로 줄었 3.25로 빠진 뒤여서 폭이 더 컸음. 업종 반등의 원인 뉴스는 확인 못함","move":"+14% (종가 $15.15)"},{"date":"2026-03-18","title":"4분기 확정 실적","detail":"2025년 4분기 확정 실적: 매출 2,620만 달러(예비 범위 상단), 매출총이익률 4.2%, 숫자 가이던스 없음. 발표 전 장중 약 $18.1","move":"발표 후 하락"},{"date":"2026-03-02","title":"이란 공습 급등","detail":"미·이스라엘의 이란 공습, 이노베이션 데이(2월 27일), 드론 방어 업체와 협력","move":"+17% (종가 $13.67)"},{"date":"2026-01-30","title":"주주 소송 보도","detail":"주주 소송 보도: \"육군 계약 생산 능력을 부풀렸다\" (네바다 대표소송 2건, 뉴저지 집단소송 1건 진행 중)","move":"−12% (종가 $13.12)"},{"date":"2026-01-22","title":"블랙록 7.3%·연중 고점","detail":"블랙록 7.3% 보유 신고(2025년 말 기준), 다음 날 연중 최고 종가","move":"고점 (종가 $17.36)"},{"date":"2026-01-13","title":"4분기 예비 매출","detail":"4분기 예비 매출 2,400만~2,650만 달러 (전년 130만 달러)","move":"호재 (종가 약 $13)"},{"date":"2026-01-02","title":"베네수엘라 작전 기대","detail":"미군 베네수엘라 작전 뒤 '군용 드론' 기대감","move":"1월 2일 +15.5%, 5일 +19%, 8일 +13% (종가 1월 5일 $10.90)"}],"chart_events":["2026-01-22","2026-03-02","2026-05-12","2026-05-28","2026-08-14","2026-09-15"],"bull":["**정책 순풍이 큽니다**: 8월 수입 드론 관세 최대 100%, 미군은 Blue UAS 인증 드론만 구매. 중국 DJI의 빈자리를 미국 회사가 채워야 합니다.","**정책 순풍이 큽니다**: 국방부는 2027년 말까지 드론 30만 대, 540억 달러 이상 예산을 요청했다는 보도가 있습니다. 레드캣 연 매출(7,150만 달러)의 700배가 넘는 시장입니다.","**육군 '정식 장비' 지위**: 블랙 위도우는 육군 SRR 사업에서 스카이디오를 이기고 뽑혔고, 계약은 약 3,500만 달러로 늘었습니다. 한 번 정식 장비가 되면 부품·배터리·업그레이드 주문이 이어지기 쉽습니다.","**육군 '정식 장비' 지위**: 팔란티어 소프트웨어를 쓴 새 카메라(AiN)가 육군 평가 중이고, 통과하면 두 번째 정식 사업이 됩니다. 공군 경비대도 기존 드론을 블랙 위도우로 바꿀지 평가 중입니다.","**매출이 빠르게 커집니다**: 2분기 매출 +527%. 회사 목표(1.5억~1.8억 달러)를 달성하면 최근 12개월 매출의 2배 이상입니다. 회사는 수주 가능성(파이프라인)을 약 20억 달러로 봅니다.","**매출이 빠르게 커집니다**: 공장은 연 매출 10억 달러 규모까지 만들 수 있게 미리 지었고, 작은 주문은 10영업일 안에 출하할 수 있다고 합니다.","**마진이 좋아지는 중**: 매출총이익률이 1분기 12.7% → 2분기 16.1%. 회사는 연말 30%, 블루 옵스·틸의 4분기 흑자를 목표로 합니다.","**고객과 제품이 넓어짐**: 육군 비중 73% → 약 50%. 공군, 해군, 나토, 일본, 우크라이나로 분산됐습니다.","**고객과 제품이 넓어짐**: 무인 보트(블루 옵스)는 대만·호르무즈 같은 바다 분쟁에서 수요가 커질 분야입니다. 5월 양산을 시작했고 해군에 리스 중입니다.","**주가가 많이 싸졌다는 주장**: 시가총액 9.0억 달러에서 현금 3.26억 달러를 빼면 사업 가치는 약 6억 달러입니다. 2026년 목표 매출 중간값(1.65억 달러)의 약 3.6배입니다.","**주가가 많이 싸졌다는 주장**: 애널리스트 평균 목표가 $16.50는 현재가의 약 2.8배입니다. 주가는 5월 유상증자 가격($9.40)보다 37% 낮습니다.","**주가가 많이 싸졌다는 주장**: 공매도가 유통주의 약 27%로 많아서, 좋은 소식이 나오면 공매도 청산 매수로 급등할 수 있다는 시각이 있습니다 (5월 28일 하루 +33%가 그 예)."],"bear":["**희석이 큽니다**: 주식 수가 1년 만에 약 67% 늘었습니다 (평균 9,130만 → 약 1.53억 주). 피자를 더 잘게 자른 것과 같아, 회사가 커져도 한 주의 몸은 덜 커집니다.","**희석이 큽니다**: 상반기 현금 소진은 약 9,100만 달러(영업 7,870만 + 설비 1,260만)입니다. 5억 달러 증권 발행 신고(shelf)가 남아 있어 추가 발행 여지가 큽니다.","**목표 달성이 어렵다는 의심**: 2분기 매출은 예상보다 약 11% 적었습니다. 연간 목표를 맞추려면 3·4분기 평균 5,700만 달러 이상, 즉 2분기의 약 3배를 팔아야 합니다.","**목표 달성이 어렵다는 의심**: 이 목표는 5월에 처음 나왔을 때 '단기~중기 목표'였고, 8월에야 '올해 목표'로 표현됐습니다. 1분기 매출(1,550만 달러)은 2025년 4분기(2,620만 달러)보다도 41% 적었습니다.","**목표 달성이 어렵다는 의심**: 정부 주문은 시기가 자주 밀립니다. 증권사들은 2026·2027년 모두 적자를 예상하고, Zacks는 실적 추정치를 내렸습니다.","**경쟁에서 밀리는 신호**: 9월 국방부 '드론 지배' 2차 경연에서 틸이 탈락했습니다. 우승 9개사에는 틸 창업자가 나가서 만든 벡터가 들어갔습니다.","**경쟁에서 밀리는 신호**: 스카이디오는 3월 육군에서 5,200만 달러(드론 2,500대 이상) 주문을 72시간 만에 받았습니다. 레드캣 SRR 계약(3,500만 달러)보다 큽니다.","**경쟁에서 밀리는 신호**: 10월 8일 온다스가 1.65억 달러 주문을 받은 날에도 레드캣은 내렸습니다.","**경쟁에서 밀리는 신호**: 6월 22일 중국이 레드캣·틸을 이중용도 품목 수출통제 대상에 넣었습니다. 부품·소재를 중국에서 직접 사기 어려워집니다.","**소송과 경영 신뢰 문제**: 7월 21일 해임된 최고매출책임자(CRO) 제프리 히치콕이 뉴욕주 대법원(뉴욕 카운티)에 소송을 냈습니다(Hitchcock v. Red Cat Holdings). 회사 공시에 따른 청구 내용은 뉴욕·오리건 법상 보복 해고, 계약 위반, 신의성실 위반이고, 손해배상 금액은 정하지 않았습니다. 보복 해고는 보통 '문제를 제기했다가 잘렸다'는 주장입니다.","**소송과 경영 신뢰 문제**: X에서는 이 소장에 '군용 드론 배터리를 세관을 피해 여객기로 나르고 현금을 줌다'는 주장이 담겼다는 글이 퍼졌습니다. 회사 10-Q·8-K와 보도에는 이 내용이 없고, 소장 원문(뉴욕 법원 전자소송 시스템)은 열어 보지 못해 **확인 못함**입니다. 회사는 \"근거 없는 주장\"이라며 맞소송도 검토 중입니다.","**소송과 경영 신뢰 문제**: 주주 소송도 3건입니다. 뉴저지 연방법원의 집단소송(Olsen, 5월 수정 소장, 판단은 2026년 말~2027년 예상)과, 이것이 끝날 때까지 멈춰 둔 네바다 대표소송 2건(신의의무 위반·내부자 거래 등 주장)입니다. 2025년 1월에는 공매도 보고서가 육군 계약 생산 능력을 문제 삼았습니다.","**소송과 경영 신뢰 문제**: 6월 18일 주주총회에서 경영진 보수안이 부결됐고(찬성 1,519만 대 반대 2,130만 표), 사외이사 4명(프리드먼·리우자·모·펑크)은 기권 표가 찬성 표보다 많았습니다. 전 틸 창업자와도 영업비밀 소송 중입니다.","**내부자는 팔기만 합니다**: 2025년 이후 장내 매수는 0건, 매도는 약 1,085만 달러입니다. CEO는 7월부터 매달 15만 주씩 파는 계획을 실행 중입니다. 육군 대장 출신 이사 폴 펑크는 6월에 보유 주식을 전부 팔았습니다.","**마진이 아직 낮고 비용이 큽니다**: 2025년 매출총이익률은 3.1%, 최근 12개월은 약 10%. 분기 영업비용 4,190만 달러는 분기 매출(2,020만 달러)의 2배입니다.","**분위기가 나빠졌습니다**: X에서는 \"헤그세스 장관이 약속은 많이 했지만 돈은 별로 안 왔다\"(9월 30일), \"저점을 또 낮췄다\"(10월 7일)는 글이 늘었습니다.","**분위기가 나빠졌습니다**: 9월 드론주 전체가 빠졌고, 회사별 악재 없이도 테마 자금이 빠져나가는 흐름이 있었습니다."],"analysts_md":"증권사 8~9곳의 평균 목표가는 $16.50~16.71(현재가의 약 2.8배)이지만, 8월 이후 새로 나온 목표가는 $9~15로 낮아졌습니다. 평균에는 주가가 높을 때 나온 예전 목표가가 섞여 있다는 뜻입니다.\n\n| 날짜 | 증권사 | 의견 | 목표가 |\n|---|---|---|---|\n| 9월 17일 | 노스랜드(Northland) | – | $13 |\n| 9월 2일 | 파이퍼 샌들러 | 중립 (신규) | $9 (최저) |\n| 8월 31일 | 에버코어 | 시장수익률 상회 (신규) | $15 |\n| 8월 7일 | 니드햄 | 매수 | $15 (하향, 기존 $20) |\n| 8월 7일 | HC 운라이트 | 매수 | $20 |\n| 7월 17일 | 와이스 레이팅스 | 매도 (D−) | – |\n| 6월 1일 | 로스(Roth) | 매수 (신규) | $25 (최고) |\n| 5월 27일 | UBS | 매수 (신규) | – |\n| 5월 6일 | 래덴버그 탈만 | 적극 매수로 상향 | – |\n\n- Zacks는 등급 4(매도)를 주고, 2026년 주당 −$0.34, 2027년 −$0.06 적자를 예상합니다.\n- 로스의 $25 근거는 '공장 규모가 매출 10억 달러까지 가능'이고, 파이퍼의 $9는 지금 주가($5.91)보다는 높습니다.","insider_title":"내부자·유명인 매매 (2025~)","insider_md":"2025년 이후 내부자의 장내 매수는 한 건도 없습니다. 같은 기간 내부자 5명이 약 120만 주, 1,085만 달러어치를 평균 $9.02에 팔았고, 지금 주가($5.91, 10월 8일)는 그보다 약 34% 낮습니다.\n\n**내부자 매수 (SEC Form 4 장내 매수)**\n\n- 2025년 1월~2026년 10월 기간 장내 매수 기록은 없습니다. 주가가 연중 최저인데도 경영진이 자기 돈으로 산 적이 없다는 뜻입니다.\n\n**내부자 매도 (사람별 합계)**\n\n| 누가 | 언제 | 수량 | 평균 매도가 | 금액 | 현재가 대비 |\n|---|---|---|---|---|---|\n| 제프리 톰슨 (CEO 겸 사장, 이사) | 2026년 7월 15일, 8월 17일, 9월 15일 (매달 15만 주, 10b5-1) | 450,000주 | $8.90 ($7.74~10.45) | 약 401만 달러 | −34% |\n| 니콜라스 리우자 Jr. (사외이사, 보상위원장. 본업은 Beeline Holdings CEO) | 2025년 5·6월, 2026년 8월 11·28일 | 320,309주 | $8.33 | 약 267만 달러 | −29% |\n| 폴 펑크 2세 (사외이사, 예비역 육군 대장·전 육군 교육사령관) | 2026년 6월 11일 | 165,028주 (위임장에 적힌 보유분 전부) | $11.50 | 약 190만 달러 | −49% |\n| 크리스토퍼 모 (사외이사, 감사위원장. 레드캣 CFO가 아니고 Beeline의 CFO) | 2025년 8~9월 7회, 2026년 8월 11일 | 116,833주 | $10.03 | 약 117만 달러 | −41% |\n| 조셉 프리드먼 (이사, 2026년 4월부터 비독립. CEO가 지배하는 Dronazon의 CEO) | 2025년 6월 30일 | 150,000주 | $7.37 | 약 111만 달러 | −20% |\n| **합계** |  | **1,202,170주** | **$9.02** | **약 1,085만 달러** | **−34%** |\n\n**읽는 법**\n\n- CEO의 매도는 미리 정해 둔 자동 매도 계획(10b5-1)에 따른 것입니다. 주가를 보고 그때그때 판 것은 아니지만, 매달 15만 주(약 90만~150만 달러)가 시장에 나오는 것은 사실입니다. 계획이 이어지면 10월 중순에도 매도 신고가 나올 수 있습니다.\n- 나머지 4명은 모두 이사이고, 계획 매도로 표시되지 않았습니다. 육군 대장 출신 폴 펑크는 4월 위임장에 적힌 보유분(165,028주)을 6월에 전부 $11.50에 팔았고, 결과적으로 하반기 급락 직전이었습니다.\n- 사외이사들끼리 연결돼 있습니다. 리우자는 Beeline Holdings CEO, 모는 같은 회사 CFO, 프리드먼은 그 회사 이사입니다. 또 프리드먼은 톰슨 CEO가 지배하는 Dronazon의 CEO가 되면서 2026년 4월 독립이사 자격을 잃었습니다.\n- 레드캣의 CFO는 2025년 11월부터 크리스찬 모리슨입니다. 이사들은 2025년 Form 4를 여러 번 늦게 냈다고 위임장에 적혀 있습니다.\n- 지금 가격은 모든 내부자 매도가보다 낮고, 가장 싼 매도($6.70, 2025년 5월 리우자)보다도 아래입니다.\n\n**유명인·유명 펀드**\n\n| 누구 | 무엇을 했나 | 진입 시점 주가 | 현재가 대비 |\n|---|---|---|---|\n| 낸시 펠로시 등 의회 의원 | 2025년 이후 RCAT 거래 기록 없음 (Quiver 의회 거래 데이터 없음) | – | – |\n| 트럼프 대통령 (OGE 278-T) | 2025년 8월 이후 제출된 278-T 19건(2025년 1월~2026년 7월 거래)을 모두 검색했지만 RCAT 거래 없음 | – | – |\n\n**대주주 신고 (13G/13D, 2025년 이후)**\n\n| 신고일 | 누구 | 지분 (주식 수) | 기준일과 그때 주가 | 현재가 대비 |\n|---|---|---|---|---|\n| 2026년 8월 14일 | 후드리버 캡피털 (Hood River Capital) **신규** | 7.16% (1,058만 주) | 2026년 6월 30일, 약 $9~10 | 약 −36~41% |\n| 2026년 8월 7일 | 스테이트 스트리트 (State Street) | 8.2% (1,209만 주) | 2026년 6월 30일, 약 $9~10 | 약 −36~41% |\n| 2026년 2월 9일 | 스테이트 스트리트 | 5.5% (661만 주) | 2025년 12월 31일, 약 $7.93 | −25% |\n| 2026년 1월 30일 | 뱅가드 (The Vanguard Group) | 5.02% (600만 주) | 2025년 12월 31일, 약 $7.93 | −25% |\n| 2026년 1월 21일 | 블랙록 (BlackRock) | 7.3% (876만 주) | 2025년 12월 31일, 약 $7.93 | −25% |\n| 2025년 7월 17일 | 블랙록 | 5.1% (504만 주) | 2025년 6월 30일, 약 $7.4 | 약 −20% |\n| 2025년 2월 13일 → 5월 15일 | G1 Execution Services (마켓메이커) | 5.3% → 2.7% | 2024년 말 → 2025년 3월 말 | – |\n\n- 13G는 '경영 참여 없이 단순 투자'라는 신고입니다. 13D(경영 참여 목적) 신고는 없습니다.\n- 블랙록·뱅가드·스테이트 스트리트는 지수 펀드가 많아 자동으로 담는 경우가 대부분입니다. 블랙록 7.3%는 1월 고점 무렵에 신고됐지만 기준일은 2025년 말(약 $7.93)입니다.\n- 눈여겨볼 곳은 새로 7.16%를 신고한 헤지펀드 후드리버 캡피털입니다. 6월 말 기준이라 5월 유상증자($9.40) 무렵에 담은 것으로 보이며(확인 못함), 지금은 그보다 낮습니다. 그 뒤에도 계속 들고 있는지는 모릅니다.\n- 2026년 3월 뱅가드 그룹은 RCAT을 포함해 여러 종목에서 같은 날(3월 13일 기준) 0%로 신고했습니다. 실제 매도라기보다 신고 주체가 바뀐 것으로 보이지만 확인 못함입니다.\n- 2026년 7월까지 전직 정부 관리 3명이 레드캣을 위해 로비 활동을 한 기록이 있습니다 (Quiver). 사외이사 폴 펑크도 예비역 육군 대장입니다.\n\n출처: SEC EDGAR Form 4·13G (레드캣), [SEC: 2026년 주주총회 위임장(DEF 14A)](https://www.sec.gov/Archives/edgar/data/748268/000162828026028755/rcat-20260430.htm), [SEC 8-K: 6월 18일 주총 투표 결과](https://www.sec.gov/Archives/edgar/data/748268/000162828026045393/rcat-20260618.htm), OGE 278-T (트럼프, [Open Cabinet 목록](https://open-cabinet.org/officials/trump-donald-j)), [Quiver Quantitative RCAT](https://www.quiverquant.com/stock/RCAT/)","next_md":"- 2026년 10월 중순: CEO의 다음 계획 매도(매달 15일 전후 15만 주 패턴)가 이어지는지\n- 2026년 11월 중순(날짜 미발표): 3분기 실적. 매출이 연간 목표에 맞게 크게 뛰었는지(하반기에만 1.14억 달러 이상 필요), 목표 1.5억~1.8억 달러를 '올해 목표'로 유지하는지, 다시 '단기~중기 목표'로 물러서는지\n- 3분기 실적의 현금 잔고와 현금 소진 속도, 새 주식 발행(일괄신고 5억 달러 사용) 여부\n- 2026년 하반기: 육군 AiN(팔란티어 항법 카메라) 선정 결과. 두 번째 정식 사업이 될지\n- 국방부 '드론 지배' 프로그램: 2차 우승사 6만 대 계약 규모와 다음 경연(3차)에 틸이 다시 도전하는지\n- 2026년 4분기: 블루 옵스·틸 흑자 전환, 매출총이익률 30% 목표 달성 여부\n- 공군 경비대 평가 후 블랙 위도우 대량 교체 주문(기존 1,000~2,000대 규모) 여부\n- 소송: 뉴욕주 대법원 Hitchcock v. Red Cat(배터리 운송 주장이 실제 소장에 있는지 포함, 회사 맞소송 여부), 뉴저지 집단소송 Olsen의 기각 신청 판단(2026년 말~2027년), 네바다 대표소송 2건, 전 틸 창업자·벡터 상대 영업비밀 소송\n- 후드리버 캡피털 등 대주주의 3분기 말 보유 변화 (11월 중순 13F·13G)\n- 2027년 2월 전후: 드론 부품 관세(180일 유예) 시행. 경쟁 수입품 가격이 오르는지\n- 2027 회계연도 국방예산·국방수권법(NDAA)의 소형 드론 예산 규모","glossary_md":"| 용어 | 뜻 |\n|---|---|\n| SRR (단거리 정찰) | 미 육군이 소대에 나눠주는 작은 정찰 드론 사업. 블랙 위도우가 2단계 제품으로 뽑힘 |\n| 프로그램 오브 레코드 | 군이 예산을 잡고 여러 해 동안 사는 '정식 장비' 사업 |\n| Blue UAS | 미 국방부가 보안을 확인해 군이 살 수 있도록 허락한 드론 목록 |\n| 드론 지배 프로그램 / Gauntlet | 국방부가 값싼 드론을 대량으로 사려고 여는 시험 대회. 우승사가 주문을 받음 |\n| 희석 | 회사가 새 주식을 찍어 기존 주주의 지분 비율이 줄어드는 것 |\n| 유상증자 | 새 주식을 팔아 현금을 모으는 것. 보통 시장 가격보다 싸게 판매 |\n| 일괄신고 (shelf) | 미리 한도를 등록해 두고 필요할 때마다 주식·채권을 팔 수 있게 하는 제도 |\n| 10b5-1 계획 | 임원이 미리 정한 날짜·수량대로 자동 매도하는 계획. 내부자 거래 오해를 피하려는 것 |\n| 매출총이익률 | 매출에서 재료비·제조비를 뺀 뒤 남는 비율 |\n| 조정 EBITDA | 주식 보상 등 일부 비용을 빼고 본 영업 이익. 마이너스면 본업에서도 적자 |\n| 공매도 비율 | 주가 하락에 베팅한 주식 수 ÷ 유통주식. 높으면 급등·급락이 모두 커질 수 있음 |\n| USV (무인 수상정) | 사람 없이 물 위를 다니는 보트. 정찰·호위·공격에 씀 |\n| FPV 드론 | 조종사가 드론 카메라 화면을 고글로 보며 조종하는 드론 |\n| GPS 거부 환경 | 적이 전파 방해로 GPS를 막은 상황. 시각 항법이 필요한 이유 |\n| 13G | 한 회사 지분 5% 이상을 가진 단순 투자자가 내는 신고서 |","sources":[{"t":"SEC 8-K: Red Cat 2026년 2분기 실적 보도자료 (8월 6일)","u":"https://www.sec.gov/Archives/edgar/data/0000748268/000162828026054364/rcat-20260806xexx991a.htm"},{"t":"TipRanks: 2분기 실적 콜 요약","u":"https://www.tipranks.com/news/company-announcements/red-cat-holdings-earnings-call-signals-high-growth-ramp"},{"t":"Yahoo Finance: 5월 13일 유상증자로 급락","u":"https://finance.yahoo.com/news/why-red-cat-stock-tumbling-121101984.html"},{"t":"Motley Fool: 5월 28일 급등 원인","u":"https://fool.com/investing/2026/05/28/why-red-cat-stock-is-skyrocketing-today/"},{"t":"Yahoo Finance (Insider Monkey): 니드햄 매수 유지와 1분기 실적","u":"https://finance.yahoo.com/news/needham-reiterates-buy-red-cat-103322341.html"},{"t":"Yahoo Finance: 3월 4분기 예비 매출과 급등","u":"https://finance.yahoo.com/news/red-cat-rcat-soars-10-003024388.html"},{"t":"Nasdaq (MarketBeat): 매출 1,800% 급증과 SRR 계약","u":"https://www.nasdaq.com/articles/red-cat-revenue-surges-1800-after-crossing-mass-production"},{"t":"Finviz: 3월 2일 급등 원인","u":"https://finviz.com/news/327264/why-are-shares-of-red-cat-holdings-skyrocketing"},{"t":"Nasdaq (Motley Fool): 이란 공습 후 드론주 급등","u":"https://www.nasdaq.com/articles/why-red-cat-stock-soared-today"},{"t":"Nasdaq (Motley Fool): 나스닥 개장벨과 이노베이션 데이","u":"https://www.nasdaq.com/articles/why-red-cat-stock-popped-today-then-dropped"},{"t":"Stocktwits: 베네수엘라 작전 기대로 반등","u":"https://stocktwits.com/news-articles/markets/equity/red-cat-roars-back-venezuela-speculation-sends-drone-stock-flying/cmxw13MR4Rs"},{"t":"Stocktwits: 6월 5년 만의 최악의 달","u":"https://stocktwits.com/news-articles/markets/equity/rcat-heads-for-worst-month-in-five-years-retail-pins-hope-on-government-drone-investment/cZ1By95R7h5"},{"t":"Stocktwits: CRO 소송과 7월 하락","u":"https://stocktwits.com/news-articles/markets/equity/rcat-stock-heads-for-second-monthly-loss-red-cat-executive-lawsuit-adds-pressure-before-earnings/cZZnQFQR7x4"},{"t":"TipRanks: 전 임원 보복 해고 소송","u":"https://www.tipranks.com/news/company-a .74,12.68,12.46,11.49,10.9,12.01,11.18,11.97,10.9,11.2,11.44,10.63,10.18,9.34,8.91,9.28,10.32,10.65,10.55,10.44,10.11,9.23,9.17,9.19,8.83,8.38,8.79,8.24,7.67,7.64,7.76,8.59,7.83,8.03,7.64,7.79,7.45,6.77,7.38,7.53,8.26,8.86,8.66,8.67,9.21,10.0,10.66,10.32,10.23,11.13,10.44,10.2,9.89,9.53,9.62,8.93,9.1,8.93,9.28,8.49,8.59,8.25,8.32,8.54,8.37,8.69,8.13,8.08,7.96,7.8,7.97,7.09,7.09,6.75,6.95,6.94,6.59,6.8,6.66,6.5,6.45,6.46,6.33,6.4,6.34,6.34,6.15,5.91,5.77,5.39,5.18,4.73,4.9]},"mc":748300388.3639765},{"ticker":"SMR","company":"NuScale Power","name_ko":"뉴스케일 파워","category":"미국우선","field":"원자로","doc_url":"https://claude.ai/code/artifact/d801514f-3c19-4e6f-8864-05f4b3403541","lead":"뉴스케일 파워는 미국에서 유일하게 정부(NRC) 설계 승인을 받은 소형모듈원전(SMR) 회사지만, 아직 확정 주문이 하나도 없고 매출이 거의 0이라 주가는 2026년 고점 대비 약 65% 떨어져 연중 최저가에 있습니다.","glance":[["현재가","$7.32 (2026년 최저가)"],["시가총액","약 31억 달러 (약 4.3조 원, A·B주 4.30억 주 기준)"],["2026년 고점 / 저점","$20.64 (1월 22일) / $7.32 (10월 8일)"],["고점 대비","−64.5% (2025년 10월 사상 최고 약 $57 대비 −87%)"],["매출 (최근 12개월)","1,069만 달러. 2분기 매출은 겨우 7.5만 달러"],["보유 현금·투자금","18.9억 달러 (6월 말). 상반기 영업현금 3.73억 달러 사용"],["정부 개입","높음: NRC 설계 승인(77MWe), 에너지부(DOE) 개발비 지원, 미·일 5,500억 달러 투자 틀에서 최대 250억 달러 후보, 미 수출입은행·DFC의 루마니아 지원 의향"],["국방 필수도","낮음~중간: 육군 소형원자로(Janus) 사업 5곳 선정에서 빠짐. 국방보다는 전력·에너지 안보용"],["내부자 동향","2025년 이후 장내 매수 0건. 매도 106건 약 24.7억 달러 (대부분 최대주주 플루어 지분 전량 매각)"],["애널리스트 평균 목표가","$11.97 (15명, 범위 $6~20), 의견은 대체로 '보유'"],["다음 실적 발표","2026년 11월 5일 (3분기)"]],"overview_md":"#### 기업 개요: 이 회사는 무엇을 하나\n\n뉴스케일은 공장에서 찍어내는 작은 원자로를 설계하는 회사입니다. 2007년 오리건 주립대 연구에서 시작했고, 본사는 미국 오리건주 코발리스에 있습니다.\n\n**1. SMR(소형모듈원전)이란?**\n\n- 보통 원전은 현장에서 10년 가까이 지는 1,000MW급 거대한 건물입니다. SMR은 그보다 훨씬 작은 원자로를 공장에서 만들어 트럭·배로 옮긴 뒤 레고처럼 여러 개를 이어 붙이는 방식입니다.\n- 뉴스케일의 모듈(NPM) 하나는 77MW(약 6만 가구가 쓰는 정도)를 만듭니다. 6개를 묶으면 462MW, 12개를 묶으면 924MW입니다.\n- 평범한 경수로(물로 식히는 원자로)와 5% 미만 저농축 우라늄을 쓰기 때문에, 특수 연료(HALEU)가 필요한 경쟁사보다 연료 구하기가 쉽습니다.\n\n**2. 이 회사만의 특징**\n\n- 2025년 5월 미국 원자력규제위원회(NRC)가 77MW로 키운 설계를 승인했습니다. 미국 SMR 중 NRC 설계 승인을 받은 곳은 뉴스케일뿐입니다.\n- 하지만 아직 고객에게 실제 원자로를 지어준 적이 없습니다. 2023년 아이다호 UAMPS 사업은 전기값이 너무 올라 취소됐습니다.\n- 2011년부터 최대주주였던 건설사 플루어(Fluor)가 2025년 10월~2026년 4월에 지분을 전부 팔고 떠났습니다 (순수익 약 24.3억 달러).\n- 한국 두산에너빌리티가 원자로 압력용기 소재를 만들고, 삼성물산·두산이 주주로 참여합니다.\n\n#### 돈 버는 구조: 지금은 거의 0, 주문이 나야 시작\n\n뉴스케일은 발전소를 직접 운영하지 않고, 원자로 모듈과 설계·인허가·운영 서비스를 팔아 돈을 벌려고 합니다. 고객 찾기와 자금 마련은 파트너 ENTRA1 에너지가 맡습니다.\n\n| 돈줄 | 지금 상태 | 숫자 | 언제 돈이 되나 |\n|---|---|---|---|\n| 엔지니어링·라이선스 | 루마니아 설계 작업 2025년 말 종료 | 매출 2024년 3,700만 → 2025년 3,150만 → 2026년 상반기 64만 달러 | 지금 (거의 멈춤) |\n| 원자로 모듈 판매 | 확정 주문 0건. 12개 분량 부품을 미리 제작 중 | 모듈당 수천만~수억 달러 규모 | 확정 계약 후 2028년 이후 |\n| 루마니아 RoPower (6기) | 2026년 2월 최종투자결정(FID) 승인. 단, 1호기만 확정 | 총사업비 최대 70억 달러, 자금 미확보 | 1호기 상업운전 2033년 목표 |\n| TVA–ENTRA1 (최대 6GW) | 2025년 9월 비구속 협약, 확정 전력구매계약(PPA) 협상 중 | 최대 72개 모듈 | PPA 체결 시점에 따라 |\n| 서비스·연료·정비 | 발전소가 있어야 시작 | - | 2030년대 |\n\n**ENTRA1 구조가 특이한 점**: 뉴스케일이 파트너에게 돈을 줍니다. 2025년 TVA 비구속 협약에 따른 '1차 마일스톤 기여금' 5.07억 달러를 비용으로 잡았고(2026년 상반기에 2.60억 달러 실제 지급), 72개 모듈 확정 PPA가 나오면 약 12억 달러를 더 낼 수 있습니다. 그 대가로 모듈 주문을 받는 구조입니다.\n\n#### 앞으로의 숫자\n\n| 항목 | 내용 |\n|---|---|\n| 회사 가이던스 | 숫자 가이던스 없음. \"프로젝트가 진행되면 매출이 늘 것\" |\n| 2026년 2분기 | 매출 7.5만 달러, 영업손실 6,400만 달러, 주당 −$0.13 |\n| 현금 | 18.9억 달러 (현금 7.66억 + 단기투자 3.06억 + 장기투자 8.21억) |\n| UBS 예상 | 매출 2028년 1.85억 → 2030년 9.24억 달러, 2030년까지 적자, 2026~2028년 현금 약 7억 달러 소모 |\n| 대기 중인 추가 비용 | TVA 확정 시 ENTRA1 마일스톤 약 12억 달러 |","gov_md":"미국 정부는 뉴스케일을 \"중국·러시아에 맞서 미국형 원전을 동맹국에 파는 선수\"로 씁니다. 다만 돈을 직접 넣기보다는 승인·수출금융·외교 협정 같은 '길 열어주기'가 중심이고, 아직 정부가 직접 낸 확정 주문은 없습니다.\n\n| 항목 | 내용 | 금액·날짜 | 구속력 |\n|---|---|---|---|\n| NRC 설계 승인 | 50MW → 77MW로 키운 설계(US460) 표준설계승인. 미국 SMR 중 유일 | 2025년 5월 | 확정 (가장 큰 자산) |\n| 에너지부(DOE) 지원 | 수년간 개발비 비용 분담. 2025년에 DOE·USTDA 분담 한도에 도달해 지원금이 10만 달러로 줄어듦 | 과거 누적 수억 달러 | 사실상 종료 |\n| 미·일 5,500억 달러 투자 틀 | 일본이 미국에 투자할 후보 명단에 ENTRA1·뉴스케일 포함 | \"최대\" 250억 달러, 2025년 10월 말 | 낮음 (후보 명단, 지급 방식 미정) |\n| TVA(연방 전력공기업)–ENTRA1 | TVA 7개 주 지역에 최대 6GW, 즉 최대 72개 모듈 | 2025년 9월 비구속 협약 | 낮음 (PPA 미체결) |\n| 루마니아 지원 (동맹 수출) | 미 수출입은행(EXIM) 사전사업 대출 9,800만 달러, EXIM 최대 30억·DFC 최대 10억 달러 지원 의향서 | 2024년~, FID 2026년 2월 | 중간 (의향서 단계) |\n| 육군 Janus 소형원자로 | 기지 5곳에 1~20MW 원자로, 최대 22억 달러. BWXT·웨스팅하우스·라디안트 등 선정 | 2026년 8월 26일 | 뉴스케일 미선정 (모듈이 77MW로 큼) |\n| TVA 첫 SMR 건설허가 | NRC가 클린치 리버 부지에 GE 히타치 BWRX-300(300MW) 허가 | 2026년 9월 30일 | 경쟁사가 먼저 착공 단계로 |\n\n**미국·중국·러시아 경쟁으로 보면**\n\n- 중국은 하이난성에 125MW급 ‘링롱 원(ACP100)’을 2021년 착공해 2026년 상업운전을 목표로 합니다. 육상 상업용 SMR로는 세계 최초가 될 수 있습니다.\n- 러시아는 70MW 부유식 원전 ‘아카데미크 로모노소프’를 2020년부터 운영 중입니다.\n- 반면 뉴스케일은 승인은 가장 먼저 받았지만 아직 착공한 호기가 없습니다. 루마니아(구 석탄발전소 부지)가 동유럽에서 러시아 원전을 대신하는 ‘미국형 원전 쇼케이스’ 역할을 합니다.\n\n**동맹국 공급망 (한국·일본)**\n\n| 회사 | 역할 | 지분 |\n|---|---|---|\n| 두산에너빌리티 | 2022년 12월 상부 원자로 압력용기 6기분 소재(2,000톤 이상) 수주, 2023년 5월 단조 시작 | 약 2.9% (13G) |\n| 삼성물산 | 사업 파트너·주주 | 5.0% → 3.8%로 축소 (13G) |\n| 일본 에바라 엘리엇 | 원자로 증기로 쓰는 산업용 압축기 공동개발 | - |\n| 일본 정부 (투자 틀) | 최대 250억 달러 후보 | - |\n\n정리하면, 정부는 뉴스케일에 '면허'와 '동맹 수출의 문'을 주었지만, 실제 발주는 아직 민간(ENTRA1·TVA·루마니아)의 계약 체결에 달려 있습니다. 국방 분야에서는 소형원자로(마이크로리액터) 회사들이 주도권을 잡고 있습니다.","gov_title":"정부가 이 회사를 쓰는 방법","events":[{"date":"2026-10-08","title":"연중 최저가 경신","detail":"별다른 회사 뉴스 없이 연중 최저가. 10/6에 3분기 실적일(11/5) 공지","move":"$7.32 (−4.6%)"},{"date":"2026-09-30","title":"TVA 첫 SMR은 경쟁사","detail":"NRC가 TVA 클린치 리버에 경쟁사 GE 히타치 BWRX-300 건설허가. TVA의 첫 SMR은 뉴스케일이 아님","move":"$7.90, 이후 하락 지속"},{"date":"2026-09-11","title":"UBS 매도 하향","detail":"UBS '중립→매도', 목표가 $10→$6. 이유: 확정 고객 없음, 2026~28년 현금 약 7억 달러 소모, 착공 지연","move":"$8.61 (−15.7%)"},{"date":"2026-09-10","title":"파이퍼 샌들러 업종 분석","detail":"파이퍼 샌들러 원전 업종 분석 시작(오클로 매수, X-에너지 매도). 원전주 동반 약세","move":"$10.21 (−5.5%)"},{"date":"2026-09-08","title":"원전주 동반 반등","detail":"새 발표 없이 원전주 동반 반등, 거래량 평소의 약 1.7배","move":"$11.18 (+15.3%)"},{"date":"2026-08-26","title":"육군 Janus 제외","detail":"육군 Janus 소형원자로 5개사 선정, 뉴스케일 제외","move":"$9.27 (−5.5%)"},{"date":"2026-08-11","title":"7.5억 달러 ATM 공시","detail":"최대 7.5억 달러 수시 신주 발행(ATM) 계약 공시","move":"$9.89 → 다음 날 $9.59"},{"date":"2026-08-05","title":"2분기 매출 7.5만 달러","detail":"2분기 실적: 매출 7.5만 달러(전년 810만 달러), 주당 −$0.13. 다음 날 캐너코드 목표가 250억 달러. 하나만 확정돼도 매출이 수십배 뛸 수 있는 구조입니다 (UBS도 2030년 매출 9.24억 달러를 가정).","**매도 물량(오버행) 해소**: 최대주주 플루어가 2026년 4월 21일에 지분을 모두 팔았습니다. 더 나올 대량 매도 물량이 없습니다.","**AI 전력 수요와 원전 부활 정책**: 데이터센터는 24시간 전기가 필요합니다. 2월 6일(+18%), 9월 8일(+15%)처럼 작은 뉴스에도 크게 튀는 주식입니다. 공매도 비율이 유통주의 약 20.6%라, 좋은 소식이 나오면 숙커버(공매도 청산 매수)로 급등할 수 있습니다."],"bear":["**확정 주문 0건**: TVA 협약은 비구속이고 1년이 지나도 PPA가 없습니다. 루마니아는 1호기만 확정, 나머지 5기는 자금 미확보, 상업운전 2033년 목표(TD 코웬은 2034년 지연 가능성 지적). UBS는 2028년까지 착공하는 사업을 1개만 가정합니다.","**매출이 사실상 0**: 2분기 매출 7.5만 달러(전년 810만 달러, 예상 약 100만 달러). X에서는 \"예상 890만 달러 대비 7.5만 달러\"로 퍼졌습니다(예상치는 자료마다 다름). 루마니아 설계 작업이 끝나면서 매출원이 사라졌습니다.","**현금 소모와 주식 희석**: 2026년 상반기 영업현금 −3.73억 달러(전년 −0.56억). 같은 기간 ATM으로 8,970만 주를 평균 $11.14에 팔아 9.85억 달러를 마련. 주식 수가 3.38억 → 4.30억 주(+27%)로 늘었습니다. 8월 11일 새 ATM 7.5억 달러를 만들었습니다. 현재가 $7.32로 다 팔면 약 1억 주, 지금 주식 수의 약 24%입니다.","**ENTRA1 구조에 대한 의문**: 뉴스케일이 파트너에게 5.07억 달러를 내기로 했고, TVA가 확정되면 약 12억 달러를 더 낼 수 있습니다. 주문을 받아도 이익의 큰 몴이 파트너에게 갈 수 있다는 비판입니다. \"ENTRA1의 경험·역량을 부풀렸다\"는 주장으로 집단소송·법무법인 조사가 진행 중입니다.","**경쟁사가 앞서기 시작**: 9월 30일 TVA의 첫 SMR 건설허가는 GE 히타치 BWRX-300이 받았습니다. 8월 육군 소형원자로 사업에서도 빠졌습니다. 중국 링롱 원은 2026년 상업운전 목표로, 실제 건설 경험에서 앞섭니다.","**경영진은 팔기만 함**: 2025년 이후 임원 장내 매수 0건. CEO 홉킨스는 약 1,680만 달러어치를 팔았습니다."],"analysts_md":"증권사 의견은 '보유'가 가장 많고, 올해 내내 목표가를 내렸습니다. 평균 목표가는 $11.97(15명, 범위 $6~20)로 현재가보다 약 64% 높지만, 최근 의견일수록 낮습니다.\n\n| 증권사 | 의견 | 목표가 | 날짜 |\n|---|---|---|---|\n| UBS | 중립 → 매도 | $10 → $6 | 2026-09-11 |\n| B. Riley | 매수 | $19 → $15 | 2026-08-14 |\n| RBC | 중립(섹터 퍼폼) | $14 → $10 | 2026-08-11 |\n| Northland | - | $16 | 2026-08-06 |\n| Canaccord Genuity | 매수 | $25 → $15 | 2026-08-06 |\n| Citi | 매도 | $7.5 → $6.5 | 2026-08-06 |\n| Barclays | 중립 | $15 → $11 | 2026-07-22 |\n| Truist | 보유 (신규) | $10 | 2026-07-13 |\n| Bank of America | 중립 (신규) | $12 | 2026-05-22 |\n| Goldman Sachs | - | $9 | 2026-05-08 |\n| HSBC | 보유 (신규) | $13 | 2026-04-23 |\n| Cantor Fitzgerald | 비중확대 | $55 → $20 | 2026-02-24 |\n| TD Cowen | 매수 → 보유 | - | 2026-02-11 |","insider_title":"내부자·유명인 매매 (2025~)","insider_md":"**내부자 매수: 없음.** 2025년 1월 이후 미국 SEC 내부자 신고(Form 4)에 장내 매수는 한 건도 없습니다.\n\n**내부자 매도: 106건, 약 24.7억 달러.** 이 중 99%가 최대주주였던 플루어의 지분 처분입니다.\n\n| 매도자 | 직책 | 주식 수 | 금액 | 평균 단가 | 현재가 대비 | 비고 |\n|---|---|---|---|---|---|---|\n| 플루어(Fluor) | 최대주주·이사회 | 1억 2,640만 주 | 24.36억 달러 | $19.27 | −62% | 2025년 9~10월 $36~47, 2026년 2월 13일 $19.05에 7,100만 주, 4월 9~21일 $11.6~12.1에 나머지. 지분 0% |\n| 존 홉킨스 | CEO | 97.4만 주 | 1,680만 달러 | $17.24 | −58% | 대부분 10b5-1 아님 (계획 매도는 59만 달러뿐) |\n| 로버트 해머디 | CFO | 29.2만 주 | 597만 달러 | $20.42 | −64% | 2026년 6·8·10월 각 2만 주는 10b5-1 계획. 10월 1일 $7.89에도 매도 |\n| 호세 레예스 | CTO(공동창업자) | 16.1만 주 | 382만 달러 | $23.73 | −69% | 약 63%가 10b5-1 계획 |\n| 칼 피셔 | COO | 12.4만 주 | 214만 달러 | $17.20 | −57% | 2026년 8월 5일 $9.36에도 매도 |\n| 클레이턴 스콧 | CCO | 4.7만 주 | 68만 달러 | $14.50 | −50% |  |\n| 재클린 엔겔 등 2명 | 회계 담당 | 4.0만 주 | 61만 달러 | 약 $15 | −51% |  |\n| 후지노 신지 | 이사 | 2만 주 | 18만 달러 | $8.86 | −17% | 2026년 8월 18일 |\n\n2026년 3월 2~3일 임원 5명이 같은 가격($12.22)에 팔았습니다. 주식 보상을 받을 때 세금을 내기 위한 매도로 보입니다(추정). 10b5-1은 미리 정해 둔 일정대로 자동 매도하는 계획이라, 그 자체로는 나쁜 신호가 아닙니다.\n\n**유명인·큰손**\n\n| 대상 | 내용 | 진입가·현재가 대비 |\n|---|---|---|\n| 낸시 펠로시 | 2025년 이후 SMR 거래 기록 없음 | - |\n| 리사 맥클레인 (하원, 공화당) | 매수 1,001~15,000달러. 거래일 2024년 11월 8일, 신고 2025년 8월 13일. 그 외 의원 거래 없음 | 거래일은 2025년 이전, 정확한 단가 미공개 |\n| 트럼프 대통령 (OGE 278-T) | 뉴스케일 거래 없음 | - |\n| 플루어 (13D/A) | 지분 44.4%(2025년 7월) → 37.3%(2025년 11월) → 13.3%(2026년 2월) → 0%(2026년 4월). 2011년 약 5.7억 달러 투자 → 약 24.3억 달러 회수 | 평균 매도가 $19.27, 현재가는 62% 아래 |\n| 반에크 (13G) | 6.3%(2026년 3월 31일) → 8.5%(6월 30일), SEC 13G로 확인. 대부분 ETF 보유분 | ETF라 진입가 없음 |\n| 골드만삭스 (13G) | 9.0%(2025년 12월 말) → 2.6%로 축소 | - |\n| 블랙록 / 뱅가드 (13G) | 블랙록 3.4%(2025년 12월 말) → 6.5%(2026년 6월 30일). 뱅가드 8.92%(2025년 6월) → 5.49%(2025년 12월 말) → 2026년 3월 13G/A에서 0% 신고(조직 개편에 따른 신고 주체 변경으로 보임, 추정). SEC 확인 | - |\n| 두산에너빌리티 / 삼성물산 (13G) | 두산 2.9%(2025년 9월 30일) / 삼성물산 3.8%(2025년 3월 31일, 마지막 신고). SEC 확인 | 초기 전략 투자(두산 등 약 1.04억 달러) |\n\n한 줄 정리: 돈을 가장 많이 아는 내부자와 최대주주는 2025~2026년 내내 팔기만 했고, 현재가는 그들의 평균 매도가보다 50~69% 낮습니다.","next_md":"- 2026-11-05 (미 동부 오후 5시, 한국 11월 6일 아침 7시): 3분기 실적. 매출이 다시 생겼는지, 분기 현금 소모, 7.5억 달러 ATM을 얼마나 썼는지(주식 수 변화)\n- 시점 미정: TVA–ENTRA1 확정 전력구매계약(PPA). 체결 시 최대 72개 모듈 주문의 문이 열리지만 ENTRA1에 약 12억 달러 추가 지급 가능\n- 시점 미정: 루마니아 RoPower 조건 충족과 자금 조달(미 EXIM 최대 30억·DFC 최대 10억 달러 확정 여부), 1호기 장기 조달 품목 계약\n- 시점 미정: 미·일 투자 틀에서 ENTRA1·뉴스케일 몸(최대 250억 달러)이 실제 프로젝트로 지정되는지\n- 진행 중: ENTRA1 관련 집단소송 진행 상황\n- 수시 확인: 경쟁 동향 — 경쟁사 GE 히타치 BWRX-300 클린치 리버 착공 일정, 중국 링롱 원 상업운전 발표\n- 주가: UBS·씨티 목표가 $6~6.5 구간 지지 여부, 내부자 첫 장내 매수가 나오는지","glossary_md":"| 용어 | 뜻 |\n|---|---|\n| SMR (소형모듈원전) | 공장에서 만들어 여러 개를 이어 붙이는 작은 원자로. 티커도 SMR |\n| MWe / GW | 전기 출력 단위. 1GW = 1,000MW. 77MWe는 약 6만 가구분 |\n| NRC | 미국 원자력규제위원회. 원자로 설계·건설·운영을 허가하는 기관 |\n| 표준설계승인 (SDA) | \"이 설계는 안전하다\"는 NRC의 승인. 실제 건설에는 별도 허가 필요 |\n| PPA (전력구매계약) | 발전소가 만든 전기를 정해진 값에 오래 사주겠다는 계약. 이게 있어야 은행이 돈을 빌려줌 |\n| FID (최종투자결정) | \"이 사업에 돈을 쓰겠다\"는 최종 결정 |\n| 비구속 협약 | 서로 협력하자는 약속일 뿐, 어겨도 벌칙이 없는 합의 |\n| ATM 발행 | 시장 가격으로 주식을 조금씩 수시로 팔아 돈을 모으는 방식 |\n| 희석 | 새 주식이 늘어 기존 주주의 몸(지분)이 작아지는 것 |\n| 오버행 | 언제든 시장에 나올 수 있는 대량 매도 물량 (예: 플루어 지분) |\n| 13D / 13G | 5% 이상 대주주가 SEC에 내는 보고서. 13D는 경영 참여 가능성 있는 투자자 |\n| Form 4 / 10b5-1 | 임원·대주주의 매매 신고 / 미리 정한 일정대로 자동 매도하는 계획 |\n| 공매도 비율 | 주가 하락에 베팅한 물량이 유통주의 몇 %인지 |\n| HALEU | 고농축 저농축 우라늄(5~20%). 일부 차세대 원자로가 필요, 공급이 부족 |","sources":[{"t":"NuScale IR: 2026년 2분기 실적 보도자료 (8월 5일)","u":"https://www.nuscalepower.com/press-releases/2026/nuscale-power-reports-second-quarter-2026-results"},{"t":"SEC 8-K: 2026년 2분기 재무제표","u":"https://www.sec.gov/Archives/edgar/data/0001822966/000182296626000086/a2026-08x05xnuscaleq2202.htm"},{"t":"SEC 8-K: 2025년 연간 실적 (2월 26일)","u":"https://www.sec.gov/Archives/edgar/data/1822966/000182296626000016/a20260226-earningscallpr.htm"},{"t":"Boardroom Alpha: 7.5억 달러 ATM 8-K (8월 11일)","u":"https://www.boardroomalpha.com/sec/smr-8-k-2026-08-11-0001104659-26-094073"},{"t":"NuScale IR: 보도자료 목록","u":"https://www.nuscalepower.com/press-releases"},{"t":"StockAnalysis: SMR 개요·뉴스","u":"https://stockanalysis.com/stocks/smr/"},{"t":"Market 8.64,9.29,9.07,9.4,9.05,9.81,9.27,9.74,9.29,9.27,9.21,9.56,9.75,9.7,11.18,10.81,10.21,8.61,8.51,8.43,8.3,9.04,8.27,8.79,8.89,8.68,8.47,8.42,7.91,7.76,7.9,7.79,7.75,7.68,8.02,7.67,7.32,7.2,6.7,6.49,5.83,6.15]},"mc":2523895599.4377947},{"ticker":"SPCX","company":"SpaceX","name_ko":"스페이스X","category":"구분 전","field":"우주","doc_url":"https://claude.ai/code/artifact/cb56e035-5892-4ef0-ad58-13210fff4a06","lead":"스페이스X는 로켓(팰컨 9·스타십), 위성 인터넷(스타링크), AI(xAI·그록·X)를 한 회사에 묶은 기업입니다. 2026년 6월 12일 공모가 $135로 역사상 가장 큰 IPO를 했고, 지금 주가는 공모가보다 약 19% 높지만 상장 직후 고점보다는 24% 낮습니다.","glance":[["상장","나스닥 (티커 SPCX), 2026년 6월 12일 상장, 공모가 $135"],["현재가","$160.57 (공모가 대비 +19%)"],["시가총액","약 2.2조 달러 (전체 주식 약 135.7억 주 기준)"],["상장 후 고점 / 저점 (종가)","$211.39 (6월 16일) / $108.27 (8월 5일). 장중 기준 $225.64 / $104.83"],["고점 대비","−24%"],["매출 (최근 12개월)","230억 달러, 1년 전보다 약 2배. 순손실 89억 달러"],["2분기 매출","78.1억 달러 (+92%), 순손실 5.4억 달러, 조정 EBITDA 35.4억 달러"],["보유 현금","약 1,000억 달러 (6월 말). 수주잔고 475억 달러"],["정부 개입","우주군 스타실드 계약 60억 달러 이상(2분기), 골든 돔 미사일 방어의 '통신망'과 '감시 위성' 담당. 지분 투자는 없음"],["국방 필수도","매우 높음. 미군 위성 발사의 대부분을 맡는 사실상 독점 업체"],["내부자 동향","쇼트웰 사장 9월 22일 34.2만 주(약 5,250만 달러) 매도(사전 계획). 상장 후 내부자 매수는 없음"],["애널리스트 평균 목표가","약 $220~226 (38~45명, 범위 $75~$800)"],["다음 큰 일정","10월 9일 락업 해제(3.28억 주), 10월 19일 이후 스타십 15차 비행, 11월 17일경 3분기 실적"]],"overview_md":"한 줄 정리: 강세론은 스타링크 성장과 AI·국방 수요를, 약세론은 엄청난 AI 투자비와 계속 풀리는 락업 물량을 봅니다. 주가는 8월 저점에서 48% 올라 공모가 위에 있습니다.\n\n#### 기업 개요: 이 회사는 무엇을 하나\n\n스페이스X는 2002년 일론 머스크가 세운 회사입니다. 본사는 텍사스주 스타베이스, 직원은 약 2만 1천 명입니다. 사업은 세 덩어리로 나뉩니다.\n\n**1. 우주(Space): 로켓 발사**\n\n- 팰컨 9은 한 번 쓴 1단 로켓을 다시 착륙시켜 재사용합니다. 그래서 발사 비용이 경쟁사보다 크게 싼니다.\n- 2026년 상반기에만 78번 발사해 1,041톤을 궁도에 올렸습니다. 대부분은 자기 스타링크 위성입니다.\n- 스타십은 사람을 달·화성에 보낼 초대형 로켓입니다. 회사는 완전 재사용에 성공하면 궁도까지 가는 비용이 과거 평균보다 99% 이상 줄어든다고 봅니다.\n- 드래곤 우주선으로 NASA 우주비행사를 국제우주정거장에 실어 나릅니다.\n\n**2. 연결(Connectivity): 스타링크**\n\n- 지구 낮은 궤도(저궤도, LEO)에 위성 약 1만 개를 띄워 인터넷을 파는 사업입니다. 산골·바다·비행기 안에서도 됩니다.\n- 가입자는 2026년 6월 말 1,200만 명으로 1년 만에 2배가 됐습니다.\n- 항공사(아메리칸항공 1,000대 이상 도입 예정), 선박, 군대도 고객입니다.\n- 휴대폰에 위성으로 직접 연결하는 '스타링크 모바일'을 키우는 중입니다. 10월 8일에는 미국 전국 800MHz 저대역 주파수를 사서 '통신사'가 되겠다는 계획을 분명히 했습니다.\n\n**3. AI: xAI·그록·X·커서**\n\n- 2026년 2월 2일, 머스크의 AI 회사 xAI(챗봇 그록, SNS X 보유)를 흡수합병했습니다. 그래서 스페이스X 안에 AI 부문이 생겼습니다.\n- 8월 14일 AI 코딩 도구 회사 커서(Anysphere)를 600억 달러어치 주식으로 인수 완료했습니다.\n- 대형 데이터센터 '콜로서스'를 지어 다른 회사에 컴퓨터 연산 능력을 빌려주고 돈을 받습니다(클라우드 계약 141억 달러).\n\n**주식 구조 참고**: 2026년 5월 4일 1주를 5주로 쪼개고(액면분할), 6월 IPO에서 6.39억 주를 $135에 팔아 순수령 약 857억 달러를 모았습니다. 상장 주식은 전체의 5% 정도로 적어, 락업(매도 금지) 물량이 풀릴 때마다 주가가 흔들립니다. 머스크는 의결권이 많은 B주를 가져 회사를 사실상 지배합니다.\n\n#### 돈 버는 구조: 스타링크가 벌고, AI와 스타십이 쓴다\n\n지금 이익을 내는 것은 스타링크 하나입니다. 로켓 부문은 스타십 개발비 때문에, AI 부문은 데이터센터 감가상각 때문에 영업적자입니다.\n\n| 부문 | 2분기 매출 | 1년 전 | 영업이익 | 조정 EBITDA | 투자비(capex) |\n|---|---|---|---|---|---|\n| 우주 (발사·개발) | 9.6억 달러 | 7.5억 | −5.4억 | −2.1억 | 11.7억 |\n| 연결 (스타링크) | 42.9억 달러 | 25.9억 | +16.6억 | +26.0억 | 13.7억 |\n| AI (xAI·X) | 25.6억 달러 | 7.4억 | −12.6억 | +11.5억 | 158.3억 |\n| **합계** | **78.1억 달러** | **40.7억** | **−1.4억** | **+35.4억** | **183.7억** |\n\n**부문별 자세히**\n\n- 스타링크 매출 42.9억 달러 중 개인 고객 24.9억, 기업·정부 18.1억 달러입니다. 기업·정부 매출은 1년 만에 108% 늘었습니다. 가입자 1명당 월 매출(ARPU)은 $66로 1년 전 $85보다 낮아졌는데, 싼 요금제로 가난한 나라 고객을 늘렸기 때문입니다.\n- 발사 매출은 6.5억, 개발(NASA 등 정부 프로그램) 매출은 3.1억 달러입니다. 다른 회사 발사는 분기 10번, 자기 위성 발사는 28번이었습니다.\n- AI 매출은 1분기 8.2억에서 2분기 25.6억 달러로 3배가 됐습니다. 이 중 21.9억이 'AI 솔루션·인프라'(컴퓨터 임대 등), 3.7억이 X 광고입니다.\n- 문제는 투자비입니다. 분기 투자비 183.7억 달러 중 86%가 AI 데이터센터에 들어갔고, 매출의 2배가 넘습니다.\n\n**쉬운 비유**: 스타링크는 장사가 잘되는 '통신사', 로켓은 그 통신사의 기지국(위성)을 나르는 '트럭', AI는 벌어들인 돈과 빚을 모두 붓는 '신사업'입니다.\n\n**재무 상태 (6월 말)**\n\n- 현금·단기증권 약 1,000억 달러. IPO 돈과 6월 26일 회사채 250억 달러(이자 5.35~6.65%) 발행 덕분입니다.\n- 상반기 순손실 48.2억 달러, 2분기만 보면 5.4억 달러 손실로 줄었습니다.\n- 10월 8일 블룸버그는 엔비디아 칩 구매를 위해 400억 달러 추가 차입을 논의 중이라고 보도했습니다.\n\n#### 앞으로의 숫자\n\n- 수주잔고(이미 계약한 일감) 475억 달러 (6월 말).\n- 머스크는 8월 12일 \"AI 매출이 1~2달 안에 스타링크·발사를 넘고, 4분기엔 가장 큰 매출원이 될 것\"이라고 말했습니다.\n- 데이터센터 용량은 1.4GW(2분기)에서 계속 늘릴 계획입니다. 머스크는 2029년 '우주 데이터센터'도 목표로 내걸었습니다.\n- 증권사 예상 선행 PER은 약 83~103배입니다. 내년 예상 이익의 100배 안팎 가격이라는 뜻입니다.\n- 회사는 공식 연간 가이던스(실적 전망)를 내지 않았습니다.","gov_md":"미국 정부에게 스페이스X는 '우주로 가는 고속도로'이자 '군용 인터넷·감시망'입니다. 정부는 지분을 사지 않고, 발사·위성·통신 서비스를 계약으로 삽니다. 배경에는 중국·러시아와의 우주 경쟁이 있습니다.\n\n| 목적 | 정부가 한 일 (금액·날짜) | 이 회사의 역할 |\n|---|---|---|\n| 골든 돔 미사일 방어 (통신망) | 우주군 '우주 데이터 네트워크 백본' 22.9억 달러 고정가 계약 (2026년 5월) | 미사일 경보 센서와 요격 무기를 실시간으로 잇는 위성 통신망. 2027년 말까지 시제품 |\n| 골든 돔 (감시 위성) | 우주 기반 이동표적 탐지(SB-AMTI) 41.6억 달러 (2026년 5월) | 하늘의 미사일·항공기를 우주에서 추적하는 위성군. 2028년 말 운용 목표 |\n| 국가 안보 발사 (NSSL) | 3단계 레인 2: 약 59억 달러, 28회 발사 (2025년 4월 배정) | 정찰·군 위성을 올리는 최대 발사 업체. 경쟁사 ULA·블루오리진보다 물량 많음 |\n| 정찰 위성망 (NRO) | 국가정찰국이 스타실드 기반 수백 기 정찰 위성망 발주 (2021년 약 18억 달러 계약) | 군용 스타링크인 '스타실드'로 지상을 촬영하는 저권도 위성 제작·발사 |\n| 스타실드 통합 | 2분기 중 우주군에서 다년 계약 60억 달러 이상 수주 (회사 발표) | 위 두 골든 돔 계약이 대부분 |\n| 달 탐사 (NASA 아르테미스) | 유인 달 착륙선으로 스타십 선정 (2021년 29억 달러 + 2022년 11.5억 달러) | 아르테미스 3호는 2027년 지구 궤도 도킹 시험, 4호(2028년)가 유인 착륙 목표 |\n| 우주정거장 수송 | NASA 유인·화물 수송 계약 | 10월 8일 크루-12가 237일 임무 후 귀환 |\n| 휴대폰 위성 통신 | FCC가 에코스타 주파수 65MHz 이전 승인, 10월 초 2세대 위성 1.5만 기 승인 | 스타링크 모바일 사업의 기반 |\n\n**미국–중국 경쟁과의 연결**\n\n- 중국도 스타링크를 따라가려고 '궁왕(Guowang, 국유 위성 인터넷)'과 '첸범(Qianfan, 상하이)' 두 개 거대 위성망을 짓고 있습니다.\n- 2026년 10월 8일 기준 궁왕 213기, 첸범 248기로 합쳐 461기입니다. 목표(약 2.8만 기)의 1.6%에 그칩니다. 스타링크는 약 1만 기가 떠 있어 20배 이상 앞서 있습니다.\n- 중국이 저궤도의 좋은 자리와 주파수를 먼저 차지하지 못하게 하는 것이 미국의 전략입니다. 그래서 미국 정부는 스페이스X의 빠른 발사 속도를 국가 자산으로 봅니다.\n- 러시아–우크라이나 전쟁에서 스타링크가 우크라이나군 통신을 맡아, 저궤도 위성망의 군사적 가치를 보여주었습니다.\n- 동맹국(일본 소프트뱅·NTT도코모, 뉴질랜드 스파크)도 스타링크 모바일 제휴를 맺었습니다.\n\n**골든 돔이란?** 트럼프 대통령이 2025년 1월 지시한 미국 본토 미사일 방어망입니다. '감시(센서) → 통신 → 요격' 3층 구조인데, 스페이스X는 감시와 통신을 맡았습니다. 예산은 2025년 감세법(OBBBA) 244억 달러와 2026 회계연도 130억 달러입니다.\n\n**주의할 점**: 머스크의 정치적 영향력 때문에 이해상충 논란이 있습니다. 2025년 5월 의원 42명이 국방부 감찰관 조사를 요청했고, 정부 의존도가 높을수록 정치 변화에 따른 위험도 커집니다.","gov_title":"정부가 이 회사를 쓰는 방법","events":[{"date":"2026-10-08","title":"800MHz 주파수 인수","detail":"장 마감 후 800MHz 전국 저대역 주파수 인수 발표(사모펀드 그레인 보유분, WSJ 추정 약 80억 달러). '스타링크 모바일'로 통신사가 되겠다는 신호. 같은 날 바클레이즈 '비중확대' 목표가 $254, 아메리칸항공 전 기단 스타링크 도입","move":"정규장 −4.2% $160.57 (10월 9일 락업 3.28억 주 앞둔 매도). 시간외 +2~3%. AT&T·버라이즌·T모바일 시간외 약 −6~7%"},{"date":"2026-09-28","title":"스타십 14차 비행","detail":"스타십 14차 비행, 처음으로 궤도 진입. 스타링크 V3 위성 26기 배치. 엔진 1개가 일찍 꺼져 비행은 조기 종료","move":"9월 25일 주간 $148.68 → 10월 8일 $160.57 (+8%)"},{"date":"2026-09-15","title":"테슬라 합병 암시","detail":"머스크, 팟캐스트에서 테슬라 합병 가능성 암시 (\"누가 알겠나\")","move":"합병 기대가 X에서 확산"},{"date":"2026-09-09","title":"2차 락업 해제","detail":"두 번째 대규모 락업 해제(약 3.19억 주)","move":"당일 −3.9%"},{"date":"2026-08-12","title":"AI 매출 발언","detail":"머스크 \"AI 매출이 곧 스타링크를 넘는다\"","move":"+9.6% $146.15"},{"date":"2026-08-06","title":"첫 락업 해제","detail":"첫 락업 해제(9.1억 주). 주가가 공모가 아래라 '가격 조건부' 4.6억 주는 계속 묶임. 공매도 청산","move":"8월 6일 +6.1%, 8월 7일 +15.8% $133.11"},{"date":"2026-08-04","title":"첫 분기 실적","detail":"첫 분기 실적: 매출 78억 달러(+92%, 예상 69억 상회). 그러나 분기 투자비 184억 달러가 매출의 2배를 넘어 실망. 쇼트웰 사장 \"스타링크를 진짜 이동통신사로\"","move":"8월 4일 +9.4%(발표 전), 8월 5일 −13.6% $108.27 (상장 후 최저 종가)"},{"date":"2026-07-15","title":"공모가 아래로","detail":"장중 $132.28로 처음 공모가 아래로. 나스닥100 편입 뒤에도 하락","move":"종가 $135.27"},{"date":"2026-06-22","title":"회사채 250억 달러","detail":"첫 회사채(250억 달러) 발행 발표. \"빚까지 내서 AI에 쓴다\"는 걱정","move":"−16.4% $154.60 (3일 연속 하락, 시총 약 6,000억 달러 증발)"},{"date":"2026-06-16","title":"커서 600억 달러 인수","detail":"AI 코딩 회사 커서(Cursor) 600억 달러 주식 인수 발표. 다음 날 주식 희석 우려와 옵션 거래 시작","move":"6월 16일 +9.8% $211.39(상장 후 최고 종가, 장중 $225.64), 6월 17일 −9.3%"},{"date":"2026-06-12","title":"나스닥 상장","detail":"나스닥 상장. 공모가 $135, 6.39억 주, 약 860억 달러 조달(역사상 최대 IPO)","move":"첫날 종가 $160.95 (+19%), 6월 15일 +19.6% $192.50"}],"chart_events":["2026-06-12","2026-06-16","2026-06-22","2026-08-04","2026-08-06","2026-10-08"],"bull":["**스타링크가 빠르게 크고 있다**: 가입자 1,200만 명(1년 만에 2배), 연결 부문 매출 +66%, 영업이익 +79%. 이미 분기 26억 달러의 EBITDA를 벌고 있습니다.","**통신사까지 되려 한다**: 에코스타 주파수(약 170~196억 달러)에 이어 10월 8일 800MHz 저대역 주파수(약 80억 달러)를 삽니다. 발표만으로 AT&T·버라이즌·T모바일이 6~7% 빠진 것은 시장이 위협을 진짜로 본다는 뜻입니다.","**국방의 핵심 파트너**: 골든 돔 통신망(22.9억)과 감시 위성(41.6억)을 따냈고, 군 위성 발사도 대부분 맡습니다. 중국 위성망은 461기로 스타링크(약 1만 기)의 5% 수준입니다.","**AI 매출이 폭발한다**: AI 매출이 한 분기 만에 3배(8.2억 → 25.6억 달러), 컴퓨터 임대 계약 141억 달러. AI 부문 EBITDA도 흑자(11.5억 달러)로 돌아섬습니다.","**스타십이 현실이 되고 있다**: 9월 28일 첫 궤도 비행 성공, V3 위성 26기 배치. 완전 재사용에 성공하면 위성 발사 비용이 크게 줄어 경쟁사가 따라오기 더 어렵습니다.","**돈이 많다**: 현금 약 1,000억 달러, 수주잔고 475억 달러.","**증권사 다수가 매수 의견**: 평균 목표가 약 $220~226으로 현재가보다 37~40% 높습니다. 모건스탠리는 $300(낙관 시나리오 시총 8조 달러)를 제시했습니다.","**테슬라 합병 기대**: 머스크가 7월·9월 두 번 암시했습니다. 공식 제안은 없습니다."],"bear":["**너무 비싸다**: 시총 약 2.2조 달러는 최근 12개월 매출(230억 달러)의 약 95배입니다. 순이익은 아직 89억 달러 적자입니다. 모닝스타 적정가 $63, 마이클 버리는 \"1조 달러도 안 된다\"고 봤습니다.","**AI에 돈을 너무 많이 쓴다**: 2분기 투자비 184억 달러 중 158억이 AI. 회사채 250억 달러에 400억 달러 추가 차입 논의까지. AI 부문 영업손실은 여전히 분기 12.6억 달러입니다.","**락업 물량이 계속 나온다**: 10월 9일 3.28억 주, 10월 말 또 3.28억 주, 11월 3분기 실적 뒤 약 13억 주. 연말까지 5,000억 달러어치 이상이 팔 수 있게 됩니다.","**스타링크 단가 하락**: 가입자 1명당 월 매출이 $85 → $66으로 22% 줄었습니다.","**주식 희석**: 커서 600억 달러 인수를 새 주식으로 치렀고(약 3.4% 희석), 머스크에게 성과 조건부 B주 13억 주 보상이 있습니다.","**머스크 한 사람 리스크**: 지분 48.4%와 의결권 지배. 정치 논란과 이해상충 조사 요구가 정부 계약에 영향을 줄 수 있습니다.","**변동성이 크다**: 상장 4개월 만에 하루 10% 이상 움직인 날이 4번, 9% 이상은 8번. 상장 후 고점에서 저점까지 −49%였습니다.","**스타십 일정 지연 가능성**: 14차 비행도 엔진 조기 정지로 조기 종료했고, 아르테미스 달 착륙은 2028년으로 밀렸습니다."],"analysts_md":"증권사 평균 목표가는 약 $220(MarketBeat 45명 기준 $219.77, 스톡애널리시스 38명 기준 $225.61)입니다. 매수 30, 중립 9, 매도 6으로 의견이 크게 갈립니다. 목표가 범위가 $75~$800으로 10배 이상 벌어져 있습니다.\n\n| 증권사 | 의견 | 목표가 | 날짜 | 현재가 대비 |\n|---|---|---|---|---|\n| 바클레이즈 | 비중확대 (신규) | $254 | 10월 8일 | +58% |\n| 서스케하나 | 중립 | $144 → $173 | 10월 7일 | +8% |\n| 모건스탠리 | 비중확대 | $300 (낙관 시나리오 시총 8조 달러) | 7월 7일 개시, 9월 29일·10월 6일 재확인 | +87% |\n| CLSA | 아웃퍼폼 (신규) | $250 | 9월 28일 | +56% |\n| 도이치은행 | 매수 | $235 | 9월 28일 | +46% |\n| TD코웬 | 매수 (신규) | $200 | 9월 28일 | +25% |\n| 모펫네이선슨 | 중립 | $131 → $142 | 9월 14일 | −12% |\n| 웰스파고 | 비중확대 | $215 → $212 | 9월 8일 | +32% |\n| 피벗 리서치 | 매수 (신규) | $220 | 9월 8일 | +37% |\n| 오펜하이머 | 아웃퍼폼 | $250 → $280 | 9월 2일 | +74% |\n| DZ뱅크 | 매도 (신규) | $100 | 8월 21일 | −38% |\n| 씨티그룹 | 매수 → 매도 | – | 8월 7일 | – |\n| 필립증권 | 강력 매도 | $75 | 7월 31일 | −53% |\n| 골드만삭스 | 매수 | $205 | 7월 7일 개시 | +28% |\n| JP모건 | 매수 | $225 | 7월 7일 개시 | +40% |\n| 뱅크오브아메리카 | 매수 | $235 | 7월 7일 개시 | +46% |\n| 레이먼드 제임스 | 강력 매수 | $800 (최고치) | 7월 7일 개시 | +398% |\n| 모닝스타 (독립 평가) | 적정가 | $63 | 6월 | −61% |\n\n참고: MarketBeat는 레이먼드 제임스가 8월 7일 '강력 매도'로 낮췄다고 기록했지만, 다른 출처로는 확인 못함(7월 중순에도 강세 의견이었다는 보도만 있음). 씨티그룹 하향도 MarketBeat 기록만 있습니다.\n\n**약세 목소리 요약**: 모닝스타($63), 필립증권($75), DZ뱅크($100), 마이클 버리(\"1조 달러 미만\"), 모펫네이선슨(\"30조 달러 시장 규모 주장은 터무니없다\") 등입니다. 공통 지적은 적자인데 너무 비싸다는 것입니다.","insider_title":"내부자·유명인 매매 (2025~)","insider_md":"**내부자 매수**: 2025년 이후 SEC에 신고된 장내 매수(코드 P)는 한 건도 없습니다. 임원들의 주식 증가는 모두 스톡옵션 행사나 xAI 합병·우선주 전환 같은 비현금 거래입니다.\n\n**내부자 매도·처분 요약**\n\n| 누구 | 직책 | 날짜 | 내용 | 평균가 | 금액 | 현재가 대비 |\n|---|---|---|---|---|---|---|\n| 그윈 쇼트웰 | 사장 겸 COO, 이사 | 2026년 9월 22일 | 옵션 342,170주를 주당 $8.40~19.40에 행사해 같은 날 전량 매도. 6월 23일 만든 사전 매매계획(10b5-1) | $153.57 | 약 5,250만 달러 | +4.6% |\n| 일론 머스크 | CEO·CTO·의장 | 2026년 4월 2일 (상장 전) | 신탁 보유분 11,390주 매도(코드 S, 사전계획 아님). 같은 날 480주 증여, 다른 신탁 186,545주는 제3자에게 분배 | $105.32 | 약 120만 달러 | +52% |\n| 안토니오 그레시아스 | 이사 (밸러 에쿠어티) | 2026년 9월 11일 | 밸러 펀드가 4,279만 주를 펀드 투자자들에게 현물로 분배(매도 아님, 6월 12일 사전계획) | – | 당시 가치 약 65억 달러 | – |\n\n- 쇼트웰은 매도 후에도 약 247만 주(약 4억 달러)를 갖고 있습니다. 매도는 옵션 행사분만 팔아 세금·현금화하는 흔한 패턴입니다.\n- 머스크의 4월 2일 '매도'는 상장 전 비상장 거래입니다. 가격 $105.318은 5대 1 분할 전 기준 주당 $526.59로, 2월 xAI 합병 때 보도된 합병회사 주당 가격(약 $527, 기업가치 1.25조 달러)과 같습니다. 즉 시장에서 판 것이 아니라 상장 전 합병 기준가로 넘긴 거래입니다. 금액(약 120만 달러)도 아주 작아, 보유분을 줄이는 의미는 거의 없습니다.\n- 머스크는 상장 후 한 주도 팔지 않았고, 락업이 2027년 6월까지입니다. 성과 조건부 B주 13억 주(미확정)도 별도로 있습니다.\n\n**의회 의원 매매 (하원 PTR 신고, Quiver 기준)**\n\n| 의원 | 소속 | 날짜 | 거래 | 금액 범위 | 당일 종가(추정 매수가) | 현재가 대비 |\n|---|---|---|---|---|---|---|\n| 마리아 엘비라 살라자르 | 공화당(플로리다) | 9월 24일 | 매도 | $1천~1.5만 | 약 $149 | – |\n| 마리아 엘비라 살라자르 | 공화당 | 8월 12일 | 매수 | $1천~1.5만 | $146.15 | +10% |\n| 길 시스네로스 | 민주당(캨리포니아), 하원 군사위 | 6월 18일 | 매수 | $1천~1.5만 | 약 $185 | −13% |\n| 윌리엄 팀슨스 | 공화당(사우스캐롤라이나), 군사·외교 소위원장 | 6월 15일 | 매수 | $5만~10만 | $192.50 | −17% |\n| 댄 미우저 | 공화당(펜실베이니아) | 6월 15일 | 매수 | $1.5만~5만 | $192.50 | −17% |\n| 존 맥구어 (배우자) | 공화당(버지니아) | 6월 15일 | 매수 | $1천~1.5만 | $192.50 | −17% |\n| 존 제임스 (배우자) | 공화당(미시간) | 6월 12일 (상장일) | 매수 | $1.5만~5만 | $160.95 | −0.2% |\n| 제러드 모스코비츠 | 민주당(플로리다) | 6월 12일 | 매수 | $1천~1.5만 | $160.95 | −0.2% |\n\n- 낸시 펠로시의 SPCX 매매는 찾지 못했습니다. 상원의원 거래도 없습니다.\n- 상장 첫 주에 산 의원 대부분은 아직 손실 구간입니다. 군사 관련 위원회 소속 의원의 매수는 이해상충 비판을 받았습니다.\n\n**트럼프 대통령 (OGE 278-T 신고, 위탁 계좌)**\n\n| 날짜 | 거래 | 금액 범위 | 당시 가격(추정) | 현재가 대비 |\n|---|---|---|---|---|\n| 2026년 6월 23일 | 매수 | $1.5만~5만 | 약 $150~155 (그 주 종가 $153.23) | 약 +5% |\n| 2026년 7월 10일 | 매수 | $1.5만~5만 | $145.30 | +10.5% |\n| 2026년 7월 17일 | 매도 | $1천~1.5만 | $123.99 | (판 뒤 +30% 상승) |\n\n금액이 작고, 제3자가 운용하는 계좌의 거래라 대통령 본인의 판단으로 보기는 어렵습니다.\n\n**대주주 (13G 신고, 2026년 6월 30일 기준)**\n\n| 보유자 | 지분 | 주식 수 | 들어온 시점·가격 | 현재 가치 |\n|---|---|---|---|---|\n| 일론 머스크 | 48.4% | 약 64.2억 주 | 창업자 (2002년) | 약 1조 달러 |\n| 구글 | 7.2% | 약 5.5억 주 | 2015년 피델리티와 함께 10억 달러 투자 (당시 기업가치 약 120억 달러, 기존 지식·확인 못함) | 약 885억 달러 |\n| 안토니오 그레시아스 (밸러) | 6.5% | 약 5.0억 주 (9월 분배 후 약 4.6억 주) | 초기 투자자 | 약 740억 달러 |\n| 파운더스 펀드 (피터 틸) | 2.0% | 약 1.6억 주 | 2008년 초기 투자 | 약 250억 달러 |\n\n대주주들은 모두 상장 훨씬 전에 들어와 현재가와 비교할 '매수가'가 사실상 의미 없을 만큼 낮습니다. 구글은 투자 당시 기업가치 기준으로 약 180배가 됐습니다(기존 지식 기준 추정).","next_md":"- 2026년 10월 9일: 상장 120일째 락업 해제 3.28억 주(약 530억 달러). 이전 해제일에는 −4%~+6%로 갈렸습니다.\n- 10월 19일 이후(미확정): 스타십 15차 비행. 머스크는 우주선(상단)을 발사탑으로 붙잡는 첫 시도를 언급\n- 10월 말(상장 135일째): 락업 해제 3.28억 주 추가\n- 11월 17일경(예상): 3분기 실적. AI 매출이 스타링크를 넘었는지, 투자비 규모, 커서 매출 반영\n- 3분기 실적 직후: 약 13억 주의 대규모 락업 해제\n- 12월 중순(상장 180일): 대부분 주주의 남은 락업 종료. 머스크·대주주는 2027년 6월까지\n- FCC의 800MHz 주파수(그레인) 인수 승인 여부와 스타링크 모바일 요금제 발표\n- 엔비디아 칩 구매용 400억 달러 차입 확정 여부 (빚 증가)\n- 골든 돔 추가 계약과 2027년 말 통신망 시제품 일정\n- 테슬라와의 합병 공식 제안 여부 (현재는 암시만)\n- 중국 궁왕·첸범 위성 발사 속도 (현재 461기)\n- 인도 스타링크 서비스 허가 (머스크와 인도 당국이 언쟁 중)","glossary_md":"| 용어 | 뜻 |\n|---|---|\n| IPO·공모가 | 회사가 처음 주식시장에 상장하며 주식을 파는 것, 그때의 가격($135) |\n| 락업(lock-up) | 상장 전 주주가 일정 기간 주식을 팔지 못하게 묶어 두는 약속. 풀리면 파는 물량이 늘 수 있음 |\n| 저궤도(LEO) | 지구 위 약 300~2,000km의 낮은 우주. 가까워서 인터넷이 빠름 |\n| 스타실드 | 스타링크의 군용·정부용 버전. 보안이 강화된 위성망 |\n| 골든 돔 | 미국 본토 미사일 방어망. 감시-통신-요격 3층 구조 |\n| NSSL | 미국 국가안보 위성 발사 사업. 군·정찰 위성을 올리는 일 |\n| 조정 EBITDA | 세금·이자·감가상각·주식보상을 빼기 전 이익. 사업이 벌어들이는 현금에 가까운 숫자 |\n| 투자비(capex) | 공장·데이터센터·위성 같은 설비에 쓰는 돈 |\n| ARPU | 가입자 1명이 한 달에 내는 평균 요금 |\n| 수주잔고 | 이미 계약했지만 아직 매출로 잡지 않은 일의 총액 |\n| 희석 | 새 주식을 발행해 기존 주주의 지분 비율이 줄어드는 것 |\n| 저대역 주파수 | 800MHz처럼 낮은 주파수. 멀리 가고 벽을 잘 통과해 실내 통화에 유리 |\n| 10b5-1 계획 | 임원이 미리 정해 둔 일정·조건대로 자동 매도하는 계획. 내부정보 거래 오해를 피하려는 장치 |\n| Form 4 / 13G | Form 4는 임원·대주주의 매매 신고, 13G는 5% 넘는 수동적 대주주 신고 |\n| PTR / OGE 278-T | 의원의 주식 거래 신고서 / 대통령·고위 공직자의 거래 신고서. 금액은 범위로만 공개 |\n| 선행 PER | 주가 ÷ 내년 예상 주당이익. 높을수록 미래 기대가 크다는 뜻 |","sources":[{"t":"SEC EDGAR: 스페이스X 2분기 실적 보도자료 (8-K, 2026년 8월 4일)","u":"https://www.sec.gov/Archives/edgar/data/1181412/000162828026052515/earningsreleaseq22608042.htm"},{"t":"SEC EDGAR: 커서 인수 계약 8-K (6월 16일)","u":"https://www.sec.gov/Archives/edgar/data/1181412/000162828026043411/spaceexplorationtechnologi.htm"},{"t":"SEC EDGAR: 커서 인수 완료 8-K (8월 14일)","u":"https://www.sec.gov/Archives/edgar/data/1181412/000162828026056945/spcx-20260814.htm"},{"t":"SEC EDGAR: 회사채 250억 달러 가격 결정 8-K (6월 23일)","u":"https://www.sec.gov/Archives/edgar/data/1181412/000162828026044955/spcx-pricing8xk.htm"},{"t":"SEC EDGAR: 머스크 Form 4 (6월 17일 제출)","u":"https://www.sec.gov/Archives/edgar/data/1181412/000162828026044069/wk-form4_1781740812.xml"},{"t":"SEC EDGAR: 쇼트웰 Form 4 (9월 24일 제출)","u":"https://www.sec.gov/Archives/edgar/data/1181412/000162828026063378/wk-form4_1790280657.xml"},{"t":"SEC EDGAR: 그레시아스 Form 4/A (9월 30일 제출)","u":"https://www.sec.gov/Archives/edgar/data/1181412/000121390026105393/xslF345X06/ownership.xml"},{"t":"StockAnalysis: SPCX 개요","u":"https://stockanalysis.com/stocks/spcx/"},{"t":"MarketBeat: SPCX 애널리스트 전망","u":"https://www.marketbeat.com/stocks/NASDAQ/SPCX/forecast/"},{"t":"The Daily Upside: 월가 커버리지 개시 (7월 8일)","u":"https://www.thedailyupside.com/industries/industrials/bullishness-reigns-in-wall-streets-spacex-coverage/"},{"t":"Stocktwits: 800MHz 주파수 인수와 통신주 급락 (10월 8일)","u":"https://stocktwits.com/news-articles/mark
