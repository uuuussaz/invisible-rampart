64,18.23,18.62,19.44,18.75,18.45,18.11,18.68,18.96,19.21,19.74,19.25,17.43,17.46,16.03,15.95,15.82,15.84,14.67,14.61,14.99,14.46,14.41,14.39,15.66,15.27,14.91,14.25,14.71,14.49,12.74,13.62,13.91,14.36,15.8,15.81,16.31,16.86,16.48,16.51,16.93,17.15,18.82,19.1,17.98,17.19,16.67,19.89,17.66,17.75,17.96,18.07,16.64,16.41,15.76,15.86,16.37,16.78,16.93,16.46,15.92,16.19,21.5,19.57,19.84,21.97,22.98,21.83,20.82,20.58,19.73,19.64,18.64,19.15,19.96,20.35,22.13,21.29,23.16,21.62,20.46,21.12,20.52,21.32,19.29,19.49]},"mc":593655609.0483742},{"ticker":"INTC","company":"Intel","name_ko":"인텔","category":"미국우선","field":"반도체","doc_url":"https://claude.ai/code/artifact/af538977-c7de-473c-aa2d-b950ce6b0921","lead":"인텔은 PC·서버용 CPU를 설계하고 직접 공장(파운드리)까지 운영하는 미국 유일의 첨단 반도체 회사입니다. 2026년에는 AI용 CPU 수요 급증, 애플·테슬라(테라팹) 고객 확보 기대로 주가가 연초의 약 2.7배가 됐지만, 6월 고점보다는 24% 낮습니다.","glance":[["현재가","$107.08 (나스닥 INTC)"],["시가총액","약 5,660억 달러 (발행주식 약 52.9억 주)"],["2026 고점 / 저점","고점 $140.94 (6월 22일) / 저점 $39.38 (1월 2일, 연초)"],["고점 대비","−24% (연초 대비로는 +172%)"],["매출 (최근 12개월)","약 570억 달러, 전년 대비 +25% / 순손실 약 113억 달러 (정부 보유 주식 평가손 등)"],["2분기 실적 (7월 23일)","매출 161억 달러(+25%), 조정 EPS $0.42, 조정 매출총이익률 41.8%"],["정부 개입","미국 정부가 지분 9.9% 보유 (2025년 8월, 4.33억 주 × $20.47 = 89억 달러). 지금 가치 약 464억 달러"],["다른 큰 주주","엔비디아 50억 달러($23.28, 2025년 9월), 소프트뱅크 20억 달러($23.00, 2025년 8월)"],["국방 필수도","매우 높음. 미국 땅에서 최첨단(18A) 칩을 만드는 유일한 회사. 국방부용 '보안 칩 공장(Secure Enclave)' 사업자"],["내부자 동향 한줄","립부 탄 CEO가 8월 11일 $95에 1,000만 달러어치 매수(유상증자와 같은 가격). 임원 매도는 3건 약 750만 달러로 작음"],["애널리스트 평균 목표가","$118.05 (43명, 범위 $80~$200). MarketBeat 집계 평균 $109.06, 의견은 '보유' 우세"],["다음 실적 발표","2026년 10월 29일 (장 마감 후)"]],"overview_md":"한 줄 판단: 강세론은 'AI 시대에 CPU가 다시 귀해졌고, 미국 정부·애플·머스크가 인텔 공장을 필요로 한다'를, 약세론은 '아직 회계상 적자인데 주가가 매출의 10배로 비싸고, 230억 달러 증자로 주식이 늘었다'를 봅니다.\n\n#### 기업 개요: 이 회사는 무엇을 하나\n\n인텔은 1968년에 세워진 미국 캨리포니아주 산타클라라의 반도체 회사입니다. 직원은 약 8.5만 명입니다. 2025년 3월부터 립부 탄(Lip-Bu Tan)이 CEO를 맡고 있습니다.\n\n**CPU란?**\n\n- 컴퓨터의 '두뇌'입니다. 명령을 순서대로 처리하고, 다른 부품에게 일을 나눠 줍니다.\n- AI에서는 GPU(엔비디아)가 계산을 많이 하지만, CPU는 GPU들을 지휘하는 '관제탑' 역할을 합니다. AI 비서(에이전트)가 스스로 일을 처리하면서 CPU 일이 크게 늘었습니다.\n- 탄 CEO는 AI 서버의 CPU:GPU 비율이 1:8에서 1:4로 바뀌었다고 말했고(4월), 9월에는 \"들어온 CPU 주문의 절반만 채울 수 있다\"고 했습니다.\n\n**파운드리(위탁 생산)란?**\n\n- 다른 회사가 설계한 칩을 대신 만들어 주는 사업입니다. 대만의 TSMC가 세계 1위입니다.\n- 인텔은 자기 칩도 만들고, 애플·테슬라 같은 외부 고객 칩도 만들려고 합니다.\n- **18A**: 지금 양산 중인 최첨단 공정(약 1.8나노 급). 노트북용 팬서 레이크, 서버용 제온 6+를 만듭니다.\n- **14A**: 다음 세대 공정(약 1.4나노 급). 머스크의 테라팹이 쓸 공정으로 거론되며, 설계 키트가 10월 중 나올 예정입니다.\n\n**이 회사만의 특징**\n\n- 미국 땅에서 최첨단 로직 칩을 설계부터 생산까지 하는 유일한 미국 회사입니다. 애리조나·오레곤·뉴멕시코에 공장이 있고 오하이오에 새 공장을 짓고 있습니다.\n- 미국 정부(9.9%), 엔비디아, 소프트뱅크가 모두 주주입니다.\n\n#### 돈 버는 구조: CPU 판매 + 공장 사업\n\n매출은 대부분 CPU 판매에서 나오고, 공장(파운드리)은 아직 주로 인텔 자기 칩을 만들면서 큰 적자를 냅니다.\n\n| 사업부 | 무엇을 파나 | 2분기 매출 (전년 대비) | 상태 |\n|---|---|---|---|\n| PC·피지컬 AI (구 CCG) | 노트북·데스크톱 CPU | 89억 달러 (+13%) | 가장 큰 매출원. AMD에 점유율을 내주는 중이라는 지적(수스케하나) |\n| 데이터센터·AI (DCAI) | 서버용 제온 CPU, 맞춤형 칩(ASIC) | 63억 달러 (+59%) | 가장 빨리 성장. 수요가 공급보다 많음 |\n| 인텔 파운드리 | 칩 제조 (대부분 인텔 내부용) | 58억 달러 (+31%) | 1분기 외부 고객 매출은 1.74억 달러뿐, 영업손실 24억 달러 |\n| 합계 | (내부 거래는 빼고 계산) | 161억 달러 (+25%) | 15년 만의 최고 성장률 |\n\n쉽게 비유하면\n\n- 인텔은 '자기 빵을 파는 빵집'(CPU)이면서, 동시에 '다른 빵집에 빵을 구워 주는 대형 오븐 공장'(파운드리)을 새로 키우는 중입니다.\n- 빵집은 주문이 밀려 못 판 정도입니다. 오븐 공장은 아직 바깥 손님이 거의 없어 돈을 씁니다.\n- 그래서 애플·테슬라·SK하이닉스 같은 외부 고객 뉴스가 나올 때마다 주가가 크게 움직입니다.\n\n재무 상태\n\n- 최근 12개월 매출 약 570억 달러, 영업이익 약 43억 달러(영업이익률 약 12%)입니다. 하지만 순손실은 약 113억 달러입니다.\n- 순손실의 큰 이유는 회계 처리입니다. 정부에 준 주식 일부(보안 칩 사업 조건으로 맡겨둔 주식)를 주가에 맞춰 다시 평가하는데, 주가가 오르면 오히려 장부상 손실이 커집니다. 2분기에만 약 125억 달러였습니다.\n- 현금 약 297억 달러, 빚 약 505억 달러(2분기 말 기준). 8월에 주당 $95로 약 2.42억 주를 새로 발행해 약 230억 달러를 더 모았습니다.\n\n#### 앞으로의 숫자\n\n| 항목 | 회사 전망 / 목표 |\n|---|---|\n| 3분기 매출 (10월 29일 발표) | 158억~168억 달러 |\n| 3분기 조정 매출총이익률 | 약 42% (1년 전 약 30%에서 크게 개선) |\n| 3분기 조정 EPS | $0.38 |\n| 공급 | 서버 칩 공급 확대는 3분기 말~4분기에 집중 |\n| 공정 | 18A-P 시험 생산 시작, 14A 설계 키트 10월 공개 예정 |\n| 투자 | 아일랜드 Intel 3 생산능력 확대에 50억 유로 투자 발표 |","gov_md":"미국 정부에게 인텔은 '중국이 대만을 막아도 미국이 최첨단 칩을 만들 수 있게 해 주는 보험'입니다. 세계 최첨단 칩의 대부분은 대만 TSMC가 만드는데, 대만은 중국과 긴장 관계에 있습니다. 그래서 정부는 보조금·지분·국방 계약을 모두 동원해 인텔을 지키려 합니다.\n\n| 목적 | 정부가 한 일 | 이 회사의 역할 |\n|---|---|---|\n| 미국 내 최첨단 칩 생산 지키기 | CHIPS법(반도체지원법) 보조금 22억 달러 지급 후, 남은 57억 달러를 2025년 8월 주식으로 전환 | 애리조나·오하이오 등 미국 공장 증설 |\n| 정부가 직접 주주가 되기 | 2025년 8월 22일 발표: 4.333억 주를 주당 $20.47에 인수(총 89억 달러, 지분 약 9.9%). 이사회 자리는 없는 '수동적 주주' | 지금 가치 약 464억 달러, 평가이익 약 375억 달러(+423%) |\n| 국방용 보안 칩 | '시큐어 인클레이브(Secure Enclave)' 프로그램 예산 32억 달러도 위 지분 대금에 포함 | 국방부·정보기관이 쓸 최첨단 칩을 감시된 미국 내 전용 라인에서 생산 |\n| 파운드리 매각 막기 | 5년간 안전장치: 인텔이 파운드리 지분 51% 미만으로 내려가면 정부가 5%를 더 $20에 살 권리(워런트) | 공장과 설계 회사를 한 몸으로 유지 |\n| 동맹·외국 기업 미국 공장 끌어오기 | 러트닉 상무장관, 미국 생산을 늘리지 않는 한국·대만 기업에 최대 100% 관세 경고 | SK하이닉스가 인텔 오하이오 공장을 빌려 미국에서 메모리를 만드는 방안 협의 중(9월 16일 보도, 미확정) |\n| AI 인프라 국산화 | 미국 내 AI 칩 공장 장려 | 머스크의 테슬라·스페이스X 합작 칩 공장 '테라팹'(텍사스) 파트너로 2026년 4월 7일 참여 |\n\n다른 회사들과 다른 점\n\n- 정부가 보조금을 주는 데 그치지 않고 **최대 주주**가 됐습니다. 정부 입장에서도 인텔 주가가 오르는 것이 이익입니다.\n- 엔비디아(50억 달러, $23.28)와 소프트뱅크(20억 달러, $23.00)도 같은 시기에 들어와, '정부가 밀어주는 회사'라는 인식이 굳었습니다.\n- 반대로, 정부 지분 때문에 회계상 평가손이 생기고(2분기 약 125억 달러), 정부가 언젠가 지분을 팔 수 있다는 점은 부담입니다.\n- 미·중 경쟁에서 인텔은 'TSMC 의존도를 낮추는 카드'입니다. TSMC의 C.C. 웨이 회장도 9월에 \"TSMC는 생산능력이 모자라 인텔 파운드리가 성공하길 바란다\"고 말한 것으로 알려졌습니다(X 게시물 기준).\n\n출처: [인텔 8-K: 정부 지분 계약](https://www.sec.gov/Archives/edgar/data/50863/000005086325000129/a08222025form8-kex991.htm), [Manufacturing Dive: 89억 달러 지분](https://www.manufacturingdive.com/news/us-government-10-percent-stake-intel-chips-funding-8-9-billion/758518/), [Evertiq/로이터: SK하이닉스 협의](https://evertiq.com/news/2026-09-16-report-sk-hynix-in-talks-with-intel-about-deal-to-make-memory-chips-in-us)","gov_title":"정부가 이 회사를 쓰는 방법","events":[{"date":"2026-10-04","title":"머스크, TSMC 테라팹 협의","detail":"머스크, TSMC와 테라팹 협력 \"논의 중\" 확인. 인텔 파운드리의 핵심 고객을 뺏길 수 있다는 우려. 같은 날 서스케하나는 \"3분기 PC CPU 점유율을 AMD에 더 내줬을 것\"","move":"약 −2~4%. 10월 2일 $119.33 → 10월 8일 $107.08"},{"date":"2026-09-21","title":"메타 에이전트 CPU 기대","detail":"메타의 AI 비서(에이전트)가 인기를 끌며 CPU 수요가 더 늘 것이란 보도. AMD도 +9.9%","move":"+12.1%, $121.78"},{"date":"2026-09-16","title":"SK하이닉스 오하이오 협의","detail":"SK하이닉스, 인텔 오하이오 공장에서 미국 첫 메모리 생산 협의(로이터, 미확정)","move":"9월 18일 주간 $108.60"},{"date":"2026-09-08","title":"UBS·노스랜드 상향","detail":"UBS·노스랜드 투자의견 상향, 씨티 '매수'로 신규 분석","move":"반등 시작"},{"date":"2026-08-10","title":"230억 달러 신주 발행","detail":"200억 달러(옵션 포함 약 230억 달러) 신주 발행, 주당 $95. 같은 날 탄 CEO가 $95에 1,000만 달러어치 매수","move":"9월 1일 $89.51까지 밀려 증자가 아래로"},{"date":"2026-07-23","title":"2분기 실적","detail":"2분기 실적: 매출 161억 달러(+25%, 예상 약 144억 달러), 조정 EPS $0.42(예상 약 $0.21). 하지만 2026년 설비투자 전망을 200억 달러 이상으로 올려 현금흐름 우려. 메모리주 동반 급락","move":"시간외 +13% → 7월 24일 정규장 −7.9%, $92.32"},{"date":"2026-07-07","title":"18A 수율 지연 보도","detail":"18A 수율(양품 비율) 개선이 늦어진다는 보도","move":"7월 10일 주간 $109.84 (전주 대비 −9%)"},{"date":"2026-07-01","title":"BofA 반도체 거품 경고","detail":"뱅크오브아메리카의 '반도체 거품' 경고, 차익실현","move":"하루 −9%, $127.02"},{"date":"2026-06-18","title":"애플 보도·연중 최고","detail":"6월 18일: 애플이 미국 내 칩 생산을 인텔에 맡길 수 있다는 보도로 +10.6%($133.99). 6월 22일 +5.2%로 연중 최고, 이날의 직접 원인은 확인 못함","move":"$140.94 (연중 최고)"},{"date":"2026-06-05","title":"반도체 전체 급락","detail":"반도체 전체 급락: 필라델피아 반도체지수 하루 −10.3%(2020년 3월 이후 최대). 브로드컴 실적 후 주가 하락, 5월 고용지표가 강해 금리 인하가 늦어질 수 있다는 우려","move":"−11.3%, $99.17"},{"date":"2026-06-02","title":"CFO 수율 목표 앞당김","detail":"진스너 CFO \"수율 목표를 최소 한 분기 앞당길 것\" (BofA 콘퍼런스)","move":"6월 3일 $112.71"},{"date":"2026-05-08","title":"애플 예비 합의 보도","detail":"WSJ: 인텔과 애플이 일부 애플 칩 위탁생산에 예비 합의","move":"+14.0%, $124.92"},{"date":"2026-05-04","title":"애플-TSMC 의존 감축 보도","detail":"블룸버그: 애플이 TSMC 의존을 줄이려 인텔·삼성과 초기 협의","move":"+12.9%, $108.15 (당시 사상 최고)"},{"date":"2026-04-29","title":"CPU 부족 설명","detail":"일부 결함이 있는 칩도 고객이 웃돈을 주고 사 갈 만큼 CPU가 모자란다고 회사가 설명","move":"+12.1%, $94.75"},{"date":"2026-04-23","title":"1분기 깜짝 실적","detail":"1분기 실적: 매출 136억 달러, 조정 EPS $0.29(예상 $0.01), 2분기 전망 상향","move":"+23.6%, $82.54 (약 40년 만의 최대 상승)"},{"date":"2026-04-07","title":"테라팹 합류","detail":"머스크 '테라팹'(테슬라·스페이스X·xAI 칩 공장) 파트너로 합류, 구글 클라우드 제온 CPU 다년 계약","move":"4월 8일 +11.4%, $58.95"},{"date":"2026-01-26","title":"CFO 25만 달러 매수","detail":"진스너 CFO가 $42.50에 25만 달러어치 매수","move":"바닥권"},{"date":"2026-01-22","title":"4분기 실적·전망 실망","detail":"4분기 실적은 예상 상회, 그러나 1분기 매출 전망(중간값 122억 달러)이 예상(126억 달러)보다 낮음. 공급 부족 탓","move":"−17.0%, $45.07"},{"date":"2026-01-21","title":"HSBC 상향","detail":"HSBC가 '비중축소'→'보유'로 상향, 목표가 $26 → $50","move":"+11.7%, $54.25"}],"chart_events":["2026-01-22","2026-04-23","2026-05-08","2026-06-18","2026-07-23","2026-08-10"],"bull":["**CPU 수요 폭발**: 데이터센터 매출이 2분기 63억 달러로 1년 전보다 59% 늘었습니다(2025년 한 해 성장률은 4.9%). 탄 CEO는 9월에 \"주문의 절반만 채울 수 있다\"고 했고, 공급은 3분기 말~4분기에 늘어납니다.","**실적이 계속 예상을 넘음**: 1분기 조정 EPS $0.29(예상 $0.01), 2분기 매출 161억 달러(회사 전망 상단 148억 달러보다 13억 달러 많음). 조정 매출총이익률도 1년 만에 29.7% → 41.8%.","**큰 고객들이 줄을 섬**: 테라팹(테슬라·스페이스X·xAI, 1단계 168억 달러·전체 최대 1,190억 달러 계획)에 인텔 14A 공정이 유일하게 이름이 올라 있고, 애플과 예비 합의(5월 WSJ), 구글 클라우드 다년 계약, 엔비디아 DGX 서버의 제온 채택이 있습니다.","**메모리까지 확장 가능성**: SK하이닉스가 인텔 오하이오 공장에서 미국 첫 메모리 생산을 협의 중입니다. 성사되면 빈 공장 부지가 돈을 벌게 됩니다.","**정부·대기업이 뒷배경**: 미국 정부 9.9%(평가이익 +423%), 엔비디아 50억 달러, 소프트뱅크 20억 달러. TSMC 회장까지 \"인텔 파운드리가 성공해야 한다\"고 할 만큼 최첨단 공장이 모자랍니다.","**돈을 두둑하게 챙김**: 8월 증자로 약 230억 달러를 모아 공장 투자 자금 걱정이 줄었습니다.","**내부자·유명인 매수**: 탄 CEO가 $95에 1,000만 달러를 샀고, 낸시 펠로시 측도 5월·7월에 콜옵션과 주식을 샀습니다. X에서는 톰 리(펀드스트랫)의 추가 매수도 화제였습니다."],"bear":["**비싼 주가**: 주가가 매출의 약 10.4배(S&P500 평균 3.1배)이고, 앞으로 1년 예상 이익 대비 주가(PER)는 약 51배입니다. 최근 12개월 회계상 순손실은 약 113억 달러입니다.","**파운드리는 아직 적자**: 1분기 파운드리 영업손실 24억 달러, 외부 고객 매출은 1.74억 달러뿐입니다. 애플 건은 '예비 합의'이고 블룸버그는 애플이 신뢰성 걱정으로 실제 이전을 하지 않을 수도 있다고 썼습니다.","**경쟁사의 추격**: 머스크가 10월 4일 TSMC와 테라팹 협력을 \"논의 중\"이라고 했고, 서스케하나는 PC CPU 점유율을 AMD에 더 내줬을 것이라고 봅니다.","**주식 희석**: 8월에 약 2.42억 주(기존 주식의 약 5%)를 새로 발행했습니다. 희석은 피자를 더 많은 조각으로 나눠 한 조각이 작아지는 것과 같습니다.","**큰 주주의 매도 가능성**: 정부·엔비디아·소프트뱅크가 모두 $20~23에 샀어 이익이 4~5배입니다. 이들이 팔면 주가에 부담이 됩니다.","**빚**: 빚이 약 505억 달러로 현금(약 297억 달러, 증자 전)보다 많습니다.","**증권사 다수는 '보유'**: MarketBeat 집계 50명 중 보유 26·매수 21·매도 3. JP모건은 '비중축소'(목표가 $85), 로젠블랫은 '매도'($80)입니다. 뱅크오브아메리카는 7월 초 반도체 거품 위험을 경고했습니다.","**크게 흔들리는 주가**: 2026년에만 하루 10% 넘게 움직인 날이 8번 이상이고, 6월 고점에서 8월 말까지 −36%까지 빠진 적이 있습니다."],"analysts_md":"증권사 의견은 '보유'가 가장 많습니다. Yahoo 집계 평균 목표가는 $118.05(43명, 현재가 대비 +10%), MarketBeat 집계는 $109.06(+2%)이고, 범위는 $80~$200으로 매우 넓습니다. 주가가 너무 빨리 올라 목표가가 뒤따라가는 모습입니다.\n\n| 증권사 | 의견 | 목표가 | 날짜 |\n|---|---|---|---|\n| 미즈호 | 중립 | $92 → $114 | 10월 6일 |\n| TD코웬 | 보유 | $115 유지 | 9월 24일 |\n| 바클레이스 | 보유 → 비중확대(상향) | – | 9월 16일 |\n| 타이그레스 | 매수 | $118 → $145 | 9월 15일 |\n| 파이퍼 샌들러 | 중립(신규) | $110 | 9월 9~10일 |\n| 노스랜드 | 시장수익률 → 아웃퍼폼(상향) | $120 | 9월 8일 |\n| UBS | 보유 → 매수(상향) | 8월 $121 → $112 | 9월 8일 |\n| 씨티 | 매수(신규) | – | 9월 8일 |\n| 뱅크오브아메리카 | 매수 | $160 → $145 | 8월 12일 |\n| 베어드 | 중립 | $75 → $125 | 7월 24~27일 |\n| 칸터 피츠제럴드 | 중립 | $150 → $125 | 7월 24일 |\n| 웰스파고 | 중립 | $110 → $120 | 7월 24일 |\n| 로스 캡피털 | 매수 | $100 → $120 | 7월 24일 |\n| 모건스탠리 | 중립 | $75 → $84 | 7월 24일 |\n| JP모건 | 비중축소(약세) | $45 → $85 | 7월 24일 |\n| 로젠블랫 | 매도(약세) | $65 → $80 | 7월 24일 |\n\n약세 목소리도 분명합니다. JP모건($85)·로젠블랫($80)은 여전히 현재가보다 20% 이상 낮은 목표가를 제시하고, X에서는 '크레이머 고점'과 'TSMC의 테라팹 참여'가 대표적인 경고였습니다.","insider_title":"내부자·유명인 매매 (2025~)","insider_md":"임원 매수는 2건이고, 둘 다 스스로 장내에서 산 것입니다(미리 정해 둔 자동 매매 아님). 특히 탄 CEO는 회사가 새 주식을 파는 날, 일반 투자자와 같은 $95에 샀습니다.\n\n| 누가 | 직책 | 날짜 | 주식 수 | 가격 | 금액 | 현재가 대비 |\n|---|---|---|---|---|---|---|\n| 립부 탄 | CEO | 2026-08-11 | 105,263주 | $95.00 | 약 1,000만 달러 | +12.7% |\n| 데이비드 진스너 | CFO | 2026-01-26 | 5,882주 | $42.50 | 약 25만 달러 | +152% |\n\n매도 요약: 임원 2명, 3건, 합계 81,280주 약 747만 달러(평균 $91.96). 모두 자동 매매 계획(10b5-1) 표시는 없습니다. 시총 5,660억 달러 회사에서는 작은 규모입니다.\n\n| 누가 | 직책 | 날짜 | 주식 수 | 가격 | 금액 |\n|---|---|---|---|---|---|\n| 나가 찬드라세카란 | 부사장, CTO·파운드리 총괄 | 2026-05-29 | 21,024주 | $118.28 | 약 249만 달러 |\n| 에이프릴 밀러 보이즈 | 부사장, 법무총괄 | 2026-05-01 | 40,256주 | $99.53 | 약 401만 달러 |\n| 에이프릴 밀러 보이즈 | 부사장, 법무총괄 | 2026-02-02 | 20,000주 | $49.05 | 약 98만 달러 |\n\n### 유명인·의원·대형 주주\n\n| 누가 | 날짜 | 내용 | 금액(신고 범위) | 당시 주가 | 현재가 대비 |\n|---|---|---|---|---|---|\n| 낸시 펠로시 (민주당 하원, 배우자 폴 펠로시 계좌) | 2026-05-29 (6월 23일 신고) | 콜옵션 200계약(2만 주분), 행사가 $50, 만기 2027년 3월 19일 | 100만~500만 달러 | 약 $114.68 | 주가 −6.6% (옵션의 내재가치는 주당 약 $64.7 → $57.1) |\n| 낸시 펠로시 | 2026-07-24 (8월 21일 신고) | 보통주 10,000주 매수 | 50만~100만 달러 | 약 $92.32 | +16% |\n| 낸시 펠로시 | 2026-07-24 | 콜옵션 50계약, 행사가 $50, 만기 2027년 6월 17일 | 25만~50만 달러 | 약 $92.32 | +16% (주가 기준) |\n| 로 칸나 (민주당 하원) | 2026년 3/23·4/24·5/27·6/30 매수, 2/6·2/17·5/1·6/18·8/3 매도 | 자주 사고파는 소액 거래 | 건당 1,001~15,000달러(4/24만 1.5만~5만 달러) | – | 방향성 약함 |\n| 길 시스네로스 (민주당 하원) | 2025-11-18, 2026-01-09 | 매수 2건 | 건당 1,001~15,000달러 | 1월 약 $45 | 약 +135% |\n| 마이클 맥콜 (공화당 하원) | 2025년 6월~2026년 5월 | 여러 차례 매도 | 최대 10만~25만 달러/건 | – | 매도 쪽 |\n| 미국 정부 (상무부) | 2025-08-22 발표 | 4.333억 주, 지분 약 9.9% | 89억 달러 | $20.47 | +423% |\n| 엔비디아 | 2025-09-18 발표 | 인텔 보통주 매입 + 제품 공동개발 | 50억 달러 | $23.28 | +360% |\n| 소프트뱅크 | 2025-08-18 계약 발표 | 인텔 보통주 매입 (인텔 8-K로 확인) | 20억 달러 | $23.00 | +366% |\n\n### 트럼프 대통령 (OGE 278-T 거래 보고)\n\n트럼프 대통령 이름의 계좌에서 인텔 채권 1건, 주식 매수 7건, 매도 2건이 신고됐습니다. 제3자가 운용하는 계좌이고, 금액은 범위로만, 가격 없이 공개됩니다. 아래 '당일 종가'는 거래일의 인텔 종가이며, 실제 체결가가 아닙니다.\n\n| 날짜 | 거래 | 금액(신고 범위) | 당일 종가 | 현재가($107.08) 대비 |\n|---|---|---|---|---|\n| 2025-08-29 | 인텔 회사채(이자 3.75%, 2027년 8월 5일 만기) 매수 | 100만~500만 달러 | $24.35 | 채권이라 주가와 직접 비교 어려움 |\n| 2026-03-02 | 주식 매수 | 5만~10만 달러 | $45.50 | +135% |\n| 2026-03-11 | 주식 매수 | 1.5만~5만 달러 | $47.98 | +123% |\n| 2026-03-13 | 주식 매수 | 1.5만~5만 달러 | $45.77 | +134% |\n| 2026-03-17 | 주식 매수 | 1,001~1.5만 달러 | $44.06 | +143% |\n| 2026-03-23 | 주식 매수 | 1,001~1.5만 달러 | $44.01 | +143% |\n| 2026-03-25 | 주식 매수 | 1.5만~5만 달러 | $47.18 | +127% |\n| 2026-04-15 | 주식 매수 | 1.5만~5만 달러 | $64.94 | +65% |\n| 2026-04-27 | 주식 매도 | 5만~10만 달러 | $84.99 | 판 뒤 +26% 더 오름 |\n| 2026-05-18 | 주식 매도 | 1.5만~5만 달러 | $108.17 | −1% |\n\n- 주식 매수 합계는 약 11만~33만 달러, 매도 합계는 약 6.5만~15만 달러(범위 합산)입니다. 대통령 재산 규모에 비하면 작습니다.\n- 3월 매수는 주가 $44~48 바닥권이었고, 4월 말·5월 중순 매도는 급등 구간이었습니다. 제3자 운용 계좌라 대통령이 직접 고른 거래인지는 알 수 없습니다.\n\n### 5% 이상 대주주 신고 (13G/13D, 2025년 이후)\n\n| 신고일 | 서류 | 보유자 | 지분 | 주식 수 | 기준일 |\n|---|---|---|---|---|---|\n| 2026-04-30 | 13G | 뱅가드 캐피털 매니지먼트 | 6.52% | 약 3.28억 주 | 2026-03-31 |\n| 2026-03-27 | 13G/A | 더 뱅가드 그룹 | 0% | 0주 | 2026-03-13 |\n| 2026-01-30 | 13G/A | 더 뱅가드 그룹 | 8.11% | 약 4.05억 주 | 2025-12-31 |\n\n- 뱅가드 그룹이 3월에 0%로 신고하고 다음 달 뱅가드 캐피털 매니지먼트가 6.52%로 신고했습니다. 같은 날 다른 종목에서도 똑같이 0% 신고가 나와, 판 것이 아니라 뱅가드 내부에서 담당 법인이 바뀐 것으로 보입니다.\n- 미국 정부(상무부)의 13D/13G 신고는 SEC EDGAR 신고 목록에서 찾지 못했습니다(확인 못함). 정부 지분 내용은 인텔 8-K(2025년 8월) 기준입니다.\n- 엔비디아·소프트뱅크의 지분 변동 신고(13D/13G)도 목록에 없어 확인 못함입니다.\n- 펠로시의 5월 옵션은 X에서 \"행사가 $88\"로 돌았지만, 하원 서류(Filing ID 20034836) 원문은 행사가 $50, 만기 2027년 3월 19일입니다. 행사가가 주가보다 훨씬 낮아 주식을 사는 것과 비슷하게 움직이는 '딥 인 더 머니' 옵션입니다. 옵션 매수 가격은 공개되지 않아 정확한 손익은 알 수 없습니다.","next_md":"| 시기 | 확인할 것 | 왜 중요한가 |\n|---|---|---|\n| 2026년 10월 중 | 14A 공정 설계 키트(PDK) 공개 | 외부 고객이 14A로 칩 설계를 시작할 수 있는 출발점 |\n| 2026년 10월 29일 (장 마감 후) | 3분기 실적 | 매출 158억~168억 달러, 조정 EPS $0.38 전망을 넘는지. 파운드리 외부 매출, 서버 CPU 공급 확대, 정부 주식 평가손 규모 |\n| 2026년 4분기 | 테라팹 파트너 구성 | TSMC가 실제로 들어오면 인텔의 몸이 줄 수 있음 (머스크: \"아직 논의뿐\") |\n| 미정 | 애플 위탁생산 정식 계약 | 5월의 '예비 합의'가 실제 주문으로 이어지는지 |\n| 미정 | SK하이닉스 오하이오 메모리 생산 결정 | 한국 정부 반대 가능성. 성사되면 파운드리의 큰 외부 고객 |\n| 수시 | 정부·엔비디아·소프트뱅크 지분 변동 | $20~23에 산 큰 주주들의 매도 여부 |\n| 수시 | 의원 거래 신고(PTR) | 펠로시 옵션 만기(2027년 3월·6월) 전 추가 매매 |\n| 2027년 3월 19일 | 펠로시 5월 콜옵션 만기 | 행사·매도·연장 여부가 신고로 공개됨 |","glossary_md":"| 용어 | 쉬운 뜻 |\n|---|---|\n| CPU | 컴퓨터의 두뇌. 명령을 처리하고 다른 부품을 지휘 |\n| GPU | 그림·AI 계산을 한꺼번에 많이 하는 칩 (엔비디아가 강자) |\n| 파운드리 | 남이 설계한 칩을 대신 만들어 주는 공장 사업 |\n| 18A / 14A | 인텔의 최첨단 공정 이름. 숫자가 작을수록 더 미세하고 성능이 좋음 |\n| 테라팹(Terafab) | 테슬라·스페이스X·xAI가 텍사스에 짓는 대형 AI 칩 공장 프로젝트 |\n| CHIPS법 | 미국 내 반도체 공장에 보조금을 주는 2022년 법 |\n| 시큐어 인클레이브 | 국방부용 최첨단 칩을 안전하게 만드는 정부 프로그램 |\n| 워런트 | 정해진 가격에 주식을 더 살 수 있는 권리 |\n| 유상증자(신주 발행) | 회사가 새 주식을 팔아 돈을 모으는 것. 기존 주주 몫이 엷어짐(희석) |\n| 매출총이익률 | 매출에서 만드는 데 든 비용을 빼고 남는 비율 |\n| 조정 EPS | 일회성 항목을 뺀 주당순이익. 회사가 주로 제시 |\n| PER | 주가를 주당순이익으로 나눈 값. 높을수록 비싼 주식 |\n| 콜옵션 | 정해진 가격(행사가)에 주식을 살 권리. 1계약 = 100주 |\n| PTR | 미국 의원이 주식 거래 후 45일 안에 내는 거래 신고서 |\n| Form 4 / 10b5-1 | 임원 주식 거래 신고서 / 미리 정해 둔 자동 매매 계획 |","sources":[{"t":"Intel: 2026년 2분기 실적 발표","u":"https://www.intc.com/news-events/press-releases/detail/1776/intel-reports-second-quarter-2026-financial \n\n**1. 발키리(XQ-58) 무인 전투기**\n\n- 사람이 타는 전투기(F-35 등) 옆에서 함께 날며 정찰·공격을 돕는 '로봇 윙맨'입니다. 이런 기체를 CCA(협동 전투 무인기)라고 부릅니다.\n- 활주로 없이 로켓으로 도움다리에서 발사할 수 있고, 오클라호마시티에서 만듭니다. 2028년 초부터 연 약 40대 생산을 계획 중입니다.\n- 해병대가 2026년 1월 첫 정식 CCA로 골랐습니다. 공군 CCA 1차 기체 사업에서는 발키리가 뽑히지 않았습니다.\n\n**2. 표적기 드론과 소형 제트엔진**\n\n- 미사일 방어 훈련 때 적 비행기 역할을 하는 표적기 드론을 오래 납품해 왔습니다.\n- 소형 크루즈미사일·드론용 제트엔진을 2027년 3,000개까지 늘릴 계획입니다. GE 에어로스페이스와 CCA급 무인기용 엔진도 함께 개발합니다.\n\n**3. 극초음속(마하 5 이상) 시험과 로켓 모터**\n\n- MACH-TB는 국방부가 극초음속 무기 기술을 자주, 싸게 시험하려고 만든 '시험 비행 대행' 사업입니다. 크라토스가 주관사이며, 2025년 1월 최대 14.5억 달러 2.0 계약을 받았습니다.\n- 자체 고체 로켓 모터(제우스, 오리올)와 극초음속 기체(에리니에스)를 인디애나주 공장에서 조립합니다. 모터 120개를 이미 주문해 두었고 3분기부터 도착합니다.\n- 이스라엘 라파엘과 50:50 합작사 '프로메테우스'를 만들어 고체 로켓 모터 공장을 짓고 있습니다(총 최대 1.75억 달러). 2027년 첫 시험 발사, 2028년 양산 목표입니다.\n\n**4. 위성 지상국·우주**\n\n- 위성을 조종하고 신호를 주고받는 지상 시스템을 하드웨어 대신 소프트웨어(가상화)로 만듭니다. 이 분야 선두 업체입니다.\n- 2026년 3월 이스라엘 위성통신 안테나 회사 오빗(Orbit)을 인수했습니다.\n\n**5. 마이크로파 부품·지휘통제(C5ISR)·훈련**\n\n- 미사일·레이더에 들어가는 전자부품, 전장 통신 차량(2월 노마드 인수), 군 훈련 시뮬레이터를 만듭니다.\n\n#### 돈 버는 구조: 부품·로켓 사업부가 83%\n\n이름은 '드론 회사'로 알려졌지만, 실제 매출의 83%는 정부솔루션(KGS) 사업부(로켓·엔진·전자부품·위성)에서 나옵니다. 무인기 사업부는 17%입니다.\n\n**사업부별 (2026년 2분기, 6월 28일 마감)**\n\n| 사업부 | 매출 | 전년 대비 | 영업이익 | 조정 EBITDA |\n|---|---|---|---|---|\n| 정부솔루션 (KGS) | 3.80억 달러 | +36% (인수 제외 +22%) | 1,430만 달러 | 3,310만 달러 |\n| 무인시스템 (KUS) | 0.79억 달러 | +8% | 120만 달러 | 510만 달러 |\n| **합계** | **4.59억 달러** | **+30.5%** | −160만 달러 (본사 비용 포함) | **3,820만 달러 (8.3%)** |\n\n**KGS 안에서 누가 가장 빨리 크나 (인수 제외 성장률)**\n\n| 사업 | 성장률 | 내용 |\n|---|---|---|\n| 로켓 시스템 | **+50%** | 극초음속·미사일방어 표적 로켓 |\n| 터빈(엔진) | +43% | 미사일·드론용 소형 제트엔진 |\n| 마이크로파 부품 | +30% | 레이더·미사일 전자부품 |\n| 우주·훈련·사이버 | +9% | 위성 지상국, 훈련 |\n\n**쉽게 비유하면**\n\n- 크라토스는 '무기 공장의 부품 도매상 + 시험 대행사'에 가깝습니다. 엔진·로켓·전자부품은 큰 방산사에도 팔고, 극초음속 시험은 국방부 대신 수행합니다.\n- 문제는 마진입니다. 매출 100달러당 남는 영업이익이 2분기 기준 0달러대입니다. 새 공장에 미리 돈을 들이고 있기 때문입니다.\n\n#### 앞으로의 숫자\n\n| 항목 | 회사 전망·현황 (8월 4일 발표) |\n|---|---|\n| 2026년 매출 | 17.5~18.1억 달러 (상향, 인수 제외 +19~23%) |\n| 2026년 조정 EBITDA | 1.73~1.76억 달러 (마진 약 10%) |\n| 2026년 영업이익 | 1,600~2,200만 달러 (매출의 1% 미만) |\n| 2026년 재량현금흐름 | **−8,500만~−1.05억 달러** (설비투자 1.25~1.35억 달러) |\n| 3분기 매출 | 4.6~4.8억 달러 |\n| 수주잔고 | 20.8억 달러 (확정 예산 15.7억 달러) |\n| 입찰 중인 사업 | 150억 달러 |\n| 극초음속 매출 | 2025년 약 2억 → 2026년 약 4억 → **2027년 7억 달러 이상** |\n| 2027년 | 조정 EBITDA 마진 추가 +1%p, 정식 전망은 3분기 실적 때 |\n","gov_md":"미국은 중국이 극초음속 미사일과 드론을 대량으로 만드는 속도를 따라잡으려 합니다. 비싼 무기를 적게 사는 대신, **싸고 많이 만들 수 있는 무기**를 사려는 쪽으로 바뀌고 있고, 크라토스는 그 흐름의 대표 회사입니다. 엘멧처럼 정부가 지분을 산 것은 아니고, **계약(주문)으로 돈을 주는 방식**입니다.\n\n| 목적 | 정부가 한 일 (금액·날짜) | 크라토스의 역할 |\n|---|---|---|\n| 중국 극초음속 무기 추격 | MACH-TB 2.0 계약 최대 14.5억 달러 (2025년 1월). 국방부 예산 문서상 5년간 약 70억 달러 규모로 커질 수 있음 | 주관사. 로켓·극초음속 기체로 시험 비행을 자주, 싸게 대행 |\n| 무인 전투기 확보 | 해병대 MUX TACAIR 2.315억 달러, 24개월 (2026년 1월 8일, 노스럽그러먼이 주관) | 발키리 기체 제작. 해병대 첫 CCA, 첫 시제기는 2026년 말 인도 목표 |\n| 미사일 경보 위성 지상국 | 우주군 미사일경보·추적(MWT) 지상국 최대 4.47억 달러 (2026년 4월 8일) | 주관사이자 통합업체. 중궤도 위성의 지상 운영 시스템 구축 |\n| 고체 로켓 모터 부족 해소 | 기존 2개 업체(L3해리스 에어로젯, 노스럽) 의존을 줄이려 새 공급사 육성 | 라파엘과 합작사 프로메테우스 설립(인디애나 크레인), 2028년 양산 목표 |\n| 미사일방어 시험 | 탄도미사일 방어 시험용 표적 로켓 | 오리올·제우스 로켓 모터 각 60개분 장기부품 선구매 |\n| 드론 대량 생산 지원 | 2026년 5월 펜타곤 전략자본실(OSC)이 국내 드론 업체 지분·대출 투자 논의 보도 | 직접 대상으로 지목되진 않았지만 수혜주로 묶여 주가 +13.8% |\n\n**예산 흐름 (주주에게 중요)**\n\n- 트럼프 대통령은 2026년 1월 7일 2027 회계연도 국방예산 **1.5조 달러**를 요구했습니다. 2026년(9,010억 달러)보다 약 66% 많은 금액입니다.\n- 회사는 이 예산에 골든돔(미국판 미사일 방패), 우주·위성통신, 무인기, 미사일·레이더가 크게 들어갈 것으로 봅니다.\n- 이란 전쟁 비용 등으로 2026년 추가경정 880억 달러(이 중 670억 달러가 이란 등 관련)도 요청됐습니다.\n\n**미·중·러 경쟁과 동맹국**\n\n- 러시아의 우크라이나 전쟁과 중동 분쟁으로 미국과 나토가 무기 재고를 다시 채우고 있습니다. 표적기, 미사일 엔진, 로켓 모터 수요가 함께 늘어납니다.\n- 이스라엘 라파엘(프로메테우스), 이스라엘 오빗 인수로 동맹국 기술을 미국 안으로 들여오는 구조입니다.\n- 영국은 2026년 6월 4년간 50억 파운드 드론 투자를 발표했고, 이날 크라토스 주가도 약 6% 올랐습니다.\n\n**한계**\n\n- 공군의 가장 큰 무인 전투기 사업(CCA 1차)에서 발키리는 선정되지 않았고, 2차는 아직 경쟁 중입니다. 2차 초기 압축은 약 10개월 뒤(2026년 7월 보도 기준)로 예상됩니다. 크라토스는 GE와 2차용 엔진에만 이름이 언급됐습니다.\n- 계약 대부분이 '최대 금액'이라 실제 돈은 해마다 예산이 집행되는 만큼만 들어옵니다.","gov_title":"정부가 이 회사를 쓰는 방법","events":[{"date":"2026-10-08","title":"연중 최저 종가","detail":"연중 최저 종가. 새 악재 공시 없음","move":"9 05","title":"존스리서치 매수 개시","detail":"존스리서치 신규 매수 의견","move":"+13.4% (종가 $89.93)"}],"chart_events":["2026-01-05","2026-01-08","2026-01-16","2026-02-26","2026-05-28","2026-08-04"],"bull":["**실적 성장이 빨라지는 중**: 2분기 매출 +30.5%, 인수 제외 +19.1%. 회사는 연간 전망을 두 번 올려 17.5~18.1억 달러로 잡았습니다(연초 16~17억).","**실적 성장이 빨라지는 중**: 최근 12개월 수주 19.9억 달러, 수주/매출 비율 1.3배. 수주잔고 20.8억 달러, 입찰 중인 사업 150억 달러입니다.","**극초음속이 가장 큰 사업이 될 수 있음**: 극초음속 매출은 2025년 약 2억 → 2026년 약 4억 → 2027년 7억 달러 이상으로 커진다는 것이 회사 전망입니다.","**극초음속이 가장 큰 사업이 될 수 있음**: MACH-TB는 국방부 예산 문서상 5년간 약 70억 달러. CEO는 \"연 10억 달러 이상도 가능하다\"고 답했습니다(공식 전망은 아님).","**발키리가 실제 사업이 됨**: 해병대가 첫 CCA로 골랐고(2.315억 달러), 8월에는 해병대용 발키리가 활주로 없이 발사돼 F-35·F/A-18과 함께 날았다는 X 게시가 퍼졌습니다.","**발키리가 실제 사업이 됨**: 2차 생산분 12대를 만드는 중이며, 2028년부터 연 40대 생산을 계획합니다.","**누구도 쉽게 못 만드는 부품을 가짐**: 미국의 고체 로켓 모터는 사실상 2개 회사가 만듭니다. 크라토스는 라파엘과 세 번째 공급사를 만들고 있습니다.","**누구도 쉽게 못 만드는 부품을 가짐**: 소형 제트엔진 3,000개(2027년), 위성 지상국 소프트웨어도 대체자가 적은 분야입니다.","**누구도 쉽게 못 만드는 부품을 가짐**: X에서는 2026년 우주 계약이 6.47억 달러를 넘는다는 집계가 돌았지만 확인 못했습니다. 금액이 공개된 회사 발표만 합치면 약 5.67억 달러 이상입니다(4월 4.468억 + 10월 1억 이상 + 9월 2,000만 달러, 금액 미공개 주문 별도).","**돈은 넉넉함**: 6월 말 현금 14.4억 달러, 부채 약 1.9억 달러. 연 1억 달러씩 현금을 써도 당분간 추가 증자가 필요 없는 규모입니다.","**몸값이 많이 낮아짐**: 주가는 1월 매출의 15~18배에서 지금 약 4.4배(2026년 매출 전망 기준)로 내려왔습니다.","**몸값이 많이 낮아짐**: 증권사 23곳 중 21곳이 매수 의견이고, 가장 낮은 목표가 $68도 현재가보다 62% 높습니다.","**몸값이 많이 낮아짐**: 레드번은 2030년까지 매출 연 18%, 조정 EBITDA 연 25% 성장을 예상합니다."],"bear":["**이익이 거의 없음**: 2분기 영업이익 −160만 달러, 2026년 연간 영업이익 전망도 1,600~2,200만 달러로 매출의 1% 미만입니다.","**이익이 거의 없음**: 주가수익비율(PER)은 지난 12개월 기준 약 247배, 내년 예상 기준 약 38배입니다.","**현금을 계속 씀**: 2025년 재량현금흐름 −1.37억 달러, 2026년 전망도 −8,500만~−1.05억 달러입니다. 발키리·로켓 모터를 주문도 받기 전에 미리 만드는 투자가 많습니다.","**주식 수가 늘어남 (희석)**: 2월 26일 $84에 1,643만 주를 새로 발행했습니다(약 10%). 그 가격에 산 투자자는 지금 −50%입니다.","**주식 수가 늘어남 (희석)**: 2024년에도 $18에 1,917만 주를 발행했고, 인수 대금으로도 주식을 줍니다. 5월에는 발행 가능 주식 수 한도를 1.95억 → 2.45억 주로 올렸습니다.","**가장 큰 무인기 사업에서는 주인공이 아님**: 공군 CCA 1차 기체는 다른 회사들이 따냈고, 2차에서도 기체보다는 GE와의 엔진 쪽에서 이름이 나옵니다.","**가장 큰 무인기 사업에서는 주인공이 아님**: 해병대 계약도 노스럽그러먼이 주관사이고, 크라토스는 기체 하청업체입니다.","**가장 큰 무인기 사업에서는 주인공이 아님**: 무인시스템 사업부 성장은 2분기 +8%로, 회사 전체(+30%)보다 느립니다.","**내부자 매도가 계속됨**: 2025년 이후 내부자 매도 1.52억 달러, 매수는 50만 달러뿐입니다. CEO는 5월에 매도 계획 한도를 80만 주 → 150만 주로 늘렸습니다.","**예산·정치 변수**: 1.5조 달러 예산은 요청일 뿐이고 의회 통과 전입니다. 예산 지연·정부 셔다운은 계약 시점을 늦춥니다.","**예산·정치 변수**: 변동성이 큽니다. 올해 하루 ±9% 이상 움직인 날이 8번, 지난 1년 하루 5% 이상 움직인 날이 약 50번입니다."],"analysts_md":"증권사는 거의 모두 매수 의견이지만, 8월 이후 새로 나온 목표가는 $68~75로 예전($100~135)보다 크게 낮아졌습니다. 평균 목표가(약 $95~101)는 오래된 높은 목표가가 섞인 숫자입니다.\n\n| 날짜 | 증권사 | 의견 | 목표가 | 현재가 대비 |\n|---|---|---|---|---|\n| 10월 6일 | 로스차일드 레드번 | 매수 (신규) | $70 | +67% |\n| 9월 30일 | 제프리스 | 매수 | $68 (기존 $80) | +62% |\n| 9월 14일 | 구겐하임 | 매수 (신규) | $74 | +76% |\n| 8월 13일 | 트루이스트 | 매수 | $104 (기존 $135) | +148% |\n| 8월 6일 | 스티펠 | 매수 | $115 (기존 $134) | +174% |\n| 8월 5일 | 캐나코드 | 매수 | $135 (기존 $130) | +222% |\n| 8월 5일 | 파이퍼 샌들러 | 중립 → 비중 확대 | $75 | +79% |\n| 8월 5일 | BTIG | 매수 | $104 (기존 $100) | +148% |\n| 8월 4일 | 칸터 피츠제럴드 | 비중 확대 | $100 (기존 $115) | +138% |\n| 8월 5일 | 와이스 레이팅스 (평가사) | 보유 → **매도** (D+) | – | – |\n| 7월 14일 | 골드만삭스 | 매수 | $89 (기존 $100) | +112% |\n| 6월 30일 | 웨드부시 | 시장수익률 상회 (신규) | $85 | +103% |\n| 6월 12일 | JP모건 | 중립 → 비중 확대 | $82 (기존 $99) | +96% |\n| 5월 7일 | UBS | **중립** | $82 | +96% |\n| 5월 7일 | BNP파리바 엑산 | **중립** | $85 | +103% |\n| 1월 9일 | B. 라이언리 | 매수 | $128 (7월에도 유지) | +205% |\n\n종합: 23곳 중 강력매수 2, 매수 19, 보유 1, 매도 1. 평균 목표가 $95.06 (MarketBeat), $100.73 (야후, 22곳, 범위 $60~150). 목표가가 내려가는 속도보다 주가가 더 빨리 내려가고 있다는 점에 주의하세요.","insider_title":"내부자·유명인 매매 (2025~)","insider_md":"2025년 1월 이후 내부자는 약 220만 주(1.52억 달러)를 팔았고, 장내 매수는 CEO의 50만 달러뿐입니다. 매도의 대부분은 미리 정해둔 자동 매도계획(10b5-1)에 따른 것입니다. 현재가는 $41.93 (10월 8일 종가)입니다.\n\n**내부자 매수 (SEC Form 4, 장내 매수 전부)**\n\n| 누가 | 직책 | 날짜 | 주식 수 | 가격 | 금액 | 현재가 대비 |\n|---|---|---|---|---|---|---|\n| 에릭 드마르코 | CEO | 2025년 5월 12일 | 7,455주 | $33.59 | 약 25만 달러 | +25% |\n| 에릭 드마르코 | CEO | 2025년 3월 3일 | 9,500주 | $26.35 | 약 25만 달러 | +59% |\n\n**내부자 매도 상위 (2025년 1월 ~ 2026년 9월)**\n\n| 누가 | 직책 | 판 주식 | 금액 | 평균 가격 | 매도계획(10b5-1) |\n|---|---|---|---|---|---|\n| 에릭 드마르코 | CEO | 110만 주 | 8,268만 달러 | $75.17 | 전부 계획 |\n| 스티븐 펜들리 | 무인시스템 사장 | 20만 주 | 1,130만 달러 | $56.50 | 대부분 계획 |\n| 필립 카레이 | 우주·훈련·사이버 사장 | 16.5만 주 | 961만 달러 | $58.43 | 계획 |\n| 디애나 룬드 | CFO | 15.4만 주 | 956만 달러 | $62.24 | 계획 |\n| 윌리엄 호글런드 | 이사회 의장 | 10.6만 주 | 775만 달러 | $73.43 | 일부 계획 |\n| 스테이시 록 | 터빈(엔진) 사장 | 9.6만 주 | 668만 달러 | $69.80 | 계획 |\n| 요나 애델만 | 마이크로파 사장 | 10.1만 주 | 538만 달러 | $53.11 | 계획 아님 |\n| 데이비드 카터 | 로켓 사업 사장 | 8.0만 주 | 514만 달러 | $64.19 | 계획 |\n| 스콧 재비스 | 이사 | 4.5만 주 | 395만 달러 | $87.06 | 일부 계획 |\n| **전체 16명** |  | **220만 주** | **1.52억 달러** | **$68.90** (현재가보다 64% 높음) |  |\n\n**CEO 드마르코의 110만 주 매도, 어떻게 봐야 하나**\n\n| 날짜 | 주식 수 | 평균 가격 | 근거가 된 매도계획 |\n|---|---|---|---|\n| 2025년 12월 1일 | 20만 주 | 약 $74 | 2025년 8월 29일 계획 (최대 100만 주) |\n| 2025년 12월 2일 | 20만 주 | 약 $72 | 같은 계획 |\n| 2025년 12월 22일 | 20만 주 | 약 $80.5 | 같은 계획 |\n| 2026년 1월 5~6일 | 20만 주 | 약 $90.3 | 같은 계획 (2026년 3월 6일 종료) |\n| 2026년 8월 14일 | 30만 주 | $64.33 | 2026년 3월 6일 새 계획 (80만 주), 5월 15일 **150만 주로 확대** (2029년 8월까지) |\n\n- **계획 매도가 맞습니다.** Form 4 전 건에 10b5-1 표시가 있고, 회사 10-Q에 계획 채택·종료·변경 날짜가 공시돼 있습니다. 10b5-1은 미리 정한 가격·수량 조건에 따라 자동으로 파는 약속이라, 팔때마다 판단한 것은 아닙니다.\n- **다만 계획 자체는 본인이 만들고 바꿉니다.** 주가가 $27에서 오르기 시작한 뒤 2025년 8월에 100만 주 계획을 만들었고, 2026년에는 두 번(3월·5월) 바꾸며 한도를 150만 주로 늘렸습니다. 5월 확대 뒤 서너 달의 대기기간을 거쳐 8월 실적 발표 직후 반등 구간에서 30만 주가 팔렸습니다.\n- **남은 지분:** 8월 매도 후 직접 보유 76.2만 주(이 매도로 28% 감소). 이미 확정됐지만 2029년 1월까지 지급이 미뤄진 주식보상 74.5만 주, 성과 조건부 75만 주가 따로 있습니다. 그래서 '전 재산 항복'으로보기는 어렵습니다.\n- **숫자로 보면:** CEO는 2025년 $26~34에 50만 달러어치를 사고, $72~90에 8,270만 달러어치를 팔았습니다. 평균 매도가 $75.17은 현재가보다 79% 높습니다. 판 뒤 주가가 크게 내려갔다는 점에서 매도 시점은 결과적으로 좋았습니다.\n- CFO(19.9만 주), 무인시스템 사장(8.4만 주), 법무총괄(4.3만 주), 이사 재비스(2만 주)도 2026년 5~6월에 새 매도계획을 만들어, 앞으로도 꼬준한 매도가 예정돼 있습니다.\n\n**유명인·유명 펀드**\n\n| 누구 | 내용 | 당시 가격 → 현재가 |\n|---|---|---|\n| 낸시 펠로시·의회 의원 | 2025년 이후 KTOS 거래 신고 없음 (마지막 기록은 2021년 로원탈 전 의원) | – |\n| 트럼프 (OGE 278-T) | 2025년 8월 이후 제출된 278-T 19건(2025년 1월~2026년 7월 거래)을 모두 확인한 결과 KTOS 거래 없음 (OGE·Open Cabinet) | – |\n| 캐시 우드 ARK | 2026년 2월 말~3월 초 25.2만 주(약 2,100만 달러) 매수 | 약 $83 → 약 −49% |\n| 캐시 우드 ARK | 2026년 6월 29일 ARKK로 13.9만 주 추가 매수 | 약 $47~50 → 약 −12~16% |\n\n**대주주 신고 (13G/13D, 2025년 이후)**\n\n| 신고일 | 주주 | 지분율 | 주식 수 | 기준일 |\n|---|---|---|---|---|\n| 2026년 7월 29일 | 블랙록 | 10.1% | 1,889만 주 | 2026년 6월 30일 |\n| 2026년 4월 30일 | 뱅가드 캐피털 매니지먼트 | 5.14% | 965만 주 | 2026년 3월 31일 |\n| 2026년 3월 26일 | 뱅가드 그룹 | 0% (자회사별 신고로 바뀜) | – | 2026년 3월 13일 |\n| 2026년 3월 5일 | 뱅가드 그룹 | 10.50% | 1,789만 주 | 2026년 2월 27일 |\n| 2026년 2월 9일 | 스테이트 스트리트 | 4.9% | 819만 주 | 2025년 12월 31일 |\n| 2025년 10월 17일 | 블랙록 | 12.7% | 2,149만 주 | 2025년 9월 30일 |\n| 2025년 4월 3일 | 블랙록 | 15.8% | 2,411만 주 | 2025년 3월 31일 |\n\n블랙록 지분은 15.8%(2025년 3월) → 10.1%(2026년 6월)로 줄었습니다. 주식 수도 약 520만 주 줄었습니다. 모두 인덱스·기관 보유를 신고하는 13G이며, 경영 참여 목적의 13D는 없습니다.\n\n출처: SEC EDGAR Form 4, 10-Q(2026년 1·2분기) 10b5-1 공시, Schedule 13G. ARK 가격은 보도의 금액·주식 수로 계산한 추정치입니다.","next_md":"| 시기 | 확인할 것 | 왜 중요한가 |\n|---|---|---|\n| 2026년 11월 3일 전후 (추정, 회사 미발표) | 3분기 실적. 회사 전망은 매출 4.6~4.8억, 조정 EBITDA 4,000~4,500만 달러 | **2027년 연간 전망이 처음 나옴**. 현금 소모가 줄어드는지 |\n| 2026년 3~4분기 | 극초음속 매출이 2분기보다 3분기 +2,000~2,500만, 4분기 +2,000~3,000만 달러 늘어나는지 | 2027년 7억 달러 목표의 중간 점검 |\n| 2026년 3분기부터 | 주문해 둔 고체 로켓 모터 120개 도착 | 로켓·미사일방어 표적 매출의 재료 |\n| 2026년 말까지 | 선정 진행 중인 극초음속 사업 수주 | 회사가 \"연내 발표 예상\"이라고 한 건들 |\n| 2026년 말 목표 | 해병대용 발키리 첫 시제기 인도 | 해병대 CCA가 일정대로 가는지 |\n| 2026년 연말~2027년 | 2027 회계연도 국방예산·국방수권법(NDAA) 통과 규모 | 1.5조 달러 요청이 실제로 얼마나 남는지 |\n| 2026년 12월 31일 | 이사 재비스 매도계획 만료. CEO·CFO 계획은 2028~2029년까지 | 내부자 매도는 당분간 이어질 예정 |\n| 2027년 중반 (예상) | 공군 CCA 2차 초기 압축 (약 6개 회사) | 발키리나 GE·크라토스 엔진이 들어가는지 |\n| 2027년 | 프로메테우스 첫 로켓 모터 시험 발사, 소형 제트엔진 3,000개 생산 | 새 공장 투자가 매출로 바뀌는 시점 |\n| 2028년 | 발키리 연 40대 생산, 프로메테우스 양산 | 무인기 사업부 성장이 빨라질지 |","glossary_md":"| 용어 | 뜻 |\n|---|---|\n| CCA (협동 전투 무인기) | 사람이 타는 전투기와 함께 날며 돕는 무인 전투기. '로봇 윙맨' |\n| 극초음속 | 소리보다 5배 이상(마하 5+) 빠른 속도. 막기 어려운 차세대 미사일의 속도 |\n| MACH-TB | 국방부의 극초음속 시험 대행 사업. 크라토스가 주관사 |\n| 고체 로켓 모터 (SRM) | 고체 연료를 태워 미사일을 밀어주는 엔진. 미국엔 만드는 회사가 적음 |\n| 표적기 | 미사일·방공포 훈련 때 적 비행기 역할을 하는 드론 |\n| 지상국 (위성) | 위성과 신호를 주고받고 조종하는 땅 위 시설·소프트웨어 |\n| OTA (기타 거래 계약) | 시제품을 빨리 만들기 위해 절차를 줄인 국방 계약 방식 |\n| 수주잔고 | 이미 주문받았지만 아직 납품 안 한 금액. 앞으로의 매출 |\n| 수주/매출 비율 (book-to-bill) | 새 주문 ÷ 매출. 1보다 크면 일감이 쌓이는 중 |\n| 조정 EBITDA | 주식보상 등 일부 비용을 빼고 본 영업 현금 이익에 가까운 숫자 |\n| 재량현금흐름 (FCF) | 영업으로 들어온 현금에서 설비투자를 뺀 돈. 마이너스면 현금을 쓰는 중 |\n| 유상증자 | 회사가 새 주식을 팔아 돈을 모으는 것. 주식 수가 늘어 기존 주주 지분이 희석됨 |\n| 10b5-1 매도계획 | 내부자가 미리 정한 조건대로 자동 매도하는 약속. 내부정보 거래 의심을 피하려는 장치 |\n| Form 4 / 13G | 내부자 매매 신고 / 5% 이상 대주주 지분 신고 (SEC) |\n| PER | 주가 ÷ 주당순이익. 이익 대비 주가가 몇 배인지 |\n| 전략자본실 (OSC) | 국방부 안에서 방산 기업에 대출·투자를 하는 조직 |","sources":[{"t":"Kratos 2026년 2분기 실적 발표 (8월 4일)","u":"https://ir.kratosdefense.com/node/32946"},{"t":"SEC 10-Q 2026년 2분기 (유상증자, 10b5-1 공시, CEO 보유)","u":"https://www.sec.gov/Archives/edgar/data/1069258/000106925826000077/ktos-20260628.htm"},{"t":"SEC 10-Q 2026년 1분기 (CEO 매도계획 종료·재채택)","u":"https://www.sec.gov/Archives/edgar/data/1069258/000106925826000053/ktos-20260329.htm"},{"t":"SEC 13G/A: 블랙록 10.1%","u":"https://www.sec.gov/Archives/edgar/data/1069258/000201238326002807/primary_doc.xml"},{"t":"SEC 13G: 뱅가드 캐피털 매니지먼트 5.14%","u":"https://www.sec.gov/Archives/edgar/data/0001069258/000210011926000757/primary_doc.xml"},{"t":"InsiderTrades: CEO 30만 주 매도 (8월 14일)","u":"https://www.insidertrades.com/alerts/nasdaq-ktos-insider-buying-and-selling-2026-08-15/"},{"t":"Defense News: 해병대, 노스럽·크라토스 발키리 선정","u":"https://www.defensenews.com/unmanned/2026/01/08/us-marine-corps-taps-northrop-kratos-to-build-valkyrie-drone-wingmen/"},{"t":"The War Zone: 해병대 XQ-58 발키리 계약","u":"https://www.twz.com/news-features/usmc-xq-58-valkyrie-development-makes-leap-forward-with-new-contract.md"},{"t":"DefenseScoop: 공군 CCA 2차 진행 상황 (7월 30일)","u":"https://defensescoop.com/2026/07/30/air-force-cca-drone-program-increment-2-downselect/"},{"t":"Defence Industry Europe: 극초음속 매출 2027년 7억 달러+ 전망","u":"https://defence-industry.eu/kratos-sees-hypersonics-revenue-reaching-at-least-700-million-in-2027-with-mach-tb-fu  달러 고정가 HALEU 농축 계약(6월 30일 서명), 공장 부지도 DOE 소유"],["국방 필수도","높음. 미국 국방용으로 쓸 수 있는 '미국산 농축 기술'은 현재 이 회사의 AC100뿐 (회사 주장, 대규모 생산은 2029년 이후)"],["내부자 동향","2025년 이후 장내 매수 0건. 매도 4건, 합계 약 112만 달러 (소액)"],["큰손 동향","블랙록 지분 7.6% → 11.6% (8월 31일 기준, 13G 확인)"],["증권사 평균 목표가","$247.40 (17명, 범위 $168.77~$340)"]],"overview_md":"한 줄 판단: 강세론은 '미국 유일의 농축 회사 + 탈러시아 + HALEU 수요'를, 약세론은 '러시아 물량 의존, 9월 대규모 증자와 워런트, 2029년까지 먼 실행 일정'을 봅니다. 2026년 주가는 약세론 쪽으로 움직였습니다.\n\n#### 기업 개요: 이 회사는 무엇을 하나\n\n센트러스는 원래 미국 정부의 우라늄 농축 공사(USEC)였고, 1998년 민영화됐습니다. 2014년 지금 이름으로 바꿨고, 본사는 메릴랜드주 베데스다, 직원은 약 470명입니다. 2025년 12월 NYSE American에서 NYSE(뉴욕증권거래소)로 옮겨습니다.\n\n**1. 농축이란?**\n\n- 땅에서 캐낸 우라늄에는 불타는 성분(우라늄-235)이 0.7%뿐입니다. 원자력 발전소는 이걸 3~5%로 올린 연료(LEU, 저농축 우라늄)를 씁니다.\n- 농축은 원심분리기를 수천 대 돌려서 무거운 성분과 가벼운 성분을 갈라내는 일입니다. 그 일의 양을 SWU(분리작업단위)라는 단위로 사고팝니다.\n- 전 세계 농축 능력은 러시아(로사톰), 유럽(우레코·오라노), 중국이 대부분을 갖고 있습니다. 미국 회사가 미국 기술로 농축하는 상업 공장은 2013년 이후 없습니다.\n\n**2. HALEU란?**\n\n- 고농축 저농축 우라늄. 불타는 성분을 5~20%(보통 19.75%)까지 올린 연료입니다.\n- 소형모듈원전(SMR)과 마이크로원자로 같은 차세대 원자로가 이 연료를 씁니다. X-에너지, 오클로, 라디안트, 안타레스 등이 고객입니다.\n- 센트러스는 2023년부터 파이크턴의 원심분리기 16대짜리 시범 라인으로 HALEU를 만들어 왔고, DOE에 누적 1,900kg 넘게 납품했습니다. 회사는 파이크턴을 '서방 유일의 인가된 HALEU 생산 시설'이라고 설명합니다.\n\n**3. 이 회사만의 특징**\n\n- 미국산 원심분리기(AC100) 기술을 갖고 있습니다. 미국 법과 협정상 군사용(핵추진 항모·삼중수소 생산 등)에는 외국 기술로 농축한 우라늄을 쓸 수 없어서 이 점이 핵심입니다.\n- 대신 지금 파는 농축 우라늄의 대부분은 직접 만든 게 아니라 러시아 국영 TENEX와 프랑스 오라노에서 사 오는 것입니다. 10-Q에 따르면 2027년까지 고객 납품분의 절반을 훨씬 넘는 양이 TENEX 계약에서 나옵니다.\n- CEO는 아미르 벡슬러, CFO는 토드 티넬리입니다.\n\n#### 돈 버는 구조: 지금은 '되파기', 앞으로는 '직접 농축'\n\n| 사업 | 하는 일 | 2분기 매출 | 포인트 |\n|---|---|---|---|\n| LEU 부문 | 러시아·유럽에서 산 농축 우라늄(SWU)과 천연 우라늄을 미국·해외 전력회사에 판매 | 1.53억 달러 (+22%), 그중 천연 우라늄 0.53억 달러 | 매출의 87%. SWU 평균 판매가 +3%, 단가 원가 +13%로 마진이 줄었음 |\n| 기술솔루션 부문 | DOE를 위한 HALEU 생산 운영, 엔지니어링·제조 서비스 | 0.23억 달러 (−21%) | DOE가 HALEU 운영 계약 추가 옵션을 쓰지 않겠다고 밝혀 매출 공백 예상 |\n\n**쉽게 비유하면**\n\n- 지금의 센트러스는 '수입 양주를 도매로 파는 가게'입니다. 물건은 러시아·프랑스 양조장에서 가져오고, 오래된 장기계약 덕분에 마진을 남깁니다.\n- 목표는 오하이오에 자기 양조장을 다시 짓는 것입니다. 러시아산 수입이 2028년 이후 완전히 막히기 전에 양조장을 지어야 하는 시간 싸움입니다.\n\n**재무 상태 (2026년 6월 말)**\n\n| 항목 | 값 |\n|---|---|\n| 현금 | 18.7억 달러 (9월 증자 5억 달러는 미포함) |\n| 2.25% 전환사채 | 4.03억 달러, 2030년 11월 만기, 전환가 약 $97.50 (지금 주가보다 낮아 전환 가능 상태) |\n| 0% 전환사채 | 8.05억 달러, 2032년 8월 만기, 전환가 약 $229.62 |\n| 2분기 순이익 | 1,680만 달러 (전년 2,890만 달러에서 −42%) |\n| 상반기 설비투자 | 9,480만 달러 (전년 약 600만 달러) |\n| 상반기 영업현금흐름 | −1,670만 달러 |\n\n#### 앞으로의 숫자\n\n| 항목 | 회사 제시 숫자 |\n|---|---|\n| 2026년 매출 가이던스 | 4.5억~5억 달러 (2월 4.25억~4.75억 → 5월 상향, 8월 유지) |\n| 2026년 투자 집행 | 3.5억~5억 달러 |\n| 수주잔고 | 45억 달러: LEU 37억(그중 신규 공장 조건부 30억, 확정 계약 24억) + 기술솔루션 8억 |\n| 파이크턴 1단계 증설 | HALEU 연 12톤 + 기존 LEU 수주 24억 달러분 농축 능력. 첫 생산 2029년 목표 |\n| 오크리지 원심분리기 공장 | 5.6억 달러 이상 투자, 400개 넘는 일자리. 첫 원심분리기 2026년 완성 목표 |\n| 인력 | 2026년 순증가 파이크턴 175명+, 오크리지 100명+ |\n| 투자자의 날 | 2026년 12월, 파이크턴 현장 |\n\n수주잔고 45억 달러 중 30억 달러는 '공장이 지어지면' 살아나는 조건부 계약이고, 기술솔루션 8억은 DOE 예산이 빠져 사라질 수 있습니다. 숫자가 크지만, 당장 돈이 되는 부분은 일부라는 뜻입니다.","gov_md":"미국 정부의 목표는 두 가지입니다. 하나는 러시아 없이 원전 연료를 만드는 것, 다른 하나는 군사용으로 쓸 수 있는 '미국산' 농축 능력을 되살리는 것입니다. 센트러스는 두 목표 모두에 걸려 있지만, 정부는 지분을 사지 않고 계약과 규제로 지원합니다.\n\n| 목적 | 정부가 한 일 | 센트러스의 역할·금액 |\n|---|---|---|\n| HALEU 국산화 | 2026년 1월 5일 DOE가 3개 회사에 총 27억 달러 농축 과제 발주. 6월 30일 계약 서명 | 9억 달러 고정가, 단계별 지급. 2032년 3월까지 HALEU 1톤 납품. 옵션 포함 최대 10.7억 달러. 끝나면 설비 소유권은 회사로 |\n| HALEU 시범 생산 | 2019년 시범 계약, 2022년 11월 운영 계약(기본 1.5억 달러) | 1,900kg 넘게 생산. 지금까지 2.8억 달러 수령. 9월 30일까지 1,500만 달러짜리 '보관만' 연장. DOE는 추가 옵션을 쓸 생각이 없다고 밝힘 |\n| 저농축(LEU)·HALEU 국산 공장 | 2024년 DOE 무기한 계약(IDIQ) 3건: HALEU 탈변환(10월 4일), HALEU 생산(10월 16일), LEU 생산(12월 10일) | 앞으로 과제를 받을 수 있는 '자격증'. LEU 과제 추가 수주 여부는 미정 |\n| 러시아 의존 끊기 | 2024년 5월 러시아산 농축 우라늄 수입금지법. 2027년 말까지만 DOE 면제(waiver) 가능 | 2025년 8월 4일, 이미 약속한 2026·2027년 미국 납품분 면제 획득. 새 판매분 면제(2024년 12월 신청)는 아직 결정 없음 |\n| 국방용 농축 | 2013년 파두카 공장 폐쇄 후 미국에 군사용 농축 능력이 없음. 냉전 때 비축분을 줄여 쓰는 중 | NNSA(핵안보청)가 일부 농축을 센트러스에 수의계약하려는 의향을 밝혀 협의 중 (2분기 콜) |\n| 동맹 투자 | 2025년 8월 25일 한국수력원자력(KHNP)·포스코인터내셔널과 파이크턴 투자 검토 MOU (구속력 없음) | KHNP는 기존 LEU 공급 물량도 늘림. 단, 새 공장 자금을 확보해야 효력 |\n\n**'비의무(unobligated)' 농축이 왜 중요한가**\n\n- 미국이 다른 나라와 맺은 핵 협정 때문에, 외국 기술로 농축한 우라늄은 '평화적 용도로만 쓴다'는 의무가 따라붙습니다. 그래서 군사용에는 못 씁니다.\n- 군사용이란 핵무기에 들어가는 삼중수소(트리티움)를 만드는 발전소 연료, 해군 핵추진 항모·잠수함 연료, 군 기지용 마이크로원자로 연료 등입니다.\n- 유럽 우레코가 미국 뉴멕시코에 공장을 갖고 있지만 기술이 외국산이라 군사용이 안 됩니다. 센트러스는 자사 AC100이 '배치 가능한 유일한 미국산 기술'이라고 주장합니다.\n- 회사는 DOE에 원심분리기 기술을 국방 목적(삼중수소 생산용 연료 포함)으로 무료로 쓸 권리를 주고 있습니다 (10-K).\n- 9월 라디안트(9월 8일)와 안타레스(9월 17일) HALEU 계약은 모두 '비의무' 농축을 내세웠습니다. 안타레스는 육군 Janus, 공군 기지 원자력, 우주군 우주 원자로 사업에 선정된 회사입니다.\n\n**러시아·중국과의 경쟁 구도**\n\n- 러시아는 미국 제재에 맞서 2024년 11월 TENEX의 미국 수출 일반 허가를 취소했고, 이 조치를 2027년 말까지 연장했습니다. 이후 물량은 건별 허가에 달려 있습니다.\n- 즉 미국 법(수입 금지)과 러시아 법(수출 제한) 양쪽에서 러시아 물량이 막힐 수 있습니다. 회사는 \"다른 공급원으로는 TENEX 물량을 다 대체할 수 없다\"고 적었습니다.\n- 한국은 동맹 투자자이자 고객입니다. 미국이 러시아·중국이 아닌 동맹과 연료 공급망을 짜려는 흐름의 한 조각입니다.\n\n**위험 신호**\n\n- DOE의 2027 회계연도 예산안에 기존 HALEU 라인 운영비가 빠졌습니다. 이 때문에 기술솔루션 수주잔고 약 8억 달러가 위험합니다.\n- 회사는 이 라인을 자기 돈으로 상업 운영하겠다며 DOE와 임대 연장을 협의 중입니다. 합의되리라는 보장은 없다고 회사가 직접 밝혔습니다.","gov_title":"정부가 이 회사를 쓰는 방법","events":[{"date":"2026-10-06","title":"구글 전력계약에 원전주 급등","detail":"구글–컨스텔레이션 3.6GW 전력계약 발표일(원전 증설분 890MW, 20년). 원전주 동반 급등. LEU와 직접 맺은 계약은 아님","move":"+8.8% (다음날 −4.4%)","close":"$153.88"},{"date":"2026-09-29","title":"연중 최저가","detail":"연중 최저가","move":"증자 후 하락 이어짐","close":"$138.18"},{"date":"2026-09-17","title":"안타레스 HALEU 계약","detail":"안타레스와 HALEU 다년 공급 확정계약 (선급금 포함, 국방용 가능한 '비의무' 농축)","move":"+7.8%","close":"$149.85"},{"date":"2026-09-09","title":"5억 달러 증자","detail":"5억 달러 증자: 보통주 50만 주 + 선지급 워런트 200만 주, 주당 $199.64 (워런트 포함). 행사가 $226.86~$362.98 워런트 699만 주 추가","move":"이틀간 −16%","close":"$165.87 → $152.31"},{"date":"2026-09-08","title":"라디안트 HALEU 계약","detail":"라디안트와 HALEU 다년 공급 확정계약 (선급금 포함)","move":"+6.7%","close":"$185.53"},{"date":"2026-09-03","title":"제프리스 보유 개시","detail":"제프리스 '보유' $169로 분석 시작","move":"−0.6%","close":"$170.46"},{"date":"2026-08-28","title":"우라늄·원전주 동반 하락","detail":"우라늄·원전주 동반 하락 (같은 날 CCJ −6%, OKLO −6%, URA −6%). 8월 랠리 뒤 차익실현이라는 분석. 회사 소식은 없음","move":"−9.8%","close":"$175.78"},{"date":"2026-08-05","title":"2분기 실적·X-에너지 계약","detail":"2분기 실적: 매출 1.76억 달러(+14%), 조정 주당 $1.77. 같은 날 X-에너지와 LEU·HALEU 확정계약. 단 DOE 운영계약 축소 공개","move":"8/6 −5.1%, 8/7 +7.5%","close":"$178.03 → $191.37"},{"date":"2026-07-01","title":"DOE 9억 달러 계약 공개","detail":"DOE와 9억 달러 HALEU 계약 서명 공개 (6월 30일 서명). 기존 HALEU 라인은 3개월 보관만 연장","move":"−0.9%","close":"$166.34"},{"date":"2026-06-18","title":"오클로 공급 의향서","detail":"오클로와 HALEU 공급 의향서 (최대 5기, 2029년 시작, 구속력 없음)","move":"+12.4%","close":"$191.39"},{"date":"2026-06-16","title":"UBS 목표가 하향","detail":"UBS 목표가 $195 → $170 (인건비 증가)","move":"−6.3%","close":"$165.47"},{"date":"2026-06-05","title":"원전주 동반 급락","detail":"우라늄·원전주 동반 급락일 (같은 날 OKLO −11%, SMR −13%, CCJ −9%, URA −10%). 회사 소식은 없었고, 섹터 하락의 계기는 확인 못함. 이후 6월 10일 $146.61까지 하락","move":"−13.3%","close":"$161.78"},{"date":"2026-05-06","title":"1분기 실적","detail":"1분기 실적: 조정 주당 $1.05(예상 $0.33), 매출 가이던스 4.5억~5억 달러로 상향","move":"+12.3% 후 −10.8%","close":"$231.32 → $206.30"},{"date":"2026-04-22","title":"가이거 브라더스 선정","detail":"파이크턴 증설 시공사로 가이거 브라더스 선정 발표 (계약은 4월 16일, 최대 9억 달러). 같은 날 백악관의 우주 원자력 추진 지시로 원전주 동반 강세","move":"+13.3%","close":"$217.08"},{"date":"2026-02-11","title":"4분기 실적 실망","detail":"4분기 실적 예상 하회(주당 $0.79 vs 예상 $1.63), 2026년 매출 가이던스 4.25억~4.75억 달러로 사실상 정체","move":"−20.7%, −11.9%","close":"$210.16 → $185.20"},{"date":"2026-01-28","title":"연중 최고가","detail":"연중 최고가","move":"고점","close":"$337.76"},{"date":"2026-01-23","title":"오크리지 확장 발표","detail":"오크리지 원심분리기 공장 5.6억 달러 확장 발표","move":"−2.0%","close":"$296.19"},{"date":"2026-01-08","title":"로스 중립 의견","detail":"로스 캐피털 '중립', 목표가 $125 (현재가보다 한참 아래)","move":"−11.4%","close":"$286.25"},{"date":"2026-01-05","title":"DOE 9억 달러 선정","detail":"DOE 27억 달러 농축 발주 중 9억 달러 선정 (기대치 17억 달러보다 적다는 BofA 평)","move":"+10.2%","close":"$300.41"}],"chart_events":["2026-01-05","2026-01-28","2026-02-11","2026-04-22","2026-06-05","2026-09-09"],"bull":["군사용(삼중수소·해군·군 마이크로원자로)에 쓸 수 있는 '비의무' 농축을 할 수 있는 배치 가능 기술은 AC100뿐이라고 회사는 설명합니다.","NNSA가 일부 농축을 수의계약하려는 의향을 밝혔고, 국방·우주용 원자로 회사(안타레스·라디안트)가 이미 고객입니다.","DOE 9억 달러 고정가 계약(옵션 포함 10.7억 달러). 끝나면 설비는 회사 것이 됩니다.","X-에너지(8월), 라디안트(9월 8일), 안타레스(9월 17일)와 확정계약. 두 계약에는 선급금이 들어 있어 '빚도 아니고 주식 희석도 아닌' 건설 자금이 됩니다.","오클로는 의향서 단계(최대 5기, 2029년부터).","수주잔고 45억 달러(2040년까지). 신규 공장 조건부 수주 30억 달러의 '자금 조달' 조건은 모두 풀렸고, 24억 달러는 확정 계약입니다.","2분기 매출 1.76억 달러는 예상(약 1.5억 달러)보다 14% 많았고 조정 주당이익 $1.77(예상 $0.75)이었습니다. 다른 원전 성장주(오클로·뉴스케일)와 달리 이미 매출과 이익이 있습니다.","6월 말 현금 18.7억 달러에 9월 증자 5억 달러가 더해졌습니다. 시가총액(약 29억 달러)에 가까운 현금입니다.","회사가 \"시장에 새 농축 능력이 더해지지 않아 판매자에게 유리하다\"고 말할 만큼 농축 가격 환경도 좋습니다.","블랙록 7.6% → 11.6%(8월 31일), 스테이트스트리트 10.2%, 밴에크 8.7%로 지분 보고가 연이어 늘었습니다 (주로 ETF·인덱스 자금).","한국수력원자력은 파이크턴 투자 검토 MOU와 물량 확대 계약을 맺었습니다.","AI 데이터센터 전력 수요로 원전주가 함께 오를 때 LEU도 크게 움직입니다 (10월 6일 +8.8%)."],"bear":["2027년까지 납품분의 절반 훨씬 넘게 TENEX(러시아 국영)에서 나옵니다. 미국 면제는 2027년 말 끝나고, 러시아도 수출을 건별 허가로만 내줍니다.","새 공장 첫 생산은 2029년 목표라 2028년에 물량 공백이 생길 수 있습니다. 회사도 \"다른 공급원으로는 다 대체 못 한다\"고 적었습니다.","9월 증자로 실제 주식 약 250만 주(선지급 워런트 포함)가 늘었습니다. 6월 말 주식 수(약 1,995만 주)의 약 13%입니다.","여기에 행사가 $226.86~$362.98 워런트 699만 주(약 35%)가 떠 있습니다. 주가가 오르면 주식이 더 늘어납니다.","전환사채 12억 달러도 있습니다. 2.25% 사채(전환가 $97.50)는 이미 전환 가능 상태이고, 0% 사채(전환가 $229.62)는 주가가 오르면 희석이 됩니다. 2025년에는 수시 주식 발행(ATM)으로 5.2억 달러를 모았습니다.","희석은 피자를 더 많은 조각으로 나누는 것과 같습니다. 회사 가치가 그만큼 커지지 않으면 한 주의 몸이 줄어듭니다.","DOE는 기존 HALEU 운영 계약의 추가 옵션을 쓸 생각이 없고, 2027 회계연도 예산안에도 없습니다. 수주잔고 약 8억 달러가 위험하고, 2분기 기술솔루션 매출은 이미 21% 줄었습니다.","1월 DOE 선정액 9억 달러는 회사 기대(17억 달러)보다 작았다는 평가가 있었습니다 (BofA).","2분기 SWU 판매가는 3% 올랐지만 원가는 13% 올랐습니다. 순이익은 전년보다 42% 줄었습니다.","2026년 매출 가이던스 4.5억~5억 달러는 2025년과 비슷한 수준입니다. 분기 매출은 납품 시기에 따라 크게 흔들립니다 (1분기 0.77억 vs 2분기 1.76억 달러).","상반기 영업현금흐름은 −1,670만 달러였고 올해 투자 3.5억~5억 달러가 나갑니다.","주가수익비율(PER)이 과거 이익 기준 약 66배, 내년 예상 기준 약 38배입니다.","유통 주식의 약 28%가 공매도 상태입니다. 하락에 건 돈이 많다는 뜻입니다.","오라노(테네시 신규 공장 추진)·우레코(뉴멕시코 증설) 등 경쟁사도 미국 내 농축을 늘리려 합니다.","회사의 2025년 10-K(2026년 2월)도 '2013년 파두카 폐쇄 이후 국방 요건에 맞는 국내 농축 능력은 없다'고 적어, 지금의 시범 라인을 국방용 능력으로 치지 않습니다. GAO(미 회계감사원) 보고서를 인용한 8월 25일 기사(Discovery Alert)는 \"파이크턴에 설치된 원심분리 장비에 외국산 부품이 들어 있어 국방용으로 쓸 수 없다\"고 적었습니다. GAO 원문은 확인 못함입니다."],"analysts_md":"증권사 17곳의 평균 목표가는 $247.40(현재가 대비 약 +74%)입니다. 하지만 절반 가까이가 '중립·보유'이고, 2026년 내내 목표가가 내려갔습니다. 가장 낮은 목표가($169)도 지금 주가보다는 높습니다.\n\n| 날짜 | 증권사 | 의견 | 목표가 | 현재가 대비 |\n|---|---|---|---|---|\n| 9월 28일 | Zacks | '보유' → '강력 매수' | – | – |\n| 9월 11일 | Northland | – | $270 | +90% |\n| 9월 3일 | Jefferies | 보유 (신규) | $169 | +19% |\n| 8월 25일 | Stifel | 매수 | $246 → $216 | +52% |\n| 8월 19일 | UBS | 중립 | $170 → $185 | +30% |\n| 8월 18일 | Barclays | 비중유지 (신규) | $207 | +46% |\n| 8월 7일 | Needham | 매수 | $264 → $262 | +84% |\n| 8월 7일 | JPMorgan | 중립 | $178 → $180 (7월 말 $236에서 하향) | +27% |\n| 8월 6일 | Roth | 중립 | $188 (1월 $125에서 상향) | +32% |\n| 7월 27일 | HC Wainwright | 매수 | $300 | +111% |\n| 7월 13일 | Truist | 매수 (신규) | $215 | +51% |\n| 7월 9일 | BofA | 중립 | $240 → $205 (1월엔 $340) | +44% |\n| 5월 8일 | Citi | 중립 | $224 → $218 | +53% |\n| 4월 24일 | B. Riley | 매수 | $315 → $295 | +108% |\n| 1월 5일 | Evercore | 시장수익률 상회 | $390 (오래된 수치) | +174% |\n\n목표가는 '이 회사가 계획대로 공장을 짓는다면'이라는 전제를 깔고 있습니다. 대부분 9월 증자 이전에 나온 숫자라는 점도 감안해야 합니다.","insider_title":"내부자·유명인 매매 (2025~)","insider_md":"2025년 1월 이후 센트러스 임원·이사의 장내 매수는 한 건도 없습니다. 장내 매도도 4건, 합계 약 112만 달러로 작습니다. Form 4의 나머지 거래 39건은 주식 보상 지급(A) 18건, 세금 납부용 자동 차감(F) 20건, 보상 주식 전환(M) 1건입니다. 현재가는 $142.09 (2026년 10월 8일 종가)입니다.\n\n**내부자 매수 (SEC Form 4 장내 매수)**\n\n| 누가 | 역할 | 날짜 | 수량 | 매수가 | 금액 | 현재가 대비 |\n|---|---|---|---|---|---|---|\n| 없음 | – | 2025년 1월~2026년 10월 | – | – | – | – |\n\n**내부자 매도 (전체)**\n\n| 날짜 | 누가 | 수량 | 매도가 | 금액 | 현재가 대비 |\n|---|---|---|---|---|---|\n| 2026년 5월 11일 | 토드 티넬리 (CFO) | 306주 | $203.55 | 약 6.2만 달러 | −30.2% |\n| 2025년 5월 30일 | 케빈 해릴 (당시 CFO, 8월 퇴사) | 1,728주 | $126.00 | 약 21.8만 달러 | +12.8% |\n| 2025년 5월 13일 | 존 도넬슨 (영업·마케팅 SVP) | 3,732주 | $96.31 | 약 35.9만 달러 | +47.5% |\n| 2025년 2월 12일 | 래리 컷립 (현장운영 SVP) | 4,000주 | $120.31 | 약 48.1만 달러 | +18.1% |\n\n네 건 모두 사전 매도 계획(10b5-1) 표시가 없습니다. 평균 매도가는 약 $114이고, 금액이 작아서 의미 있는 신호로 보기는 어렵습니다. 반대로 주가가 연초 대비 절반 아래로 내려왔는데도 경영진이 자기 돈으로 산 기록은 없습니다.\n\n**경영진 보상 구조 (참고)**\n\n- 2026년 8월 15일 이사회는 경영진에게 성과조건부 주식(성과 RSU)을 특별 지급했습니다.\n- 벡슬러 CEO는 파이크턴 새 라인에서 '첫 농축'에 성공해야 100% 받습니다. 다른 임원은 첫 라인 완공 때 30%, 첫 농축 때 70%입니다. 비용 조건도 붙어 있습니다.\n\n**유명인·유명 펀드**\n\n- 펠로시를 포함한 의회 의원: Quiver Quantitative에 LEU 거래 기록이 없습니다.\n- 트럼프 OGE 278-T: 2026년 9월 8일 제출 보고서에 트럼프의 제3자 위탁운용 계좌가 LEU를 7월 17일 사고 7월 29일 판 기록이 있습니다 (아래 표). 금액은 범위로만 공개되고 가격은 나오지 않습니다.\n- 대형 기관의 지분 보고(13G)는 아래와 같습니다. 13G에는 매수 가격이 나오지 않아서, 해당 기간의 주가 범위로 대신했습니다.\n\n**트럼프 계좌의 LEU 거래 (OGE 278-T, 2026년 9월 8일 보고서)**\n\n| 날짜 | 거래 | 금액 범위 | 당일 종가 | 현재가 $142.09 대비 |\n|---|---|---|---|---|\n| 2026년 7월 17일 | 매수 (센트러스 Class A) | $15,001~50,000 | $156.05 | −8.9% |\n| 2026년 7월 29일 | 매도 | $15,001~50,000 | $159.69 | −11.0% |\n\n12일 만에 사고판 소액 거래입니다. 종가 기준으로 보면 매수가보다 약 2% 높게 팔았고, 지금 주가는 두 가격보다 모두 낮습니다. 위탁운용 계좌라 트럼프 본인이 직접 고른 거래인지는 알 수 없습니다.\n\n**대주주 신고 (13G/13D)**\n\n| 기관 | 지분 변화 (기준일) | 늘린 기간 주가 | 현재가 대비 |\n|---|---|---|---|\n| 블랙록 | 7.6% → 11.6% (6월 30일 → 8월 31일), +80만 주 | 7~8월 $147~$195 | 약 −20~25% 손실 구간 |\n| 스테이트스트리트 | 7.4% → 8.6% → 10.2% (3월 31일 → 8월 31일) | 4~8월 $147~$231 | 손실 구간 |\n| 밴에크 | 5.1% → 6.4% → 8.7% (2025년 말 → 6월 30일) | 1~6월 $146~$338 | 손실 구간 |\n| 뱅크 오브 노바스코샤 | 4.4% → 6.9% (6월 30일) | – | – |\n| 뱅가드 캐피털 매니지먼트 | 5.0% 신규 (6월 30일) | – | – |\n| D.E. Shaw (헤지펀드) | 5.6% → 2.0% (1월 7일 → 3월 31일), 대부분 매도 | 1~3월 $168~$338 | 현재가보다 높게 팔았을 가능성 |\n| 글로벌 X (우라늄 ETF 운용사) | 6.41% (3월 31일) | 1~3월 $169~$338 | 손실 구간 |\n\n눈에 띄는 매수자는 대부분 ETF·인덱스 운용사(블랙록·스테이트스트리트·밴에크·글로벌 X)입니다. 우라늄·원자력 ETF에 돈이 들어오면 자동으로 늘어나는 지분이라, '대가의 판단'으로 읽기는 어렵습니다.","next_md":"| 시기 | 확인할 것 | 왜 중요한가 |\n|---|---|---|\n| 2026년 11월 초 (예상) | 3분기 실적 | 연간 매출 4.5억~5억 달러 유지 여부, 마진, 9월 증자 후 주식 수 |\n| 2026년 10월 이후 | 기존 HALEU 라인 상업 운영·부지 임대 연장 DOE 합의 | 9월 30일 보관 연장이 끝났음. 합의 안 되면 단기 HALEU 공급 공백 |\n| 2026년 내 | NNSA 수의계약, DOE LEU 생산 과제 추가 발주 | 국방용 수요가 실제 계약으로 바뀌는지 |\n| 2026년 내 | 오크리지 첫 원심분리기 완성, 핵심 협력사 계약 100% | 공급망이 실제로 돌아가는지 |\n| 2026년 12월 | 파이크턴 현장 투자자의 날 | 증설 규모·일정·비용 구체화 여부 |\n| 수시 | 오클로 의향서의 확정계약 전환, 추가 선급금 계약 | 희석 없는 건설 자금 |\n| 수시 | 한국수력원자력·포스코인터 투자 MOU의 실제 투자 전환 | 동맹 자금 유입 |\n| 2027 회계연도 예산 (의회) | DOE HALEU 예산 복구 여부 | 기술솔루션 수주잔고 약 8억 달러 |\n| 2027년 내 | TENEX 신규 판매분 면제 결정, 러시아 건별 수출 허가 | 2027년까지 납품분의 절반 이상이 러시아산 |\n| 2027년 12월 31일 | 미국 면제 기한·러시아 수출 제한 동시 만료 | 2028년 물량 공백 여부 |\n| 2028년 9월~ | 첫 워런트 시리즈(행사가 $226.86) 1차 만기 | 주가가 행사가를 넘으면 주식 수 증가 |\n| 2029년 | 파이크턴 새 농축 능력 첫 가동 (목표) | 강세론의 핵심. 늦어지면 약세론 강화 |\n| 2032년 3월 | DOE 계약 HALEU 1톤 납품 기한 | 9억 달러 계약 완료 조건 |","glossary_md":"| 용어 | 뜻 |\n|---|---|\n| 농축 | 우라늄에서 불타는 성분(우라늄-235) 비율을 높이는 일 |\n| LEU (저농축 우라늄) | 불타는 성분 5% 미만. 지금 원전들의 연료. 회사 티커도 여기서 나옴 |\n| HALEU (고농축 저농축 우라늄) | 불타는 성분 5~20%. 차세대 소형 원자로 연료 |\n| SWU (분리작업단위) | 농축에 든 '일의 양'. 농축 서비스 가격의 단위 |\n| 원심분리기 | 아주 빠르게 돌며 무거운 성분과 가벼운 성분을 갈라내는 기계. 여러 대를 이은 줄을 '캐스케이드'라 부름 |\n| 비의무(unobligated) 농축 | 외국과의 '평화적 사용' 약속에 묶이지 않아 군사용에도 쓸 수 있는 농축 |\n| 삼중수소(트리티움) | 핵무기에 들어가는 물질. 미국은 TVA 원전에서 만듬 |\n| TENEX | 러시아 국영 원자력기업 로사톰 자회사. 센트러스의 주 공급원 |\n| 면제(waiver) | 수입 금지 예외를 허락하는 DOE 결정. 2027년 말까지만 가능 |\n| 무기한 계약(IDIQ) | 금액·수량을 정하지 않고 필요할 때 과제를 발주하는 정부 계약 틀 |\n| 전환사채 | 나중에 정해진 가격(전환가)으로 주식으로 바꿀 수 있는 빚 |\n| 워런트 | 정해진 가격(행사가)에 새 주식을 살 수 있는 권리. 선지급 워런트는 거의 다 미리 낸 것 |\n| ATM 발행 | 시장 가격으로 주식을 조금씩 수시로 팔아 돈을 모으는 방식 |\n| 희석 | 새 주식이 늘어 기존 주주의 지분 비율이 줄어드는 것 |\n| 13G | 지분 5% 이상을 가진 '경영 참여 의도 없는' 투자자가 SEC에 내는 보고서 |\n| 수주잔고 | 계약은 했지만 아직 매출로 잡지 않은 일감의 총액 |","sources":[{"t":"SEC: 센트러스 2026년 2분기 실적 보도자료 (8-K Ex.99.1)","u":"https://www.sec.gov/Archives/edgar/data/0001065059/000162828026053433/ex991-10q2026_08x05.htm"},{"t":"SEC: 2026년 2분기 10-Q","u":"https://www.sec.gov/Archives/edgar/data/0001065059/000162828026053863/leu-20260630.htm"},{"t":"SEC: 2025년 연차보고서 10-K","u":"https://www.sec.gov/Archives/edgar/data/1065059/000162828026007117/leu-20251231.htm"},{"t":"SEC: DOE 9억 달러 HALEU 계약 8-K와 7월 1일 보도자료","u":"https://www.sec.gov/Archives/edgar/data/1065059/000162828026046801/ex991_haleu900mpr.htm"},{"t":"SEC: 5억 달러 증자·워런트 가격 결정 (9월 9일)","u":"https://www.sec.gov/Archives/edgar/data/0001065059/000110465926107103/tm2625019d5_ex99-2.htm"},{"t":"SEC: 안타레스 HALEU 계약 보도자료 (9월 17일)","u":"https://www.sec.gov/Archiv },"mc":2597749290.7725525},{"ticker":"MP","company":"MP Materials","name_ko":"엠피 머티리얼즈","category":"미국우선","field":"희토류","doc_url":"https://claude.ai/code/artifact/258aba87-4880-4783-979b-0c9da7de70a9","lead":"MP 머티리얼즈는 미국에서 유일하게 대규모로 희토류를 캐고 정제하는 회사이고, 2025년 7월부터는 미국 국방부가 최대주주인 '국가 대표 희토류 회사'입니다. 실적은 좋아지고 있지만 주가는 5월 고점에서 약 36% 내려왔습니다. 중국과의 희토류 휴전 기대, 텍사스 자석 공장 지연 보도, CEO의 대량 매도가 겹친 결과입니다.","glance":[["상장","미국 NYSE (티커 MP)"],["현재가","$46.14"],["시가총액","약 82억 달러 (약 11조 원)"],["2026년 고점 / 저점","$72.65 (5월 6일) / $38.10 (7월 29일)"],["고점 대비","−36.5% (연초 $54.97 대비 −16.1%)"],["매출 (최근 12개월)","약 4.16억 달러, 1년 전보다 약 2.2배. 별도로 국방부 가격보장금 상반기 5,990만 달러"],["2분기 실적","매출 1.08억 달러(+89%), 순손실 2,030만 달러, 조정 EBITDA +2,850만 달러"],["현금 / 빚","현금·단기투자 14.5억 달러 / 장기부채 9.35억 달러"],["정부 개입","국방부 4억 달러 우선주 + 워런트 → 최대주주(약 15%). NdPr 최저가 $110/kg 10년 보장, 자석 100% 구매 10년 보장, 1.5억 달러 대출"],["국방 필수도","매우 높음. 전투기·미사일·드론 모터용 희토류 자석의 미국 내 유일한 '광산→자석' 회사"],["내부자 동향","CEO 리틴스키 2025~2026년 약 450만 주(약 2억 달러) 매도. COO 로젠탈은 2026년 5~6월 $54~57에 2.7만 주 매수"],["공매도 비율","유통주식의 약 20.5% (높은 편)"],["증권사 평균 목표가","$72.71 (17명, 범위 $53~100). 현재가 대비 약 +58%"],["다음 실적 발표","2026년 10월 29일 (3분기, 일정 사이트 기준. 회사 공식 발표는 확인 못함)"]],"overview_md":"한 줄 판단: 강세론은 '정부가 가격과 판매를 보장해 주는 회사'라는 점을, 약세론은 '자석 공장이 2028년에야 본격 가동되고 그 사이 미·중 관계와 내부자 매도가 주가를 누른다'는 점을 봅니다.\n\n#### 기업 개요: 이 회사는 무엇을 하나\n\nMP 머티리얼즈는 땅에서 희토류 광석을 캐고, 그것을 정제해 금속으로 만들고, 마지막에 자석까지 만드는 회사입니다. 본사는 미국 네바다주 라스베이거스, 직원은 약 1,000명입니다.\n\n1. **희토류와 자석**\n  - 희토류는 17가지 금속을 묶어 부르는 말입니다. 이 회사의 핵심 제품은 네오디뮤과 프라세오디뮤을 합친 **NdPr**입니다.\n  - NdPr로 만든 자석(NdFeB 자석)은 전기차 모터, 로봇, 드론, 전투기, 미사일에 들어갑니다. 냉장고 자석보다 훨씬 강한 자석입니다.\n  - 전 세계 희토류 정제와 자석 생산의 대부분을 중국이 합니다. 그래서 중국이 수출을 막으면 미국 공장과 무기 생산이 멈출 수 있습니다.\n2. **마운틴패스 광산 (캘리포니아)**\n  - 미국에서 유일하게 대규모로 운영되는 희토류 광산 격 정제 공장입니다. X에서는 \"세계 희토류 공급의 10% 이상\"이라는 평가가 나옵니다.\n  - 2017년 현 CEO 제임스 리틴스키가 파산한 광산을 사들여 지금의 회사를 만들었습니다.\n  - 예전에는 광석 가루(정광)를 중국 성허자원에 팔았지만, 2025년 7월 중국 판매를 멈추고 2026년 1월 계약을 끝냈습니다.\n3. **인디펜던스 공장 (텍사스 포트워스)**\n  - 2025년 1월 문을 연 금속·자석 공장입니다. 2025년 12월부터 자석을 만들기 시작했고, 지금은 고객 인증(품질 시험)용 자석을 보내는 단계입니다.\n  - 첫 대형 고객은 GM입니다. 애플은 2025년 7월 15일 재활용 자석 5억 달러어치를 사기로 약속했습니다.\n4. **10X 공장 (텍사스, 건설 중)**\n  - 국방부 계약에 따라 짓는 두 번째 자석 공장입니다. 완공하면 미국 내 자석 생산 능력이 연 약 1만 톤이 됩니다. 가동은 2028년 예정입니다.\n\n#### 돈 버는 구조: 지금은 NdPr 산화물, 앞으로는 자석\n\n지금 매출의 약 85%는 광산에서 정제한 NdPr을 파는 데서 나옵니다. 자석 사업은 아직 준비 비용이 더 큰 단계입니다. 여기에 국방부가 NdPr 가격이 $110/kg보다 낮으면 차액을 채워 주는 '가격보장금'이 더해집니다.\n\n| 사업 | 하는 일 | 2026년 2분기 숫자 | 상태 |\n|---|---|---|---|\n| 소재 (Materials) | 광석 채굴 → NdPr 산화물·금속 생산 | 매출 9,560만 달러(+155%), NdPr 생산 840톤(+41%), 판매 1,006톤(+127%) | 주력 매출원 |\n| 자석 (Magnetics) | 포트워스에서 NdPr 금속·자석 제조 | 매출 1,650만 달러(−17%), 가동 준비비 1,440만 달러 | 고객 인증 단계 |\n| 국방부 가격보장금 | NdPr 시장가가 $110/kg 아래면 차액 지급 | 1,760만 달러 (상반기 5,990만 달러) | 2025년 4분기부터, 10년간 |\n| 중희토류 분리 | 디스프로슘·테르븄·가돌리늄 뽑기 | 2분기에 미국 항공·방산 고객과 가돌리늄 장기 공급 계약 | 2026년 시운전 시작 |\n| 드론용 자석 (Project Swarm) | 드론 회사들의 수요를 모아 규격화 | 미국·동맹국 고객 여러 곳과 구독 계약 | 2분기 시작 |\n\n쉽게 비유하면\n\n- MP는 '밀가루 공장'(광산·정제)으로 돈을 벌면서, '빵집'(자석 공장)을 새로 키우는 중입니다.\n- 다른 점은 밀가루 가격이 너무 떨어지면 정부가 차액을 보전해 주고, 빵집에서 만들 빵(10X 공장 자석)도 10년간 다 팔리도록 정부가 보장한다는 점입니다.\n\n재무 상태 (2026년 6월 말)\n\n- 2분기 매출 1.08억 달러는 1년 전보다 89% 늘었고, 1분기(9,070만 달러)보다도 늘었습니다.\n- 회계상으로는 순손실 2,030만 달러(주당 −$0.11)이지만, 일회성 비용을 빼면 거의 손익분기점(주당 −$0.01)입니다.\n- 조정 EBITDA는 +2,850만 달러로 1년 전(−1,250만 달러)에서 흑자로 돌아섰습니다. 다만 이 중 약 62%가 정부 가격보장금입니다.\n- 현금·단기투자는 14.5억 달러로, 연초(18.3억 달러)보다 줄었습니다. 상반기 설비투자가 3.08억 달러였기 때문입니다.\n\n#### 앞으로의 숫자\n\n| 항목 | 목표·예정 | 비고 |\n|---|---|---|\n| 미국 내 자석 생산 능력 | 연 약 1만 톤 (인디펜던스 + 10X) | 10X 가동 2028년 예정 |\n| 10X 공장 판매 | 생산량 100%를 국방·민간 고객이 사도록 국방부가 보장, 10년 | 2025년 7월 계약 |\n| 10X 건설 자금 | JP모건·골드만삭스 10억 달러 대출 확약 | 회사 발표 |\n| NdPr 최저가 | $110/kg, 10년 | 시장가가 낮을수록 보장금이 커짐 |\n| 애플 재활용 자석 | 5억 달러 어치 구매 약속 | 마운틴패스·포트워스에 재활용 설비 확충 |\n| 회사 가이던스 | 2분기 발표에 숫자 가이던스 없음 | 투자자가 일정을 직접 확인해야 함 |","gov_md":"미국 정부는 MP를 '중국 없이 희토류 자석을 만드는 국가 대표 회사'로 쓰고 있습니다. 다른 희토류 회사들은 대출이나 규제 완화로 도움을 받지만, MP는 국방부가 직접 주주가 되고 가격과 판매까지 보장해 주는 것이 다릅니다.\n\n#### 2025년 7월 10일 국방부 계약의 내용\n\n| 항목 | 내용 | 쉽게 말하면 |\n|---|---|---|\n| 우선주 투자 | 4억 달러. 보통주로 바꾸는 가격 $30.03 | 국방부의 '매수가'는 약 $30. 현재가 $46.14는 그보다 약 54% 높음 |\n| 워런트 | 추가 주식을 $30.03에 살 수 있는 권리 | 우선주와 합치면 지분 약 15%, 최대주주 |\n| NdPr 최저가 | $110/kg, 10년 | 시장가가 낮아도 정부가 차액을 채워 줌. 2026년 상반기에만 5,990만 달러 받음 |\n| 10X 자석 공장 판매 보장 | 공장 완공 후 10년간 생산량 100%를 국방·민간 고객이 사도록 보장 | 만들기만 하면 팔 곳이 정해져 있음 |\n| 대출 | 1.5억 달러 (2025년 8월) | 마운틴패스 중희토류 분리 설비 확장용 |\n| 민간 자금 | JP모건·골드만삭스 10억 달러 대출 확약 | 10X 공장 건설비 |\n\n발표 당일 주가는 약 50% 올랐습니다. 국방부 차관 스티브 파인버그가 이 계약을 주도했습니다.\n\n#### 미·중 경쟁과 연결\n\n| 목적 | 정부가 한 일 | MP의 역할 |\n|---|---|---|\n| 중국 희토류 무기화에 대응 | 중국이 2025년 4월·10월 희토류 수출 통제. 미국은 MP 지분 투자로 맞대응 | 미국 내 '광산→정제→금속→자석' 전 과정을 갖춘 유일한 회사 |\n| 무기용 자석 공급망 | 국방 조달 규정 DFARS 252.225-7052: 2027년 1월 1일부터 중국·러시아·북한·이란에서 채굴·정제·분리·생산된 희토류 자석(NdFeB·SmCo)과 텅스텐·탄탈을 국방 계약에 납품 금지. 광산부터 완성 자석까지 공급망 전체가 대상 | 10X 공장 자석의 판매 보장, 가돌리늄 방산 공급 계약 |\n| 광물 비축 | 2026년 2월 2일 트럼프, 120억 달러 규모 '프로젝트 볼트' 발표 (수출입은행 대출 100억 달러) | 비축 수요가 늘면 미국산 NdPr 수요 증가 기대 |\n| 드론·동맹국 공급 | 동맹국과 함께 비중국 공급망 구축 | Project Swarm으로 미국·동맹국 드론 회사에 자석 공급 계약 |\n| 경쟁사도 지원 | 2026년 1월 USA Rare Earth에 16억 달러 투자 발표 | MP만의 독점이 아니라는 신호 (당일 MP −8.8%) |\n\n#### 중국의 반격\n\n- 2026년 6월 22일 중국 상무부는 MP와 USA Rare Earth를 수출통제 명단에 올렸습니다. 중국 기업은 군사·민간 겸용 물품을 이 두 회사에 보낼 수 없고, 다른 나라 기업도 중국산 겸용 물품을 넘길 수 없습니다.\n- 2026년 9월 18일 로이터는 중국 국유기업 중국희토그룹이 성허자원 인수를 협상 중이라고 보도했습니다. 성허자원은 MP 지분 약 3%를 갖고 있어, 성사되면 중국 정부가 MP 지분을 간접 보유하게 됩니다. MP는 \"성허도 중국 정부도 우리 경영에 영향력이 없다\"는 입장입니다. 당일 주가는 −4.3%였습니다.\n- 2025년 10월 부산 미·중 정상회담 뒤 휴전이 있었지만, 2026년 9월에도 미국 측은 \"중국이 희토류를 충분히 공급하지 않는다\"고 말했습니다.\n\n핵심 구조: 미·중 긴장이 커지면 MP의 전략적 가치가 오르고, 휴전·공급 재개 기대가 커지면 주가가 내리는 패턴이 2025~2026년 내내 반복됐습니다. 다만 NdPr 가격이 떨어져도 $110/kg 최저가가 있어 실적 타격은 과거보다 작습니다.","gov_title":"정부가 이 회사를 쓰는 방법","events":[{"date":"2026-10-07","title":"모건스탠리 목표가 하향","detail":"모건스탠리 목표가 $73 → $66 하향. 희토류 섹터 동반 매도","move":"−4.6%, $46.31"},{"date":"2026-10-01","title":"베어드 목표가 하향","detail":"베어드 목표가 $80 → $65 하향. 섹터 전반 매도","move":"−2.5%, $46.09"},{"date":"2026-09-18","title":"성허 인수 협상 보도","detail":"로이터: 중국희토그룹이 MP 지분 약 3% 보유한 성허자원 인수 협상","move":"−4.3%, $47.26"},{"date":"2026-09-10","title":"미·중 해빙 기대","detail":"미·중 관계 해빙 기대로 희토류주 일제히 하락","move":"−5.5%, $51.32"},{"date":"2026-08-21","title":"가격보장 재평가 급반등","detail":"뚜렷한 회사 발표 없이 급반등. 정부 가격보장 효과 재평가","move":"+9.1%, $60.05 (8월 고점)"},{"date":"2026-08-06","title":"2분기 실적 발표","detail":"2분기 실적: 매출 1.08억 달러(+89%), 조정 EBITDA 2,850만 달러, 가격보장금 1,760만 달러","move":"8월 6일 −0.9%, 8월 7일 +7.6% ($51.11)"},{"date":"2026-07-30","title":"금속·광산주 반등","detail":"이틀간 10% 넘게 빠진 뒤 금속·광산주와 함께 반등","move":"+9.3%, $41.66"},{"date":"2026-07-29","title":"10X 2028년 가동","detail":"업계 보고서: 텍사스 10X 자석 공장 생산은 2028년부터. 도이체방크 목표가 $70 → $61","move":"7월 29일 연중 최저 $38.10"},{"date":"2026-07-09","title":"목표가 연속 하향","detail":"도이체방크·바클레이즈·니덤·JP모건이 잇따라 목표가 하향","move":"7월 한 달 약 −22%"},{"date":"2026-06-22","title":"중국 수출통제 명단","detail":"중국 상무부, MP와 USA Rare Earth를 수출통제 명단에 올림","move":"주간 $60.88 → $53.90 (−11%)"},{"date":"2026-06-05","title":"CEO 추가 매도 예고","detail":"CEO 리틴스키 5월 말 35만 주 매도에 이어 25만 주 추가 매도 예고. 광산주 동반 약세","move":"−9.6%, $59.18"},{"date":"2026-05-21","title":"바클레이즈 비중확대","detail":"바클레이즈 신규 '비중확대', 목표가 $69. 희토류주 동반 강세","move":"5월 21일 +9.3%, $61.74"},{"date":"2026-05-07","title":"1분기 실적 발표","detail":"1분기 실적: 매출 9,060만 달러(+49%), 조정 EBITDA 3,660만 달러, 가격보장금 4,230만 달러, 조정 주당순이익 +$0.03(예상 −$0.01). 다음 날 웨드부시 목표가 $100","move":"5월 7일 −4.8% ($69.13), 5월 8일 −2.5% ($67.43)"},{"date":"2026-05-06","title":"연중 최고가","detail":"연중 최고가","move":"+6.7%, $72.65"},{"date":"2026-04-08","title":"미·이란 휴전 급등","detail":"4월 7일 밤 미·이란 휴전 발표로 시장 전체 급등 (다우 개장 직후 +2.8%, 유가 −16%). MP만의 뉴스는 확인 못함","move":"+10.0%, $54.44"},{"date":"2026-03-30","title":"원인 불명 급락","detail":"원인 확인 못함 (회사 발표·애널리스트 의견 변화 보도 없음). 다음 날 +5.9% 반등","move":"−12.0%, $45.59"},{"date":"2026-02-02","title":"프로젝트 볼트 발표","detail":"트럼프, 120억 달러 '프로젝트 볼트' 핵심광물 비축 계획 발표","move":"2월 3일 +9.3%, $64.61"},{"date":"2026-01-26","title":"경쟁사 정부 투자","detail":"미국 정부, 경쟁사 USA Rare Earth에 16억 달러 투자 발표","move":"−8.8%, $63.44"},{"date":"2026-01-02","title":"연초 희토류 강세","detail":"연초 희토류 테마 강세","move":"$54.97 → $69.58 (+27%)"}],"chart_events":["2026-05-06","2026-06-05","2026-06-22","2026-07-29","2026-08-06","2026-09-18"],"bull":["**정부가 바닥을 받쳐 줌** NdPr 가격이 $110/kg보다 낮으면 국방부가 차액을 줍니다. 2026년 상반기에만 5,990만 달러를 받았습니다. 10X 공장 자석은 10년간 100% 팔리도록 보장됩니다. 보통 광산 회사는 가격과 판매량이 모두 불확실한데, MP는 둘 다 일부 보장됩니다. 국방부의 매수 단가는 $30.03입니다. 최대주주가 손해를 보지 않도록 정책이 계속 뒷받침할 것이라는 기대가 있습니다.","**실적이 실제로 좋아지는 중** 2분기 매출 +89%, NdPr 판매량 +127%(1,006톤), 생산량 +41%(840톤). 조정 EBITDA가 1년 전 −1,250만 달러에서 +2,850만 달러로 돌아섰습니다.","**2027년 1월 국방 조달 규제** 이때부터 미국 무기에 중국산 희토류 자석을 쓰기 어려워집니다. X에서는 \"2027년까지 국산 희토류 구매 의무\"를 핵심 호재로 꼽았습니다.","**대형 고객 확보** 애플 5억 달러 재활용 자석 계약, GM 자석 계약, 미국 항공·방산 고객과 가돌리늄 장기 계약(2026년 2분기), 드론용 Project Swarm. 백악관이 '자석'을 다음 핵심 산업으로 본다는 글이 9월 X에서 많이 공유됐습니다.","**중국이 압박할수록 가치가 오름** 중국은 6월 MP를 수출통제 명단에 올렸고, 9월에는 국유기업이 희토류 회사를 더 묶고 있습니다. 미국 입장에서는 '중국 밖 공급원'의 필요성이 커집니다.","**현금 여유와 내부자 매수** 현금·단기투자 14.5억 달러. COO 로젠탈이 2026년 5~6월 $54~57에 자기 돈으로 2.7만 주를 샀습니다. 증권사 평균 목표가 $72.71은 현재가보다 약 58% 높습니다."],"bear":["**비싼 값** 시가총액 82억 달러는 최근 12개월 매출 4.16억 달러의 약 20배입니다. 내년 예상 이익 기준 주가수익비율(PER)도 약 58배입니다. 회계상으로는 아직 적자입니다 (2분기 순손실 2,030만 달러).","**이익의 상당 부분이 정부 보조** 2분기 조정 EBITDA 2,850만 달러 중 약 62%(1,760만 달러)가 정부 가격보장금입니다. 시장 가격만으로는 아직 돈을 많이 못 벌고 있다는 뜻입니다.","**자석 사업은 아직 멀었음** 자석 부문 매출은 2분기 −17%였고, 가동 준비비는 1,440만 달러로 늘었습니다. 포트워스 자석은 아직 고객 인증 단계입니다. 7월 말 \"10X 공장 생산은 2028년부터\"라는 보도에 주가가 연중 최저로 떨어졌습니다. 상반기 설비투자 3.08억 달러로 현금이 연초 18.3억 → 14.5억 달러로 줄었습니다.","**CEO의 대량 매도** CEO 리틴스키는 2025년 2월~2026년 6월 약 450만 주, 약 2억 달러어치를 팔았습니다. CFO와 법무총괄도 팔았습니다.","**미·중 휴전이 악재** 2025년 10월 미·중 희토류 합의 때 하루 약 −11%, 2026년 9월 해빙 기대 때 −5%. 중국 희토류가 다시 싸게 들어오면 '미국산 프리미엄'이 줄 수 있습니다.","**경쟁사와 중국 지분 문제** 정부는 USA Rare Earth에도 16억 달러를 넣었습니다. MP만 밀어주는 것이 아닙니다. 성허자원의 MP 지분 약 3%가 중국 국유기업 손에 들어갈 수 있습니다. 중국이 이 지분을 시장에 팔 가능성도 거론됩니다.","**목표가 하향과 공매도** 7월 이후 JP모건($75→$60), 도이체방크($70→$61), 모건스탠리($73→$66), 베어드($80→$65) 등이 목표가를 낮췄습니다. Zacks는 8월 '강력 매도'로 내렸습니다. 유통주식의 약 20.5%가 공매도되어 있습니다. 주가가 떨어질 것에 돈을 건 투자자가 많다는 뜻입니다."],"analysts_md":"증권사 대부분은 여전히 '매수' 의견이고 평균 목표가는 $72.71(17명)입니다. 하지만 7월 이후에는 목표가를 올린 곳보다 내린 곳이 훨씬 많고, 최근 목표가는 $57~66 구간에 모여 있습니다.\n\n| 날짜 | 증권사 | 의견 | 목표가 | 현재가($46.14) 대비 |\n|---|---|---|---|---|\n| 10월 7일 | 모건스탠리 | 비중확대 | $73 → $66 | +43% |\n| 10월 1일 | 베어드 | 시장수익률 상회 | $80 → $65 | +41% |\n| 9월 16일 | 프리덤 브로커 | 보유 (신규) | $57 | +24% |\n| 9월 8일 | 제프리스 | 매수 유지 | – | – |\n| 8월 26일 | Zacks | 보유 → 강력 매도 | – | – |\n| 8월 24일 | DA 데이비슨 | 매수 | $82 | +78% |\n| 7월 29일 | JP모건 | 비중확대 | $75 → $60 | +30% |\n| 7월 22일 | 니덤 | 매수 | $81 → $73 | +58% |\n| 7월 16일 | 바클레이즈 | 비중확대 | $69 → $65 | +41% |\n| 7월 9일 | 도이체방크 | 매수 | $70 → $61 | +32% |\n| 5월 8일 | 캐나코드 제뉴이티 | 매수 | $79 → $82 | +78% |\n| 5월 8일 | 웨드부시 | 시장수익률 상회 | $90 → $100 (최고) | +117% |\n\n참고: MarketBeat 집계로는 18명 중 매수 15, 보유 1, 매도 2이고 평균 $75입니다. 매도 의견은 Zacks와 Weiss Ratings(D−)입니다.","insider_title":"내부자·유명인 매매 (2025~)","insider_md":"2025년 이후 내부자 장내 매수는 COO 한 사람의 2건, 약 151만 달러뿐입니다. 같은 기간 내부자 매도는 약 490만 주, 2.24억 달러로 매수의 약 150배입니다. 그중 약 90%가 CEO 한 사람의 매도입니다. 현재가는 $46.14 (2026년 10월 8일 종가)입니다.\n\n#### 내부자 매수 (SEC Form 4 장내 매수 전체)\n\n| 날짜 | 누가 | 직책 | 수량 | 매수가 | 금액 | 현재가 대비 |\n|---|---|---|---|---|---|---|\n| 2026년 6월 9일 | 마이클 로젠탈 | 최고운영책임자(COO) | 10,000주 | $54.30 | 약 54만 달러 | −15.0% |\n| 2026년 5월 20일 | 마이클 로젠탈 | 최고운영책임자(COO) | 17,000주 | $56.62 | 약 96만 달러 | −18.5% |\n\n참고: 로젠탈은 2025년 8월 29일에는 15만 주를 평균 $72.02(약 1,080만 달러)에 팔았습니다. 비싸게 팔고 싸게 다시 산 셈입니다.\n\n#### 내부자 매도 요약\n\n| 누가 | 시기 | 수량 | 평균 매도가 | 금액 | 미리 정한 매도 계획(10b5-1) | 현재가 대비 |\n|---|---|---|---|---|---|---|\n| 제임스 리틴스키 (회장 겸 CEO) | 2025년 2~4월 | 238.6만 주 | $26.40 | 약 6,300만 달러 | 예 | +75% |\n| 〃 | 2025년 11~12월 | 63.3만 주 | $63.30 | 약 4,010만 달러 | 아니오 | −27% |\n| 〃 | 2026년 1월·4월 | 60만 주 | $64.09 | 약 3,850만 달러 | 예 | −28% |\n| 〃 | 2026년 5월 12일~6월 3일 | 88.5만 주 | $66.27 | 약 5,870만 달러 | 아니오 | −30% |\n| 마이클 로젠탈 (COO) | 2025년 8월 | 15만 주 | $72.02 | 약 1,080만 달러 | 아니오 | −36% |\n| 라이언 코벗 (CFO) | 2025년 3월~2026년 5월 | 19.9만 주 | $48.40 | 약 960만 달러 | 대부분 예 | −5% |\n| 엘리엇 훅스 (법무총괄) | 2025년 6월~2026년 5월 | 5.3만 주 | $53.84 | 약 290만 달러 | 예 | −14% |\n\n읽는 법\n\n- CEO 리틴스키는 2025년 2월~2026년 6월 총 약 450만 주, 약 2억 달러를 팔았습니다. 이 중 2026년분은 약 149만 주, 약 9,700만 달러입니다. ('2026년에만 2억 달러'는 2025~2026년 합계를 잘못 읽은 것입니다.)\n- 2026년 5~6월 매도는 미리 정한 계획이 아닌 재량 매도였고, $64~71에 팔아 지금 기준으로 약 30% 비싼 값입니다. 6월 5일 주가 −9.6%의 원인 중 하나로 꼽혔습니다.\n- 리틴스키는 여전히 대주주입니다. 내부자 전체 지분은 약 19.6%입니다.\n- 반대로 COO는 $54~57에 샀고, 지금은 그보다 15~19% 낮습니다. 따라 사면 COO보다 싸게 사는 위치입니다.\n\n#### 유명인·정부·큰손\n\n| 누가 | 내용 | 매수가 | 현재가 대비 |\n|---|---|---|---|\n| 미국 국방부 | 2025년 7월 우선주 4억 달러 + 워런트, 약 15% 최대주주 | $30.03 (전환·행사 가격) | +54% |\n| 성허자원 (중국) | 3.1%(554.6만 주, 2025년 9월 30일 기준 13G/A). 중국희토그룹이 성허 인수 협상 중 (2026년 9월 18일 로이터) | 공개된 매수가 없음 (상장 전부터 보유) | – |\n| 트럼프 대통령 개인 | X의 \"2025년 1~5월 8번 매수\" 주장은 **거짓**. 2025년 8월~2026년 9월에 제출된 OGE 278-T 거래보고서 19건 전부(거래일 2025년 1월 6일~2026년 7월 31일, 스캔본은 문자인식으로 확인)를 검색했지만 MP 거래는 없음. 'MP 매수'는 국방부의 지분 투자를 가리킴 | 해당 없음 | – |\n| 펠로시 등 의회 의원 | 2025년 이후 MP 거래 기록 없음. 마지막 기록은 2022년 5월 토머스 수오지 하원의원 매수(1.5만~5만 달러) | – | – |\n\n#### 대주주 신고 (13G/13D, 2025년 이후)\n\n5% 넘게 가진 투자자는 SEC에 13G(단순 투자) 또는 13D(경영 관여 가능)를 냅니다. 매수 가격은 적지 않아 현재가 대비는 계산할 수 없습니다.\n\n| 제출일 | 서류 | 보유자 | 지분 | 주식 수 | 기준일 |\n|---|---|---|---|---|---|\n| 2026년 3월 27일 | 13G/A | 뱅가드 그룹 | 0% | 0 | 2026년 3월 13일 (뱅가드가 전 종목에서 신고 주체를 바꾸며 낸 서류로, 실제 매도인지는 확인 못함) |\n| 2026년 1월 27일 | 13G/A | 노바스코샤 은행 | 3.72% | 679.5만 | 2025년 12월 31일 |\n| 2026년 1월 13일 | 13D/A | 제임스 리틴스키 (CEO) | 7.3% | 1,302.2만 | 2026년 1월 12일 |\n| 2025년 11월 25일 | 13G/A | 성허자원 | 3.1% | 554.6만 | 2025년 9월 30일 |\n| 2025년 10월 17일 | 13G/A | 블랙록 | 6.7% | 1,193.0만 | 2025년 9월 30일 |\n| 2025년 10월 6일 | 13G | 노바스코샤 은행 | 6.51% | 1,193.4만 | 2025년 9월 30일 |\n| 2025년 3월 19일 | 13D/A | 제임스 리틴스키 (CEO) | 9.0% | 1,476.5만 | 2025년 3월 19일 |\n\n읽는 법: CEO 지분은 9.0%에서 7.3%로 줄었고(그 뒤 2026년 4~6월에도 추가 매도), 노바스코샤 은행도 석 달 만에 6.51% → 3.72%로 줄였습니다. 국방부 지분은 우선주·워런트 형태라 이 표에 나오지 않습니다.\n\n출처: [SEC EDGAR Form 4 (MP Materials)](https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=0001801368&type=4), [SEC EDGAR 13D/13G (MP Materials)](https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=0001801368&type=SC%2013), [Open Cabinet: 트럼프 재산공개 목록](https://open-cabinet.org/officials/trump-donald-j), [트럼프 OGE 278-T (2025년 8월 12일 제출)](https://extapps2.oge.gov/201/Presiden.nsf/PAS+Index/E9C024E25C9E4B2085258CEB006E7E23/$FILE/Donald-J-Trump-08.12.2025-278T.pdf), [Benzinga 의회 거래: MP](https://www.benzinga.com/government-trades/securities/MP)","next_md":"지금 매출의 약 85%는 광산에서 정제한 NdPr을 파는 데서 나옵니다. 자석 사업은 아직 준비 비용이 더 큰 단계입니다. 여기에 국방부가 NdPr 가격이 $110/kg보다 낮으면 차액을 채워 주는 '가격보장금'이 더해집니다.\n\n| 사업 | 하는 일 | 2026년 2분기 숫자 | 상태 |\n|---|---|---|---|\n| 소재 (Materials) | 광석 채굴 → NdPr 산화물·금속 생산 | 매출 9,560만 달러(+155%), NdPr 생산 840톤(+41%), 판매 1,006톤(+127%) | 주력 매출원 |\n| 자석 (Magnetics) | 포트워스에서 NdPr 금속·자석 제조 | 매출 1,650만 달러(−17%), 가동 준비비 1,440만 달러 | 고객 인증 단계 |\n| 국방부 가격보장금 | NdPr 시장가가 $110/kg 아래면 차액 지급 | 1,760만 달러 (상반기 5,990만 달러) | 2025년 4분기부터, 10년간 |\n| 중희토류 분리 | 디스프로슘·테르븄·가돌리늄 뽑기 | 2분기에 미국 항공·방산 고객과 가돌리늄 장기 공급 계약 | 2026년 시운전 시작 |\n| 드론용 자석 (Project Swarm) | 드론 회사들의 수요를 모아 규격화 | 미국·동맹국 고객 여러 곳과 구독 계약 | 2분기 시작 |\n\n쉽게 비유하면\n\n- MP는 '밀가루 공장'(광산·정제)으로 돈을 벌면서, '빵집'(자석 공장)을 새로 키우는 중입니다.\n- 다른 점은 밀가루 가격이 너무 떨어지면 정부가 차액을 보전해 주고, 빵집에서 만들 빵(10X 공장 자석)도 10년간 다 팔리도록 정부가 보장한다는 점입니다.\n\n재무 상태 (2026년 6월 말)\n\n- 2분기 매출 1.08억 달러는 1년 전보다 89% 늘었고, 1분기(9,070만 달러)보다도 늘었습니다.\n- 회계상으로는 순손실 2,030만 달러(주당 −$0.11)이지만, 일회성 비용을 빼면 거의 손익분기점(주당 −$0.01)입니다.\n- 조정 EBITDA는 +2,850만 달러로 1년 전(−1,250만 달러)에서 흑자로 돌아섰습니다. 다만 이 중 약 62%가 정부 가격보장금입니다.\n- 현금·단기투자는 14.5억 달러로, 연초(18.3억 달러)보다 줄었습니다. 상반기 설비투자가 3.08억 달러였기 때문입니다.\n\n#### 앞으로의 숫자\n\n| 항목 | 목표·예정 | 비고 |\n|---|---|---|\n| 미국 내 자석 생산 능력 | 연 약 1만 톤 (인디펜던스 + 10X) | 10X 가동 2028년 예정 |\n| 10X 공장 판매 | 생산량 100%를 국방·민간 고객이 사도록 국방부가 보장, 10년 | 2025년 7월 계약 |\n| 10X 건설 자금 | JP모건·골드만삭스 10억 달러 대출 확약 | 회사 발표 |\n| NdPr 최저가 | $110/kg, 10년 | 시장가가 낮을수록 보장금이 커짐 |\n| 애플 재활용 자석 | 5억 달러 어치 구매 약속 | 마운틴패스·포트워스에 재활용 설비 확충 |\n| 회사 가이던스 | 2분기 발표에 숫자 가이던스 없음 | 투자자가 일정을 직접 확인해야 함 |","glossary_md":"| 용어 | 뜻 |\n|---|---|\n| 희토류 | 17가지 금속 원소의 묶음. 강한 자석·반도체·무기에 쓰임 |\n| NdPr | 네오디뮤과 프라세오디뮤. 영구자석의 주재료이자 MP의 핵심 제품 |\n| NdFeB 자석 | 네오디뮤·철·붕소로 만든 자석. 현존 가장 강한 상용 자석 |\n| 중희토류 | 디스프로슘·테르븄·가돌리늄처럼 양이 적은 희토류. 자석이 열에 강해지게 함 |\n| 우선주 | 보통주보다 배당·재산을 먼저 받는 주식. 국방부 것은 보통주로 바꿀 수 있음 |\n| 전환가 | 우선주를 보통주로 바꿀 때 적용되는 가격 (국방부 $30.03) |\n| 워런트 | 정해진 가격에 주식을 살 수 있는 권리 |\n| 가격 최저가(플로어) | 시장가가 정한 가격보다 낮으면 차액을 채워 주는 약속. MP는 NdPr $110/kg |\n| 오프테이크 | 생산할 물건을 미리 사기로 한 장기 구매 계약 |\n| 조정 EBITDA | 세금·이자·감가상각·일회성 비용을 빼기 전 이익. 사업이 버는 현금에 가까운 숫자 |\n| PER / P/S | 주가를 이익(또는 매출)으로 나눈 배수. 높을수록 미래 기대가 크다는 뜻 |\n| 공매도 비율 | 주가 하락에 돈을 건 주식이 유통주식에서 차지하는 비율 |\n| Form 4 | 임원·대주주가 자기 회사 주식을 사고팔 때 SEC에 내는 신고서 |\n| 10b5-1 계획 | 내부자가 미리 정해 둔 일정·가격에 자동으로 파는 계획. 내부정보 의심을 줄이려는 장치 |\n| OGE 278-T | 미국 대통령·고위 공무원의 주식·채권 거래 신고서 |\n| 수출통제 명단 | 중국 정부가 군사·민간 겸용 물품을 보내지 못하게 한 기업 목록 |","sources":[{"t":"SEC 8-K: MP Materials 2026년 2분기 실적 보도자료","u":"https://www.sec.gov/Archives/edgar/data/0001801368/000180136826000047/mpmcq22026er.htm"},{"t":"Jones Day: 중국 희토류 수출통제 유예 2026년 11월 10일까지","u":"https://www.jonesday.com/en/insights/2025/11/bis-suspends-affiliates-rule_china-pauses-rare-earth-export-controls"},{"t":"Pillsbury: 중국 상무부 유예 공식 발표 (2025년 11월 7일)","u":"https://pillsburylaw.com/en/news-and-insights/china-suspends-export-controls-certain-critical-minerals-related-items.html"},{"t":"Wikipedia: 부산 미·중 정상회담 (2025년 10월 30일)","u":"https://en.wikipedia.org/wiki/Busan_Summit"},{"t":"Bullstory: MP 3분기 실적 일정","u":"https://bullstory.io/en/stocks/mp/earnings/2026-q3"},{"t":"MP Materials: 2분기 실적 발표 (8월 6일)","u":"https://mpmaterials.com/news/mp-materials-reports-second-quarter-2026-results"},{"t":"MP Materials: 1분기 실적 발표 (5월 7일)","u":"https://mpmaterials.com/news/mp-materials-reports-first-quarter-2026-results"},{"t":"Nasdaq/Zacks: 1분기 예상 상회에도 주가 −5%","u":"https://www.nasdaq.com/articles/mp-dips-5-despite-q1-earnings-beat-how-play-stock"},{"t":"MP Materials IR: 국방부 파트너십 발표 (2025년 7월 10일)","u":"https://investors.mpmaterials.com/investor-news/news-details/2025/MP-Materials-Announces-Transformational-Public-Private-Partnership-with- ,["매출","최근 12개월 약 7.4억 달러, 2분기(4~6월) 1.78억 달러 (전년 대비 +2.5%)"],["수익성","2분기 매출총이익 −170만 달러(거의 0), 영업손실 6,410만 달러, 순손실 1.9억 달러"],["현금","자유롭게 쓸 수 있는 현금 1.62억 달러 (6월 말), 전환사채 약 5.8억 달러"],["정부 개입","지분 투자 없음. 에너지부(DOE) 16.6억 달러 대출보증은 8월 4일 해지됨 (한 푼도 안 쓰고 끝)"],["국방 필수도","낮음. 물류창고 지게차용 연료전지가 주력이고 최근 국방 계약은 확인 못함"],["내부자 동향","2025년 이후 장내 매수 3건 약 101만 달러(CFO 2건이 92만 달러), 매도 10건 약 97만 달러"],["증권사 평균 목표가","약 $3.5 (의견은 \"보유\", 범위 $0.75~$7)"],["다음 실적 발표","2026년 11월 9일 전후 (추정, 회사 확정 전)"]],"overview_md":"#### 기업 개요\n\n플러그파워는 미국 뉴욕주 슬링어랜즈에 본사를 둔 수소 회사입니다. 2026년 3월 2일 호세 루이스 크레스포(Jose Luis Crespo)가 CEO가 됐고, 창업 CEO였던 앤디 마시(Andy Marsh)는 이사회 의장을 맡고 있습니다.\n\n#### 이 회사가 파는 것 세 가지\n\n1. **연료전지 (GenDrive)**: 수소와 산소를 합쳐 전기를 만드는 장치입니다. 전기 지게차에 들어가고, 월마트·아마존·홈디포 같은 큰 물류창고가 씁니다. 지금까지 7만 6천 대 넘게 깔았습니다.\n2. **전해조 (GenEco)**: 연료전지와 반대로 물에 전기를 흘려 수소를 뽑아내는 기계입니다. 정유·화학 공장과 '친환경 항공유'를 만드는 회사가 사 갑니다.\n3. **수소 그 자체**: 직접 수소를 만들어 고객의 창고까지 배달합니다. 미국 조지아·테네시·루이지애나 3곳 공장에서 하루 약 40톤을 만듭니다.\n\n#### 돈 버는 구조\n\n면도기를 팔고 면도날로 계속 버는 방식을 노립니다. 지게차용 연료전지를 팔아 두면, 그 뒤로 수소 연료·수리 서비스·교체 장비가 반복해서 팔립니다. 문제는 그중 수소 연료를 만들어 파는 일이 아직 손해를 본다는 점입니다.\n\n| 사업 | 2분기 매출 (비중) | 지금 상태 | 언제 돈이 되나 |\n|---|---|---|---|\n| 장비 판매 (연료전지·전해조·액화설비) | 8,190만 달러 (46%) | 2분기 이 부문 마진 약 +2% (1년 전 −18%). 지게차 1,666대 납품, 1년 전 739대의 2.3배 | 지금 거의 손익분기. 고객 2곳이 3년 안에 2만 대 이상 교체 계획 |\n| 수소 연료 | 3,950만 달러 (22%) | 매출 +15%, 그러나 마진 −48% (1년 전 −91%) | 공장 가동률을 올려야 함. 아직 손실 |\n| 서비스 (수리·유지) | 2,980만 달러 (17%) | 매출 +82%, 마진 +27% | 지금 이익 |\n| 전력 구매 계약(PPA) | 2,690만 달러 (15%) | 고객 현장에 설비를 깔고 전기 요금 식으로 받음 | 지금 |\n| 전해조 (장비 판매에 포함) | 2025년 연 1.87억 달러, 2026년 1분기 4,080만 달러 (+343%) | 유럽·호주 대형 프로젝트 수주 이어지는 중. 수주가 실제 매출이 되기까지 1~2년 걸림 | 2026~2027년 |\n\n2분기 전체 매출은 1.783억 달러로 1분기보다 9%, 1년 전보다 2.5% 늘었습니다. 상반기(1~6월) 매출은 3.42억 달러로 전년보다 11% 늘었습니다.\n\n#### 재무 상태 (2026년 6월 30일 기준)\n\n| 항목 | 숫자 | 쉬운 설명 |\n|---|---|---|\n| 매출총이익 | 2분기 −170만 달러 (1분기 −13%, 1년 전 −31%) | 물건을 팔아 번 돈이 만드는 데 든 돈과 거의 같아졌다는 뜻 |\n| 영업비용 | 6,240만 달러 (1년 전의 절반) | 구조조정 'Project Quantum Leap'으로 줄임 |\n| 영업손실 | 6,410만 달러 (1년 전 1.77억 달러) | 적자 폭이 크게 줄었음 |\n| 순손실 | 1.9억 달러 (주당 −$0.14) | 이 중 약 1억 달러는 전환사채·워런트의 평가손실로, 주가가 오르면 장부상 손실이 커지는 항목 |\n| 쓸 수 있는 현금 | 1.62억 달러 | 3개월 전(2.23억 달러)보다 줄었음 |\n| 용도가 묶인 현금(담보 등) | 약 5.1억 달러 | 조건이 풀려야 쓸 수 있는 돈 |\n| 2분기 현금 순소진 | 약 6,100만 달러 (직전 분기보다 58% 감소) | 한 달에 2,000만 달러씩 쓰는 셈 |\n| 전환사채 | 4.31억 달러, 연 6.75% 이자, 2033년 12월 만기 (장부가 약 5.8억 달러) | 나중에 주식으로 바꿀 수 있는 빚. 바뀌면 주식 수가 늘어남 |\n| 발행주식 | 13.97억 주 (2025년 말 13.94억 주) | 허용 한도는 15억 → 30억 주로 2026년 2월 12일 주주총회에서 상향 |\n\n회사는 6월 30일 보고서에서 \"앞으로 12개월은 운영할 자금이 충분하다\"고 밝혔고, 계속기업 불확실성(파산 경고) 문구는 없습니다. 다만 이 판단에는 \"시장에서 주식을 팔 수 있는 권리\"가 가정으로 들어가 있습니다. 이 권리는 시장가 매각 한도 9.44억 달러(ATM)와 요크빌 펀드에 팔 수 있는 한도 10억 달러(SEPA)를 합쳐 약 19억 달러어치이고, 상반기에는 한 주도 팔지 않았습니다.\n\n#### 앞으로의 숫자 (회사 목표)\n\n| 시기 | 회사가 말한 목표 | 지금까지 |\n|---|---|---|\n| 2025년 4분기 | 매출총이익 플러스 | 달성 (+2.4%, 분기 매출 약 2.25억 달러) |\n| 2026년 연간 | 매출 15~16% 성장 (8월 10일 13~15%에서 상향) | 2025년 매출 7.1억 달러라면 8.2억 달러 안팎. 상반기 3.42억 달러라서 하반기에 4.75억~4.82억 달러(전년 하반기보다 18~20% 많이) 필요 |\n| 2026년 4분기 | EBITDAS 흑자 (이자·세금·감가상각·주식보상비용을 빼기 전 이익) | \"궤도에 있다\"고 8월에 재확인 |\n| 2027년 말 | 영업이익 흑자 | 2분기 영업손실 6,410만 달러 |\n| 2028년 말 | 전체 흑자 | 아직 적자 |\n| 2026년 중 | 부동산·설비 매각으로 유동성 2.75억 달러 확보 | 8월 10일까지 약 5,200만 달러 수령. 뉴욕 게이트웨이 부지는 1.42억 달러에 팔기로 했고 최종 마감 시한은 2027년 3월 31일 |\n\n쉽게 말해 \"매출은 10%대로 늘리고, 비용은 확 줄여서, 2026년 말부터 이익이 나는 구간에 들어간다\"는 계획입니다. 하반기 매출이 크게 늘어야 한다는 점이 가장 큰 숙제입니다.","gov_md":"플러그파워는 정부가 지분을 가진 회사도, 국방 조달에 기대는 회사도 아닙니다. 정부와의 관계는 주로 세금 혜택과 대출 보증인데, 2025–2026년에 이때만 더 줄어들었습니다. 수요는 유럽·호주 같은 해외에서 더 많이 옵니다.\n\n| 항목 | 현재 상태 | 플러그에 미치는 영향 |\n|---|---|---|\n| 정부 지분 | 없음. 미국 정부가 주주가 된 적 없음 | 정부가 주가를 떠받칠 직접적 이유는 없음 |\n| DOE 대출보증 | 2025년 1월 16일 최대 16.6억 달러(녹색수소 공장 최대 6곳) 계약. 2025년 11월 회사가 사업 중단, 2026년 8월 4일 DOE가 계약 해지 통보 (실효 8월 18일경) | 한 푼도 빌리지 않아 상환 의무는 없음. 대신 \"정부 보증으로 공장을 짓는다\"는 계획이 사라짐. 대출과 관련해 회사를 대상으로 한 주주 소송도 진행 중 |\n| 45V 청정수소 세액공제 | 2025년 7월 새 세법(OBBBA)이 \"2028년 1월 1일 전에 공사를 시작한 설비\"만 받을 수 있게 시한을 당김 (기존 2033년). 최대 수소 1kg당 약 $3 | 미국 내 새 수소 공장이 2027년까지 공사를 시작해야 함. 전해조 수요가 앞당겨질 수도, 시한 뒤 끊길 수도 있음 |\n| 48E 투자세액공제(연료전지) | OBBBA가 \"연료전지 설비\"에 고정 30% 세액공제를 유지 (2025년 말 후 공사 착수분부터) | 연료전지 고객의 장비 부담이 줄어 판매에 유리. 2분기에 루이지애나 수소 공장의 세액공제를 현금 3,920만 달러에 팔았음 |\n| 중국 부품 제한 | 세금 혜택을 받으려면 \"중국 등 금지 외국 기업\" 부품 비중을 제한하는 새 규칙 (세부 기준은 아직 확정 전, 2025년 연간보고서) | 미국에서 만드는 플러그에는 유리할 수 있으나 영향은 아직 불확실 |\n| 관세 | 2026년 2월 미 대법원이 IEEPA 관세는 위법이라고 판결 → 플러그는 2분기에 관세 환급금 1,470만 달러를 재고에서 차감(현금 1,090만 달러 수령) | 작은 금액이지만 정부 정책이 비용에 직접 영향을 준 사례 |\n| 수소 허브·연구 보조금 | 2025년 10월 DOE가 약 75.6억 달러 규모의 프로젝트 자금을 취소(캘리포니아·태평양 북서부 수소 허브 포함). 나머지 허브의 2026년 현재 상태는 확인 못함 | 미국 내 수소 인프라를 키우려던 정부 지원이 축소된 흐름 |\n| 국방·군 | 최근 미 국방부 계약은 확인 못함. 2009년 국방부가 지게차용 연료전지 19대를 사 준 기록이 있는 정도 | 매출의 대부분은 월마트·아마존 같은 민간 고객과 유럽·호주 프로젝트 |\n| 미 정부기관 계약 | NASA 글렌연구센터에 액체수소를 공급하는 첣 계약(2025년 12월 보도, 금액 확인 못함) | 상징적인 규모 |\n\n#### 중국과의 경쟁: 미국 안에서 만들기\n\n- 중국 업체들이 전해조 시장에서 가격을 크게 낮춰 놓았습니다. IEA(국제에너지기구)는 2026년 6월 \"중국산 알칼리형 전해조 스택이 서구산의 약 4분의 1 가격\"이라고 밝혔습니다. 이 수치는 알칼리형 기준이고, 플러그가 쓰는 PEM형과의 가격 비교는 확인 못했습니다. 지금은 중국 업체 다수가 세계 대형 전해조 제조사 상위권을 차지한다는 보도도 있습니다(BNEF 순위, 기사 시점은 확인 못함).\n- 플러그는 전해조 스택 공장(기가팩토리)을 뉴욕주 로체스터에 짓고, 연료전지는 뉴욕주 슬링어랜즈에서 만듭니다. 이 외에도 텔사스 휴스턴, 인디애나 라페이엣에 제조·조립 시설이 있습니다. \"미국에서 만든 장비\"라는 점이 중국산 견제 정책에서는 장점이지만, 가격으로는 중국산을 이기기 어렵다는 약점이 있습니다.\n\n#### 동맹국 수요: 실제 주문은 해외에서\n\n| 상대 | 규모 | 진행 상태 |\n|---|---|---|\n| Arcadia eFuels (덴마크 보딩보르) | 280MW 공급 계약 + 대형 프로젝트 4개에 대해 \"우선 공급사\" (합계 1GW 이상 가능성) | 2026년 9월 29–30일 발표. 투자 최종결정(FID) 전이고, 고객이 \"진행해라\"는 통보를 해야 납품 시작 |\n| Galp (포르투갈 시네스 정유소) | 100MW | 시운전 중 |\n| Iberdrola·BP (스페인) | 25MW | 시운전 중 |\n| Carlton Power (영국 배로) | 30MW (총 55MW 중) | 2026년 2분기 FID, 나머지 25MW는 2026년 FID 기대 |\n| Orica (호주 헌터밸리) | 50MW | 2026년 7월 7일 FID 후 수주 |\n| Hy2gen (캐나다 퀘벥) | 275MW (설계 단계 FEED 선정) | 실제 공급 계약은 아직 |\n\n미국이 수소 지원을 줄이는 동안 덴마크·영국·스페인·포르투갈·호주는 \"항공유·정유·화학에서 화석연료를 줄이겠다\"는 목적으로 주문을 내고 있습니다. 다만 위 숫자는 \"계약 규모\"이고, 받은 돈은 공사 진행에 따라 수령되므로 매출로 잡히는 데 1~2년이 걸립니다.\n\n#### 정리\n\n- 지금 플러그에게 정부는 \"뒤에서 도와주는 존재\"가 아니라 \"지원이 줄어드는 환경\"에 가깝습니다. 심지어 대출 계약은 사라졌습니다.\n- 반대로 연료전지 세액공제 30%는 유지됐고, 부동산·세액공제 현금화는 회사 유동성에 도움이 되고 있습니다.","gov
