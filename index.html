 return `<div class="panel" style="margin-top:14px"><h3 style="font-size:15px;margin:0 0 8px">정부·내부자·공모 기준가 대비 현재가</h3><div class="refs">${rows.map(r=>`<div class="row ${r.c?'cur':''}"><span>${esc(r.l)}</span><span class="tr"><span class="fl" style="width:${(r.v/mx*100).toFixed(1)}%"></span></span><span class="vv">$${fmt(r.v)}${r.c?'':` <span class="${cls(s.last/r.v-1)}">${pct((s.last/r.v-1)*100)}</span>`}</span></div>`).join('')}</div><div class="note">오른쪽 %는 기준가 대비 현재가의 차이입니다. 기준가는 각 종목 '내부자·유명인 매매' 또는 '한눈에 보기'에 적힌 값입니다.</div></div>`}
/* ---------- state ---------- */
const st={cat:'전체',tag:null,q:'',sort:'drop'};
const root=document.getElementById('app');

function spark(s){const p=s.series.p,w=220,h=46,mn=Math.min(...p),mx=Math.max(...p);
  const pts=p.map((v,i)=>[(i/(p.length-1))*w, h-3-((v-mn)/(mx-mn||1))*(h-8)]);
  const path=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join('');
  const e=pts[pts.length-1];
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="${path} L${w} ${h} L0 ${h}Z" fill="var(--area)"/><path d="${path}" fill="none" stroke="var(--navy)" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;}

function list(){
  const cats=['전체','미국우선','구분 전'];
  const cnt=c=>c==='전체'?S.length:S.filter(s=>s.category===c).length;
  let items=S.filter(s=>(st.cat==='전체'||s.category===st.cat)&&(!st.tag||s.tags.includes(st.tag))&&(!st.q||(s.ticker+s.name_ko+s.company+s.field).toLowerCase().includes(st.q.toLowerCase())));
  const sorters={drop:(a,b)=>a.fromHi-b.fromHi,cap:(a,b)=>(b.mc||0)-(a.mc||0),ytd:(a,b)=>a.ytd-b.ytd,tk:(a,b)=>a.ticker.localeCompare(b.ticker)};
  items.sort(sorters[st.sort]);
  const pool=S.filter(s=>st.cat==='전체'||s.category===st.cat); const tags=[...new Set(pool.flatMap(s=>s.tags))];
  root.innerHTML=`
  <header class="top"><div><h1>보이지 않는 성벽</h1><p>미국과 중국의 패권 경쟁, 군비 경쟁, 공급망 내재화로 수요가 달라지는 미국 상장 종목 ${S.length}개를 정리했습니다. 종목을 누르면 주가 흐름과 근거를 볼 수 있습니다.</p></div><button class="themebtn" id="tg" type="button">테마 전환</button></header>
  <div class="tabs" role="tablist">${cats.map(c=>`<button class="tab" role="tab" aria-selected="${st.cat===c}" data-c="${c}">${c}<span class="n">${cnt(c)}</span></button>`).join('')}</div>
  <div class="bar"><input type="search" id="q" placeholder="종목 검색 (티커·이름)" value="${esc(st.q)}" aria-label="종목 검색">
    <label style="font-size:13px;color:var(--muted)">정렬 <select id="so">${[['drop','고점 대비 낙폭 큰 순'],['cap','시가총액 큰 순'],['ytd','올해 수익률 낮은 순'],['tk','티커 순']].map(([v,l])=>`<option value="${v}" ${st.sort===v?'selected':''}>${l}</option>`).join('')}</select></label>
    <div class="chips" role="group" aria-label="분야 필터">${tags.map(t=>`<button class="chip" type="button" aria-pressed="${st.tag===t}" data-t="${t}">${t}</button>`).join('')}</div></div>
  ${items.length?`<details class="dd-panel" open><summary>고점 대비 낙폭 (${items.length}개)</summary><div class="body"><div class="hb">${(()=>{const mxv=Math.max(...items.map(s=>-s.fromHi),1);return [...items].sort((a,b)=>a.fromHi-b.fromHi).map(s=>`<button type="button" data-k="${s.ticker}" aria-label="${s.ticker} 고점 대비 ${pct(s.fromHi)}"><span class="lb">${s.ticker}</span><span class="tr"><span class="fl" style="width:${(-s.fromHi/mxv*100).toFixed(1)}%"></span></span><span class="vl down">${pct(s.fromHi)}</span></button>`).join('')})()}</div><div class="note">2026년 종가 고점에서 ${lastDate.slice(5).replace('-','/')} 종가까지의 하락률입니다. 막대를 누르면 종목 상세로 이동합니다.</div></div></details>`:''}
  <div class="grid">${items.map(s=>`
   <button class="card" data-k="${s.ticker}" type="button">
     <div class="r1"><span class="tk">${s.ticker}</span><span class="pill ${s.category==='미국우선'?'us':'pre'}">${s.category}</span></div>
     <div class="nm">${esc(s.name_ko)} · ${esc(s.company)}</div>
     <div class="tag">${esc(s.field)}</div>
     ${spark(s)}
     <div class="r3"><span class="px">$${fmt(s.last)}</span><span class="dd ${cls(s.fromHi)}">고점 대비 ${pct(s.fromHi)}</span></div>
     <div class="sub"><span>시총 ${mcap(s.mc)}</span><span>${s.sinceIpo?'상장 후':'올해'} <span class="${cls(s.ytd)}">${pct(s.ytd)}</span></span></div>
   </button>`).join('')||'<div class="empty">조건에 맞는 종목이 없습니다.</div>'}</div>
  <footer><p>가격은 ${lastDate} 종가, 고점은 2026년 종가 기준입니다. 상장 후 1년이 안 된 종목(ELMT, SPCX)은 상장일 이후 값입니다.</p>
  <p>색 표기는 한국 증권앱 관례를 따릅니다. 상승은 빨강, 하락은 파랑입니다.</p>
  <p>각 종목의 상세 본문 숫자는 문서 작성 시점(10/7~10/9 종가) 기준이라 위 카드 가격과 조금 다를 수 있습니다. 내부자·정부 거래는 SEC·OGE 공시 기준이고, 확인하지 못한 항목은 각 종목 끝에 따로 적어 두었습니다.</p></footer>`;
  root.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{st.cat=b.dataset.c;st.tag=null;list()});
  root.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{st.tag=st.tag===b.dataset.t?null:b.dataset.t;list()});
  root.querySelector('#so').onchange=e=>{st.sort=e.target.value;list()};
  const q=root.querySelector('#q'); q.oninput=e=>{st.q=e.target.value;const pos=e.target.selectionStart;list();const n=root.querySelector('#q');n.focus();n.setSelectionRange(pos,pos)};
  root.querySelectorAll('.card,.hb button').forEach(c=>c.onclick=()=>{location.hash=c.dataset.k});
  root.querySelector('#tg').onclick=toggleTheme;
}

function toggleTheme(){const r=document.documentElement;const cur=r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');r.dataset.theme=cur==='dark'?'light':'dark'}

/* ---------- chart ---------- */
function chart(s){
  const d=s.series.d,p=s.series.p,W=900,H=340,L=52,R=14,T=54,B=30; const iw=W-L-R, ih=H-T-B;
  const t0=Date.parse(d[0]), t1=Date.parse(d[d.length-1]); const X=ds=>L+((Date.parse(ds)-t0)/(t1-t0||1))*iw;
  let mn=Math.min(...p),mx=Math.max(...p); const pad=(mx-mn)*.08||1; mn-=pad; mx+=pad; const Y=v=>T+ih-((v-mn)/(mx-mn))*ih;
  const xs=d.map(X), ys=p.map(Y);
  const line=xs.map((x,i)=>(i?'L':'M')+x.toFixed(1)+' '+ys[i].toFixed(1)).join('');
  // y ticks (nice)
  const step=(()=>{const raw=(mx-mn)/4,m=Math.pow(10,Math.floor(Math.log10(raw)));const f=raw/m;return (f<1.5?1:f<3.5?2:f<7.5?5:10)*m})();
  const ticks=[];for(let v=Math.ceil(mn/step)*step;v<=mx;v+=step)ticks.push(v);
  const dec=step<1?2:0;
  // month ticks
  const months=[];{let c=new Date(d[0]);c=new Date(Date.UTC(c.getUTCFullYear(),c.getUTCMonth()+1,1));while(c<=new Date(d[d.length-1])){months.push(new Date(c));c=new Date(Date.UTC(c.getUTCFullYear(),c.getUTCMonth()+1,1))}}
  // markers
  const evs=(s.chart_events||[]).map(ds=>({ds,e:s.events.find(e=>e.date===ds)})).filter(o=>o.e&&ds_ok(o.ds,d)).sort((a,b)=>a.ds<b.ds?-1:1);
  function ds_ok(ds,d){return ds>=d[0]&&ds<=d[d.length-1]}
  const lanes=[];const mk=evs.map((o,k)=>{let idx=0;while(idx<d.length-1&&d[idx+1]<=o.ds)idx++;const x=xs[idx];let ln=0;while((lanes[ln]??-99)>x-24)ln++;lanes[ln]=x;return {n:k+1,x,y:ys[idx],ln,o,idx}});
  s._mk=mk;
  const hi=p.indexOf(s.hi), lo=p.indexOf(Math.min(...p));
  const svg=`<svg id="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="${s.ticker} 2026년 일별 종가 차트">
   ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end" font-size="12" font-family="IBM Plex Mono,monospace" fill="var(--muted)">${v.toFixed(dec)}</text>`).join('')}
   ${months.map(m=>{const x=X(m.toISOString().slice(0,10));return `<line x1="${x}" x2="${x}" y1="${T+ih}" y2="${T+ih+5}" stroke="var(--muted)"/><text x="${x}" y="${H-8}" text-anchor="middle" font-size="12" fill="var(--muted)">${m.getUTCMonth()+1}월</text>`}).join('')}
   <path d="${line} L${xs[xs.length-1]} ${T+ih} L${xs[0]} ${T+ih}Z" fill="var(--area)"/>
   <path d="${line}" fill="none" stroke="var(--navy)" stroke-width="2" stroke-linejoin="round"/>
   ${mk.map(m=>`<line x1="${m.x}" x2="${m.x}" y1="${16+m.ln*17+8}" y2="${m.y}" stroke="var(--muted)" stroke-dasharray="2 3" opacity=".7"/><circle cx="${m.x}" cy="${m.y}" r="3.5" fill="var(--surface)" stroke="var(--navy)" stroke-width="2"/>`).join('')}
   ${mk.map(m=>`<g class="mkg" data-n="${m.n}"><circle cx="${m.x}" cy="${16+m.ln*17}" r="8.5" fill="var(--navy)"/><text x="${m.x}" y="${16+m.ln*17+4}" text-anchor="middle" font-size="11" font-family="IBM Plex Mono,monospace" fill="var(--on-navy)">${m.n}</text></g>`).join('')}
   <circle cx="${xs[hi]}" cy="${ys[hi]}" r="4" fill="var(--up)"/><text x="${xs[hi]+(xs[hi]>W-120?-8:8)}" y="${ys[hi]-8}" text-anchor="${xs[hi]>W-120?'end':'start'}" font-size="12" font-family="IBM Plex Mono,monospace" fill="var(--ink)">고점 ${p[hi].toFixed(2)}</text>
   <circle cx="${xs[xs.length-1]}" cy="${ys[ys.length-1]}" r="4.5" fill="var(--navy)"/>
   <line id="cx" y1="${T}" y2="${T+ih}" stroke="var(--ink)" stroke-width="1" opacity="0" /><circle id="cc" r="5" fill="var(--navy)" stroke="var(--surface)" stroke-width="2" opacity="0"/>
   <rect id="hit" x="${L}" y="${T}" width="${iw}" height="${ih}" fill="transparent"/>
  </svg>`;
  return {svg,xs,ys,d,p,W};
}

/* ---------- detail ---------- */
function detail(s){
  const i=S.indexOf(s), prev=S[(i+S.length-1)%S.length], next=S[(i+1)%S.length];
  const c=chart(s);
  const ev=(s.events||[]);
  const evTable='| 날짜 | 사건 | 주가 반응 |\n| --- | --- | --- |\n'+ev.map(e=>`| ${e.date.slice(5).replace('-','/')} | ${(e.title?'**'+e.title+'** — ':'')+String(e.detail||'').replace(/\|/g,'\\|').replace(/\n/g,' ')} | ${String(e.move||'').replace(/\|/g,'\\|').replace(/\n/g,' ')}${e.close?' (종가 '+String(e.close).replace(/\|/g,'')+')':''} |`).join('\n');
  const sec=(t,html,open)=>html?`<details ${open?'open':''}><summary>${t}</summary><div class="body">${html}</div></details>`:'';
  const li=a=>`<ul>${(a||[]).map(x=>`<li>${marked.parseInline(String(x))}</li>`).join('')}</ul>`;
  root.innerHTML=`
  <div class="crumb"><button class="btn" id="back" type="button">← 전체 목록</button></div>
  <div class="dh"><div><h2><span class="tk">${s.ticker}</span>${esc(s.name_ko)}</h2>
    <div class="co"><span>${esc(s.company)}</span><span class="pill ${s.category==='미국우선'?'us':'pre'}">${s.category}</span><span>${esc(s.field)}</span><span>시총 ${mcap(s.mc)}</span></div></div>
    <div class="big">$${fmt(s.last)}<small class="${cls(s.fromHi)}">고점 대비 ${pct(s.fromHi)} · ${lastDate.slice(5).replace('-','/')} 종가</small></div></div>
  <p class="lead">${marked.parseInline(String(s.lead||''))}</p>
  <div class="panel"><dl class="facts">${(s.glance||[]).map(r=>`<div><dt>${esc(r[0])}</dt><dd>${marked.parseInline(String(r[1]))}</dd></div>`).join('')}${s.tp?`<div><dt>목표가까지 거리</dt><dd>${lastDate.slice(5).replace('-','/')} 종가 $${fmt(s.last)} 기준, 평균 목표가 $${fmt(s.tp)}까지 <b class="${cls(s.tp/s.last-1)}">${pct((s.tp/s.last-1)*100)}</b></dd></div>`:''}</dl>
    <div class="note">위 표는 문서 작성 시점(10/7~10/9 종가) 기준입니다.</div></div>
  <div class="panel chartbox"><h3>${s.sinceIpo?'상장 이후':'2026년'} 일별 종가와 주요 사건</h3><div class="readout" id="ro">차트 위를 움직이면 날짜별 종가가 보입니다.</div>${c.svg}
    <ul class="mk">${(s._mk||[]).map(m=>`<li><span class="b">${m.n}</span><div><span class="d">${m.o.ds.slice(5).replace('-','/')}</span> <b>${esc(m.o.e.title||'')}</b><div class="mv">${esc(String(m.o.e.move||'').slice(0,90))}</div></div></li>`).join('')}</ul></div>
  ${refsHtml(s)}
  <div class="ctl"><h3>상세 내용</h3><button class="btn" id="ex" type="button">모두 펼치기</button></div>
  <div class="cols" style="margin-bottom:10px"><div class="panel bu"><h4>강세 논리</h4>${li(s.bull)}</div><div class="panel be"><h4>약세 논리</h4>${li(s.bear)}</div></div>
  ${sec('기업 개요와 돈 버는 구조',md(s.overview_md),true)}
  ${sec(esc(s.gov_title||'정부와의 관계'),md(s.gov_md),true)}
  ${sec('2026년 주요 사건 ('+ev.length+'건)',md(evTable),false)}
  ${sec('증권사 목표가',md(s.analysts_md),false)}
  ${sec(esc(s.insider_title||'내부자·유명인 매매'),md(s.insider_md),false)}
  ${sec('앞으로 확인할 것',md(s.next_md),true)}
  ${sec('용어 풀이',md(s.glossary_md),false)}
  ${sec('출처와 확인하지 못한 것',(s.unverified?`<p><b>확인 못함</b> ${marked.parseInline(String(s.unverified))}</p>`:'')+`<ul class="src">${(s.sources||[]).map(x=>`<li><a href="${safeLink(x.u)}" target="_blank" rel="noopener noreferrer">${esc(x.t)}</a></li>`).join('')}</ul>`,false)}
  <div class="pn"><button class="btn" data-k="${prev.ticker}" type="button">← ${prev.ticker}</button><button class="btn" data-k="${next.ticker}" type="button">${next.ticker} →</button></div>
  <footer><p>정보 정리 목적의 자료이며 출처는 각 항목에 표시했습니다. 숫자는 문서 작성 시점 기준입니다.</p></footer>`;
  root.querySelector('#back').onclick=()=>{location.hash=''};
  root.querySelectorAll('.pn .btn').forEach(b=>b.onclick=()=>{location.hash=b.dataset.k});
  let all=false;const ex=root.querySelector('#ex');ex.onclick=()=>{all=!all;root.querySelectorAll('details').forEach(x=>x.open=all);ex.textContent=all?'모두 접기':'모두 펼치기'};
  // chart interaction
  const svg=root.querySelector('#ch'),ro=root.querySelector('#ro'),cx=svg.querySelector('#cx'),cc=svg.querySelector('#cc');
  function show(ev){const r=svg.getBoundingClientRect();const x=(ev.clientX-r.left)/r.width*c.W;let b=0,bd=1e9;c.xs.forEach((v,k)=>{const dd=Math.abs(v-x);if(dd<bd){bd=dd;b=k}});
    cx.setAttribute('x1',c.xs[b]);cx.setAttribute('x2',c.xs[b]);cx.setAttribute('opacity','.35');cc.setAttribute('cx',c.xs[b]);cc.setAttribute('cy',c.ys[b]);cc.setAttribute('opacity','1');
    const ch=(c.p[b]/s.hi-1)*100;const mkh=(s._mk||[]).filter(m=>m.idx===b).map(m=>' · 사건 '+m.n).join('');
    ro.innerHTML=`<b>${c.d[b]}</b> · 종가 <b>$${c.p[b].toFixed(2)}</b> · 고점 대비 <span class="${cls(ch)}">${pct(ch)}</span>${mkh}`}
  svg.addEventListener('pointermove',show);svg.addEventListener('pointerdown',show);
  svg.addEventListener('pointerleave',()=>{cx.setAttribute('opacity','0');cc.setAttribute('opacity','0')});
}

function route(){const k=decodeURIComponent(location.hash.slice(1)).toUpperCase(); if(BY[k]){detail(BY[k]);window.scrollTo(0,0)} else {list()}}
addEventListener('hashchange',route);
route();
</script>
