name: 종가 갱신
on:
  schedule:
    # 미국 정규장 마감(ET 16:00) 뒤. 평일 UTC 21:30 (서머타임 17:30 ET, 겨울 16:30 ET)
    - cron: '30 21 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-prices
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install yfinance
      - name: 종가 받기
        run: python source/update_prices.py
      - name: 페이지 다시 만들기
        working-directory: source
        run: python build.py
      - name: 바뀐 게 있으면 커밋
        run: |
          if git diff --quiet -- index.html source/prices.json; then
            echo "변경 없음"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html source/prices.json
            git commit -m "종가 갱신 $(date -u +%F)"
            git push
          fi
